:root{

:root{color-scheme:light}

section.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 14px 16px;min-width:0}

.check .t{font-size:13px} .check .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

.lbl-row{display:flex;align-items:center;flex-wrap:wrap}

const num=v=>{if(v===undefined||v===null||v==='')return null;const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null;};
const DS=()=>LANG==='en'?'.':',';
const f=(x,d=2)=>x===null||x===undefined||!isFinite(x)?'–':x.toFixed(d).replace('.',DS()).replace('-','−');

function calc(m,G){
  const r={};
  const Wa=num(m.Wa), H=num(m.H), h0=num(m.h0)||0, eta=num(m.eta)??0.5, hgU=num(m.hg);
  const Wh=num(m.Wh)??Wa;
  const [Ss,TB,TC,TD]=SOIL[G.soil];
  const gI=num(G.gI), agR=num(G.agR), ag=num(G.ag), gIe=num(G.gIe);
  const plat=m.mode==='platform';
  const z=plat?num(m.z):0, Hb=plat?num(m.Hb):null, T1=plat?num(m.T1):null, Ta=num(m.Ta);
  r.hg = hgU!==null?hgU:(H!==null?h0+eta*(H-h0):null);
  const alpha=gI*agR/9.81, aS=alpha*Ss; r.alpha=alpha; r.S=Ss; r.aS=aS;
  let Sa=aS, saNote=T('sa_g');
  if(!plat){
    if(Ta!==null&&Ta>0){const se=aS*(Ta<TB?1+Ta/TB*1.5:Ta<=TC?2.5:Ta<=TD?2.5*TC/Ta:2.5*TC*TD/Ta/Ta); if(se>Sa){Sa=se;saNote=T('sa_se');}}
  } else {
    if(z===null||!Hb){Sa=null;saNote=T('sa_need');}
    else{const zr=Math.min(z/Hb,1); let v;
      if(Ta!==null&&T1){v=aS*(3*(1+zr)/(1+Math.pow(1-Ta/T1,2))-0.5);saNote=T('sa_425');}
      else{v=aS*(3*(1+zr)-0.5);saNote=T('sa_res');}
      Sa=Math.max(v,aS);}
  }
  r.Sa=Sa; r.saNote=saNote;
  const gA=num(m.gA), qa=num(m.qa);
  r.Fec=(Sa!==null&&Wa!==null)?Sa*Wa*gA/qa:null; r.gA=gA; r.qa=qa;
  const cat=RO_CATS[m.roCat||0]; const gC=m.gC==='auto'?gIe:num(m.gC);
  const Kz=plat?((z!==null&&Hb)?1+2*Math.min(z/Hb,1):null):1;
  r.gC=gC; r.beta=cat.b; r.qC=cat.q; r.Kz=Kz; r.ag=ag;
  if(Wa!==null&&Kz!==null){
    const raw=gC*ag*cat.b*Kz*Wa/cat.q, lo=0.75*gC*ag*Wa, hi=4*gC*ag*Wa;
    r.Fro_raw=raw; r.Fro_lo=lo; r.Fro_hi=hi; r.Fro=Math.min(Math.max(raw,lo),hi);
    r.roBound=raw<lo?T('bLo'):raw>hi?T('bHi'):T('bF');
  } else r.Fro=null;
  const dr=G.drive;
  if(dr==='ec'){r.F=r.Fec;r.Fsrc='ec';}
  else if(dr==='ro'){r.F=r.Fro;r.Fsrc='ro';}
  else{ if(r.Fec===null&&r.Fro===null){r.F=null;} else if((r.Fec??-1)>=(r.Fro??-1)){r.F=r.Fec;r.Fsrc='ec';} else {r.F=r.Fro;r.Fsrc='ro';} }
  r.aPlate=r.Fsrc==='ro'?gIe*ag:aS;
  r.M=(r.F!==null&&r.hg!==null)?r.F*r.hg:null;
  const F=r.F, M=r.M; r.rows=[]; r.checks=[];
  const add=(c,w,t,v,u)=>r.rows.push([c,w,t,v,u]);
  const sup=m.sup;
  if(F!==null&&M!==null){
    if(sup==='surf-rect'||sup==='surf-circ'){
      let A,pzX,pzY,qX,qY,lbl;
      if(sup==='surf-rect'){const bx=num(m.bx),by=num(m.by);
        if(bx&&by){A=bx*by;pzX=6*M/(bx*bx*by);pzY=6*M/(by*by*bx);qX=4*M/(bx*bx*by);qY=4*M/(by*by*bx);lbl=`${f(bx)} × ${f(by)} m`;}}
      else{const D=num(m.Ds); if(D){const R=D/2;A=Math.PI*R*R;pzX=pzY=4*M/(Math.PI*R**3);qX=qY=3*M/(4*R**3);lbl=`Ø ${f(D)} m`;}}
      if(A){
        const ph=F/A, grav=Wa/A;
        ['X','Y'].forEach(d=>{const pz=d==='X'?pzX:pzY,q=d==='X'?qX:qY;
          add('E'+d,`${T('surfAll')} (${lbl})`,`p<sub>${d.toLowerCase()}</sub> ${T('horiz',{d})}`,ph,'kN/m²');
          add('E'+d,T('sideHalf',{s:'+',d}),T('pzHalf'),-q,'kN/m²');
          add('E'+d,T('sideHalf',{s:'−',d}),T('pzHalf'),q,'kN/m²');
          add('E'+d,T('linEdge',{d}),T('pzLin'),pz,'± kN/m²');
        });
        const up=grav-Math.max(pzX,pzY);
        r.checks.push({s:up>=0?'ok':'warn',t:T('c_upl'),d:`W/A − p<sub>z,max</sub> = ${f(grav)} − ${f(Math.max(pzX,pzY))} = ${fs(up)} kN/m²`,p:up>=0?T('p_comp'):T('p_upl')});
      } else r.checks.push({s:'na',t:T('c_nosurf'),d:'b<sub>x</sub>, b<sub>y</sub> / D<sub>f</sub>',p:T('p_need')});
    }
    const n=num(m.n);
    let legsOK=false,dNX=null,dNY=null;
    if(sup==='legs-circ'||(sup==='surf-circ'&&n)){const Dc=num(m.Dc); if(n&&Dc){dNX=dNY=4*M/(n*Dc);legsOK=true;}}
    if(sup==='legs-rect'||(sup==='surf-rect'&&n)){const ax=num(m.ax),ay=num(m.ay)??ax; if(n&&ax){dNX=2*M/(n*ax);dNY=2*M/(n*ay);legsOK=true;}}
    const isLeg=sup==='legs-circ'||sup==='legs-rect';
    if(legsOK){
      const g1=Wh/n, V=F/n, dN=Math.max(dNX,dNY), Nmin=g1-dN;
      const lbl=isLeg?T('leg'):T('anchor');
      r.checks.push({s:Nmin>=0?'ok':'crit',t:isLeg?T('c_legs'):T('c_anch'),d:`W/n − ΔN = ${f(g1)} − ${f(dN)} = ${fs(Nmin)} kN / ${lbl}`,p:Nmin>=0?T('p_comp'):T('p_tens',{v:f(-Nmin,1)})});
      r.checks.push({s:'ok',t:T('c_shear',{l:lbl}),d:`V = F/n = ${f(V)} kN`,p:`${f(V,1)} kN`});
      if(isLeg){
        const fa=num(m.fa), fb=num(m.fb)??fa;
        if(fa){const At=fa*fb;
          ['X','Y'].forEach(d=>{const dn=d==='X'?dNX:dNY;
            add('E'+d,`${T('allFeet')} (${f(fa)} × ${f(fb)} m)`,`v ${T('horiz',{d})}`,V/At,'kN/m²');
            add('E'+d,T('sideLegs',{s:'+',d}),T('pzOver'),-dn/At,'kN/m²');
            add('E'+d,T('sideLegs',{s:'−',d}),T('pzOver'),dn/At,'kN/m²');});
          r.footInfo=T('footGrav',{a:f(Wa/n/At,1),b:f(g1/At,1)})+(sup==='legs-circ'?T('foot45'):'');
        } else {
          ['X','Y'].forEach(d=>{const dn=d==='X'?dNX:dNY;
            add('E'+d,T('allLegs'),`F<sub>${d.toLowerCase()}</sub> ${T('horiz',{d})}`,V,'kN');
            add('E'+d,T('sideLegs',{s:'+',d}),'F<sub>z</sub>',-dn,'kN');
            add('E'+d,T('sideLegs',{s:'−',d}),'F<sub>z</sub>',dn,'kN');});
        }
      } else ['X','Y'].forEach(d=>add('E'+d,T('anchInfo'),T('dNper',{d}),d==='X'?dNX:dNY,'± kN'));
    } else if(isLeg){
      r.checks.push({s:'na',t:T('c_nolegs'),d:sup==='legs-circ'?'n, D<sub>c</sub>':'n, a<sub>x</sub>',p:T('p_need')});
    } else if(sup==='surf-circ'&&num(m.Wh)!==null){
      r.checks.push({s:'na',t:T('c_noanch'),d:T('d_noanch'),p:T('p_need')});
    }
    if(sup==='two'){
      const a=num(m.a2), fa=num(m.fa), fb=num(m.fb)??fa, ax=m.axis||'Y', tr=ax==='Y'?'X':'Y';
      if(a&&fa){
        const At=fa*fb, dN=M/a, g1=Wh/2, pzT=6*(M/2)/(fb*fb*fa), qT=4*(M/2)/(fb*fb*fa);
        add('E'+ax,`${T('bothSad')} (${f(fa)} × ${f(fb)} m)`,`p ${T('horiz',{d:ax})}`,F/2/At,'kN/m²');
        add('E'+ax,T('sideSad',{s:'+',d:ax}),T('pzOver'),-dN/At,'kN/m²');
        add('E'+ax,T('sideSad',{s:'−',d:ax}),T('pzOver'),dN/At,'kN/m²');
        add('E'+tr,T('bothSad'),`p ${T('horiz',{d:tr})}`,F/2/At,'kN/m²');
        add('E'+tr,T('bothSadHalf',{s:'+',d:tr}),T('pzHalf'),-qT,'kN/m²');
        add('E'+tr,T('bothSadHalf',{s:'−',d:tr}),T('pzHalf'),qT,'kN/m²');
        add('E'+tr,T('sadLin'),T('pzLin'),pzT,'± kN/m²');
        const gp=g1/At, up=Math.min(gp-dN/At,gp-pzT);
        r.checks.push({s:up>=0?'ok':'crit',t:T('c_sad'),d:`${f(gp,1)} kN/m² ${T('gravL')} − max(${f(dN/At,1)}; ${f(pzT,1)}) = ${fs(up,1)} kN/m²`,p:up>=0?T('p_comp'):T('p_tensA')});
        r.checks.push({s:'warn',t:T('c_slideSad'),d:T('d_slideSad',{d:ax,v:f(F/At,1)}),p:T('p_ask')});
      } else r.checks.push({s:'na',t:T('c_nosad'),d:T('d_nosad'),p:T('p_need')});
    }
  }
  const ps=m.pshape, t=num(m.pt);
  if(F!==null&&M!==null&&ps!=='none'&&t){
    let A=null,dims=null;
    if(ps==='rect'){const B=num(m.pB),Ll=num(m.pL); if(B&&Ll){A=B*Ll;dims={X:B,Y:Ll,circ:false};}}
    else{const D=num(m.pD); if(D){A=Math.PI*D*D/4;dims={X:D,Y:D,circ:true,D};}}
    if(A){
      const Wp=A*t*num(G.gc), Fp=r.aPlate*Wp, N=Wa+Wp, Mt=F*(t+r.hg)+Fp*t/2, e=Mt/N;
      const tan=Math.tan(num(G.delta)*Math.PI/180), slide=(F+Fp)/(N*tan);
      const P={Wp,Fp,N,Mt,e,slide,dirs:{}};
      ['X','Y'].forEach(d=>{const b=dims[d], l=dims.circ?null:dims[d==='X'?'Y':'X'];
        let cls,smax,smin,s;
        if(dims.circ){const D=dims.D;
          if(e<=D/8){cls=T('full');s='ok';smax=N/A+Mt/(Math.PI*D**3/32);smin=N/A-Mt/(Math.PI*D**3/32);}
          else if(e<=0.3*D){cls=T('part');s='warn';smax=null;smin=0;}
          else{cls=T('spec_c');s='crit';smax=null;smin=0;}
        } else {
          if(e<=b/6){cls=T('full');s='ok';smax=N/A*(1+6*e/b);smin=N/A*(1-6*e/b);}
          else if(e<=b/3){cls=T('part');s='warn';smax=2*N/(3*l*(b/2-e));smin=0;}
          else{cls=T('spec_r');s='crit';smax=e<b/2?2*N/(3*l*(b/2-e)):null;smin=0;}
        }
        P.dirs[d]={b,cls,s,smax,smin,lim1:dims.circ?dims.D/8:b/6,lim2:dims.circ?0.3*dims.D:b/3};});
      r.plate=P;
      const rk={ok:0,warn:1,crit:2};
      const worst=['X','Y'].map(d=>P.dirs[d]).sort((a,b)=>rk[b.s]-rk[a.s])[0];
      r.checks.push({s:worst.s,t:T('c_ecc'),d:`e = ${f(e,3)} m · ${T('limit')} ${f(worst.lim1,3)} / ${f(worst.lim2,3)} m`,p:worst.cls});
      r.checks.push({s:slide<=1?'ok':'crit',t:T('c_slide'),d:`(F + F<sub>alap</sub>)/(N·tg δ) = ${f(F+Fp)}/${f(N*tan)} = ${f(slide,3)}`,p:slide<=1?T('p_ok'):T('p_nok')});
      add('EX / EY',T('plateAll'),T('plateIn'),Fp/A,'kN/m²');
    } else r.checks.push({s:'na',t:T('c_noplate'),d:'B, L / D',p:T('p_need')});
  } else if(ps==='none') r.checks.push({s:'na',t:T('c_plate'),d:T('d_noplate'),p:'–'});
  if(F===null) r.checks.unshift({s:'na',t:T('c_noF'),d:plat?T('d_noFp'):'W<sub>a</sub>',p:T('p_need')});
  else if(r.hg===null) r.checks.unshift({s:'na',t:T('c_nohg'),d:T('d_nohg'),p:T('p_need')});
  const rank={crit:3,warn:2,ok:1,na:0};
  r.status=r.checks.reduce((a,c)=>rank[c.s]>rank[a]?c.s:a,'ok');
  if(r.checks.length&&r.checks.every(c=>c.s==='na')) r.status='na';
  return r;
}

const MF=['id','name','Wa','Wh','H','h0','eta','hg','mode','z','Hb','T1','Ta','gA','qa','gC','roCat','sup','bx','by','Ds','n','Dc','ax','ay','axis','a2','fa','fb','pshape','pB','pL','pD','pt','note'];
const GF=['agR','gI','soil','ag','gIe','delta','gc'];
function cur(){return S.M[S.sel];}
function nm(m){return (m.name&&m.name.length)?m.name:(m.nk&&EXN[m.nk]?EXN[m.nk][LANG]:'');}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function showVal(v){if(v===null||v===undefined)return '';return typeof v==='number'?String(v).replace('.',DS()):String(v);}
function fillSel(){$('m_sel').innerHTML=S.M.map((m,i)=>`<option value="${i}">${esc(m.id)} – ${esc(nm(m))}</option>`).join('');$('m_sel').value=S.sel;}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(el=>{const v=T(el.dataset.i); if(el.tagName==='OPTION') el.textContent=v.replace(/<[^>]+>/g,''); else el.innerHTML=v;});
  document.title=T('title');
  const cs=num($('m_roCat').value)||0;
  $('m_roCat').innerHTML=RO_CATS.map((c,i)=>`<option value="${i}">${c.l[LANG]} – ${f(c.b,1)} / ${f(c.q,1)}</option>`).join('');
  $('m_roCat').value=(cur().roCat||0);
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG?'true':'false'));
  document.querySelectorAll('[data-info]').forEach(el=>{
    const k=el.dataset.info; let ib=el.querySelector(':scope > .ib');
    if(!ib){ib=document.createElement('span');ib.className='ib';ib.textContent='i';ib.setAttribute('role','button');ib.tabIndex=0;ib.setAttribute('aria-expanded','false');el.appendChild(ib);
      if(!el._box){const box=document.createElement('div');box.className='info';box.hidden=true;
        const host=el.closest('label');
        if(host) host.appendChild(box); else (el.closest('h2,h3')||el).insertAdjacentElement('afterend',box);
        el._box=box;}
      const box=el._box; ib.setAttribute('aria-expanded',String(!box.hidden));
      const tog=ev=>{ev.preventDefault();ev.stopPropagation();box.hidden=!box.hidden;ib.setAttribute('aria-expanded',String(!box.hidden));};
      ib.addEventListener('click',tog); ib.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' ')tog(ev);});
    }
    ib.setAttribute('aria-label','Info'); el._box.innerHTML=(INFO[LANG]||INFO.hu)[k]||'';
  });
  setDrive();
}
function setDrive(){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.drive===S.G.drive?'true':'false'));
  const d=S.G.drive;
  $('card_ec').classList.toggle('dim',d==='ro'); $('code_ec').classList.toggle('dim',d==='ro');
  $('card_ro').classList.toggle('dim',d==='ec'); $('code_ro').classList.toggle('dim',d==='ec');
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{S.G.drive=b.dataset.drive;setDrive();update();}));
function fillInputs(){
  GF.forEach(k=>{$('g_'+k).value=showVal(S.G[k]);});
  const m=cur(); MF.forEach(k=>{$('m_'+k).value=showVal(m[k]);}); $('m_name').placeholder=nm(m);
  $('m_roCat').value=m.roCat||0; vis();
}
function vis(){
  const m=cur();
  document.querySelectorAll('[data-show]').forEach(el=>{const ks=el.dataset.show.split(' ');el.hidden=!ks.some(k=>k===m.sup||k===m.mode);});
  document.querySelectorAll('[data-pshow]').forEach(el=>{el.hidden=!el.dataset.pshow.split(' ').includes(m.pshape);});
}
function soilInfo(){const s=SOIL[S.G.soil];$('g_soilinfo').value=`${f(s[0])} · ${f(s[1])} · ${f(s[2],1)} · ${f(s[3],1)} s`;}
GF.forEach(k=>$('g_'+k).addEventListener('input',e=>{S.G[k]=e.target.value;update();}));
MF.forEach(k=>$('m_'+k).addEventListener(k==='id'||k==='name'?'change':'input',e=>{
  const m=cur(); let v=e.target.value; if(k==='roCat') v=parseInt(v,10);
  m[k]=v; if(['sup','mode','pshape'].includes(k)) vis(); if(k==='id'||k==='name') fillSel(); update();}));
$('m_sel').addEventListener('change',e=>{S.sel=+e.target.value;fillInputs();update();});
$('b_add').addEventListener('click',()=>{S.M.push(Object.assign({},base,{id:'P'+(S.M.length+1),name:T('newM'),sup:'surf-rect'}));S.sel=S.M.length-1;fillSel();fillInputs();update();});
let delArm=false;
$('b_del').addEventListener('click',()=>{
  if(S.M.length<=1)return;
  if(!delArm){delArm=true;$('b_del').textContent=T('delSure');setTimeout(()=>{delArm=false;$('b_del').textContent=T('del');},2500);return;}
  S.M.splice(S.sel,1);S.sel=Math.max(0,S.sel-1);delArm=false;$('b_del').textContent=T('del');fillSel();fillInputs();update();});
let resArm=false;
$('b_reset').addEventListener('click',()=>{
  if(!resArm){resArm=true;$('b_reset').textContent=T('resetSure');setTimeout(()=>{resArm=false;$('b_reset').textContent=T('reset');},3000);return;}
  S={G:Object.assign({},G0),M:JSON.parse(JSON.stringify(M0)),sel:0};resArm=false;$('b_reset').textContent=T('reset');fillSel();fillInputs();applyLang();update();});
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.lang;try{localStorage.setItem(LKEY,LANG);}catch(e){}applyLang();fillSel();fillInputs();update();}));

function render(){
  const m=cur(), r=calc(m,S.G);
  $('r_title').innerHTML=T('force_t')+`${esc(m.id)} ${esc(nm(m))}`;
  const row=(k,v)=>`<div class="r"><span>${k}</span><b>${v}</b></div>`;
  $('r_ec').innerHTML=[
    row('α = γ<sub>I</sub>·a<sub>gR</sub>/g',f(r.alpha,4)), row('S ('+esc(S.G.soil)+T('soilL')+')',f(r.S)), row(r.saNote,f(r.Sa,4)),
    row('γ<sub>a</sub> / q<sub>a</sub>',f(r.gA,1)+' / '+f(r.qa,1)), row('F<sub>a</sub>/W<sub>a</sub>',r.Fec!==null?f(r.Fec/num(m.Wa),4):'–')].join('');
  $('r_ecF').innerHTML=r.Fec!==null?`${f(r.Fec)} kN<small>F<sub>a</sub></small>`:'–';
  $('r_ro').innerHTML=[
    row('γ<sub>CNS</sub> · a<sub>g</sub> [g]',f(r.gC,2)+' · '+f(r.ag,2)), row('β<sub>CNS</sub> / q<sub>CNS</sub>',f(r.beta,1)+' / '+f(r.qC,1)),
    row('K<sub>z</sub> = 1 + 2z/H',f(r.Kz,2)), row(T('fromFormula'),r.Fro!==null?f(r.Fro_raw)+' kN':'–'),
    row(T('bounds'),r.Fro!==null?f(r.Fro_lo)+' … '+f(r.Fro_hi)+' kN':'–')].join('');
  $('r_roF').innerHTML=r.Fro!==null?`${f(r.Fro)} kN<small>${r.roBound}</small>`:'–';
  const src=r.Fsrc==='ec'?'Eurocode':r.Fsrc==='ro'?'P100':'–';
  $('r_design').innerHTML=`
    <div class="kv"><span class="k">${T('k_F')}</span><span class="v">${f(r.F)} kN</span></div>
    <div class="kv"><span class="k">${T('k_src')}</span><span class="v" style="color:var(--${r.Fsrc||'muted'})">${src}</span></div>
    <div class="kv"><span class="k">${T('k_hg')}</span><span class="v">${f(r.hg)} m</span></div>
    <div class="kv"><span class="k">M = F·h<sub>g</sub></span><span class="v">${f(r.M)} kNm</span></div>
    <span class="pill ${r.status}">${T('st')[r.status]}</span>`;
  $('r_checks').innerHTML=(r.checks.length?r.checks:[{s:'na',t:T('c_none'),d:'',p:'–'}]).map(c=>`<div class="check ${c.s}"><div><div class="t">${c.t}</div><div class="d">${c.d}</div></div><span class="pill ${c.s}">${c.p}</span></div>`).join('')
    +(r.footInfo?`<div class="hint">${r.footInfo}</div>`:'')+(m.note?`<div class="hint"><b>${T('noteL')}:</b> ${esc(m.note)}</div>`:'');
  $('r_axis').innerHTML=r.rows.length?r.rows.map(x=>`<tr><td class="dir">${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class="n">${fs(x[3],2)}</td><td>${x[4]}</td></tr>`).join(''):`<tr><td colspan="5" style="color:var(--muted)">${T('noDist')}</td></tr>`;
  if(r.plate){const P=r.plate,X=P.dirs.X,Y=P.dirs.Y;
    const pr=(k,a,b,n)=>`<tr><td>${k}</td><td class="n">${a}</td><td class="n">${b}</td><td>${n||''}</td></tr>`;
    $('r_plate').innerHTML=[
      pr(T('pl_W'),f(P.Wp,1)+' kN','',''),
      pr(T('pl_F'),f(P.Fp,2)+' kN','',`a = ${f(r.aPlate,4)} g (${r.Fsrc==='ro'?'γ<sub>I,e</sub>·a<sub>g</sub>':'α·S'})`),
      pr('N = W<sub>a</sub> + W',f(P.N,1)+' kN','',''),
      pr('M = F·(t + h<sub>g</sub>) + F<sub>alap</sub>·t/2',f(P.Mt,2)+' kNm','',''),
      pr('e = M/N',f(P.e,3)+' m','',''),
      pr(T('pl_dim'),f(X.b)+' m',f(Y.b)+' m',''),
      pr(T('pl_cls'),`<span class="pill ${X.s}">${X.cls}</span>`,`<span class="pill ${Y.s}">${Y.cls}</span>`,'EC7 6.5.4'),
      pr('σ<sub>max</sub>',X.smax!==null?f(X.smax,1)+' kPa':T('nonlin'),Y.smax!==null?f(Y.smax,1)+' kPa':T('nonlin'),''),
      pr('σ<sub>min</sub>',f(X.smin,1)+' kPa',f(Y.smin,1)+' kPa',''),
      pr(T('pl_sl'),f(P.slide,3),'',T('pl_sln'))].join('');
  } else $('r_plate').innerHTML=`<tr><td colspan="4" style="color:var(--muted)">${T('noPlate')}</td></tr>`;
  $('r_all').innerHTML=S.M.map((mm,i)=>{const q=calc(mm,S.G);
    return `<tr data-i="${i}" class="${i===S.sel?'sel':''}"><td><b>${esc(mm.id)}</b></td><td>${esc(nm(mm))}</td><td class="n">${f(num(mm.Wa),1)}</td><td class="n">${f(q.Fec)}</td><td class="n">${f(q.Fro)}</td><td class="n">${f(q.F)}</td><td class="n">${f(q.M)}</td><td><span class="pill ${q.status}">${T('sts')[q.status]}</span></td></tr>`;}).join('');
  window.__rows=r.rows;
}
$('r_all').addEventListener('click',e=>{const tr=e.target.closest('tr');if(!tr)return;S.sel=+tr.dataset.i;fillSel();fillInputs();update();});
$('b_copy').addEventListener('click',()=>{
  const strip=s=>String(s).replace(/<[^>]+>/g,'');
  const m=cur();
  const txt=[T('copyHead')].concat((window.__rows||[]).map(x=>[m.id,x[0],strip(x[1]),strip(x[2]),fs(x[3],2),strip(x[4])].join('\t'))).join('\n');
  const done=()=>{$('copymsg').textContent=T('copied');};
  function fallback(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){$('copymsg').textContent=T('copyFail');}ta.remove();}
  try{navigator.clipboard.writeText(txt).then(done,()=>fallback(txt));}catch(e){fallback(txt);}
});
function update(){soilInfo();render();save();}
fillSel();applyLang();fillInputs();update();
})();
</script>
