/* Lohmeyer: plan of load positions + section with friction */
function figLoh(o){
  o=o||{}; const x2=o.x2||1000, xG=o.xG||0, Ka=o.Ka, LF=o.LF||6, rack=!!o.rack;
  let s=svgOpen(340,300)+defs();
  // plan: one panel with neighbours
  const X0=20,Y0=26,W=260,H=150;
  s+=`<rect x="${X0}" y="${Y0}" width="${W}" height="${H}" fill="${C.conc}" stroke="${C.line}"/>`;
  s+=`<rect x="${X0+W}" y="${Y0}" width="40" height="${H}" fill="${C.pale}" stroke="${C.line}"/><rect x="${X0}" y="${Y0+H}" width="${W}" height="16" fill="${C.pale}" stroke="${C.line}"/>`;
  s+=`<line x1="${X0+W}" y1="${Y0-6}" x2="${X0+W}" y2="${Y0+H+22}" stroke="${C.acc}" stroke-width="2" stroke-dasharray="6 3"/><line x1="${X0-6}" y1="${Y0+H}" x2="${X0+W+46}" y2="${Y0+H}" stroke="${C.acc}" stroke-width="2" stroke-dasharray="6 3"/>`;
  s+=txt(X0+W+4,Y0-10,L3('hézag','rost','joint'),{fs:9,fill:C.acc});
  const sc=Math.min(0.045, 110/Math.max(x2,1)), dx=Math.max(16,x2*sc);
  const wheel=(x,y)=>`<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="${C.acc}"/>`;
  // interior (mid)
  const mx=X0+70, my=Y0+60;
  s+=wheel(mx,my)+wheel(mx+dx,my)+dim(mx,my+14,mx+dx,my+14,'x');
  if(rack&&xG>0){ const gx=mx, gy=my-Math.max(14,xG*sc); s+=`<rect x="${gx-4}" y="${gy-4}" width="8" height="8" fill="${C.ink}"/>`+`<line x1="${gx}" y1="${gy+4}" x2="${gx}" y2="${my-5}" stroke="${C.muted}" stroke-dasharray="2 2"/>`+txt(gx+8,gy+3,'x<tspan font-size="8">G</tspan>',{fs:10,fill:C.ink}); }
  s+=txt(mx+dx/2,my+36,L3('① közép','① câmp','① interior'),{a:'middle',fs:10,fw:600});
  // edge (wheels along joint, right edge)
  const ex=X0+W-7, ey=Y0+30;
  s+=wheel(ex,ey)+wheel(ex,ey+dx)+txt(ex-10,ey+dx/2+4,L3('② szél','② margine','② edge'),{a:'end',fs:10,fw:600});
  // corner
  const cx=X0+W-7, cy=Y0+H-7;
  s+=wheel(cx,cy)+wheel(cx-dx,cy)+txt(cx-dx-10,cy+3,L3('③ sarok','③ colț','③ corner'),{a:'end',fs:10,fw:600});
  // Ka arrow across joint
  s+=`<path d="M${X0+W-14} ${Y0+95} q14 -14 28 0" fill="none" stroke="${C.steel}" stroke-width="1.5" marker-end="${U('arw')}"/>`+txt(X0+W-18,Y0+114,'K<tspan font-size="8">a</tspan>'+(Ka!=null?' = '+fmt(Ka,2):''),{a:'end',fs:10,fill:C.steel});
  s+=dim(X0,Y0+H+30,X0+W,Y0+H+30,'L<tspan font-size="8">F</tspan> = '+fmt(LF,1)+' m');
  // section with friction
  const sy=Y0+H+52;
  s+=`<rect x="${X0}" y="${sy}" width="${W}" height="22" fill="${C.conc}" stroke="${C.line}"/><line x1="${X0}" y1="${sy+24}" x2="${X0+W}" y2="${sy+24}" stroke="${C.acc}" stroke-width="1.5"/><rect x="${X0}" y="${sy+26}" width="${W}" height="20" fill="${U('pGran')}" stroke="${C.line}"/>`;
  s+=`<line x1="${X0+W/2}" y1="${sy+11}" x2="${X0+25}" y2="${sy+11}" stroke="${C.red}" stroke-width="1.5" marker-end="${U('arw')}"/><line x1="${X0+W/2}" y1="${sy+11}" x2="${X0+W-25}" y2="${sy+11}" stroke="${C.red}" stroke-width="1.5" marker-end="${U('arw')}"/>`;
  s+=txt(X0+W/2,sy+19,L3('zsugorodás','contracție','shrinkage'),{a:'middle',fs:8,fill:C.red});
  s+=txt(X0+W+6,sy+28,'μ',{fs:11,fill:C.acc,fw:600})+txt(X0+W+6,sy+40,L3('súrlódás','frecare','friction'),{fs:8,fill:C.muted});
  s+='</svg>';
  return fig(s,L3('Lohmeyer (Westergaard/Eisenmann) teherállások: ① lemez közepe – σ alul, a 2. kerék (x) és a polcláb (x<sub>G</sub>) hatásával; ② szél és ③ sarok a hézagnál, K<sub>a</sub> teherátadással. Alul: a táblahossz (L<sub>F</sub>) mentén a súrlódás (μ) gátolja a zsugorodást → kényszerfeszültség.','Poziții Lohmeyer: ① câmp – σ jos, cu roata 2 (x) și piciorul de raft (x<sub>G</sub>); ② margine și ③ colț la rost, cu transfer K<sub>a</sub>. Jos: frecarea (μ) pe lungimea L<sub>F</sub> împiedică contracția.','Lohmeyer load positions: ① interior – σ at bottom, with 2nd wheel (x) and rack leg (x<sub>G</sub>); ② edge and ③ corner at the joint with K<sub>a</sub> transfer. Below: friction (μ) over L<sub>F</sub> restrains shrinkage.'));
}

function keiAt(arr,rho){ const i=(rho-KEI_RHO0)/KEI_STEP; if(i<=0) return arr[0]; if(i>=arr.length-1) return arr[arr.length-1]; const j=Math.floor(i), f=i-j; return arr[j]+(arr[j+1]-arr[j])*f; }

function lohStress(Qd,a,h,E,k,mu,le){

function lohCalc(W){

      eq:`G<sub>d</sub> = 1,20·F<sub>p</sub> = ${f1(Gd/1000)} kN; a = ${f0(aG)} mm, b = ${f0(s.b)} mm; σ<sub>m</sub> = 0,275·G<sub>d</sub>/h²·(1+μ)·[lg(E·h³/(k·b⁴)) − 0,436] = ${f2(s.m)} MPa${parts.length?'; '+parts.join('; '):''}; Σσ = ${f2(tot)} MPa; ${epsTxt(tot)}`});

function lohPanel(){
  const L=V.L||{}; if(METH==='tr34'||!L.le) return '';
  const rows=[['l<sub>e</sub> = [E<sub>cm</sub>·h³/(12(1−μ²)k)]<sup>0,25</sup> <span class="tag tr">Gl. 7.27</span>',f0(L.le)+' mm'],
    ['μ · k<sub>s</sub>'+(L.kSrc==='ev2T'?' = E<sub>v2,T</sub>/(0,83·h·∛(E<sub>cm</sub>/E<sub>v2,T</sub>)) <span class="tag tr">Gl. 7.8</span>':''),fmt(L.mu,2)+' · '+fmt(L.k,4)+' N/mm³'+(L.kSrc==='ev2T'?' (E<sub>v2,T</sub> = '+f0(L.ET)+' MPa)':(L.kSrc==='ins'?' ('+L3('hőszigetelés','izolație','insulation')+')':' (= TR34 k)'))],
    [L3('Használati terület / kivitel','Domeniu de utilizare / execuție','Usage area / execution')+' <span class="tag tr">Tafel 7.2/7.3</span>',L.area+' / '+L.ex+' → γ<sub>ct,Q</sub> = '+f2(L.gQ)+', γ<sub>ct,S</sub> = '+f2(L.gS)],
    ['n → γ<sub>Q</sub>·φ<sub>n</sub> <span class="tag tr">Tafel 7.1</span>',fmt(L.nRep,0)+' → '+f2(L.gqp)],
    ['ε<sub>zul</sub> = 0,10‰/γ<sub>ct,Q</sub> → σ<sub>zul</sub> = E·ε<sub>zul</sub>',fmt(L.epsQ*1e3,3)+'‰ → '+f2(L.sQ)+' MPa']];
  if(L.Ka!=null) rows.push(['K<sub>a</sub> <span class="tag tr">Tafel 7.9</span>',f2(L.Ka)+(val('lohKa')==='auto'?' ('+L3('automatikus','automat','automatic')+(L.kaRef?', '+L.kaRef:'')+')':'')]);
  rows.push(['μ<sub>1</sub> / μ<sub>2</sub> <span class="tag tr">Tafel 7.5</span> · L<sub>F</sub>',fmt(L.fr[0],2)+' / '+fmt(L.fr[1],2)+' · '+f2(L.LF)+' m']);
  if(L.ev2) rows.push([L3('Szükséges E<sub>v2</sub> altalaj / ágyazat','E<sub>v2</sub> necesar teren / strat','Required E<sub>v2</sub> subgrade / sub-base')+' <span class="tag tr">Tafel 7.4</span>',L.ev2[1]+' / '+L.ev2[2]+' MPa (Q<sub>d,max</sub> = '+f1(L.QdMax)+' kN)']);
  return kv(rows);
}
function lohNote(){
  return L3('Lohmeyer–Ebeling: Betonböden für Produktions- und Lagerhallen (2006), 7. és 8. fejezet. A módszer rugalmas (Westergaard/Eisenmann), a cél a repedésmentes lemez; a vasalás a repedés előtt nem dolgozik, ezért a feszültség a vasalástól független. A 2006-os kiadás DIN 1045-1 alapú; a 2019-es 4. kiadás Eurocode-alapú (értékei eltérhetnek). Szabadtéri padló hőmérsékleti felhajlása (7.8) a „Szabadtéri padló” jelölővel kapcsolható be. A szél- és sarokhelyzet második kerékre vonatkozó tényezője a Bild 7.6 ábráról leolvasott érték.',
    'Lohmeyer–Ebeling (2006), cap. 7 și 8. Metodă elastică (Westergaard/Eisenmann) pentru placă fără fisuri; armătura nu lucrează înainte de fisurare. Ediția 2006 se bazează pe DIN 1045-1; ediția a 4-a (2019) pe Eurocode. Curbarea termică la exterior (7.8) se activează cu „Pardoseală exterioară”. Coeficientul pentru a doua roată la margine/colț este citit de pe Bild 7.6.',
    'Lohmeyer–Ebeling (2006), ch. 7 and 8. Elastic method (Westergaard/Eisenmann) aiming at an uncracked slab; reinforcement does not act before cracking. The 2006 edition is based on DIN 1045-1; the 4th edition (2019) is Eurocode-based. Outdoor thermal curling (7.8) is enabled with “Outdoor floor”. The edge/corner second-wheel coefficient is read from Bild 7.6.');
}

/* ===== calculation report (breviar) – EC2:2023 tab is never included ===== */
const optText = id => { const e=$(id); return e&&e.selectedOptions&&e.selectedOptions[0] ? e.selectedOptions[0].textContent : ''; };
function rTable(head,rows){ return `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${typeof c==='number'||/^[\d\s.,−\-%]+[\w/²³ ]*$/.test(String(c))&&i>0?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
function buildReport(){
  const v=V, full=val('repMode')==='full', figs=$('repFigs').checked;
  const H=(n,s)=>`<h2>${n}. ${s}</h2>`;
  const today=val('pDate');
  let s=`<h1>${L3('Ipari padló – statikai számítás','Pardoseală industrială – breviar de calcul','Industrial floor – structural calculation')}</h1>`;
  s+=`<table class="meta"><tbody>
   <tr><td><b>${t('proj')}:</b></td><td>${val('projName')}</td></tr>
   <tr><td><b>${t('projNo')}:</b></td><td>${val('projNo')}</td></tr>
   <tr><td><b>${t('designer')}:</b></td><td>${val('designer')||'—'}</td></tr>
   <tr><td><b>${t('pDate')}:</b></td><td>${today}</td></tr>
   <tr><td><b>${t('methset')}:</b></td><td>${METH==='tr34'?'TR34':(METH==='loh'?'Lohmeyer–Ebeling':'TR34 + Lohmeyer–Ebeling')}</td></tr>
   <tr><td><b>${t('normset')}:</b></td><td>${NORM==='hu'?L3('Magyarország (MSZ EN)','Ungaria (MSZ EN)','Hungary (MSZ EN)'):L3('Románia (SR EN)','România (SR EN)','Romania (SR EN)')}</td></tr>
  </tbody></table>`;
  /* 1 references */
  s+=H(1,t('refsH'))+`<ul>${refsHtml().replace(/<code>/g,'<b>').replace(/<\/code>/g,'</b>')}</ul>`;
  /* 2 inputs */
  s+=H(2,L3('Bemenő adatok','Date de intrare','Input data'));
  s+=`<h3>${t('floorH')}</h3>`+rTable([L3('Jellemző','Parametru','Item'),L3('Érték','Valoare','Value')],[
    [t('support'),optText('support')],[t('method'),optText('method')],[t('scen'),optText('scenario')],[t('flat'),val('flatClass')],
    [t('sawnSp'),f1(num('sawnSp'))+' m'],[t('baySp'),f0(num('baySp'))+' m']]);
  s+=`<h3>${t('concH')}</h3>`+rTable([L3('Jellemző','Parametru','Item'),L3('Érték','Valoare','Value')],[
    [t('concCl'),optText('conc')],[t('hLbl'),f0(v.hNom)+' mm'],['Δh',f0(v.dh)+' mm'],
    [t('expH'),(v.exp.map(x=>NORM==='hu'&&x.startsWith('XK')?x+'(H)':x).join(' + ')||'—')],
    [L3('Minimális betonosztály / v/c','Clasa minimă / a/c','Minimum class / w/c'),clsName(v.minF)+' / '+(v.minWc<1?fmt(v.minWc,2):'—')]]);
  s+=`<h3>${t('layH')}</h3>`+rTable([t('layType'),t('layName'),t('layThk'),'E₂ ≥ [MPa]','E₂/E₁ ≤'],LAYERS.map(L=>[lyName(L.type),L.name||'—',L.type==='sub'?'—':(L.type==='film'?(L.n||1)+' × '+fmt(+L.t||0,2)+' mm':f0(+L.t||0)+' '+layerUnit(L.type)),L.e2?f0(L.e2):'—',L.tt?fmt(+L.tt,2):'—']));
  s+=rTable([L3('Jellemző','Parametru','Item'),L3('Érték','Valoare','Value')],[[t('memb'),optText('memb')],[t('kMode'),optText('kMode')],[t('kOn'),optText('kOn')],['k',fmt(v.k,4)+' N/mm³']]);
  const reinfRows=[[t('reinf'),optText('reinf')]]; if(v.meshR) reinfRows.push([t('meshPos'),optText('meshPos')]);
  if(v.fib) reinfRows.push([t('fibName'),val('fibName')||'—'],[t('fibGroup'),optText('fibGroup')],[t('fibShape'),optText('fibShape')],['l × d',f0(num('fibL'))+' × '+f2(num('fibD'))+' mm'],[t('fibDos'),f0(num('fibDos'))+' kg/m³'],['f<sub>R1</sub>…f<sub>R4</sub>',v.fR.map(f2).join(' / ')+' MPa']);
  if(v.hasBar) reinfRows.push([t('botH'),(val('botKind')==='bars'?t('kBars')+' Ø'+f0(num('meshD'))+'/'+f0(num('meshS')):t('kMesh')+' '+optText('meshSel'))],[t('steelGr'),val('steelGr')],['A<sub>s</sub>',f0(v.As)+' mm²/m'],['c',f0(v.c)+' mm'],['f<sub>yk</sub>',f0(v.fyk)+' MPa']);
  if(['fibEdge','fabEdge'].includes(val('reinf'))) reinfRows.push([t('stripLbl'),f2(num('stripW'))+' m']);
  if(v.topKind!=='none') reinfRows.push([t('topH'),(v.topKind==='mesh'?t('kMesh')+' '+optText('topMesh'):t('kBars')+' Ø'+f0(num('topD'))+'/'+f0(num('topS')))+', Aₛ = '+f0(v.AsTop)+' mm²/m ('+L3('teherbírásba nem számít, TR34 6.3.2','neconsiderată în capacitate, TR34 6.3.2','not counted in capacity, TR34 6.3.2')+')']);
  s+=`<h3>${t('t3h')}</h3>`+rTable([L3('Jellemző','Parametru','Item'),L3('Érték','Valoare','Value')],reinfRows);
  const jRows=[[t('jType'),optText('jType')]];
  if(v.jt==='system') jRows.push([t('sysName'),val('sysName')||'—'],[t('sysWmax'),f1(num('sysWmax'))+' mm'],[t('sysPd'),num('sysPd')>0?f1(num('sysPd'))+' kN':'TR34'],[t('armour'),'✓']);
  if($('wkOn').checked||val('expXV')) jRows.push([t('wkMax'),fmt(num('wkMax'),2)+' mm']);
  if(DOWJ.includes(v.jt)) jRows.push([t('dType'),optText('dType')],[v.dT==='plate'?'p<sub>b</sub> × t<sub>p</sub>':'d<sub>d</sub>',v.dT==='plate'?f0(num('pb'))+' × '+f0(num('tpl'))+' mm':f0(num('dd'))+' mm'],['s',f0(num('ds'))+' mm'],['w',f0(num('jw'))+' mm'],['f<sub>yk</sub>',f0(num('fykD'))+' MPa']);
  if(v.jt==='sawn'||v.jt==='sawnDowel') jRows.push([t('sawnD'),f0(num('sawnD'))+' mm (= '+fmt(num('sawnD')/v.hNom,2)+'·h)'],[t('sawnSp'),f1(num('sawnSp'))+' m']);
  s+=`<h3>${t('t4h')}</h3>`+rTable([L3('Jellemző','Parametru','Item'),L3('Érték','Valoare','Value')],jRows);
  const lRows=[];
  if(v.hasRack&&v.rt!=='none') lRows.push([t('rackType'),optText('rackType')],['F<sub>p</sub> · γ',f1(v.Fp)+' kN · '+fmt(v.gR,1)],[L3('Hatékony talplemez','Placă de bază efectivă','Effective baseplate'),f0(v.ap)+' × '+f0(v.bp)+' mm'],['x · y',f0(v.xs)+' · '+f0(v.ys)+' mm']);
  if(v.hasMhe&&v.mt!=='none') lRows.push([t('mheType'),optText('mheType')],[t('flCls'),v.fl||t('flNone')],['Q<sub>k</sub>',f1(v.Qk)+' kN'],[t('dynMode'),v.dyn==='en'?'φ = '+fmt(v.phi,2)+' × γ<sub>Q</sub> = 1,5 → '+fmt(v.gEff,2)+' (EN 1991-1-1 6.3.2.3)':'γ = '+fmt(v.gD,2)+' (TR34 7.2)'],[L3('Érintkezési felület','Amprentă','Contact area'),f0(v.atg)+' × '+f0(v.btg)+' mm'],['H₁',f0(num('H1'))+' mm']);
  if($('mezOn').checked) lRows.push([t('mezH'),'G<sub>k</sub> = '+f1(num('mG'))+' kN, Q<sub>k</sub> = '+f1(num('mQ'))+' kN, '+f0(num('ma'))+' × '+f0(num('mb'))+' mm']);
  lRows.push(['q · γ',f1(num('q'))+' kN/m² · '+fmt(num('gUdl')||1,2)]); if(num('ql')>0) lRows.push(['q<sub>l</sub>',f1(num('ql'))+' kN/m ('+optText('qlPos')+')']);
  s+=`<h3>${t('t5h')}</h3>`+rTable([L3('Jellemző','Parametru','Item'),L3('Érték','Valoare','Value')],lRows);
  if(METH!=='tr34'){ s+=`<h3>${t('lohH')}</h3>`+rTable([L3('Jellemző','Parametru','Item'),L3('Érték','Valoare','Value')],[[t('lohArea'),optText('lohArea')],[t('lohExec'),optText('lohExec')],[t('lohNl'),fmt(num('lohN'),0)],['μ<sub>c</sub>',fmt(num('lohMu'),2)],[t('lohX2'),f0(num('lohX2'))],[t('lohXG'),f0(num('lohXG'))],[t('lohKa'),optText('lohKa')],[t('lohFr'),optText('lohFr')],[t('lohLF'),f2(num('lohLF'))],[t('lohQl'),f1(num('lohQl'))],[t('ev2U')+' / '+t('ev2T'),f0(num('ev2U'))+' / '+f0(num('ev2T'))]].concat($('lohOut').checked?[[t('lohOut'),'✓'],[t('lohBF'),f2(num('lohBF'))],[t('lohDt'),fmt(num('lohDt'),2)]]:[])); }
  if(figs){ s+=`<div class="figrow"><div>${figSupport(val('support'))}</div><div>${figLayers(LAYERS,Math.round(v.hNom))}</div><div>${figReinf(val('reinf'),val('topKind'),{b:num('stripW'),c:num('cov'),pos:v.meshPos})}</div><div>${figJoint(val('jType'),val('dType'))}</div>${v.hasRack&&v.rt!=='none'?`<div>${figRack(v.rt,v.xs,v.ys,num('aisle'))}</div>`:''}</div>`; }
  /* 3 material properties */
  s+=H(3,L3('Anyagjellemzők és merevség','Proprietăți de material și rigiditate','Material properties and stiffness'));
  const eq=x=>`<div class="eq">${x}</div>`;
  if(full){
    s+=eq(`f<sub>cm</sub> = f<sub>ck</sub> + 8 = ${f0(v.fck)} + 8 = ${f0(v.fcm)} MPa; f<sub>ctm</sub> = 0,3·f<sub>ck</sub><sup>2/3</sup> = ${f2(v.fctm)} MPa; E<sub>cm</sub> = 22000·(f<sub>cm</sub>/10)<sup>0,3</sup> = ${f0(v.Ecm)} MPa`);
    s+=eq(`f<sub>ctd,fl</sub> = f<sub>ctm</sub>·(1,6 − h/1000)/γ<sub>m</sub> = ${f2(v.fctm)}·${f2(v.fflex)}/1,5 = ${f2(v.fctdfl)} MPa  [TR34 Eq.1]`);
    s+=eq(`M<sub>un</sub> = M<sub>n</sub> = f<sub>ctd,fl</sub>·h²/6 = ${f2(v.fctdfl)}·${f0(v.h)}²/6 = ${f2(v.Mun)} kNm/m  [TR34 Eq.2]`);
    if(v.smRestr&&v.SM) s+=eq(`M<sub>n,res</sub> = (f<sub>ctd,fl</sub> − f<sub>sh,cur</sub>)·h²/6 = (${f2(v.fctdfl)} − ${f2(v.SM.fshc)})·${f0(v.h)}²/6 = ${f2(v.SM.MnR)} kNm/m  [${L3('kényszerrel csökkentve – TR34 3. kiadás (2003) módszere, EC2 B melléklet zsugorodással','redus din constrângere – metoda TR34 ed. 3 (2003), contracție EC2 Anexa B','reduced by restraint – TR34 3rd ed. (2003) method, shrinkage per EC2 Annex B')}]`);
    if(v.fib) s+=eq(`σ<sub>r1</sub> = 0,45·f<sub>R1</sub> = ${f2(v.s1)} MPa; σ<sub>r4</sub> = 0,37·f<sub>R4</sub> = ${f2(v.s4)} MPa; M<sub>p</sub> = h²(0,29σ<sub>r4</sub> + 0,16σ<sub>r1</sub>)/γ<sub>m</sub> = ${f2(v.Mfib)} kNm/m  [TR34 Eq.6]`);
    if((v.r==='fibFab'||v.r==='fibEdge')&&v.hasBar) s+=eq(v.eqBar==='8'?`M<sub>p</sub> = M<sub>fib</sub> + A<sub>s</sub>·f<sub>yk</sub>/γ<sub>s</sub>·(d − 0,048h) = ${f2(v.Mfib)} + ${f0(v.As)}·${f0(v.fyk)}/1,15·(${f0(v.d)} − ${f1(0.048*v.h)})/10⁶ = ${f2(v.Mbar)} kNm/m  [TR34 Eq.8]`:`h<sub>ux</sub> = ${f1(v.hux)} mm (Eq.9); M<sub>u</sub> = ${f2(v.Mbar)} kNm/m  [TR34 Eq.10]`);
    if(v.fabStrip) s+=eq(`M<sub>p,${L3('perem','fâșie','strip')}</sub> = 0,95·A<sub>s</sub>·f<sub>yk</sub>·d/γ<sub>s</sub> = ${f2(v.Mfab)} kNm/m  [TR34 Eq.3]`);
    if(v.fabOnly) s+=eq(`M<sub>p</sub> = 0,95·A<sub>s</sub>·f<sub>yk</sub>·d/γ<sub>s</sub> = 0,95·${f0(v.As)}·${f0(v.fyk)}·${f0(v.d)}/1,15/10⁶ = ${f2(v.Mfab)} kNm/m  [TR34 Eq.3]`);
    s+=eq(`${v.kNote} = ${fmt(v.kGround,4)} N/mm³${v.sup==='insul'?' → k = '+fmt(v.k,4)+' N/mm³ (TR34 5.5)':''}`);
    s+=eq(`l = [E<sub>cm</sub>·h³/(12(1−ν²)k)]<sup>0,25</sup> = [${f0(v.Ecm)}·${f0(v.h)}³/(12·0,96·${fmt(v.k,4)})]<sup>0,25</sup> = ${f0(v.l)} mm  [TR34 Eq.20]`);
    s+=eq(`λ = [3k/(E<sub>cm</sub>·h³)]<sup>0,25</sup> = ${fmt(v.lm,3)} 1/m  [TR34 Eq.33]`);
    if(!v.plain) s+=eq(`M<sub>p</sub>/M<sub>un</sub> = ${f2(v.MpF)}/${f2(v.Mun)} = ${f2(v.ratio)} ${v.ratio>=0.5?'≥':'<'} 0,50  [TR34 7.4]`);
    s+=eq(`d = ${f0(v.dEff)} mm; k<sub>s</sub> = ${f2(v.ks)}; v<sub>Rd,c,min</sub> = 0,035·k<sub>s</sub><sup>1,5</sup>·f<sub>ck</sub><sup>0,5</sup> = ${fmt(v.vmin,3)} MPa${v.steelFib?'; v<sub>f</sub> = 0,015·Σf<sub>R</sub> = '+fmt(v.vf,3)+' MPa':''}; v<sub>Rd,c</sub> = ${fmt(v.vRdc,3)} MPa; v<sub>max</sub> = ${f2(v.vmax)} MPa  [TR34 6.4]`);
    if(DOWJ.includes(v.jt)) s+=eq(`P<sub>sh</sub> = ${f1(v.Psh)} kN; P<sub>max</sub> = ${f1(v.Pbb)} kN (e = w/2 = ${f1(v.e)} mm) → P<sub>d</sub> = ${f1(v.Pd)} kN; n = 1,8·l/s = ${f2(v.nD)}; Y = ${f1(v.Y)} kN  [TR34 6.5, 7.9.2]`);
  } else {
    s+=rTable([L3('Jellemző','Parametru','Item'),L3('Érték','Valoare','Value')],[['f<sub>ctm</sub> · E<sub>cm</sub>',f2(v.fctm)+' MPa · '+f0(v.Ecm)+' MPa'],['f<sub>ctd,fl</sub>',f2(v.fctdfl)+' MPa'],['M<sub>n</sub> = M<sub>un</sub>',f2(v.Mun)+' kNm/m'],['M<sub>p</sub>',v.plain?'—':f2(v.MpF)+' kNm/m'],['k · l · λ',fmt(v.k,4)+' N/mm³ · '+f0(v.l)+' mm · '+fmt(v.lm,3)+' 1/m'],['v<sub>Rd,c</sub> · v<sub>max</sub>',fmt(v.vRdc,3)+' · '+f2(v.vmax)+' MPa']]);
  }
  if(METH!=='tr34'&&v.L&&v.L.le){ s+=`<h3>Lohmeyer – ${L3('alapértékek','valori de bază','basic values')}</h3>`+lohPanel().replace(/<div class="kv">/,'<table><tbody>').replace(/<div class="r"><span>(.*?)<\/span><span>(.*?)<\/span><\/div>/g,'<tr><td>$1</td><td>$2</td></tr>').replace(/<\/div>$/,'</tbody></table>'); }
  /* 4 checks */
  s+=H(4,t('t6h'));
  const groups=[['rack',t('sRack')],['mhe',t('sMhe')],['mez',t('sMez')],['mach',t('sMach')],['udl',t('sUdl')],['joint',t('sJoint')],['loh',t('sLoh')+' – Lohmeyer–Ebeling'],['mat',t('sMat')],['fat',t('sFat')]];
  const strip=x=>String(x).replace(/<span class="tag[^>]*>.*?<\/span>/g,'');
  groups.forEach(([g,name])=>{
    const L=CHECKS.filter(c=>c.grp===g); if(!L.length) return;
    s+=`<h3>${name}</h3>`;
    if(full){ L.forEach(c=>{ const ok=c.u<=1; s+=`<p style="margin:8px 0 2px"><b>${strip(c.label)}</b> ${c.ref?'['+c.ref+']':''} — ${c.info?t('info'):`<span class="${ok?'ok':'bad'}">${isFinite(c.u)?f0(c.u*100)+'%':'∞'} · ${ok?t('ok'):t('nok')}</span>`}</p>`; if(c.eq) s+=eq(c.eq); if(!c.txt) s+=eq(`${t('cap')} = ${fmt(c.cap,(c.unit==='MPa'||c.unit==='')?2:1)} ${c.info?'':(c.u<=1?'≥':'<')} ${t('dem')} = ${fmt(c.dem,(c.unit==='MPa'||c.unit==='')?2:1)} ${c.unit}${c.detail?' · '+c.detail:''}`); }); }
    else s+=rTable([t('colCheck'),t('colRef'),t('colCap'),t('colDem'),t('colU'),t('colRes')],L.map(c=>c.txt?[strip(c.label),c.ref||'',strip(c.txt),'','',t('info')]:[strip(c.label),c.ref||'',fmt(c.cap,(c.unit==='MPa'||c.unit==='')?2:1),fmt(c.dem,(c.unit==='MPa'||c.unit==='')?2:1)+' '+c.unit,isFinite(c.u)?f0(c.u*100)+'%':'∞',c.info?t('info'):`<span class="${c.u<=1?'ok':'bad'}">${c.u<=1?t('ok'):t('nok')}</span>`]));
  });
  if(val('flatClass')) s+=`<h3>${t('sFlat')}</h3>`+flatHtml().replace(/<div class="note[^"]*">/g,'<p>').replace(/<\/div>/g,'</div>');
  /* 5 warnings */
  const Wall=[].concat(v.W.loh||[],v.W.gen||[],v.W.mat||[],v.W.rack||[],v.W.mhe||[],v.W.mach||[],v.W.joint||[],v.W.fat||[]);
  if(!v.ductOK) Wall.unshift(note(t('ductBad'),'bad'));
  if(v.plain) Wall.unshift(note(t('plainNote'),'warn'));
  if(Wall.length){ s+=H(5,L3('Megjegyzések és figyelmeztetések','Observații și avertismente','Notes and warnings'))+'<ul>'+Wall.map(w=>'<li>'+w.replace(/<[^>]+>/g,'')+'</li>').join('')+'</ul>'; }
  /* 6 conclusion */
  const bad=CHECKS.filter(c=>!c.info&&c.u>1), gov=CHECKS.filter(c=>!c.info).reduce((a,b)=>(!a||b.u>a.u)?b:a,null);
  s+=H(Wall.length?6:5,L3('Összegzés','Concluzie','Conclusion'));
  s+=`<p class="${bad.length?'bad':'ok'}">${bad.length?t('someBad'):t('allOk')}</p>`;
  if(gov) s+=`<p>${t('govern')}: ${strip(gov.label)} — ${f0(gov.u*100)}%</p>`;
  s+=`<p style="font-size:.75rem;color:#555;margin-top:18px">${t('footer')}</p>`;
  $('reportDoc').innerHTML=s;
}
function reportStandalone(isDoc){
  const figsWas=$('repFigs').checked;
  if(isDoc) $('repFigs').checked=false;   // Word does not render inline SVG reliably
  buildReport();
  const body=$('reportDoc').innerHTML;
  $('repFigs').checked=figsWas; buildReport();
  const css=`body{font-family:Arial,sans-serif;font-size:10.5pt;color:#111;margin:${isDoc?'0':'24px'}}h1{font-size:16pt;margin:0 0 6px}h2{font-size:12pt;border-bottom:1.5px solid #111;padding-bottom:2px;margin:18px 0 6px}h3{font-size:10.5pt;margin:12px 0 4px;color:#333}
table{border-collapse:collapse;width:100%;font-size:9.5pt;margin:4px 0}th,td{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top}th{background:#eee}td.n{text-align:right}.meta td{border:none}

/* ===== mechanics ===== */
function meyer(Mp,Mn,a,l){
  const al=a/l, S=Mp+Mn;
  const i0=2*Math.PI*S, e0=Math.PI*S/2+2*Mn, c0=2*Mn;
  const i2=x=>4*Math.PI*S/(1-x/3), e2=x=>(Math.PI*S+4*Mn)/(1-2*x/3), c2=x=>4*Mn/(1-x);
  if(al>=0.2) return {i:i2(al),e:e2(al),c:c2(al),i0,e0,c0,i2:i2(al),e2:e2(al),c2:c2(al),al};
  const f=al/0.2; return {i:i0+(i2(0.2)-i0)*f, e:e0+(e2(0.2)-e0)*f, c:c0+(c2(0.2)-c0)*f, i0,e0,c0,i2:i2(0.2),e2:e2(0.2),c2:c2(0.2),al};
}
function dualCap(Mp,Mn,a,l,x){
  const al=a/l,S=Mp+Mn, v0=(2*Math.PI+1.8*x/l)*S;
  const v2=z=>(4*Math.PI/(1-z/3)+1.8*x/(l-z*l/2))*S;
  return al>=0.2? v2(al) : v0+(v2(0.2)-v0)*al/0.2;
}
function quadCap(Mp,Mn,a,l,x,y){
  const al=a/l,S=Mp+Mn, v0=(2*Math.PI+1.8*(x+y)/l)*S;
  const v2=z=>(4*Math.PI/(1-z/3)+1.8*(x+y)/(l-z*l/2))*S;
  return al>=0.2? v2(al) : v0+(v2(0.2)-v0)*al/0.2;
}
function westergaard(PkN,h,l,a){
  const P=PkN*1000, b=(a<1.724*h)?(Math.sqrt(1.6*a*a+h*h)-0.675*h):a, q=P/(h*h);
  return {i:0.316*q*(4*Math.log10(l/b)+1.069), e:0.572*q*(4*Math.log10(l/b)+0.359), c:3*q*(1-Math.pow(a*Math.SQRT2/l,0.6))};
}

}
const kv = rows => `<div class="kv">${rows.map(r=>`<div class="r"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>`;

  const meshR=['fibFab','fibEdge','fabric','fabEdge','bars'].includes(r), meshPos=meshR?(val('meshPos')||'bot'):'none', hasBot=meshR&&meshPos!=='top', hasTopR=meshR&&meshPos!=='bot';

  const fck=parseFloat(val('conc')), hNom=Math.max(num('h'),1), dh=Math.max(num('dh'),0), h=Math.max(hNom-dh,1), fcm=fck+8;

  else if(kMode==='e2'){ const E2=Math.max(num('E2'),1); k=E2/(0.83*(h/1000)*Math.pow(Ecm/E2,1/3))/1000; kNote=`k = E₂/(0,83·h·(Ecm/E₂)^⅓) = ${f0(E2)}/(0,83·${fmt(h/1000,3)}·(${f0(Ecm)}/${f0(E2)})^⅓)`; }

  function punching(grp,P,x,y,tag){

      addCheck({grp:'rack',tag:'quad',label:t('internal'),ref:'Eq.29/30',cap:Q,dem:4*Fd,unit:'kN',detail:`min(${f0(sumInd)}; ${f0(sumDual)}; ${f0(eq)})`,eq:`Pu,4 = min(4·Pu,1; 2·Pu,2; Eq.29/30) = min(${f0(sumInd)}; ${f0(sumDual)}; ${f0(eq)}) = ${f1(Q)} kN`});

function renderEC(v){

  if(!on){ if(!$('t8').hidden) showTab('t1'); return; }
  const f1k=num('fR1k'), f3k=num('fR3k'), kO=parseFloat(val('kO')), kG=Math.min(num('kG')||1,1.5);

  const duct=[['e',1.3],['d',1.1],['c',0.9],['b',0.7],['a',0.5]].find(([_,r])=>SC>0&&f3k>=r*SC);

    ['f<sub>Ftud</sub> = κ<sub>O</sub>κ<sub>G</sub>·0,33·f<sub>R,3k</sub>/γ<sub>SF</sub> <span class="tag ec">L.3, L.5</span>',f2(fFtud)+' MPa'],
    [L3('M<sub>Rd</sub> merev-képlékeny (≈ f<sub>Ftud</sub>·h²/2)','M<sub>Rd</sub> rigid-plastic (≈ f<sub>Ftud</sub>·h²/2)','M<sub>Rd</sub> rigid-plastic (≈ f<sub>Ftud</sub>·h²/2)')+' <span class="tag ec">L.8.1</span>',f2(MRd)+' kNm/m'],
    [L3('Összevetés: TR34 M<sub>p</sub>','Comparație: TR34 M<sub>p</sub>','Compare: TR34 M<sub>p</sub>'),v.fib?f2(v.Mfib)+' kNm/m':'—'],

  document.querySelectorAll('[data-t]').forEach(el=>{ const k=el.dataset.t; if(T[k]) el.innerHTML=t(k); });
  document.querySelectorAll('#langSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG));
  document.querySelectorAll('#normSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.norm===NORM));
  document.querySelectorAll('#methSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.meth===METH));
  $('refs').innerHTML=refsHtml(); renderMach();
  document.title=t('title');
  fillOptions(); renderLayers(); visibility(); render();
}
/* ===== tabs, popover, events ===== */
function showTab(id){ $('summary').hidden=id!=='t6'; document.querySelectorAll('#mainTabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id)); document.querySelectorAll('section.tab').forEach(s=>s.hidden=s.id!==id); hidePop(); }
function showSub(id){ document.querySelectorAll('#subTabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.sub===id)); document.querySelectorAll('.subp').forEach(s=>s.hidden=s.id!==id); }
let popBtn=null;
function hidePop(){ $('pop').hidden=true; if(popBtn) popBtn.setAttribute('aria-expanded','false'); popBtn=null; }
document.addEventListener('click',e=>{
  const b=e.target.closest('button.i');
  if(b){ e.preventDefault(); if(popBtn===b){hidePop();return;} hidePop(); popBtn=b; b.setAttribute('aria-expanded','true');
    const p=$('pop'); p.innerHTML=ti(b.dataset.i)||'—'; p.hidden=false;
    const r=b.getBoundingClientRect(), pw=Math.min(420,window.innerWidth-32);
    let x=r.left+window.scrollX-10; if(x+pw>window.scrollX+window.innerWidth-16) x=window.scrollX+window.innerWidth-16-pw; if(x<16) x=16;
    p.style.left=x+'px'; p.style.top=(r.bottom+window.scrollY+6)+'px'; return; }
  if(!e.target.closest('#pop')) hidePop();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') hidePop(); });
document.querySelectorAll('#mainTabs button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
document.querySelectorAll('#subTabs button').forEach(b=>b.addEventListener('click',()=>showSub(b.dataset.sub)));
document.querySelectorAll('#langSeg button').forEach(b=>b.addEventListener('click',()=>{ LANG=b.dataset.lang; applyLang(); }));
document.querySelectorAll('#normSeg button').forEach(b=>b.addEventListener('click',()=>{ NORM=b.dataset.norm; applyLang(); }));
document.querySelectorAll('#methSeg button').forEach(b=>b.addEventListener('click',()=>{ METH=b.dataset.meth; applyLang(); }));
document.querySelectorAll('.wrap input, .wrap select').forEach(el=>{ if(el.closest('#layTbl')||el.closest('#machList')||el.id==='fileLoad') return; el.addEventListener('input',()=>{
  if(el.id==='flCls' && el.value){ const v=FLC[el.value]; $('Qk').value=v[5]/2; $('atg').value=200; $('btg').value=200; $('wSp').value=Math.round(v[2]*1000); $('lohX2').value=Math.round(v[2]*1000); $('axF').value=v[5]; if(val('tyre')==='pneu') $('tyre').value='solid'; }
  if(['Qk','atg','btg'].includes(el.id)) $('flCls').value='';
  if(['ev2U','ev2T','kOn','kMode'].includes(el.id)) syncE2();
  if(el.id==='sawnD') SAWN_USER=true;
  if(el.id==='h' && !SAWN_USER) $('sawnD').value=Math.round(num('h')/3);
  if(['reinf','botKind','topKind','meshPos'].includes(el.id)) fillOptions();
  if(el.id==='fibCat'){ const c=FIB_CAT[el.value]; if(c){ $('fibName').value=el.value; $('fibL').value=c.l; $('fibD').value=c.d.toFixed(2); if(c.ft) $('fibFt').value=c.ft; if([...$('fibGroup').options].some(o=>o.value===c.g)) $('fibGroup').value=c.g; $('fibShape').value=c.sh; } }
  if(el.id==='jType'&&el.value==='system'&&$('dType').value!=='plate'){ $('dType').value='plate'; }
  if(el.id==='sysProd'){ const c=TJ_CAT[el.value]; $('sysPd').readOnly=!!c; if(c){ $('sysName').value=c.name; $('sysWmax').value=c.wmax; $('ds').value=c.s; $('dType').value='plate'; $('pb').value=c.b; $('tpl').value=c.t; if(num('jw')>c.wmax) $('jw').value=c.wmax; } else { $('sysPd').value=0; } }
  visibility(); render(); }); });
$('layAdd').addEventListener('click',()=>{ const i=LAYERS.findIndex(x=>x.type==='sub'); LAYERS.splice(i<0?LAYERS.length:i,0,{type:'gran',name:'',t:150}); renderLayers(); render(); });
/* save / load project */
function collect(){ const o={v:5,lang:LANG,norm:NORM,meth:METH,layers:LAYERS,mach:MACH,f:{}}; document.querySelectorAll('.wrap input[id], .wrap select[id]').forEach(el=>{ if(el.id==='fileLoad'||el.id==='AsOut') return; o.f[el.id]=el.type==='checkbox'?el.checked:el.value; }); return o; }
function restore(o){ if(!o||!o.f) return; Object.entries(o.f).forEach(([id,v])=>{ const el=$(id); if(!el) return; if(el.type==='checkbox') el.checked=!!v; else el.value=v; }); if(!$('reinf').value) $('reinf').value='fabric'; if(o.layers) LAYERS=o.layers; MACH=Array.isArray(o.mach)?o.mach:[]; renderMach(); if(o.lang) LANG=o.lang; if(o.norm) NORM=o.norm; if(o.meth) METH=o.meth; applyLang(); }
function download(name,mime,content){ const b=new Blob([content],{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
const safeName = () => (val('projNo')||'padlo').replace(/[^\w\-]+/g,'_');
$('btnSave').addEventListener('click',()=>download(safeName()+'_TR34.json','application/json',JSON.stringify(collect(),null,1)));
$('btnLoad').addEventListener('click',()=>$('fileLoad').click());
$('fileLoad').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ restore(JSON.parse(rd.result)); }catch(err){ alertBox(L3('A fájl nem olvasható projektfájlként.','Fișierul nu poate fi citit ca proiect.','The file could not be read as a project file.')); } }; rd.readAsText(f); e.target.value=''; });
function alertBox(msg){ const n=document.createElement('div'); n.className='note bad'; n.textContent=msg; $('summary').before(n); setTimeout(()=>n.remove(),5000); }
$('btnPrint').addEventListener('click',()=>{ document.body.classList.add('printing'); setTimeout(()=>{ window.print(); document.body.classList.remove('printing'); },50); });
$('btnDoc').addEventListener('click',()=>download(safeName()+'_breviar.doc','application/msword',reportStandalone(true)));
$('btnHtml').addEventListener('click',()=>download(safeName()+'_breviar.html','text/html',reportStandalone(false)));
/* init */
(function init(){ const d=new Date(); $('pDate').value=d.toISOString().slice(0,10); $('sawnD').value=Math.round(num('h')/3); applyLang(); showTab('t1'); })();

</script>
</body>
