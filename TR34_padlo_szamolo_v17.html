<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TR34 ipari padló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: engineering calc sheet. Header with switches, summary strip, main tabs; Checks tab has sub-tabs. Light theme only (user preference). */
:root{
  --bg:#f2f1ec; --panel:#ffffff; --ink:#15212c; --muted:#5b646d; --line:#d5d2c8;
  --steel:#1d4466; --steel-2:#2f6a9a; --accent:#b0622a; --soft:#eaeef2; --field:#fcfcfa;
  --ok:#2e7a43; --ok-bg:#e3f1e6; --bad:#b03a25; --bad-bg:#f8e2dd; --warn:#8f6410; --warn-bg:#f7eed8;
  --ec:#6b4ea0; --ec-bg:#efeaf7;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow","Segoe UI",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{border-bottom:3px solid var(--accent);padding-block:18px 14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
header.top h1{font-family:var(--f-display);font-size:1.65rem;margin:0;letter-spacing:.01em;text-wrap:balance}
header.top .sub{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-top:4px}
.switches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{font:600 .78rem var(--f-body);letter-spacing:.06em;background:transparent;color:var(--muted);border:0;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--steel);color:#fff}
.switches .lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.btn{font:600 .8rem var(--f-body);border:1px solid var(--steel-2);background:var(--panel);color:var(--steel);padding:7px 12px;border-radius:5px;cursor:pointer}
.btn.primary{background:var(--steel);color:#fff;border-color:var(--steel)}
.btn:hover{filter:brightness(.97)}
/* summary */
.summary{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.sum-item{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:4px;padding:8px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.sum-item.bad{border-left-color:var(--bad)}
.sum-item.na{border-left-color:var(--line);opacity:.75}
.sum-item .g{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sum-item .u{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.02rem;font-weight:600}
.sum-item.bad .u{color:var(--bad)}
.sum-item .w{font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tabs */
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:16px}
nav.tabs button{font:600 .8rem var(--f-body);background:var(--soft);color:var(--muted);border:1px solid var(--line);border-bottom:none;padding:9px 12px;border-radius:6px 6px 0 0;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--panel);color:var(--steel);border-color:var(--steel-2)}
nav.tabs button.ec{color:var(--ec);border-style:dashed}
nav.sub{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:8px}
nav.sub button{font:600 .76rem var(--f-body);background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 10px;border-radius:14px;cursor:pointer}
nav.sub button[aria-selected="true"]{background:var(--soft);color:var(--steel);border-color:var(--steel-2)}
nav.sub button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;background:var(--ok);vertical-align:1px}
nav.sub button .dot.bad{background:var(--bad)}
nav.sub button .dot.na{background:var(--line)}
section.tab{background:var(--panel);border:1px solid var(--line);border-radius:0 6px 6px 6px;padding:22px 22px 28px}
h2{font-family:var(--f-display);font-size:1.18rem;color:var(--steel);margin:0 0 4px}
h3{font-size:.78rem;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin:26px 0 8px}
h3 .f{text-transform:none;letter-spacing:0;color:var(--ink)}
p.intro{color:var(--muted);margin:0 0 14px;max-width:85ch}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 18px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.field .lab{font-size:.76rem;font-weight:600;color:var(--muted);display:block}
.field label button.i,.field .lab button.i{display:inline-block;margin-left:5px;vertical-align:-3px}
.field .hint{font-size:.7rem;color:var(--muted);line-height:1.4}
.field.chk{flex-direction:row;align-items:center;gap:8px}
.field.chk label{color:var(--ink)}
input[type=number],input[type=text],input[type=date],select{font:.86rem var(--f-mono);padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--field);color:var(--ink);width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--steel-2);outline-offset:1px}
input[readonly]{background:var(--soft)}
.tag{display:inline-block;font:600 .64rem var(--f-mono);color:#fff;background:var(--steel-2);padding:1px 5px;border-radius:3px;margin-right:4px;vertical-align:1px;white-space:nowrap}
.tag.tr{background:var(--accent)}
.tag.ec{background:var(--ec)}
/* info button + popover */
button.i{width:17px;height:17px;border-radius:50%;border:1px solid var(--steel-2);background:var(--panel);color:var(--steel-2);font:italic 700 .7rem Georgia,serif;line-height:15px;padding:0;cursor:pointer;flex:none;text-align:center}
button.i:hover,button.i[aria-expanded="true"]{background:var(--steel-2);color:#fff}
#pop{position:absolute;z-index:50;max-width:min(420px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--steel-2);border-radius:6px;box-shadow:0 6px 22px rgba(20,30,40,.18);padding:10px 12px;font-size:.82rem;line-height:1.5}
#pop .src{display:block;margin-top:6px;font:.7rem var(--f-mono);color:var(--muted)}
.note{background:var(--soft);border-left:4px solid var(--steel-2);padding:9px 12px;font-size:.82rem;margin:12px 0;border-radius:0 4px 4px 0;max-width:110ch}
.note.warn{background:var(--warn-bg);border-color:var(--warn)}
.note.bad{background:var(--bad-bg);border-color:var(--bad)}
.note.ec{background:var(--ec-bg);border-color:var(--ec)}
.kv{background:var(--soft);border-radius:4px;padding:8px 12px;margin-top:8px}
.kv .r{display:flex;justify-content:space-between;gap:12px;font:.8rem var(--f-mono);padding:3px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.kv .r:last-child{border-bottom:0}
.kv .r>span:first-child{color:var(--muted);min-width:0}
.kv .r>span:last-child{font-weight:600;text-align:right}
.ck{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,170px) auto;gap:6px 14px;align-items:center;border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:4px;padding:8px 12px;margin:6px 0;background:var(--panel)}
.ck.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.ck.info{border-left-color:var(--line)}
.ck .l{font-size:.84rem;font-weight:600;min-width:0}
.ck .l small{display:block;font:400 .74rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.ck.bad .bar i{background:var(--bad)}
.ck.info .bar i{background:var(--muted)}
.ck .v{font:600 .82rem var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.ck.bad .v{color:var(--bad)}
@media (max-width:560px){.ck{grid-template-columns:1fr auto}.ck .bar{grid-column:1/-1;order:3}}
/* diagrams */
.fig{background:#fbfaf7;border:1px solid var(--line);border-radius:6px;padding:10px 12px 8px;min-width:0}
.fig svg{width:100%;height:auto;display:block}
.fig .cap{font-size:.72rem;color:var(--muted);margin-top:6px;line-height:1.4}
.figs{display:flex;flex-direction:column;gap:12px}
/* tables */
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:.8rem}
table.t th,table.t td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
table.t th{background:var(--soft);font-weight:600;color:var(--steel)}
table.t td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t input,table.t select{padding:4px 6px;font-size:.8rem}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font:600 .72rem var(--f-mono)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.na{background:var(--soft);color:var(--muted)}
ul.refs{padding-left:18px;font-size:.83rem;line-height:1.8;margin:0}
ul.refs code{font-family:var(--f-mono);background:var(--soft);padding:1px 5px;border-radius:3px}
ul.refs .w{color:var(--muted);font-size:.76rem}
footer{font-size:.72rem;color:var(--muted);margin-top:20px;max-width:110ch}
/* report */
#reportDoc{background:#fff;border:1px solid var(--line);padding:28px 32px;max-width:900px;margin:12px auto 0;font-family:var(--f-body);color:#111}
#reportDoc h1{font-family:var(--f-display);font-size:1.5rem;margin:0 0 4px;color:#111}
#reportDoc h2{font-size:1.05rem;color:#111;border-bottom:1.5px solid #111;padding-bottom:3px;margin:22px 0 8px}
#reportDoc h3{color:#333;font-size:.85rem;margin:14px 0 6px}
#reportDoc table{border-collapse:collapse;width:100%;font-size:.8rem;margin:6px 0}
#reportDoc th,#reportDoc td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
#reportDoc th{background:#eee}
#reportDoc td.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}
#reportDoc .eq{font-family:var(--f-mono);font-size:.78rem;background:#f5f5f5;padding:4px 8px;margin:3px 0;border-left:3px solid #999;overflow-x:auto}
#reportDoc .ok{color:#1d6b33;font-weight:700}
#reportDoc .bad{color:#a52a14;font-weight:700}
#reportDoc .meta td{border:none;padding:2px 8px 2px 0}
#reportDoc svg{max-width:100%;height:auto}
#reportDoc .figrow{display:flex;flex-wrap:wrap;gap:12px}
#reportDoc .figrow>div{flex:1 1 260px;max-width:420px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  body.printing .wrap>*:not(#t7){display:none!important}
  body.printing #t7{border:none;padding:0}
  body.printing #t7>*:not(#reportDoc){display:none!important}
  body.printing #reportDoc{border:none;padding:0;max-width:none;margin:0}
  #reportDoc h2{break-after:avoid}
  #reportDoc table,#reportDoc .eq,#reportDoc svg{break-inside:avoid}
  #pop{display:none!important}
}
/* collapsible reference tables */
details.box{border:1px solid var(--line);border-radius:6px;margin-top:18px;background:var(--panel)}
details.box>summary{cursor:pointer;padding:9px 12px;font:600 .8rem var(--f-body);color:var(--steel);list-style:none;display:flex;align-items:center;gap:8px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::before{content:"▸";color:var(--accent);transition:transform .15s}
details.box[open]>summary::before{transform:rotate(90deg)}
details.box>div,details.box>ul{padding:4px 14px 14px}
details.box h4{font-size:.78rem;color:var(--steel);margin:14px 0 6px}
details.box .src{font-size:.72rem;color:var(--muted);margin-top:6px}
table.t tr.sel td{background:#fff6e8}
.u-in{display:flex;align-items:center;gap:6px}.u-in input{min-width:0;flex:1}.u-in span{font-size:.75rem;color:var(--muted,#667);white-space:nowrap}
#layTbl input[type=number]{min-width:64px}
#layTbl select{min-width:210px}#layTbl input[type=text]{min-width:170px}
#barBlock>.grid{margin-top:12px}

details.ckd{margin:6px 0}
details.ckd>summary{list-style:none;cursor:pointer;margin:0}
details.ckd>summary::-webkit-details-marker{display:none}
details.ckd .car{display:inline-block;color:var(--muted);transition:transform .15s;font-size:.75rem;margin-right:2px}
details.ckd[open] .car{transform:rotate(90deg)}
details.ckd[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
details.ckd .ckx{border:1px solid var(--line);border-top:0;border-left:5px solid var(--ok);border-radius:0 0 4px 4px;padding:8px 12px;background:var(--panel);font-size:.8rem}
details.ckd.bad .ckx{border-left-color:var(--bad)}
details.ckd.info .ckx{border-left-color:var(--line)}
details.ckd .eqx{font:400 .76rem var(--f-mono);line-height:1.55;margin:2px 0;overflow-wrap:anywhere}
details.ckd .why{margin-top:8px;padding:8px 10px;background:var(--bad-bg);border-radius:4px;line-height:1.5}
/* --- v17 polish: depth, focus, sticky tabs, zebra tables --- */
section.tab{box-shadow:0 1px 2px rgba(21,33,44,.05),0 6px 18px -10px rgba(21,33,44,.18)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:6px;margin-top:10px}
nav.tabs button{transition:background .15s,color .15s}
nav.tabs button:hover{color:var(--steel);background:#e4e9ee}
nav.tabs button[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--accent)}
.sum-item{transition:transform .12s,box-shadow .12s}
.sum-item:hover{transform:translateY(-1px);box-shadow:0 4px 12px -6px rgba(21,33,44,.3)}
input:not([type=checkbox]):not([type=radio]),select,textarea{transition:border-color .12s,box-shadow .12s}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{outline:none;border-color:var(--steel-2);box-shadow:0 0 0 3px rgba(47,106,154,.18)}
input[readonly]{background:var(--soft);color:var(--muted)}
input[type=checkbox]{accent-color:var(--steel)}
table tbody tr:nth-child(even) td{background:#fafaf7}
table tbody tr:hover td{background:#f1f4f7}
details.ckd>summary.ck:hover{background:#f6f8fa}
h3{display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:var(--line);opacity:.7}
.btn{transition:background .12s,color .12s}
.btn:hover{background:var(--soft);filter:none}
.btn.primary:hover{background:var(--steel-2)}
@media print{nav.tabs{position:static}section.tab{box-shadow:none}}
.mach{border:1px solid var(--line);border-left:4px solid var(--steel-2);border-radius:6px;padding:12px 14px;margin-top:10px;background:var(--field)}
.mach-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.mach-h input[type=text]{flex:1 1 220px;min-width:0;font-weight:600}
.mach-h>input[type=text]{width:auto}
.mach-h>select{flex:0 1 220px;width:auto}
.mach-h>.btn{flex:0 0 auto;width:auto}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div>
    <h1 data-t="title"></h1>
    <div class="sub" data-t="subtitle"></div>
  </div>
  <div class="switches">
    <div class="seg" role="group" aria-label="Language" id="langSeg">
      <button type="button" data-lang="hu" aria-pressed="true">HU</button>
      <button type="button" data-lang="ro" aria-pressed="false">RO</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <span class="lbl" data-t="normset"></span>
    <div class="seg" role="group" aria-label="Standards" id="normSeg">
      <button type="button" data-norm="hu" aria-pressed="true">MSZ EN</button>
      <button type="button" data-norm="ro" aria-pressed="false">SR EN</button>
    </div>
    <span class="lbl" data-t="methset"></span>
    <div class="seg" role="group" aria-label="Method" id="methSeg">
      <button type="button" data-meth="tr34" aria-pressed="false">TR34</button>
      <button type="button" data-meth="loh" aria-pressed="false">Lohmeyer</button>
      <button type="button" data-meth="both" aria-pressed="true" data-t="methBoth"></button>
    </div>
    <button type="button" class="i" data-i="meth">i</button>
    <button type="button" class="btn" id="btnSave" data-t="save"></button>
    <button type="button" class="btn" id="btnLoad" data-t="load"></button>
    <input type="file" id="fileLoad" accept=".json,application/json" hidden>
  </div>
</header>

<div class="summary" id="summary" hidden></div>

<nav class="tabs" role="tablist" id="mainTabs">
  <button type="button" role="tab" data-tab="t1" aria-selected="true" data-t="tab1"></button>
  <button type="button" role="tab" data-tab="t2" aria-selected="false" data-t="tab2"></button>
  <button type="button" role="tab" data-tab="t3" aria-selected="false" data-t="tab3"></button>
  <button type="button" role="tab" data-tab="t4" aria-selected="false" data-t="tab4"></button>
  <button type="button" role="tab" data-tab="t5" aria-selected="false" data-t="tab5"></button>
  <button type="button" role="tab" data-tab="t6" aria-selected="false" data-t="tab6"></button>
  <button type="button" role="tab" data-tab="t7" aria-selected="false" data-t="tab7"></button>
  <button type="button" role="tab" data-tab="t8" aria-selected="false" data-t="tab8" class="ec" id="tabEc" hidden></button>
</nav>

<!-- ===== 1 GENERAL ===== -->
<section class="tab" id="t1">
  <h2 data-t="t1h"></h2>
  <p class="intro" data-t="t1i"></p>
  <div class="cols">
    <div>
      <h3 data-t="projH"></h3>
      <div class="grid">
        <div class="field"><label for="projName"><span data-t="proj"></span></label><input type="text" id="projName" value="Raktárcsarnok – A zóna"></div>
        <div class="field"><label for="projNo"><span data-t="projNo"></span></label><input type="text" id="projNo" value="2026/014"></div>
        <div class="field"><label for="designer"><span data-t="designer"></span></label><input type="text" id="designer" value=""></div>
        <div class="field"><label for="pDate"><span data-t="pDate"></span></label><input type="date" id="pDate"></div>
      </div>
      <h3 data-t="floorH"></h3>
      <div class="grid">
        <div class="field"><label for="support"><span data-t="support"></span><button type="button" class="i" data-i="support">i</button></label>
          <select id="support">
            <option value="ground" data-t="supGround"></option>
            <option value="insul" data-t="supInsul"></option>
            <option value="piled" data-t="supPiled" disabled></option>
          </select></div>
        <div class="field"><label for="method"><span data-t="method"></span><button type="button" class="i" data-i="method">i</button></label>
          <select id="method">
            <option value="large" data-t="mLarge"></option>
            <option value="jointless" data-t="mJointless"></option>
            <option value="strip" data-t="mStrip"></option>
            <option value="widebay" data-t="mWide"></option>
            <option value="overlayU" data-t="mOverU"></option>
            <option value="overlayB" data-t="mOverB"></option>
            <option value="twolayer" data-t="mTwo"></option>
            <option value="heating" data-t="mHeat"></option>
            <option value="pt" data-t="mPT"></option>
          </select></div>
        <div class="field"><label for="scenario"><span data-t="scen"></span><button type="button" class="i" data-i="scen">i</button></label>
          <select id="scenario"><option value="full" data-t="scenFull"></option><option value="asrs" data-t="scenAsrs"></option><option value="block" data-t="scenBlock"></option><option value="prod" data-t="scenProd"></option><option value="light" data-t="scenLight"></option></select></div>
        <div class="field"><label for="flatClass"><span data-t="flat"></span><button type="button" class="i" data-i="flat">i</button></label>
          <select id="flatClass">
            <option value="FM1">FM1</option><option value="FM2" selected>FM2</option><option value="FM3">FM3</option><option value="FM4">FM4</option>
            <option value="DM1">DM1</option><option value="DM2">DM2</option><option value="DM3">DM3</option>
          </select><span class="hint" data-t="seeFlat"></span></div>
      </div>
      <div id="methodWarn"></div>
      <details class="box"><summary data-t="refsH"></summary><ul class="refs" id="refs"></ul></details>

t8i:['Az EN 1992-1-1:2023 Magyarországon és Romániában még nincs nemzeti melléklettel bevezetve (határidő: kiadás 2027.09.30., a régi EC2 visszavonása 2028.03.30.). Az L melléklet megjegyzése szerint az ipari padlókat nem ezzel kell méretezni. Ez a fül csak tájékoztató, a jelentésbe nem kerül be.','EN 1992-1-1:2023 nu este încă adoptat cu anexă națională în Ungaria și România (termen: publicare 30.09.2027, retragerea vechiului EC2 30.03.2028). Conform notei din Anexa L, pardoselile industriale nu se proiectează cu aceste prevederi. Fila este doar informativă și nu intră în raport.','EN 1992-1-1:2023 is not yet adopted with a national annex in Hungary or Romania (deadlines: publication 30.09.2027, withdrawal of the old EC2 30.03.2028). According to the Annex L note, industrial floors are not intended to be designed with these provisions. This tab is informative only and is never included in the report.'],

const TI = {
support:['TR34 5.5–5.7. Hőszigetelésen fekvő lemeznél a k a szigetelés és a talaj kisebbike (alaplemez nélkül), illetve alaplemez esetén a szigetelés k-ja. A cölöpös lemez (TR34 8. fejezet) később kerül be.','TR34 5.5–5.7. La placa pe termoizolație k este minimul dintre izolație și teren (fără placă suport), respectiv k al izolației dacă există placă suport. Placa pe piloți (TR34 cap. 8) va fi adăugată ulterior.','TR34 5.5–5.7. For a slab on insulation k is the lower of insulation and ground (no base slab), or the insulation k with a base slab. Pile-supported slabs (TR34 chapter 8) will be added later.'],
method:['TR34 11.1. Hézagolt: kialakított hézag ≤ 50 m (jellemzően 40 m), vágott hézag ~6 m. Hézagmentes: mezők ≤ 35 m, oldalarány ≤ 1:1,5. Tapadó réteg, kétrétegű és utófeszített padlót a TR34 nem méretez.','TR34 11.1. Cu rosturi: rosturi formate ≤ 50 m (uzual 40 m), rosturi tăiate ~6 m. Fără rosturi: câmpuri ≤ 35 m, raport laturi ≤ 1:1,5. Stratul legat, bistratul și postcomprimarea nu sunt dimensionate de TR34.','TR34 11.1. Jointed: formed joints ≤ 50 m (typically 40 m), sawn joints ~6 m. Jointless: bays ≤ 35 m, aspect ratio ≤ 1:1.5. Bonded overlays, two-layer and post-tensioned floors are not designed by TR34.'],
scen:['Könnyű zónában csak a megoszló és vonalteher ellenőrzése fut, az állvány és a targonca kimarad.','În zona ușoară se verifică doar încărcările distribuite și liniare; rafturile și stivuitorul sunt omise.','In a light zone only UDL and line loads are checked; racking and MHE are skipped.'],
flat:['TR34 3. fejezet. FM: szabad mozgású terület (E és F tulajdonság, 95%-os érték). DM: kötött nyomvonalú VNA folyosó (dZ, dX, d²Z, d²X). Ha az állványkiosztás még nem ismert, FM2 javasolt.','TR34 cap. 3. FM: zonă de circulație liberă (proprietățile E și F, percentila 95). DM: culoare VNA cu traseu definit (dZ, dX, d²Z, d²X). Dacă amplasarea rafturilor nu e cunoscută, se recomandă FM2.','TR34 chapter 3. FM: free-movement area (properties E and F, 95th percentile). DM: defined-movement VNA aisles (dZ, dX, d²Z, d²X). If the racking layout is unknown, FM2 is suggested.'],
ecOn:['Az EN 1992-1-1:2023 L melléklete szerinti acélszálas beton osztályozás és tájékoztató értékek. Nem hatályos HU/RO-ban, és az L melléklet szerint ipari padlóra nem rendeltetésszerű.','Clasificarea betonului cu fibre și valori informative după EN 1992-1-1:2023 Anexa L. Neadoptat în HU/RO și, conform Anexei L, nedestinat pardoselilor industriale.','Steel fibre concrete classification and informative values per EN 1992-1-1:2023 Annex L. Not adopted in HU/RO and, per Annex L, not intended for industrial floors.'],
conc:['TR34 6.1, 1. táblázat: fctm = 0,3·fck^(2/3), Ecm = 22·(fcm/10)^0,3. A betonosztálynak a környezeti osztály minimumát is teljesítenie kell.','TR34 6.1, Tabelul 6.1: fctm = 0,3·fck^(2/3), Ecm = 22·(fcm/10)^0,3. Clasa trebuie să respecte și minimul clasei de expunere.','TR34 6.1, Table 6.1: fctm = 0.3·fck^(2/3), Ecm = 22·(fcm/10)^0.3. The class must also meet the exposure class minimum.'],
h:['TR34 7.1: legalább 150 mm. Az alapréteg tűrése +0/−25 mm (TR34 5.3): pozitív tűrés nem engedhető meg, mert közvetlenül csökkenti a lemezvastagságot.','TR34 7.1: minimum 150 mm. Toleranța stratului de fundație +0/−25 mm (TR34 5.3): toleranța pozitivă nu se admite, reduce direct grosimea plăcii.','TR34 7.1: at least 150 mm. Sub-base tolerance +0/−25 mm (TR34 5.3): no positive tolerance, as it directly reduces slab thickness.'],
dh:['TR34 7.1: a lábtörlő mélyedések, indukciós hurkok, vezetőhuzalok vágatai csökkentik a hatékony vastagságot. A számítás h − Δh-val fut.','TR34 7.1: nișele pentru covoare, buclele de inducție și firele de ghidare reduc grosimea efectivă. Calculul se face cu h − Δh.','TR34 7.1: mat wells, induction loops and guide wires reduce the effective thickness. The calculation uses h − Δh.'],
exp:['MSZ 4798:2016+2M:2018, ill. NE 012/1-2022 F.1 táblázatai: minimális betonosztály és legnagyobb v/c. Belső, száraz padló: XC1. A TR34 9.2.2 szerint simított padlóban légbuborékképző kerülendő, ezért fagynál a légbuborék nélküli változat számít.','MSZ 4798:2016+2M:2018, resp. NE 012/1-2022 Tabelele F.1: clasa minimă și raportul a/c maxim. Pardoseală interioară uscată: XC1. Conform TR34 9.2.2 aerul antrenat se evită la pardoselile driscuite, deci la îngheț se ia varianta fără aer antrenat.','MSZ 4798:2016+2M:2018 or NE 012/1-2022 Tables F.1: minimum class and maximum w/c. Indoor dry floor: XC1. Per TR34 9.2.2 air entrainment should be avoided in power-trowelled floors, so the non-air-entrained variant governs for frost.'],
abr:['Magyarország: XK1(H)–XK4(H) (MSZ 4798). Kopóréteg (szórt felület) nélküli ipari padló: XK4(H), C45/55; kopóréteggel: XK1(H). Románia: XM1–XM3 (NE 012/1-2022); targoncaforgalom: XM2, poliuretán/acél kerék: XM3.','Ungaria: XK1(H)–XK4(H) (MSZ 4798). Pardoseală industrială fără strat de uzură: XK4(H), C45/55; cu strat de uzură: XK1(H). România: XM1–XM3 (NE 012/1-2022); trafic de stivuitoare: XM2, roți poliuretan/metal: XM3.','Hungary: XK1(H)–XK4(H) (MSZ 4798). Industrial floor without wearing course (dry-shake): XK4(H), C45/55; with one: XK1(H). Romania: XM1–XM3 (NE 012/1-2022); forklift traffic: XM2, polyurethane/steel wheels: XM3.'],
memb:['TR34 5.4: a fólia célja a lemez és az alapréteg közti súrlódás csökkentése (jellemzően 300 µm, 300 mm átfedéssel). Cölöpfejek felett 2 réteg.','TR34 5.4: folia reduce frecarea dintre placă și stratul de fundație (uzual 300 µm, suprapunere 300 mm). Peste capetele piloților 2 straturi.','TR34 5.4: the membrane reduces friction between slab and sub-base (typically 300 µm, 300 mm laps). Two layers over pile heads.'],
cbr:['Csak a fáradás-ellenőrzéshez (TR34 E1 táblázat): az alapréteg szükséges vastagsága a 100 MPa egyenértékű alapozási modulushoz.','Doar pentru verificarea la oboseală (TR34 Tabelul E1): grosimea necesară a stratului de fundație pentru modulul echivalent de 100 MPa.','Only for the fatigue check (TR34 Table E1): sub-base thickness needed for a 100 MPa equivalent foundation modulus.'],
kMode:['TR34 5.1: k tárcsás vizsgálatból, 1,25 mm-es süllyedésnél, lehetőleg Ø750 mm-es tárcsával; kisebb tárcsánál az 5.1 ábra átszámító tényezőjével (itt közelítő, az ábráról leolvasva). Az E₂-ből számolt k (Lohmeyer: k = E₂/(0,83·h·(Ecm/E₂)^⅓)) közvetett módszer, a TR34 szerint geotechnikus véleményével használható.','TR34 5.1: k din încercarea cu placa, la tasarea de 1,25 mm, de preferință cu placa Ø750 mm; pentru plăci mai mici se aplică factorul din Figura 5.1 (aici aproximat, citit de pe figură). k derivat din E₂ (Lohmeyer: k = E₂/(0,83·h·(Ecm/E₂)^⅓)) este metodă indirectă, admisă cu avizul geotehnicianului.','TR34 5.1: k from plate bearing tests at 1.25 mm settlement, preferably with a Ø750 mm plate; smaller plates use the Figure 5.1 factor (approximated here, read from the figure). k derived from E₂ (Lohmeyer: k = E₂/(0.83·h·(Ecm/E₂)^⅓)) is an indirect method, acceptable with geotechnical advice.'],
kOn:['TR34 5.6: a lemezt az altalaj k-jára kell méretezni, a szemcsés alapréteg javító hatása nélkül. Stabilizált vagy javító (capping) réteg k-ja használható. Az alapréteg tetején mért érték túlbecsülheti a k-t.','TR34 5.6: placa se dimensionează pe k al terenului natural, fără aportul stratului granular. Se poate folosi k al stratului stabilizat sau de formă. Valoarea măsurată pe stratul granular poate supraestima k.','TR34 5.6: design on the subgrade k, without enhancement from the granular sub-base. The k of a stabilised or capping layer may be used. A value measured on top of the sub-base may overestimate k.'],
kIns:['TR34 5.5: a szigetelés k-ját a gyártótól kell beszerezni, vagy tárcsás vizsgálattal mérni; a tartós kúszást is figyelembe kell venni.','TR34 5.5: k al izolației se obține de la producător sau prin încercare cu placa; se ține cont de fluajul pe termen lung.','TR34 5.5: obtain the insulation k from the manufacturer or a plate test; consider long-term creep.'],
reinf:['TR34 6.2–6.3. Makro-szintetikus szálnál a tartós kúszás jelentős lehet, és átszúródási többlet nem vehető figyelembe. Mikro-szintetikus szál a méretezésben nem számít. Csak felső háló esetén a lemez vasalatlannak tekintendő.','TR34 6.2–6.3. La fibrele macrosintetice fluajul pe termen lung poate fi semnificativ și nu se ia spor la străpungere. Fibrele microsintetice nu se iau în calcul. Doar plasă superioară: placa se consideră nearmată.','TR34 6.2–6.3. Macro-synthetic fibres may have significant long-term creep, and no punching enhancement is assumed. Micro-synthetic fibres are ignored in design. Top fabric only: the slab is treated as unreinforced.'],
fibGroup:['EN 14889-1: I hidegen húzott huzal, II lemezből vágott, III olvasztásból kinyert, IV hidegen húzott huzalból forgácsolt, V tömbből mart. EN 14889-2 (polimer): Ia mikro (< 0,30 mm, egyszálas), Ib mikro (fibrillált), II makro (> 0,30 mm).','EN 14889-1: I sârmă trasă la rece, II tăiate din tablă, III extrase din topitură, IV așchiate din sârmă trasă, V frezate din blocuri. EN 14889-2 (polimer): Ia micro (< 0,30 mm, monofilament), Ib micro (fibrilat), II macro (> 0,30 mm).','EN 14889-1: I cold-drawn wire, II cut sheet, III melt-extracted, IV shaved cold-drawn wire, V milled from blocks. EN 14889-2 (polymer): Ia micro (< 0.30 mm, monofilament), Ib micro (fibrillated), II macro (> 0.30 mm).'],
fibDos:['TR34 6.2.2 / 6.2 táblázat: a szálmennyiséget az EN 14721 szerint kell ellenőrizni; minden minta ≥ 0,80, három minta átlaga ≥ 0,85 a előírt minimumnak. Ezért a célzott adagolás nagyobb lehet a tervezettnél.','TR34 6.2.2 / Tabelul 6.2: conținutul de fibre se verifică după EN 14721; fiecare probă ≥ 0,80, media a trei probe ≥ 0,85 din minimul specificat. Dozajul țintă poate fi mai mare decât cel de calcul.','TR34 6.2.2 / Table 6.2: fibre content checked to EN 14721; every sample ≥ 0.80, average of three ≥ 0.85 of the specified minimum. The target dosage may need to exceed the design value.'],
fR:['EN 14651, TR34 6.3.3: legalább 12 próbatest átlaga a tényleges szálra és adagolásra. Két adagolás között csak ≤ 10 kg/m³ különbségen belül interpolálható, extrapolálni tilos. A CE-jelöléshez deklarált érték (fR1 = 1,5 / fR4 = 1,0 MPa) kevés a TR34-hez.','EN 14651, TR34 6.3.3: media a minimum 12 epruvete pentru fibra și dozajul efectiv. Interpolare doar între dozaje la ≤ 10 kg/m³, extrapolarea interzisă. Valorile pentru marcajul CE (fR1 = 1,5 / fR4 = 1,0 MPa) nu sunt suficiente pentru TR34.','EN 14651, TR34 6.3.3: mean of at least 12 specimens for the actual fibre and dosage. Interpolate only between dosages ≤ 10 kg/m³ apart, never extrapolate. The CE declaration values (fR1 = 1.5 / fR4 = 1.0 MPa) are not sufficient for TR34.'],
mesh:['Q-háló: azonos vasalás mindkét irányban (pl. Q257 = Ø7/150). A TR34 7.4: Aₛ ≥ 0,08%, vágott hézagon át ≤ 0,125%. Különböző irányoknál a kisebbik számít.','Plasă Q: aceeași armare pe ambele direcții (ex. Q257 = Ø7/150). TR34 7.4: Aₛ ≥ 0,08%, peste rosturi tăiate ≤ 0,125%. La direcții diferite se ia valoarea mai mică.','Q fabric: same in both directions (e.g. Q257 = Ø7/150). TR34 7.4: Aₛ ≥ 0.08%, across sawn joints ≤ 0.125%. If directions differ, use the smaller.'],
cov:['TR34 6.2.1: névleges alsó betonfedés jellemzően 50 mm (40 + Δc_dev 10 mm). Vezetőhuzalos padlónál a háló legalább 50 mm-rel a felület alatt.','TR34 6.2.1: acoperire nominală inferioară uzual 50 mm (40 + Δc_dev 10 mm). La firele de ghidare plasa la minimum 50 mm sub suprafață.','TR34 6.2.1: nominal bottom cover typically 50 mm (40 + Δc_dev 10 mm). With guide wires, fabric at least 50 mm below the surface.'],
strip:['A szélsáv a szél menti törési mechanizmust fogja át; javasolt szélesség ≥ l + lehorgonyzási hossz.','Fâșia de margine trebuie să cuprindă mecanismul de cedare la margine; lățime recomandată ≥ l + lungimea de ancorare.','The edge strip must contain the edge failure mechanism; suggested width ≥ l + anchorage length.'],
topMesh:['TR34 6.2.1 és 6.3.2: talajon fekvő lemezben a felső háló nem növeli a teherbírást (Mn a vasalatlan beton repesztő nyomatéka). Rakodórámpák, sarkok körül a repedések korlátozására javasolt.','TR34 6.2.1 și 6.3.2: la placa pe teren plasa superioară nu mărește capacitatea (Mn = momentul de fisurare al betonului simplu). Se recomandă la rampe și colțuri pentru limitarea fisurilor.','TR34 6.2.1 and 6.3.2: in ground-supported slabs top fabric does not increase capacity (Mn is the plain-concrete cracking moment). Recommended around dock levellers and corners to limit cracking.'],
jType:['TR34 11.3–11.6. Vágott mozgási hézag: ~6 m, 3–4 mm széles, mélység a lemez 25–30%-a. Kialakított hézag: tüskékkel vagy lemeztüskékkel, élvédelemmel. Kapcsolt hézag: nem nyílik, a betonacél teljes erőt visz át.','TR34 11.3–11.6. Rost tăiat: ~6 m, lățime 3–4 mm, adâncime 25–30% din grosime. Rost format: cu dornuri sau plăci, cu protecție muchii. Rost legat: nu se deschide, armătura transmite întreaga forță.','TR34 11.3–11.6. Sawn joint: ~6 m, 3–4 mm wide, 25–30% of depth. Formed joint: with bar or plate dowels and armouring. Tied joint: does not open, bars carry full force.'],
jw:['A teher külpontossága e = w/2 (TR34 D melléklet). Kialakított hézag jellemzően ~20 mm-re nyílik, vágott hézag 3–5 mm-re. 0,9 mm felett a szemcse-összekapcsolódás csökken (TR34 7.9.1).','Excentricitatea e = w/2 (TR34 Anexa D). Rosturile formate se deschid ~20 mm, cele tăiate 3–5 mm. Peste 0,9 mm angrenarea scade (TR34 7.9.1).','Load eccentricity e = w/2 (TR34 Appendix D). Formed joints typically open ~20 mm, sawn joints 3–5 mm. Above 0.9 mm aggregate interlock reduces (TR34 7.9.1).'],
layout:['TR34 11.10: négyzetes mezők, oldalarány ≤ 1:1,5; vágott hézag ≤ ~6 m; hézagmentes mező ≤ 35 m, hézagolt ≤ 50 m; kerülni a beugró sarkokat és a pontszerű terheket a hézagokon.','TR34 11.10: câmpuri pătrate, raport laturi ≤ 1:1,5; rosturi tăiate ≤ ~6 m; câmpuri fără rosturi ≤ 35 m, cu rosturi ≤ 50 m; evitați colțurile intrânde și încărcările concentrate pe rosturi.','TR34 11.10: square panels, aspect ratio ≤ 1:1.5; sawn joints ≤ ~6 m; jointless bays ≤ 35 m, jointed ≤ 50 m; avoid re-entrant corners and point loads on joints.'],
armour:['TR34 11.9: a kis, kemény kerekekkel (raklapemelő) járt mozgási hézagokat acél élvédelemmel kell ellátni.','TR34 11.9: rosturile de mișcare circulate de roți mici și dure (transpalete) se protejează cu profile metalice.','TR34 11.9: free-movement joints trafficked by small hard wheels (pallet trucks) should be armoured.'],
rackType:['TR34 4.2. A hátfalas elrendezés a leggyakoribb mértékadó eset. Mobil állványnál a sínek merevségétől függően pont- vagy vonalteher. Önhordó raktárnál (clad rack) a terheket a gyártótól kell beszerezni – szakértői terület.','TR34 4.2. Configurația spate-în-spate este de obicei determinantă. La rafturile mobile, în funcție de rigiditatea șinelor, încărcare concentrată sau liniară. La depozitele autoportante încărcările se obțin de la producător – domeniu de specialitate.','TR34 4.2. Back-to-back is usually the governing case. Mobile racking: point or line load depending on rail stiffness. Clad rack: loads from the supplier – specialist field.'],
Fp:['Az állványgyártó adata a legnagyobb lábterhelésre, az állvány önsúlyával együtt (TR34 4.2.1).','Valoarea maximă de la producătorul rafturilor, inclusiv greutatea proprie (TR34 4.2.1).','Maximum upright load from the racking supplier, including self-weight (TR34 4.2.1).'],
bp:['TR34 7.8.1, 7.4 ábra: hatékony méret = min(tényleges; oszlopméret + 4·t). Adat hiányában 100 × 100 mm.','TR34 7.8.1, Figura 7.4: dimensiune efectivă = min(reală; montant + 4·t). În lipsa datelor 100 × 100 mm.','TR34 7.8.1, Figure 7.4: effective size = min(actual; leg size + 4·t). Without data use 100 × 100 mm.'],
mheType:['TR34 4.3. A gép teherbírása (t) nem megfelelő mérőszám: a gyártótól a terhelt és üres állapot tengely- és kerékterheit, valamint az érintkezési felületet kell beszerezni.','TR34 4.3. Capacitatea de ridicare nu este un indicator adecvat: se obțin de la producător încărcările pe axe și roți (încărcat și descărcat) și amprenta.','TR34 4.3. Lifting capacity is not an adequate indicator: obtain axle and wheel loads (laden and unladen) and contact areas from the manufacturer.'],
Qk:['A legjobban terhelt kerék statikus terhe terhelt állapotban. γ = 1,6 tartalmazza a fékezést és a kanyarodást (TR34 7.2).','Încărcarea statică a roții celei mai încărcate, în stare încărcată. γ = 1,6 include frânarea și virarea (TR34 7.2).','Static load of the most heavily loaded wheel when laden. γ = 1.6 covers braking and cornering (TR34 7.2).'],
H1:['TR34 7.8.2, 7.6 ábra: ha a kerék a raklap be- és kivételénél az állványlábhoz közel áll (H₁ ≤ 2h), a két terhet együtt kell vizsgálni. 0 = nincs ilyen helyzet.','TR34 7.8.2, Figura 7.6: dacă roata stă aproape de picior la manipularea paletului (H₁ ≤ 2h), cele două încărcări se verifică împreună. 0 = nu există.','TR34 7.8.2, Figure 7.6: if the wheel stands close to an upright when picking (H₁ ≤ 2h), the two loads act together. 0 = not applicable.'],
fat:['TR34 7.3 és E melléklet: nehéz targoncánál (pl. papírtekercs, dupla raklap) fáradás. Csak vasalatlan vagy hálós lemezre (szálas lemezre nincs adat); tengelyteher ≤ 25 t; egyenértékű alapozási modulus ≥ 100 MPa. A tömör kerék szorzója 1,3, kötött nyomvonalon 1,4.','TR34 7.3 și Anexa E: oboseală la stivuitoare grele (role de hârtie, palete duble). Doar plăci nearmate sau cu plasă (nu există date pentru fibre); încărcare pe axă ≤ 25 t; modul echivalent ≥ 100 MPa. Roți pline ×1,3, traseu impus ×1,4.','TR34 7.3 and Appendix E: fatigue with heavy MHE (paper reels, double pallets). Plain or fabric slabs only (no data for fibre); axle ≤ 25 t; equivalent foundation modulus ≥ 100 MPa. Solid tyres ×1.3, constrained path ×1.4.'],
mez:['TR34 7.2: önsúly 1,35, hasznos teher 1,5. A módszer alkalmazhatóságát mezzanin alapozására egyeztetni kell az ellenőrző hatósággal.','TR34 7.2: permanente 1,35, utile 1,5. Aplicabilitatea pentru fundarea mezaninului se convine cu verificatorul.','TR34 7.2: dead 1.35, imposed 1.5. Agree the method with the checking authority for mezzanine support.'],
udl:['TR34 7.12: q = 5,95·λ²·Mun, a teher tényezője 1,0 (a globális 1,5-ös biztonság az anyagoldalon van). A kritikus folyosószélesség π/(2λ).','TR34 7.12: q = 5,95·λ²·Mun, coeficient pe încărcare 1,0 (siguranța globală 1,5 este pe material). Lățimea critică a culoarului π/(2λ).','TR34 7.12: q = 5.95·λ²·Mun, load factor 1.0 (global factor 1.5 sits on the material). Critical aisle width π/(2λ).'],
fRk:['Karakterisztikus maradó szilárdság (5%-os kvantilis) – nem azonos a TR34-ben használt átlagértékkel.','Rezistență reziduală caracteristică (fractil 5%) – diferită de valoarea medie folosită în TR34.','Characteristic residual strength (5% fractile) – not the mean value used in TR34.'],
kO:['EN 1992-1-1:2023 L.5.5.1: szálorientációs tényező; S2–S5 konzisztenciájú betonból készült lemeznél hajlításra és átszúródásra 1,0.','EN 1992-1-1:2023 L.5.5.1: factor de orientare; pentru plăci din beton S2–S5 la încovoiere și străpungere 1,0.','EN 1992-1-1:2023 L.5.5.1: orientation factor; 1.0 for bending and punching of slabs in S2–S5 concrete.'],
kG:['EN 1992-1-1:2023 L.5.5.1 (L.6): κG = 1 + 0,5·A_ct ≤ 1,5, ahol A_ct a húzott zóna területe [m²]. 1,0 a biztonság javára.','EN 1992-1-1:2023 L.5.5.1 (L.6): κG = 1 + 0,5·A_ct ≤ 1,5, A_ct aria zonei întinse [m²]. 1,0 acoperitor.','EN 1992-1-1:2023 L.5.5.1 (L.6): κG = 1 + 0.5·A_ct ≤ 1.5, A_ct tension zone area [m²]. 1.0 is conservative.'],
};
Object.assign(TI,{
support:['Talajon fekvő lemez (TR34 5.6, 7. fejezet): a lemez a tömörített alaprétegen fekszik, a teherbírást az altalaj ágyazási tényezője (k) adja. Hőszigetelésen fekvő lemez (TR34 5.5): hűtőháznál a lemez alatt hőszigetelés van; alaplemez nélkül a talaj és a szigetelés k-ja közül a kisebbikkel, alaplemezzel a szigetelés k-jával kell számolni. Cölöpökön álló lemez (TR34 8. fejezet): később kerül be.','Placă pe teren (TR34 5.6, cap. 7): placa stă pe stratul de fundație compactat; capacitatea depinde de modulul de reacție (k) al terenului. Placă pe termoizolație (TR34 5.5): la depozite frigorifice sub placă există izolație; fără placă suport se ia minimul dintre k teren și k izolație, cu placă suport k izolație. Placă pe piloți (TR34 cap. 8): ulterior.','Ground-supported slab (TR34 5.6, chapter 7): the slab rests on the compacted sub-base; capacity depends on the subgrade modulus k. Slab on insulation (TR34 5.5): cold stores with insulation below the slab; without a base slab use the lower of ground and insulation k, with a base slab the insulation k. Pile-supported slab (TR34 chapter 8): later.'],
scen:['TR34 4.1–4.3 és 7. fejezet. Raktár: állvány + targonca. Automata raktár: állvány, targonca nélkül (TR34 7.8.4: sűrű állványzatot megoszló teherként is vizsgálni). Blokkos tárolás: megoszló teher + targonca (TR34 4.1, 7.12). Gyártócsarnok: targonca, megoszló és vonalteher, gépalap pontszerű teherként (mezzanin mezőn). Könnyű zóna: csak megoszló és vonalteher.','TR34 4.1–4.3 și cap. 7. Depozit: rafturi + stivuitor. Depozit automat: rafturi fără stivuitor (TR34 7.8.4: rafturile dense se verifică și ca încărcare distribuită). Stivuire în bloc: distribuită + stivuitor (TR34 4.1, 7.12). Hală de producție: stivuitor, distribuită și liniară, fundații de utilaje ca încărcări concentrate (câmpul mezanin). Zonă ușoară: doar distribuită și liniară.','TR34 4.1–4.3 and chapter 7. Warehouse: racking + MHE. Automated store: racking without MHE (TR34 7.8.4: dense racking also as UDL). Block stacking: UDL + MHE (TR34 4.1, 7.12). Production hall: MHE, UDL and line loads, machine bases as point loads (mezzanine fields). Light zone: UDL and line loads only.'],
jType:['A tüske (angolul dowel) sima acélrúd vagy acéllemez, amely a hézagon átnyúlva a függőleges terhet átadja a szomszédos mezőre, de a vízszintes mozgást (zsugorodás) engedi: az egyik oldalán be van betonozva, a másik oldalon hüvelyben csúszik. TR34 6.5, 7.9, 11.3–11.6. Vágott hézag: ~6 m, a repedést a vágás indítja, a szemcse-összekapcsolódás 15%-ot ad át. Kialakított hézag: zsaluzott, tüskékkel és élvédelemmel. Kapcsolt hézag: lehorgonyzott betonacél, nem nyílik.','Dornul (dowel) este o bară netedă sau o placă de oțel care traversează rostul și transmite încărcarea verticală câmpului vecin, permițând mișcarea orizontală (contracția): pe o parte este înglobat, pe cealaltă alunecă într-un manșon. TR34 6.5, 7.9, 11.3–11.6. Rost tăiat: ~6 m, fisura pornește din tăietură, angrenarea transferă 15%. Rost format: cofrat, cu dornuri și protecție. Rost legat: bare ancorate, nu se deschide.','A dowel is a smooth steel bar or plate across the joint that transfers vertical load to the neighbouring panel while allowing horizontal (shrinkage) movement: cast in on one side, sliding in a sleeve on the other. TR34 6.5, 7.9, 11.3–11.6. Sawn joint: ~6 m, crack induced by the cut, aggregate interlock transfers 15%. Formed joint: formwork, dowels and armouring. Tied joint: anchored bars, does not open.'],
sawnD:['TR34 11.8.1: a vágás mélysége jellemzően a lemezvastagság 25–30%-a; a gyakorlatban gyakran h/3. A mélyebb vágás csökkenti a szemcse-összekapcsolódást és a teherátadást (TR34 7.9.1). Alapértelmezés: h/3.','TR34 11.8.1: adâncimea tăieturii uzual 25–30% din grosime; în practică adesea h/3. O tăietură mai adâncă reduce angrenarea și transferul (TR34 7.9.1). Implicit: h/3.','TR34 11.8.1: saw-cut depth typically 25–30% of slab depth; in practice often h/3. Deeper cuts reduce aggregate interlock and load transfer (TR34 7.9.1). Default: h/3.'],
fl:['EN 1991-1-1 6.3.2.3, 6.5 és 6.6 táblázat: hat targonca osztály önsúly és emelt teher szerint. A kerékteher a tengelyteher fele, az érintkezési felület 200 × 200 mm (6.2 ábra). Választáskor a program kitölti a kerékterhet, a kerékközt és az érintkezési felületet; ezek felülírhatók.','EN 1991-1-1 6.3.2.3, Tabelele 6.5 și 6.6: șase clase de stivuitoare după greutate și sarcina ridicată. Încărcarea pe roată este jumătate din încărcarea pe axă, amprenta 200 × 200 mm (Figura 6.2). La selectare se completează încărcarea pe roată, ecartamentul și amprenta; pot fi modificate.','EN 1991-1-1 6.3.2.3, Tables 6.5 and 6.6: six forklift classes by net weight and hoisting load. Wheel load is half the axle load, contact area 200 × 200 mm (Figure 6.2). Selecting fills wheel load, wheel spacing and contact area; all can be overwritten.'],
dynMode:['TR34 7.2: a γ = 1,6 parciális tényező a fékezést, kanyarodást és a teher bizonytalanságát is lefedi. EN 1991-1-1 6.3.2.3: dinamikus tényező φ = 1,40 levegős, 2,00 tömör kerékre, ezt a γ<sub>Q</sub> = 1,5 tényezővel kell még szorozni (felfüggesztett födémekre készült). A kettő együtt nem alkalmazható.','TR34 7.2: γ = 1,6 acoperă frânarea, virarea și incertitudinea. EN 1991-1-1 6.3.2.3: factor dinamic φ = 1,40 pneuri, 2,00 bandaje pline, înmulțit apoi cu γ<sub>Q</sub> = 1,5 (destinat planșeelor). Nu se aplică ambele.','TR34 7.2: γ = 1.6 covers braking, cornering and load uncertainty. EN 1991-1-1 6.3.2.3: dynamic factor φ = 1.40 pneumatic, 2.00 solid tyres, then multiplied by γ<sub>Q</sub> = 1.5 (intended for suspended floors). Do not combine both.'],
mesh:['Alsó háló vagy betonacél: ez adja M<sub>p</sub>-t (TR34 6.3.2, 3. egyenlet). TR34 7.4: Aₛ ≥ 0,08%, vágott hézagon át ≤ 0,125%. A lista a szabványváltó szerint a hazai piacon szokásos termékeket mutatja (Magyarország: Q-hálók; Románia: plasă sudată Ø/ochi, ST 009).','Plasă sau bare inferioare: dau M<sub>p</sub> (TR34 6.3.2, ec. 3). TR34 7.4: Aₛ ≥ 0,08%, peste rosturi tăiate ≤ 0,125%. Lista arată produsele uzuale pe piața aleasă (Ungaria: plase Q; România: plasă sudată Ø/ochi, ST 009).','Bottom fabric or bars give M<sub>p</sub> (TR34 6.3.2, Eq. 3). TR34 7.4: Aₛ ≥ 0.08%, across sawn joints ≤ 0.125%. The list shows products common in the selected market (Hungary: Q fabrics; Romania: welded mesh Ø/spacing, ST 009).'],
steelGr:['B500A: hidegen alakított, kis duktilitás (hálók); B500B: általános; B500C: nagy duktilitás. Magyarországon MSZ EN 10080 / MSZ 339, Romániában ST 009-2011 szerint. Mindhárom f<sub>yk</sub> = 500 MPa.','B500A: deformat la rece, ductilitate redusă (plase); B500B: uzual; B500C: ductilitate ridicată. În Ungaria MSZ EN 10080 / MSZ 339, în România ST 009-2011. Toate f<sub>yk</sub> = 500 MPa.','B500A: cold-worked, low ductility (fabrics); B500B: general; B500C: high ductility. Hungary: MSZ EN 10080 / MSZ 339; Romania: ST 009-2011. All f<sub>yk</sub> = 500 MPa.'],

Object.assign(TI,{
 meth:['<b>TR34</b>: képlékeny (törési vonal) méretezés, Meyerhof, a TR34 4. kiadás szerint.<br><b>Lohmeyer</b>: rugalmas méretezés Westergaard/Eisenmann szerint (Lohmeyer–Ebeling 2006, 7–8. fejezet); a cél a repedésmentes lemez: a számolt nyúlás legfeljebb a megengedett nyúlás lehet. A hazai gyakorlat (MMK Segédlet 2022) mindkettőt említi.<br><b>Mindkettő</b>: összevetés; a breviárba mindkét fejezet bekerül.','<b>TR34</b>: calcul plastic (linii de rupere), Meyerhof.<br><b>Lohmeyer</b>: calcul elastic Westergaard/Eisenmann (Lohmeyer–Ebeling 2006, cap. 7–8); scopul este placa fără fisuri: deformația calculată ≤ deformația admisă.<br><b>Ambele</b>: comparație; ambele capitole intră în breviar.','<b>TR34</b>: plastic (yield-line) design, Meyerhof.<br><b>Lohmeyer</b>: elastic design per Westergaard/Eisenmann (Lohmeyer–Ebeling 2006, ch. 7–8), aiming at an uncracked slab: calculated strain ≤ permissible strain.<br><b>Both</b>: comparison; both chapters go into the report.'],
 ev2:['Tárcsás vizsgálat második terhelési ága (MSZ 2509-3 / DIN 18134). Lohmeyer Tafel 7.4 (MMK Segédlet 10. táblázat) szükséges értékei a legnagyobb tervezési ponttehertől függenek: ≤30 kN: 35/80, ≤60: 45/100, ≤100: 60/120, ≤140 kN: 80/150 MPa (altalaj / ágyazat). Talajfajta szerinti tervezési E2d: lásd táblázat az oldal alján.','Ramura a doua a încercării cu placa (DIN 18134). Valorile necesare Lohmeyer Tafel 7.4 depind de încărcarea punctuală maximă de calcul: ≤30 kN: 35/80, ≤60: 45/100, ≤100: 60/120, ≤140 kN: 80/150 MPa (teren / strat).','Second loading cycle of the plate test (DIN 18134). Lohmeyer Tafel 7.4 requirements depend on the largest design point load: ≤30 kN: 35/80, ≤60: 45/100, ≤100: 60/120, ≤140 kN: 80/150 MPa (subgrade / sub-base).'],
 lohArea:['Lohmeyer Tafel 7.2: a repedésmentesség iránti igény.<br>A – szórt áru raktár, durva fém- és faipar, acélszerkezeti üzem, mezőgazdasági csarnok;<br>B – finom fém- és faipar, műanyag- és gumiipar, raktár, logisztikai központ, autószerviz;<br>C – bemutató- és eladótér, papír- és textilipar, finommechanika, élelmiszeripar, magasraktár.','Lohmeyer Tafel 7.2: exigența privind evitarea fisurilor.<br>A – depozite de vrac, prelucrare grosieră metal/lemn, hale agricole;<br>B – prelucrare fină, mase plastice, depozite, centre logistice, service auto;<br>C – showroom, hârtie/textile, mecanică fină, industrie alimentară, depozite înalte.','Lohmeyer Tafel 7.2: demand for crack avoidance.<br>A – bulk storage, coarse metal/timber work, agricultural sheds;<br>B – fine metal/timber work, plastics, warehouses, logistics centres, car workshops;<br>C – showrooms, paper/textile, precision engineering, food, high-bay warehouses.'],
 lohExec:['Lohmeyer 7.2.3: N – jó betonösszetétel, 10–25 °C, azonnali utókezelés; S – különleges összetétel (víz ≤ 165 kg/m³), zárt csarnok, védelem napsütés és huzat ellen, kétszeres utókezelési idő. A zsugorodási tényezőt (γ<sub>ct,S</sub>, Tafel 7.3) befolyásolja.','Lohmeyer 7.2.3: N – compoziție bună, 10–25 °C, tratare imediată; S – compoziție specială (apă ≤ 165 kg/m³), hală închisă, protecție, durată dublă de tratare. Influențează γ<sub>ct,S</sub> (Tafel 7.3).','Lohmeyer 7.2.3: N – good mix, 10–25 °C, immediate curing; S – special mix (water ≤ 165 kg/m³), closed hall, protection, double curing time. Affects γ<sub>ct,S</sub> (Tafel 7.3).'],
 lohN:['Lohmeyer Tafel 7.1: a kerékteher biztonsági tényezője a teherismétlődések számától függ (γ<sub>Q</sub>·φ<sub>n</sub> = 1,45 … 1,75); pl. 30 áthaladás/óra · 8 óra · 200 nap · 20 év ≈ 1·10⁶. Rezgési tényező nem kell. Polclábra γ<sub>G</sub> = 1,20.','Lohmeyer Tafel 7.1: coeficientul pentru roți depinde de numărul de repetări (γ<sub>Q</sub>·φ<sub>n</sub> = 1,45 … 1,75); ex. 30 treceri/oră · 8 h · 200 zile · 20 ani ≈ 1·10⁶. Pentru rafturi γ<sub>G</sub> = 1,20.','Lohmeyer Tafel 7.1: wheel load factor depends on the number of repetitions (γ<sub>Q</sub>·φ<sub>n</sub> = 1.45 … 1.75); e.g. 30 passes/h · 8 h · 200 days · 20 years ≈ 1·10⁶. Rack legs: γ<sub>G</sub> = 1.20.'],
 lohX2:['A második kerék (ugyanazon tengely) távolsága. Belső helyzetben a Westergaard-féle hatásvonal (Bild 7.5) érintőirányú tényezőjével, szélen és sarkon a Gnad-féle hatásvonallal (Bild 7.6, μ = 0,35, az ábráról leolvasva) növeli a feszültséget. 0 = nincs második kerék.','Distanța roții a doua (aceeași axă). În câmp: linia de influență Westergaard (Bild 7.5); la margine și colț: linia Gnad (Bild 7.6, μ = 0,35, citită de pe figură). 0 = fără a doua roată.','Distance of the second wheel (same axle). Interior: Westergaard influence line (Bild 7.5); edge and corner: Gnad influence line (Bild 7.6, μ = 0.35, read from the figure). 0 = no second wheel.'],

Object.assign(TI,{
 wk:['EC2 (MSZ EN / SR EN 1992-1-1) 7.3.4 szerinti repedéstágasság, a hálós / betonacélos lemezre:<br>• <b>kényszer</b> (zsugorodás, lehűlés): ha a súrlódási erő μ·(g+q)·L/2 kisebb, mint a lemez repesztő ereje k·f<sub>ctm</sub>·h, a lemez nem reped a táblán belül; különben a repesztő erő terheli a vasalást (7.1 egy., k<sub>c</sub> = 1,0), és mindkét rétegre számol w<sub>k</sub>-t;<br>• <b>teher</b>: a mértékadó karakterisztikus pontteher rugalmas (Westergaard) feszültsége; ha &gt; f<sub>ctm</sub>, az alsó vasalásra számol w<sub>k</sub>-t (k<sub>t</sub> = 0,4 tartós).<br>A határérték megválasztása a tervező feladata. Tájékoztatásul: EN 1992-3 (folyadéktároló szerkezetek) 1. tömörségi osztály: w<sub>k1</sub> = 0,20 mm (h<sub>D</sub>/h ≤ 5) … 0,05 mm (h<sub>D</sub>/h ≥ 35); általános szerkezetre XC osztályban 0,3 mm (EC2 7.1N táblázat). A táblahossz a hézagtávolság (hézagmentes / nagy táblás padlónál a mezőméret), a súrlódás a Lohmeyer-blokk súrlódási beállításából jön. Szálas lemezre (háló nélkül) nem alkalmazható.','Deschiderea fisurilor conform EC2 7.3.4 pentru plăci armate: constrângere (contracție, răcire) – dacă forța de frecare μ·(g+q)·L/2 < forța de fisurare k·f<sub>ctm</sub>·h placa nu fisurează; altfel forța de fisurare încarcă armătura (ec. 7.1, k<sub>c</sub> = 1,0); încărcare – efortul elastic Westergaard sub încărcarea caracteristică; dacă &gt; f<sub>ctm</sub>, se calculează w<sub>k</sub> pentru armătura inferioară. Limita o alege proiectantul (ex. EN 1992-3 clasa 1: 0,20 … 0,05 mm; EC2 Tab. 7.1N: 0,3 mm).','Crack width per EC2 7.3.4 for fabric / bar reinforced slabs: restraint (shrinkage, cooling) – if friction force μ·(g+q)·L/2 < cracking force k·f<sub>ctm</sub>·h the slab does not crack; otherwise the cracking force loads the steel (Eq. 7.1, k<sub>c</sub> = 1.0); load – elastic Westergaard stress under the characteristic point load; if &gt; f<sub>ctm</sub>, w<sub>k</sub> is computed for the bottom steel. The limit is the designer’s choice (e.g. EN 1992-3 class 1: 0.20 … 0.05 mm; EC2 Table 7.1N: 0.3 mm).'],

Object.assign(TI,{ mach:['<b>Teher:</b> P = 1,35·G<sub>k</sub> + 1,5·Q<sub>k</sub> lábanként (felületi tehernél az összteher), mint a mezzanin oszlopnál; csak statikus gépekre – rezgő gépnél (prés, kompresszor, kalapács) dinamikus hatás és külön alap kellhet, ezt a program nem kezeli.<br><b>Lábak:</b> egy láb (Eq.21/22), két láb x és y irányban (Eq.27/28, x < 2h esetén összevont felület, 7.8.2), négy láb (Eq.29/30); minden lábra átszúródás (Eq.11–15).<br><b>Helyzet:</b> a hézagtól / szabad széltől mért d távolság l-en (merevségi sugár) belül lineáris átmenet a szél- (hézag: X/0,85 + Y szerint) és a belső teherbírás között: P<sub>u</sub>(d) = P<sub>u,szél</sub> + (P<sub>u,int</sub> − P<sub>u,szél</sub>)·d/l; d ≥ l → belső. A csoportos (2/4 láb) teherbírást ugyanezzel a helyzeti tényezővel csökkenti. A TR34 maga csak a belső / szél / sarok helyzetet adja – az interpoláció mérnöki közelítés.<br><b>Felületi teher:</b> egy foltteherként (a = √(a·b/π)); ha a > l, megoszló teherként is ellenőrzi (Eq.35).<br><b>Lohmeyer:</b> Q<sub>d</sub> = 1,2·(G+Q), a szomszéd lábak hatásával (Bild 7.5), hézagnál K<sub>a</sub>·σ<sub>r</sub>, l<sub>e</sub>-n belül lineáris átmenettel.','<b>Încărcare:</b> P = 1,35·G<sub>k</sub> + 1,5·Q<sub>k</sub> pe picior; numai utilaje statice.<br><b>Picioare:</b> 1 (Eq.21/22), 2 (Eq.27/28), 4 (Eq.29/30); străpungere pe picior.<br><b>Poziție:</b> în interiorul distanței l interpolare liniară între capacitatea la margine/rost și cea interioară; d ≥ l → interior (aproximare inginerească).<br><b>Suprafață:</b> încărcare concentrată pe amprentă; dacă a > l, și ca încărcare distribuită.<br><b>Lohmeyer:</b> Q<sub>d</sub> = 1,2·(G+Q), cu influența picioarelor vecine.','<b>Load:</b> P = 1.35·G<sub>k</sub> + 1.5·Q<sub>k</sub> per leg; static machines only.<br><b>Legs:</b> 1 (Eq.21/22), 2 (Eq.27/28), 4 (Eq.29/30); punching per leg.<br><b>Position:</b> within distance l linear interpolation between edge/joint and internal capacity; d ≥ l → internal (engineering approximation).<br><b>Area:</b> patch load over the footprint; if a > l also as UDL.<br><b>Lohmeyer:</b> Q<sub>d</sub> = 1.2·(G+Q) with neighbouring legs.'] });

Object.assign(TI,{
 smShr:['<b>Forrás:</b> EC2 – MSZ EN / SR EN 1992-1-1, 3.1.4 pont és B melléklet. Bemenet: cementosztály, relatív páratartalom, lemezvastagság (egyenértékű vastagság h<sub>0</sub> = 2h egyoldali kiszáradásnál) és időpontok. Eredmény: a beton végső zsugorodása ε<sub>cs</sub> (kiszáradási + autogén) és kúszási tényezője φ(t,t<sub>0</sub>).<br><b>Mire jó:</b> tájékoztató adat, hogy mekkora lesz a zsugorodás és mennyire „lágyul” a beton tartós terhelés alatt; ebből számol a kényszerfeszültség is. Önmagában nem változtat a teherbíráson.<br><b>Miért választható:</b> a TR34 4. kiadása nem kér zsugorodásszámítást a teherbíráshoz.','<b>Sursa:</b> EC2 (SR EN 1992-1-1) 3.1.4 și Anexa B. <b>Scop:</b> contracția finală ε<sub>cs</sub> și coeficientul de curgere lentă φ – informativ; folosit la efortul din constrângere. TR34 ed. 4 nu îl cere.','<b>Source:</b> EC2 (EN 1992-1-1) 3.1.4 and Annex B. <b>Purpose:</b> final shrinkage ε<sub>cs</sub> and creep coefficient φ – information; used by the restraint check. TR34 4th ed. does not require it.'],
 smRestr:['<b>Forrás:</b> a TR34 régebbi, 3. kiadásának (2003) módszere, a zsugorodást az EC2 B melléklet képletéből véve: f<sub>sh</sub> = κ·E<sub>c,eff</sub>·ε<sub>cs</sub> (κ = 0,2), felhajlásból f<sub>cur</sub> = ½·E<sub>c,eff</sub>·Δε/(1−ν), Δε = 1,5·10⁻⁶·h; f<sub>sh,cur</sub> = (f<sub>sh</sub>+f<sub>cur</sub>)/2, E<sub>c,eff</sub> = E<sub>cm</sub>/(1+φ).<br><b>Mit csinál:</b> a beton zsugorodna, de az alapréteg súrlódása és a felhajlás ezt gátolja, ezért a lemezben eleve húzófeszültség van. Ezt kivonja a hajlító-húzószilárdságból: <b>bekapcsolva minden TR34-ellenőrzés a csökkentett M<sub>n,res</sub> = (f<sub>ctd,fl</sub> − f<sub>sh,cur</sub>)·h²/6 nyomatékkal számol</b> (pont-, vonal-, megoszló teher). A duktilitás és a minimális vasalás az eredeti M<sub>un</sub>-nal marad.<br><b>Mire jó:</b> biztonság javára tett feltevés – hasznos, ha a lemez korán kap terhet, erősen súrlódó alapon fekszik, vagy nagy mezős / hézagmentes.<br><b>Miért van alapból kikapcsolva:</b> a TR34 4. kiadása szándékosan nem számolja – szerinte a teher és a zsugorodás együttes hatását reálisan nehéz felmérni, és túlméretezést okozhat; helyette jó betonkeverékkel, csúsztatóréteggel, korlátozott hézagtávolsággal kezeli, és azzal, hogy a lemezt nem kötik falhoz, oszlophoz.','<b>Sursa:</b> metoda TR34 ed. 3 (2003), contracție după EC2 Anexa B. <b>Scop:</b> scade efortul din constrângere (frecare + curbare) din rezistența la încovoiere – toate verificările TR34 folosesc M<sub>n,res</sub>. Ipoteză acoperitoare (încărcare timpurie, frecare mare, câmpuri mari). TR34 ed. 4 nu o cere intenționat (controlează contracția prin rețetă, strat de alunecare, distanța rosturilor).','<b>Source:</b> TR34 3rd ed. (2003) method, shrinkage per EC2 Annex B. <b>Purpose:</b> deducts the restraint stress (friction + curling) from the flexural strength – all TR34 checks use M<sub>n,res</sub>. Conservative option (early loading, high friction, large bays). TR34 4th ed. deliberately omits it (controls shrinkage by mix, slip membrane, joint spacing).'],
 smJoint:['<b>Forrás:</b> TR34 4. kiadás, 7.9 pont – vágott hézagnál a szemcsék összekapaszkodása a teher kb. 15%-át adja át, ezért a lemezszél teherbírása ÷0,85 (P<sub>u,edge</sub>/0,85); a teherpárnál Eq.27/28. Emellett ellenőrzi, hogy a vágás legalább a lemezvastagság harmada (h/3) legyen.<br><b>Mire jó:</b> egy polcláb vagy egy közeli lábpár közvetlenül a vágott hézag mellett – gyakran ez a mértékadó eset.<br><b>Megjegyzés:</b> a korábbi kézi számításban egy „+1/(1−0,15) kN” tag szerepelt – ezt elírásnak tekintettük, és ÷0,85 osztásként vettük.','<b>Sursa:</b> TR34 ed. 4, 7.9 – la rostul tăiat angrenarea agregatelor transferă ~15%, deci capacitatea la margine ÷0,85; perechea după Eq.27/28; adâncimea tăieturii ≥ h/3. <b>Scop:</b> picior de raft sau pereche lângă rostul tăiat.','<b>Source:</b> TR34 4th ed., 7.9 – at sawn joints aggregate interlock transfers ~15%, so edge capacity ÷0.85; pairs per Eq.27/28; saw-cut depth ≥ h/3. <b>Purpose:</b> rack leg or close pair right next to a sawn joint.'],

const txt = (x,y,s,o={}) => `<text x="${x}" y="${y}" fill="${o.fill||C.ink}" font-size="${o.fs||11}" text-anchor="${o.a||'start'}" font-weight="${o.fw||400}"${o.it?' font-style="italic"':''}>${s}</text>`;
const defs = () => { SFX++; return `<defs>
 <pattern id="pGran_${SFX}" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="${C.gran}"/><circle cx="2" cy="2" r="1.1" fill="#9f8f72"/><circle cx="6" cy="5.5" r="1.4" fill="#a89878"/></pattern>
 <pattern id="pSoil_${SFX}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="${C.soil}"/><line x1="0" y1="0" x2="0" y2="10" stroke="#9c8460" stroke-width="2"/></pattern>
 <pattern id="pIns_${SFX}" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="${C.ins}"/><path d="M0 6 Q3 0 6 6 T12 6" fill="none" stroke="#c9a93a" stroke-width="1"/></pattern>
 <pattern id="pHbm_${SFX}" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#c9c3b3"/><path d="M0 8 L8 0" stroke="#a59f8f" stroke-width="1"/></pattern>
 <marker id="arw_${SFX}" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="${C.steel}"/></marker>
 <marker id="arwR_${SFX}" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="${C.steel}"/></marker>
</defs>`; };
const dim = (x1,y1,x2,y2,label,off=0) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.steel}" stroke-width="1" marker-start="${U('arwR')}" marker-end="${U('arw')}"/>`+
  txt((x1+x2)/2 + (y1===y2?0:6+off), (y1+y2)/2 + (y1===y2?-4:4), label, {fill:C.steel, a: y1===y2?'middle':'start', fs:10});
const fig = (svg, cap) => svg + `<div class="cap">${cap}</div>`;

/* support / build-up */
function figSupport(sup){
  let s = svgOpen(320,150)+defs();
  if(sup==='insul'){
    s += `<rect x="20" y="20" width="280" height="22" fill="${C.conc}" stroke="${C.line}"/>`+txt(26,35,L3('Kopólemez','Placă de uzură','Wearing slab'));
    s += `<rect x="20" y="42" width="280" height="2" fill="${C.st2}"/>`;
    s += `<rect x="20" y="44" width="280" height="24" fill="${U('pIns')}" stroke="${C.line}"/>`+txt(26,60,L3('Hőszigetelés','Termoizolație','Insulation'));
    s += `<rect x="20" y="68" width="280" height="10" fill="${C.heat}" opacity=".55"/>`+txt(26,76,L3('Fűtőréteg','Strat încălzire','Heater mat'),{fs:9});
    s += `<rect x="20" y="78" width="280" height="18" fill="${C.conc2}" stroke="${C.line}"/>`+txt(26,91,L3('Alaplemez','Placă suport','Base slab'));
    s += `<rect x="20" y="96" width="280" height="20" fill="${U('pGran')}"/><rect x="20" y="116" width="280" height="24" fill="${U('pSoil')}"/>`;
  } else {
    s += `<rect x="20" y="24" width="280" height="30" fill="${C.conc}" stroke="${C.line}"/>`+txt(26,43,L3('Betonlemez h','Placă de beton h','Concrete slab h'));
    s += `<rect x="20" y="54" width="280" height="2.5" fill="${C.st2}"/>`+txt(296,66,L3('fólia','folie','membrane'),{a:'end',fs:9,fill:C.st2});
    s += `<rect x="20" y="57" width="280" height="34" fill="${U('pGran')}"/>`+txt(26,78,L3('Szemcsés alapréteg ≥ 150 mm','Strat granular ≥ 150 mm','Granular sub-base ≥ 150 mm'));
    s += `<rect x="20" y="91" width="280" height="45" fill="${U('pSoil')}"/>`+txt(26,116,L3('Altalaj → k','Teren natural → k','Subgrade → k'),{fill:'#fff',fw:600});
    for(let i=0;i<5;i++){const x=60+i*50; s+=`<line x1="${x}" y1="6" x2="${x}" y2="22" stroke="${C.acc}" stroke-width="2" marker-end="${U('arw')}"/>`;}
  }
  s += '</svg>';
  return fig(s, sup==='insul' ? L3('Hőszigetelésen fekvő lemez (TR34 5.3 ábra szerinti rétegrend).','Placă pe termoizolație (alcătuire după TR34 Fig. 5.3).','Slab on insulation (build-up per TR34 Fig. 5.3).')
                             : L3('Talajon fekvő lemez: a lemezt az altalaj k-jára méretezzük (TR34 5.6).','Placă pe teren: se dimensionează pe k al terenului natural (TR34 5.6).','Ground-supported slab: designed on the subgrade k (TR34 5.6).'));
}
/* construction method plan */
function figMethod(m){
  let s = svgOpen(320,170)+defs();
  const X0=20,Y0=20,W=280,H=120;
  s += `<rect x="${X0}" y="${Y0}" width="${W}" height="${H}" fill="${C.pale}" stroke="${C.steel}" stroke-width="2"/>`;
  const thick = (x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.steel}" stroke-width="2.5"/>`;
  const thin = (x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.st2}" stroke-width=".8" stroke-dasharray="3 2"/>`;
  let cap='';
  if(m==='large'){
    s += thick(X0+140,Y0,X0+140,Y0+H);
    for(let x=X0+23;x<X0+W;x+=23) if(Math.abs(x-(X0+140))>3) s+=thin(x,Y0,x,Y0+H);
    for(let y=Y0+24;y<Y0+H;y+=24) s+=thin(X0,y,X0+W,y);
    cap=L3('Kialakított mozgási hézag (vastag) 40–50 m-enként, vágott hézagok (szaggatott) ~6 m-es hálóban.','Rost format (gros) la 40–50 m, rosturi tăiate (întrerupt) în rețea de ~6 m.','Formed joints (thick) at 40–50 m, sawn joints (dashed) on a ~6 m grid.');
  } else if(m==='jointless'){
    s += thick(X0+93,Y0,X0+93,Y0+H)+thick(X0+186,Y0,X0+186,Y0+H)+thick(X0,Y0+60,X0+W,Y0+60);
    s += dim(X0,Y0+H+14,X0+93,Y0+H+14,'≤ 35 m');
    cap=L3('Csak kialakított hézagok, mezők ≤ 35 m, oldalarány ≤ 1:1,5.','Doar rosturi formate, câmpuri ≤ 35 m, raport laturi ≤ 1:1,5.','Formed joints only, bays ≤ 35 m, aspect ratio ≤ 1:1.5.');
  } else if(m==='strip'){
    for(let y=Y0+24;y<Y0+H;y+=24) s+=thick(X0,y,X0+W,y);
    for(let x=X0+28;x<X0+W;x+=28) for(let y=Y0;y<Y0+H;y+=24) s+=thin(x,y,x,y+24);
    s += dim(X0+W+8,Y0,X0+W+8,Y0+24,'4–6 m');
    cap=L3('Sávok zsaluzat mellett, keresztirányú vágott hézag ≤ 6 m-enként.','Fâșii între cofraje, rosturi tăiate transversale la ≤ 6 m.','Strips between forms, transverse sawn joints at ≤ 6 m.');
  } else if(m==='widebay'){
    for(let y=Y0+40;y<Y0+H;y+=40) s+=thick(X0,y,X0+W,y);
    for(let x=X0+40;x<X0+W;x+=40) s+=thin(x,Y0,x,Y0+H);
    s += dim(X0+W+8,Y0,X0+W+8,Y0+40,'12–15 m');
    cap=L3('Széles mezők, a felület lehúzható „highway straightedge”-dzsel.','Câmpuri late, suprafața se poate nivela cu dreptarul.','Wide bays allowing highway straightedge finishing.');
  } else if(m==='overlayU'||m==='overlayB'||m==='twolayer'){
    s = svgOpen(320,170)+defs();
    s += `<rect x="20" y="40" width="280" height="26" fill="${C.conc}" stroke="${C.line}"/>`+txt(26,57,m==='twolayer'?L3('Felső réteg','Strat superior','Top layer'):L3('Új réteg','Strat nou','New overlay'));
    s += (m==='overlayU')?`<rect x="20" y="66" width="280" height="3" fill="${C.st2}"/>`:`<rect x="20" y="66" width="280" height="3" fill="${C.acc}"/>`;
    s += `<rect x="20" y="69" width="280" height="36" fill="${C.conc2}" stroke="${C.line}"/>`+txt(26,90,L3('Meglévő / alsó lemez','Placă existentă / inferioară','Existing / lower slab'));
    s += `<rect x="20" y="105" width="280" height="30" fill="${U('pGran')}"/>`;
    s += txt(300,80,m==='overlayU'?L3('elválasztó fólia','folie de separare','separation membrane'):L3('tapadó híd','punte de aderență','bonding layer'),{a:'end',fs:9,fill:m==='overlayU'?C.st2:C.acc});
    cap = m==='overlayU'?L3('Elválasztott ráöntés: talajon fekvő lemezként méretezhető (TR34 11.1.4).','Strat nelegat: se dimensionează ca placă pe teren (TR34 11.1.4).','Unbonded overlay: designed as a ground-supported slab (TR34 11.1.4).')
        : L3('Tapadó / kétrétegű szerkezet: a TR34 nem ad méretezési módszert.','Strat legat / bistrat: TR34 nu oferă metodă de calcul.','Bonded / two-layer: TR34 gives no design method.');
  } else if(m==='heating'){
    s = svgOpen(320,170)+defs();
    s += `<rect x="20" y="40" width="280" height="50" fill="${C.conc}" stroke="${C.line}"/>`;
    for(let x=40;x<300;x+=30) s+=`<circle cx="${x}" cy="70" r="5" fill="none" stroke="${C.heat}" stroke-width="2"/>`;
    s += `<rect x="20" y="90" width="280" height="40" fill="${U('pGran')}"/>`;
    s += dim(310,40,310,64,'h_eff',-40);
    cap=L3('Padlófűtés: a csövek csökkentik a hatékony vastagságot – adja meg Δh-ként (TR34 11.1.6).','Încălzire în pardoseală: țevile reduc grosimea efectivă – introduceți ca Δh (TR34 11.1.6).','In-floor heating: pipes reduce the effective thickness – enter as Δh (TR34 11.1.6).');
  } else if(m==='pt'){
    for(let y=Y0+15;y<Y0+H;y+=15) s+=`<line x1="${X0}" y1="${y}" x2="${X0+W}" y2="${y}" stroke="${C.acc}" stroke-width="1"/>`;
    for(let x=X0+20;x<X0+W;x+=20) s+=`<line x1="${x}" y1="${Y0}" x2="${x}" y2="${Y0+H}" stroke="${C.acc}" stroke-width="1"/>`;
    cap=L3('Utófeszített mezők akár 100 × 100 m – a TR34 nem méretezi, a feszítőrendszer szállítóját kell bevonni.','Câmpuri postcomprimate până la 100 × 100 m – TR34 nu le dimensionează.','Post-tensioned panels up to 100 × 100 m – not designed by TR34.');
  }
  s += '</svg>';
  return fig(s,cap);
}
/* layers */
function figLayers(layers, h){
  const W=370; let y=14; let s=''; const D=defs();
  const fills={gran:U('pGran'),level:U('pGran'),fill:U('pSoil'),hbm:U('pHbm'),cap:U('pHbm'),ins:U('pIns'),base:C.conc2,blind:C.conc2,heat:C.heat,sub:U('pSoil')};
  const sc = v => Math.max(14, Math.min(60, v*0.12));
  const hh = sc(h);
  s += `<rect x="40" y="${y}" width="230" height="${hh}" fill="${C.conc}" stroke="${C.line}"/>`+txt(46,y+hh/2+4,L3('Betonlemez','Placă beton','Slab'))+txt(278,y+hh/2+4,h+' mm',{fs:10,fill:C.muted});
  y += hh;
  layers.forEach(l=>{
    if(LY_THIN.includes(l.type)){
      const th=12, col=l.type==='film'?C.acc:C.steel;
      s += `<line x1="40" y1="${y+th/2}" x2="270" y2="${y+th/2}" stroke="${col}" stroke-width="${l.type==='film'?2:1.5}" stroke-dasharray="${l.type==='film'?'none':(l.type==='geotex'?'2 3':'8 3')}"/>`;
      s += txt(278,y+th/2+4,(l.type==='film'?(l.n||1)+'×'+fmt(+l.t||0,2)+' mm':(+l.t||0)+' g/m²'),{fs:9,fill:C.muted});
      s += txt(46,y+th/2-2,(l.name||lyName(l.type)),{fs:8.5,fill:col});
      y += th; return;
    }
    const th = l.type==='sub'?40:sc(l.t||0);
    s += `<rect x="40" y="${y}" width="230" height="${th}" fill="${fills[l.type]||C.gran}" stroke="${C.line}" ${l.type==='heat'?'opacity=".6"':''}/>`;
    s += txt(46,y+th/2+4,(l.name||lyName(l.type)),{fs:10,fill:l.type==='sub'?'#fff':C.ink,fw:l.type==='sub'?600:400});
    if(l.type!=='sub') s += txt(278,y+th/2+4,(l.t||0)+' mm'+(l.e2?' · E₂≥'+l.e2:''),{fs:10,fill:C.muted});
    else if(l.e2) s += txt(278,y+th/2+4,'E₂≥'+l.e2,{fs:10,fill:C.muted});
    y += th;
  });
  return fig(svgOpen(W,y+8)+D+s+'</svg>', L3('Rétegrend (nem méretarányos).','Alcătuire (nu la scară).','Build-up (not to scale).'));
}
/* reinforcement section */
function figReinf(r,topKind,dv){
  dv=dv||{};
  let s = svgOpen(320,150)+defs();
  s += `<rect x="20" y="20" width="280" height="80" fill="${C.conc}" stroke="${C.line}"/>`;
  const fib = r==='steelFib'||r==='synFib'||r==='fibFab'||r==='fibEdge';
  if(fib){ let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
    for(let i=0;i<70;i++){const x=26+rnd()*268,y=26+rnd()*68,a=rnd()*Math.PI,l=10;
      s+=`<line x1="${x}" y1="${y}" x2="${(x+Math.cos(a)*l).toFixed(1)}" y2="${(y+Math.sin(a)*l).toFixed(1)}" stroke="${r==='synFib'?'#4a8a6a':'#444'}" stroke-width="1.2"/>`;} }
  if((r==='fibFab'||r==='fabric'||r==='bars'||r==='fibEdge'||r==='fabEdge') && dv.pos!=='top'){
    const edge=r==='fibEdge'||r==='fabEdge', x1=edge?190:30, x2=300;
    const cT='c'+(dv.c!=null?' = '+dv.c+' mm':''), bT='b'+(dv.b!=null?' = '+dv.b+' m':'');
    for(let x=x1;x<x2;x+=18) s+=`<circle cx="${x}" cy="82" r="${r==='bars'?4:3}" fill="${C.steel}"/>`;
    s+=`<line x1="${x1-6}" y1="82" x2="296" y2="82" stroke="${C.steel}" stroke-width="1.5"/>`;
    const cx=edge?178:310;
    s+=dim(cx,82,cx,100,'')+`<rect x="${cx-62}" y="86" width="58" height="12" fill="${C.conc}" opacity=".9"/>`+txt(cx-5,96,cT,{a:'end',fs:10,fill:C.steel});
    if(edge) s+=`<line x1="300" y1="14" x2="300" y2="106" stroke="${C.acc}" stroke-width="2" stroke-dasharray="5 3"/>`
      +dim(184,112,300,112,bT)+txt(300,10,L3('padló pereme','marginea pardoselii','floor perimeter'),{a:'end',fs:9,fill:C.acc})
      +txt(100,128,(r==='fabEdge'?L3('mező: vasalatlan','câmp: nearmat','field: unreinforced'):L3('mező: csak szál','câmp: doar fibre','field: fibre only')),{a:'middle',fs:9,fill:C.muted});
  }
  if(topKind&&topKind!=='none'){ const tx=(r==='fibEdge'||r==='fabEdge')?190:30; if((r==='fibEdge'||r==='fabEdge')&&dv.pos==='top') s+=`<line x1="300" y1="14" x2="300" y2="106" stroke="${C.acc}" stroke-width="2" stroke-dasharray="5 3"/>`+dim(184,112,300,112,'b'+(dv.b!=null?' = '+dv.b+' m':''))+txt(300,10,L3('padló pereme','marginea pardoselii','floor perimeter'),{a:'end',fs:9,fill:C.acc}); for(let x=tx;x<300;x+=18) s+=`<circle cx="${x}" cy="34" r="${topKind==='bars'?4:3}" fill="${C.acc}"/>`; s+=`<line x1="${tx-6}" y1="34" x2="296" y2="34" stroke="${C.acc}" stroke-width="1.5"/>`; }
  if(r==='plain') s+=txt(160,64,L3('vasalatlan','nearmat','unreinforced'),{a:'middle',fill:C.muted,it:true});
  s += dim(10,20,10,100,'h',4) + '</svg>';
  const cap = {steelFib:L3('Acélszálas lemez: Mp a maradó szilárdságból (TR34 6. egy.).','Placă cu fibre: Mp din rezistențele reziduale (TR34 ec. 6).','Steel fibre slab: Mp from residual strengths (TR34 Eq. 6).'),
    synFib:L3('Makro-szintetikus szál: kúszás, átszúródási többlet nélkül.','Fibre macrosintetice: fluaj, fără spor la străpungere.','Macro-synthetic fibre: creep, no punching enhancement.'),
    fibFab:L3('Szál + alsó háló: TR34 8. egy. (Aₛ < 0,15%) vagy 9–10. egy.','Fibre + plasă inferioară: TR34 ec. 8 (Aₛ < 0,15%) sau ec. 9–10.','Fibre + bottom fabric: TR34 Eq. 8 (Aₛ < 0.15%) or Eq. 9–10.'),
    fabEdge:L3('Vasbeton, háló csak a b szélességű peremsávban a padló kerülete mentén; a mező vasalatlan (rugalmas ellenőrzés). b, c és a háló helye: lent.','Beton armat, plasă doar în fâșia perimetrală de lățime b; câmpul nearmat (verificare elastică).','Reinforced concrete, fabric only in the perimeter strip of width b; the field is unreinforced (elastic check).'),
    fibEdge:L3('Peremháló: b szélességű sáv körbe a padló kerülete mentén; a peremen álló terhek teherbírása nő, a mező szálas marad. b, c és a háló helye: lent.','Plasă perimetrală: fâșie de lățime b de-a lungul conturului pardoselii; crește capacitatea la margine, câmpul rămâne cu fibre.','Perimeter fabric: strip of width b around the floor perimeter; edge capacity increases, the field stays fibre-only.'),
    fabric:L3('Alsó háló: Mp = 0,95·Aₛ·fyk·d/γs (TR34 3. egy.). c: lent, „Alsó vasalás”.','Plasă inferioară: Mp = 0,95·Aₛ·fyk·d/γs (TR34 ec. 3).','Bottom fabric: Mp = 0.95·Aₛ·fyk·d/γs (TR34 Eq. 3).'),
    bars:L3('Alsó betonacél, mint a hálónál.','Bare inferioare, ca la plasă.','Bottom bars, as for fabric.'),
    plain:L3('Vasalatlan: rugalmas (Westergaard) ellenőrzés.','Nearmat: verificare elastică (Westergaard).','Plain: elastic (Westergaard) check.')}[r];
  return fig(s,cap);
}
/* joint section */
function figJoint(j,d){
  let s = svgOpen(320,140)+defs();
  const gap = (j==='sawn'||j==='sawnDowel')?2:(j==='tied'?2:8);
  const xm=160;
  s += `<rect x="20" y="30" width="${xm-gap/2-20}" height="60" fill="${C.conc}" stroke="${C.line}"/><rect x="${xm+gap/2}" y="30" width="${300-xm-gap/2}" height="60" fill="${C.conc}" stroke="${C.line}"/>`;
  s += `<rect x="20" y="90" width="280" height="2" fill="${C.st2}"/><rect x="20" y="92" width="280" height="26" fill="${U('pGran')}"/>`;
  if(j==='sawn'||j==='sawnDowel'){ s+=`<rect x="${xm-2}" y="30" width="4" height="18" fill="#fff" stroke="${C.line}"/><path d="M${xm} 48 l2 8 l-3 8 l2 8 l-2 8 l1 10" fill="none" stroke="${C.ink}" stroke-width="1"/>`; s+=txt(xm+8,26,L3('vágás 25–30% h','tăietură 25–30% h','saw cut 25–30% h'),{fs:9,fill:C.muted}); }
  if(j==='dowel'||j==='sawnDowel'){
    if(d==='plate') s+=`<path d="M${xm-45} 60 L${xm} 52 L${xm+45} 60 L${xm} 68 Z" fill="${C.st2}" opacity=".85"/>`;
    else s+=`<rect x="${xm-60}" y="57" width="120" height="${d==='square'?8:6}" fill="${C.steel}"/><rect x="${xm}" y="55" width="62" height="10" fill="none" stroke="${C.acc}" stroke-dasharray="3 2"/>`+txt(xm+64,52,L3('hüvely','manșon','sleeve'),{fs:9,fill:C.acc});
    if(j==='dowel') s+=`<rect x="${xm-6}" y="28" width="5" height="4" fill="${C.steel}"/><rect x="${xm+1}" y="28" width="5" height="4" fill="${C.steel}"/>`;
  }
  if(j==='tied') s+=`<rect x="40" y="58" width="240" height="5" fill="${C.steel}"/>`+txt(160,52,L3('lehorgonyzott betonacél','bare ancorate','anchored bars'),{a:'middle',fs:9,fill:C.steel});
  if(j==='free') s+=txt(xm,22,L3('szabad szél','margine liberă','free edge'),{a:'middle',fs:10,fill:C.muted});
  if(j!=='sawn'&&j!=='sawnDowel'&&j!=='tied') s+=dim(xm-gap/2-14,110,xm+gap/2+14,110,'w');
  s += '</svg>';
  const cap={free:L3('Szabad szél: átadás nincs, a szélbírás X.','Margine liberă: fără transfer, capacitate X.','Free edge: no transfer, capacity X.'),
