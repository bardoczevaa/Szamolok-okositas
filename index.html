<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mérnöki számolók</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #667085;
    --border: #e2e5ea; --accent: #1f6feb; --accent-soft: #e8f0fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e;
      --border: #30363d; --accent: #4493f8; --accent-soft: #1f2a3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  #search {
    width: 100%; padding: 12px 14px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text); margin-bottom: 24px;
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  h2 {
    font-size: .85rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 28px 0 10px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  a.card {
    display: block; padding: 14px 16px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--card); color: var(--text);
    text-decoration: none; transition: border-color .15s, background .15s;
  }
  a.card:hover { border-color: var(--accent); background: var(--accent-soft); }
  .card .t { font-weight: 600; }
  .card .f { font-size: .8rem; color: var(--muted); word-break: break-all; }
  .msg { color: var(--muted); padding: 16px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mérnöki számolók</h1>
  <p class="sub">Válaszd ki a számolót – az új fájlok automatikusan megjelennek.</p>
  <input id="search" type="search" placeholder="Keresés…" autocomplete="off">
  <div id="list"><p class="msg">Betöltés…</p></div>
</div>

<script>
// Ha a repót átnevezed, a lenti értékek maguktól igazodnak a GitHub Pages címhez.
// Csak akkor kell kézzel kitölteni, ha a fájlt nem a Pages linkről nyitod meg.
const FALLBACK_OWNER = "bardoczevaa";
const FALLBACK_REPO  = "Sz-mol-k-okositas";
const BRANCH = "main";

const onPages = location.hostname.endsWith(".github.io");
const owner = onPages ? location.hostname.split(".")[0] : FALLBACK_OWNER;
const repo  = onPages ? (location.pathname.split("/")[1] || FALLBACK_REPO) : FALLBACK_REPO;
const base  = onPages ? `/${repo}/` : `https://${owner}.github.io/${repo}/`;

const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");
let items = [];

function prettify(path) {
  const name = path.split("/").pop().replace(/\.html?$/i, "");
  const s = name.replace(/[-_]+/g, " ").trim();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function render(filter = "") {
  const q = filter.trim().toLowerCase();
  const shown = items.filter(it =>
    !q || it.title.toLowerCase().includes(q) || it.path.toLowerCase().includes(q));
  if (!shown.length) {
    listEl.innerHTML = `<p class="msg">${items.length ? "Nincs találat." : "Még nincs feltöltött számoló."}</p>`;
    return;
  }
  const groups = {};
  for (const it of shown) {
    const dir = it.path.includes("/") ? it.path.slice(0, it.path.lastIndexOf("/")) : "Általános";
    (groups[dir] ||= []).push(it);
  }
  const dirs = Object.keys(groups).sort((a, b) =>
    a === "Általános" ? -1 : b === "Általános" ? 1 : a.localeCompare(b, "hu"));
  listEl.innerHTML = "";
  for (const dir of dirs) {
    const h = document.createElement("h2");
    h.textContent = dir;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const it of groups[dir].sort((a, b) => a.title.localeCompare(b.title, "hu"))) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = base + it.path.split("/").map(encodeURIComponent).join("/");
      a.innerHTML = `<div class="t"></div><div class="f"></div>`;
      a.querySelector(".t").textContent = it.title;
      a.querySelector(".f").textContent = it.path;
      grid.appendChild(a);
    }
    listEl.append(h, grid);
  }
}

async function loadTitles() {
  // A számolók saját <title>-jét próbálja kiolvasni; ha nincs, a fájlnév marad.
  await Promise.all(items.map(async it => {
    try {
      const r = await fetch(base + it.path.split("/").map(encodeURIComponent).join("/"));
      if (!r.ok) return;
      const html = await r.text();
      const m = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
      if (m && m[1].trim()) {
        const tmp = document.createElement("textarea");
        tmp.innerHTML = m[1].trim();
        it.title = tmp.value;
      }
    } catch (e) {}
  }));
  render(searchEl.value);
}

async function init() {
  try {
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${BRANCH}?recursive=1`);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    items = data.tree
      .filter(n => n.type === "blob" && /\.html?$/i.test(n.path) && !/(^|\/)index\.html?$/i.test(n.path))
      .map(n => ({ path: n.path, title: prettify(n.path) }));
    render();
    loadTitles();
  } catch (e) {
    listEl.innerHTML = `<p class="msg">Nem sikerült betölteni a listát (${e.message}). Próbáld újra pár perc múlva.</p>`;
  }
}

searchEl.addEventListener("input", () => render(searchEl.value));
init();
</script>
</body>
</html>
