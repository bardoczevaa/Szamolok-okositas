title: Süllyedésszámítás – rétegösszegzés
sub: NP 112-2014 H melléklet, összevetve az SR EN 1997-1 F mellékletével
---
**Mikor kell?** Síkalapok és lemezalapok abszolút és relatív süllyedéséhez, szomszédos épületek egymásra hatásához.

## 1. Nettó nyomás az alapsíkon

$$p_{net} = p_{ef,med} - \gamma\,D \qquad (H.1) \qquad p_{ef,med} = V_d / A$$

- V_d a teljes teher az alapsíkon (szerkezet + alap + ráterhelő talaj), γ a talaj átlagos térfogatsúlya az alapsík felett, D az alapozási mélység [i]Széles (B > 10 m) munkagödörnél kötött talajban, ha a gödör feneke megemelkedhet, p_net = p_ef,med (a kiemelt talaj tehermentesítő hatása nélkül), és a p_net < γD tartományban az újraterhelési modulus használható.[/i]
- A terhet a SLS kombinációból kell venni – a CR 0 szerint az esettől függően karakterisztikus, kvázi-állandó vagy gyakori `NP 112-2014, H.5 (2)`

## 2. Feszültség a középponti függőlegesben

$$\sigma_z = \alpha_0 \cdot p_{net} \qquad (H.2)$$

| z/B | kör | L/B = 1 | 2 | 3 | ≥ 10 |
|---|---|---|---|---|---|
| 0,0 | 1,00 | 1,00 | 1,00 | 1,00 | 1,00 |
| 0,2 | 0,95 | 0,96 | 0,96 | 0,98 | 0,98 |
| 0,4 | 0,76 | 0,80 | 0,87 | 0,88 | 0,88 |
| 0,6 | 0,55 | 0,61 | 0,73 | 0,75 | 0,75 |
| 0,8 | 0,39 | 0,45 | 0,53 | 0,63 | 0,64 |
| 1,0 | 0,29 | 0,34 | 0,48 | 0,53 | 0,55 |
| 1,2 | 0,22 | 0,26 | 0,39 | 0,44 | 0,48 |
| 1,4 | 0,17 | 0,20 | 0,32 | 0,38 | 0,42 |
| 1,6 | 0,13 | 0,16 | 0,27 | 0,32 | 0,37 |
| 2,0 | 0,09 | 0,11 | 0,19 | 0,24 | 0,31 |
| 3,0 | 0,04 | 0,05 | 0,10 | 0,13 | 0,21 |
| 4,0 | 0,02 | 0,03 | 0,06 | 0,08 | 0,16 |
| 5,0 | 0,02 | 0,02 | 0,04 | 0,05 | 0,13 |
| 6,0 | 0,01 | 0,02 | 0,03 | 0,04 | 0,10 |

`NP 112-2014, H.3 táblázat` – B a rövidebb, L a hosszabb oldal; köztes értékek lineárisan interpolálhatók.

## 3. Elemi rétegek és aktív zóna

- Elemi réteg vastagsága: **h_i ≤ 0,4·B**, rétegen belül homogén talaj `H.2.1 (3)`
- Az aktív zóna alja (z0), ahol $\sigma_z \le 0{,}2\,\sigma_{gz}$ `(H.3)` [i]σgz a geológiai (önsúly-) feszültség ugyanabban a mélységben – talajvíz alatt a víz alatti térfogatsúllyal.[/i]
- Ha a határ egy jóval puhább rétegbe esik, vagy E_s < 5000 kPa: a réteget be kell venni, illetve $\sigma_z \le 0{,}1\,\sigma_{gz}$ `(H.4)`
- Gyakorlatilag összenyomhatatlan réteg (E_s > 100 000 kPa) tetejénél az aktív zóna lezárható

## 4. A süllyedés

$$s = \beta \sum_{i=1}^{n} \frac{\sigma_{zi}^{med}\,h_i}{E_{s,i}} \qquad \beta = 0{,}8 \qquad (H.5)$$

$$\sigma_{zi}^{med} = \frac{\sigma_{zi}^{sup} + \sigma_{zi}^{inf}}{2}$$

- E_s,i a román lineáris alakváltozási modulus, $E_s = M_0\,E_{oed}$ (lásd a talajmodulus-lapot) [i]kPa-ban és méterben számolva s méterben jön ki. A szabvány cm-ben írja fel, ezért ott 100-as szorzó is szerepel.[/i]

## 5. Szomszédos alapok hatása – sarokpont-módszer

$$\sigma_z = \alpha_c \cdot p_{net} \qquad (H.6)$$

Egy tetszőleges P pont alatt a terhelt téglalapot P-n átmenő vonalakkal négy téglalapra bontjuk, és az α_c tényezőket előjelesen összegezzük `(H.7)`, H.4 táblázat. A szomszéd épület σz-je hozzáadódik a saját feszültséghez. [i]Meglévő épület melletti új alapnál a meglévő épület már lezajlott süllyedését nem szabad újra számolni – csak az új épület okozta többletfeszültség okoz többletsüllyedést a meglévő alatt.[/i]

## 6. Relatív értékek és ellenőrzés

- süllyedéskülönbség Δs, elfordulás tg θ = Δs / L, relatív lehajlás `(H.14)`:

$$f = \frac{2\,s_3 - s_1 - s_2}{2\,l}$$

- Ellenőrzés: $\Delta \le \Delta_{lim}$ `(H.15)` – a határértékek a H.1 táblázatból vagy a szerkezeti tervből; technológiai korlátozású építményeknél (CRE) a technológiai terv adja `NP 112-2014, H.4`

## 7. Eurocode út

SR EN 1997-1, F1: $s = \sum \sigma_z\,\Delta z / E_{oed}$ – nincs β tényező, és az E_oed-et használja (M0 nélkül). A határ mélységére tipikusan a 20%-os kritérium; a határértékekre a H melléklet ad tájékoztatást. `SR EN 1997-1, 6.6, F és H melléklet`

> Több pontos, két épületes számításhoz a saját **Calcul tasarii_BE** számolód készült (NP 112 H.5–H.7, sarokpont-módszer, aktív zóna metszetben).

---
*Források: NP 112-2014 H.2.1, H.2.2, H.3.7, H.4, H.3–H.4 táblázat; SR EN 1997-1:2004 6.6, F melléklet.*

title: Calculul tasărilor – însumare pe straturi elementare
sub: NP 112-2014 anexa H, comparativ cu SR EN 1997-1 anexa F
---
**Când e nevoie?** Pentru tasarea absolută și relativă a fundațiilor de suprafață și a radierelor și pentru influența clădirilor învecinate.

## 1. Presiunea netă la baza fundației

$$p_{net} = p_{ef,med} - \gamma\,D \qquad (H.1) \qquad p_{ef,med} = V_d / A$$

- V_d încărcarea totală la baza fundației (structură + fundație + pământul de pe fundație), γ greutatea volumică medie a pământului de deasupra bazei, D adâncimea de fundare [i]La gropi late (B > 10 m) în pământuri coezive, dacă fundul săpăturii se poate umfla, se acceptă p_net = p_ef,med (fără efectul de descărcare), iar pentru p_net < γD se pot folosi modulele la descărcare.[/i]
- Încărcările din combinația SLS – conform CR 0, după caz caracteristică, cvasipermanentă sau frecventă `NP 112-2014, H.5 (2)`

## 2. Efortul pe verticala centrului

$$\sigma_z = \alpha_0 \cdot p_{net} \qquad (H.2)$$

| z/B | cerc | L/B = 1 | 2 | 3 | ≥ 10 |
|---|---|---|---|---|---|
| 0,0 | 1,00 | 1,00 | 1,00 | 1,00 | 1,00 |
| 0,2 | 0,95 | 0,96 | 0,96 | 0,98 | 0,98 |
| 0,4 | 0,76 | 0,80 | 0,87 | 0,88 | 0,88 |
| 0,6 | 0,55 | 0,61 | 0,73 | 0,75 | 0,75 |
| 0,8 | 0,39 | 0,45 | 0,53 | 0,63 | 0,64 |
| 1,0 | 0,29 | 0,34 | 0,48 | 0,53 | 0,55 |
| 1,2 | 0,22 | 0,26 | 0,39 | 0,44 | 0,48 |
| 1,4 | 0,17 | 0,20 | 0,32 | 0,38 | 0,42 |
| 1,6 | 0,13 | 0,16 | 0,27 | 0,32 | 0,37 |
| 2,0 | 0,09 | 0,11 | 0,19 | 0,24 | 0,31 |
| 3,0 | 0,04 | 0,05 | 0,10 | 0,13 | 0,21 |
| 4,0 | 0,02 | 0,03 | 0,06 | 0,08 | 0,16 |
| 5,0 | 0,02 | 0,02 | 0,04 | 0,05 | 0,13 |
| 6,0 | 0,01 | 0,02 | 0,03 | 0,04 | 0,10 |

`NP 112-2014, tabelul H.3` – B latura mică, L latura mare; se admite interpolarea liniară.

## 3. Straturi elementare și zona activă

- Grosimea stratului elementar: **h_i ≤ 0,4·B**, pământ omogen în strat `H.2.1 (3)`
- Limita inferioară a zonei active (z0) unde $\sigma_z \le 0{,}2\,\sigma_{gz}$ `(H.3)` [i]σgz efortul geologic la aceeași adâncime – sub nivelul apei cu greutatea volumică submersată.[/i]
- Dacă limita cade într-un strat mult mai compresibil sau cu E_s < 5000 kPa: se include stratul, respectiv $\sigma_z \le 0{,}1\,\sigma_{gz}$ `(H.4)`
- La un strat practic incompresibil (E_s > 100 000 kPa) zona activă se poate limita la suprafața acestuia

## 4. Tasarea

$$s = \beta \sum_{i=1}^{n} \frac{\sigma_{zi}^{med}\,h_i}{E_{s,i}} \qquad \beta = 0{,}8 \qquad (H.5)$$

$$\sigma_{zi}^{med} = \frac{\sigma_{zi}^{sup} + \sigma_{zi}^{inf}}{2}$$

- E_s,i modulul de deformație liniară, $E_s = M_0\,E_{oed}$ (vezi fișa modulelor) [i]Cu kPa și metri tasarea rezultă în metri. Normativul o scrie în cm, de aceea apare factorul 100.[/i]

## 5. Influența fundațiilor vecine – metoda punctelor de colț

$$\sigma_z = \alpha_c \cdot p_{net} \qquad (H.6)$$

Sub un punct oarecare P, suprafața încărcată se împarte prin drepte care trec prin P în patru dreptunghiuri, iar coeficienții α_c se însumează cu semn `(H.7)`, tabelul H.4. σz din clădirea vecină se adună la efortul propriu. [i]La o fundație nouă lângă o clădire existentă nu se recalculează tasarea deja consumată a clădirii existente – numai efortul suplimentar din clădirea nouă produce tasare suplimentară sub cea existentă.[/i]

## 6. Mărimi relative și verificare

- tasare diferențială Δs, rotire tg θ = Δs / L, încovoiere relativă `(H.14)`:

$$f = \frac{2\,s_3 - s_1 - s_2}{2\,l}$$

- Verificare: $\Delta \le \Delta_{lim}$ `(H.15)` – valori limită din tabelul H.1 sau din proiectul structurii; la construcții cu restricții de deformații (CRE) din proiectul tehnologic `NP 112-2014, H.4`

## 7. Varianta Eurocode

SR EN 1997-1, F1: $s = \sum \sigma_z\,\Delta z / E_{oed}$ – fără factorul β și cu E_oed (fără M0). Pentru adâncimea zonei se folosește uzual criteriul de 20%; pentru valori limită, anexa H dă orientări. `SR EN 1997-1, 6.6, anexele F și H`

> Pentru calcule cu mai multe puncte și două clădiri ai calculatorul propriu **Calcul tasarii_BE** (NP 112 H.5–H.7, metoda punctelor de colț, zona activă în secțiune).

- Sub-layer thickness **h_i ≤ 0.4·B**, homogeneous soil within each `H.2.1 (3)`
- Bottom of the active zone (z0) where $\sigma_z \le 0.2\,\sigma_{gz}$ `(H.3)` [i]σgz is the geostatic stress at the same depth – submerged unit weight below the water table.[/i]
- If that depth falls in a much softer layer or E_s < 5000 kPa: include the layer, or use $\sigma_z \le 0.1\,\sigma_{gz}$ `(H.4)`
- At a practically incompressible layer (E_s > 100 000 kPa) the active zone may stop at its top

## 4. Settlement

$$s = \beta \sum_{i=1}^{n} \frac{\sigma_{zi}^{med}\,h_i}{E_{s,i}} \qquad \beta = 0.8 \qquad (H.5)$$

$$\sigma_{zi}^{med} = \frac{\sigma_{zi}^{sup} + \sigma_{zi}^{inf}}{2}$$

- E_s,i Romanian linear deformation modulus, $E_s = M_0\,E_{oed}$ (see the soil moduli sheet) [i]With kPa and metres, s comes out in metres. The code writes it in cm, hence its factor of 100.[/i]

## 5. Neighbouring foundations – corner-point method

$$\sigma_z = \alpha_c \cdot p_{net} \qquad (H.6)$$

Under any point P, split the loaded area by lines through P into four rectangles and sum the α_c factors with signs `(H.7)`, Table H.4. The neighbour's σz adds to the own stress. [i]For a new foundation next to an existing building, do not recompute settlement the existing building has already undergone – only the added stress from the new building causes extra settlement under the existing one.[/i]

## 6. Relative values and check

- differential settlement Δs, rotation tan θ = Δs / L, relative deflection `(H.14)`:

$$f = \frac{2\,s_3 - s_1 - s_2}{2\,l}$$

- Check: $\Delta \le \Delta_{lim}$ `(H.15)` – limits from Table H.1 or the structural design; for buildings with deformation restrictions (CRE) from the process design `NP 112-2014, H.4`

## 7. Eurocode route

SR EN 1997-1, F1: $s = \sum \sigma_z\,\Delta z / E_{oed}$ – no β factor and E_oed without M0. The 20% criterion is common for the depth; Annex H gives guidance on limits. `SR EN 1997-1, 6.6, Annexes F and H`

> For multi-point, two-building cases use your own **Calcul tasarii_BE** calculator (NP 112 H.5–H.7, corner-point method, active zone in section).

---
*Sources: NP 112-2014 H.2.1, H.2.2, H.3.7, H.4, Tables H.3–H.4; SR EN 1997-1:2004 6.6, Annex F.*

<script type="text/markdown" data-id="sikalap-teherbiras" data-num="08" data-cat="found" data-calc="cbear" data-lang="hu">
title: Síkalapok talajtörési ellenőrzése
sub: NP 112-2014 D, F, H melléklet – p_conv, p_pl és R_d (EC7 D melléklet)
---
**Mikor kell?** Talp-, sáv- és lemezalapok méretezésénél. A román gyakorlatban három szint létezik: hagyományos (konvencionális) nyomás, plasztikus nyomás (SLS) és teherbírás (ULS).

## 1. Hagyományos nyomás – p_conv

$$p_{conv} = \bar{p}_{conv} + C_B + C_D \qquad (D.1)$$

- $\bar{p}_{conv}$ alapérték a D.1–D.5 táblázatokból, **B = 1,0 m** szélességre és **D = 2,0 m** mélységre [i]Pl. közepesen tömör középhomok 500 kPa, tömör 600 kPa; tömör durva homok 700 kPa; homokos kavics 550 kPa. Kötött talajnál az e hézagtényező és az I_c konzisztenciaindex szerint, interpolálva.[/i]
- Szélességi korrekció, B ≤ 5 m: $C_B = \bar{p}_{conv}\,K_1\,(B - 1)$, K1 = 0,10 szemcsés talajra (iszapos homok kivételével), 0,05 iszapos homokra és kötött talajra; B > 5 m: C_B = 0,4·p̄ ill. 0,2·p̄ `D.2.1`
- Mélységi korrekció: D ≤ 2 m: $C_D = \bar{p}_{conv}\,(D - 2)/4$; D > 2 m: $C_D = \gamma\,(D - 2)$ `D.2.2` [i]γ az alapsík feletti rétegek súlyozott átlagos térfogatsúlya. Pinceszintes épületeknél a D értelmezésére figyelj (a szabvány külön szabályt ad).[/i]

Használat: előtervezés, illetve egyszerű feltételek mellett hagyományos építményekre. Ellenőrzés: $p_{ef,med} \le p_{conv}$, külpontos terhelésnél $p_{ef,max} \le 1{,}2\,p_{conv}$ (egy irányban) [i]A külpontos esetek szorzóit (1,2 egy irányban, 1,4 két irányban) a NP 112 1. fejezetében ellenőrizd – a szöveg a projekt PDF-jéből nem olvasható ki biztosan.[/i]

## 2. Plasztikus nyomás – p_pl (SLS)

Pince nélküli épület:

$$p_{pl} = m_L\,(\bar{\gamma}\,B\,N_1 + q\,N_2 + c\,N_3) \qquad (H.16)$$

Pinces épület:

$$p_{pl} = m_L\left[\bar{\gamma}\,B\,N_1 + \frac{2q_e + q_i}{3}\,N_2 + c\,N_3\right] \qquad (H.17)$$

- m_L a munkakörülményi tényező (H.7 táblázat): kavics, görgeteg 2,0 · finom homok 1,7 / 1,6 (telített) · iszapos homok 1,5 / 1,3 · kötött talaj I_c ≥ 0,5: 1,4 · I_c < 0,5: 1,1
- $\bar{\gamma}$ az alapsík alatti B/4 mélységű réteg súlyozott térfogatsúlya, q az oldalsó terhelés az alapsík szintjén (≈ γ·D), c a kohézió
- N1, N2, N3 a φ függvényében (H.8 táblázat): φ = 20° → 0,51 / 3,06 / 5,66 · 25° ≈ 0,78 / 4,12 / 6,68 · 30° → 1,15 / 5,59 / 7,95 [i]SLS-ben a talaj parciális tényezői 1,0 – karakterisztikus paraméterekkel számolunk.[/i]
- Kör vagy sokszög alapnál az egyenértékű szélesség $B = \sqrt{A}$

Ellenőrzés: $p_{ef,med} \le p_{pl}$ és a külpontos csúcsnyomásokra a megfelelő szorzós feltétel. `NP 112-2014, H.5 (3)`

## 3. Teherbírás – ULS (az EC7 D mellékletével azonos)

Drénezett állapot:

$$R_d = A'\left(c'\,N_c\,b_c\,s_c\,i_c + q'\,N_q\,b_q\,s_q\,i_q + 0{,}5\,\gamma'\,B'\,N_\gamma\,b_\gamma\,s_\gamma\,i_\gamma\right) \qquad (F.2)$$

$$N_q = e^{\pi\tan\varphi'}\tan^2(45° + \varphi'/2) \qquad N_c = (N_q - 1)\cot\varphi' \qquad N_\gamma = 2\,(N_q - 1)\tan\varphi'$$

Drénezetlen állapot:

$$R_d = A'\,\left[(\pi + 2)\,c_u\,b_c\,s_c\,i_c + q\right] \qquad (F.1)$$

- A′ = B′·L′ a hatékony (redukált) felület: B′ = B − 2e_B, L′ = L − 2e_L
- alaktényezők téglalapra: $s_q = 1 + (B'/L')\sin\varphi'$, $s_\gamma = 1 - 0{,}3\,B'/L'$; drénezetlen $s_c = 1 + 0{,}2\,B'/L'$
- Ellenőrzés: $V_d \le R_d$ – a román NA szerinti tervezési megközelítéssel és parciális tényezőkkel `SR EN 1997-1, 6.5.2, D melléklet` · `NP 112-2014, F melléklet`

## 4. Eurocode út

Az EC7 ugyanazt a D mellékletet használja; p_conv és p_pl fogalma nincs benne. A használhatóságot a süllyedés-számítás igazolja (6.6), a teherbírást az R_d. A második generációs EN 1997-1:2024-hez a román NA tervezete 2025-ben volt közvéleményen.

---
*Források: NP 112-2014 D.1–D.2, F.1–F.2, H.5, H.7–H.8 táblázat; SR EN 1997-1:2004 6.5, D melléklet.*
</script>
<script type="text/markdown" data-id="sikalap-teherbiras" data-num="08" data-cat="found" data-calc="cbear" data-lang="ro">
title: Capacitatea portantă a fundațiilor de suprafață
sub: NP 112-2014 anexele D, F, H – p_conv, p_pl și R_d (EC7 anexa D)
---
**Când e nevoie?** La dimensionarea fundațiilor izolate, continue și a radierelor. În practica românească există trei niveluri: presiunea convențională, presiunea plastică (SLS) și capacitatea portantă (SLU).

## 1. Presiunea convențională – p_conv

$$p_{conv} = \bar{p}_{conv} + C_B + C_D \qquad (D.1)$$

- $\bar{p}_{conv}$ valoarea de bază din tabelele D.1–D.5, pentru **B = 1,0 m** și **D = 2,0 m** [i]De ex. nisip mijlociu de îndesare medie 500 kPa, îndesat 600 kPa; nisip mare îndesat 700 kPa; pietriș cu nisip 550 kPa. La pământuri coezive după indicele porilor e și indicele de consistență I_c, prin interpolare.[/i]
- Corecția de lățime, B ≤ 5 m: $C_B = \bar{p}_{conv}\,K_1\,(B - 1)$, K1 = 0,10 pentru pământuri necoezive (exceptând nisipurile prăfoase), 0,05 pentru nisipuri prăfoase și pământuri coezive; B > 5 m: C_B = 0,4·p̄ resp. 0,2·p̄ `D.2.1`
- Corecția de adâncime: D ≤ 2 m: $C_D = \bar{p}_{conv}\,(D - 2)/4$; D > 2 m: $C_D = \gamma\,(D - 2)$ `D.2.2` [i]γ greutatea volumică medie ponderată a straturilor de deasupra tălpii. La clădiri cu subsol atenție la definirea lui D (normativul dă reguli separate).[/i]

Utilizare: predimensionare, respectiv construcții obișnuite în condiții simple. Verificare: $p_{ef,med} \le p_{conv}$, la încărcare excentrică $p_{ef,max} \le 1{,}2\,p_{conv}$ (pe o direcție) [i]Verifică coeficienții pentru excentricitate (1,2 pe o direcție, 1,4 pe două) în cap. 1 al NP 112 – textul nu se citește sigur din PDF-ul proiectului.[/i]

## 2. Presiunea plastică – p_pl (SLS)

Construcții fără subsol:

$$p_{pl} = m_L\,(\bar{\gamma}\,B\,N_1 + q\,N_2 + c\,N_3) \qquad (H.16)$$

Construcții cu subsol:

$$p_{pl} = m_L\left[\bar{\gamma}\,B\,N_1 + \frac{2q_e + q_i}{3}\,N_2 + c\,N_3\right] \qquad (H.17)$$

- m_L coeficientul condițiilor de lucru (tabelul H.7): bolovănișuri, pietrișuri 2,0 · nisipuri fine 1,7 / 1,6 (saturate) · nisipuri prăfoase 1,5 / 1,3 · pământuri coezive I_c ≥ 0,5: 1,4 · I_c < 0,5: 1,1
- $\bar{\gamma}$ media ponderată a greutăților volumice pe adâncimea B/4 sub talpă, q suprasarcina laterală la nivelul tălpii (≈ γ·D), c coeziunea
- N1, N2, N3 funcție de φ (tabelul H.8): φ = 20° → 0,51 / 3,06 / 5,66 · 25° ≈ 0,78 / 4,12 / 6,68 · 30° → 1,15 / 5,59 / 7,95 [i]La SLS coeficienții parțiali pentru pământ sunt 1,0 – se lucrează cu parametrii caracteristici.[/i]
- La fundații circulare sau poligonale, latura echivalentă $B = \sqrt{A}$

Verificare: $p_{ef,med} \le p_{pl}$ și condițiile corespunzătoare pentru presiunile maxime la excentricitate. `NP 112-2014, H.5 (3)`

## 3. Capacitatea portantă – SLU (identic cu EC7 anexa D)

Condiții drenate:

$$R_d = A'\left(c'\,N_c\,b_c\,s_c\,i_c + q'\,N_q\,b_q\,s_q\,i_q + 0{,}5\,\gamma'\,B'\,N_\gamma\,b_\gamma\,s_\gamma\,i_\gamma\right) \qquad (F.2)$$

$$N_q = e^{\pi\tan\varphi'}\tan^2(45° + \varphi'/2) \qquad N_c = (N_q - 1)\cot\varphi' \qquad N_\gamma = 2\,(N_q - 1)\tan\varphi'$$

Condiții nedrenate:

$$R_d = A'\,\left[(\pi + 2)\,c_u\,b_c\,s_c\,i_c + q\right] \qquad (F.1)$$

- A′ = B′·L′ aria redusă: B′ = B − 2e_B, L′ = L − 2e_L
- factori de formă dreptunghi: $s_q = 1 + (B'/L')\sin\varphi'$, $s_\gamma = 1 - 0{,}3\,B'/L'$; nedrenat $s_c = 1 + 0{,}2\,B'/L'$
- Verificare: $V_d \le R_d$ – cu abordarea de calcul și coeficienții parțiali din anexa națională `SR EN 1997-1, 6.5.2, anexa D` · `NP 112-2014, anexa F`

## 4. Varianta Eurocode

EC7 folosește aceeași anexă D; noțiunile p_conv și p_pl nu există. Starea de serviciu se justifică prin calculul tasărilor (6.6), iar SLU prin R_d. Pentru generația a doua EN 1997-1:2024, proiectul anexei naționale a fost în anchetă publică în 2025.

---
*Surse: NP 112-2014 D.1–D.2, F.1–F.2, H.5, tabelele H.7–H.8; SR EN 1997-1:2004 6.5, anexa D.*
</script>
<script type="text/markdown" data-id="sikalap-teherbiras" data-num="08" data-cat="found" data-calc="cbear" data-lang="en">
title: Bearing check of shallow foundations
sub: NP 112-2014 Annexes D, F, H – p_conv, p_pl and R_d (EC7 Annex D)
---
**When?** Sizing pads, strips and rafts. Romanian practice has three levels: conventional pressure, plastic pressure (SLS) and bearing resistance (ULS).

## 1. Conventional pressure – p_conv

$$p_{conv} = \bar{p}_{conv} + C_B + C_D \qquad (D.1)$$

- $\bar{p}_{conv}$ base value from Tables D.1–D.5, for **B = 1.0 m** width and **D = 2.0 m** depth [i]E.g. medium-dense medium sand 500 kPa, dense 600 kPa; dense coarse sand 700 kPa; sandy gravel 550 kPa. For cohesive soils by void ratio e and consistency index I_c, interpolated.[/i]
- Width correction, B ≤ 5 m: $C_B = \bar{p}_{conv}\,K_1\,(B - 1)$, K1 = 0.10 for cohesionless soils (except silty sands), 0.05 for silty sands and cohesive soils; B > 5 m: C_B = 0.4·p̄ or 0.2·p̄ `D.2.1`
- Depth correction: D ≤ 2 m: $C_D = \bar{p}_{conv}\,(D - 2)/4$; D > 2 m: $C_D = \gamma\,(D - 2)$ `D.2.2` [i]γ is the weighted mean unit weight above the base. With basements, mind the definition of D (the code has separate rules).[/i]

Use: preliminary design, and ordinary buildings under simple conditions. Check: $p_{ef,med} \le p_{conv}$, eccentric loading $p_{ef,max} \le 1.2\,p_{conv}$ (one direction) [i]Confirm the eccentricity factors (1.2 one way, 1.4 two ways) in NP 112 chapter 1 – the text is not reliably legible in the project PDF.[/i]

## 2. Plastic pressure – p_pl (SLS)

Buildings without basement:

$$p_{pl} = m_L\,(\bar{\gamma}\,B\,N_1 + q\,N_2 + c\,N_3) \qquad (H.16)$$

Buildings with basement:

$$p_{pl} = m_L\left[\bar{\gamma}\,B\,N_1 + \frac{2q_e + q_i}{3}\,N_2 + c\,N_3\right] \qquad (H.17)$$

- m_L working-condition factor (Table H.7): boulders, gravels 2.0 · fine sands 1.7 / 1.6 (saturated) · silty sands 1.5 / 1.3 · cohesive I_c ≥ 0.5: 1.4 · I_c < 0.5: 1.1
- $\bar{\gamma}$ weighted unit weight over B/4 below the base, q lateral surcharge at base level (≈ γ·D), c cohesion
- N1, N2, N3 as functions of φ (Table H.8): φ = 20° → 0.51 / 3.06 / 5.66 · 25° ≈ 0.78 / 4.12 / 6.68 · 30° → 1.15 / 5.59 / 7.95 [i]At SLS the partial factors on soil are 1.0 – use characteristic parameters.[/i]
- Circular or polygonal bases: equivalent width $B = \sqrt{A}$

Check: $p_{ef,med} \le p_{pl}$ plus the corresponding conditions on peak pressures under eccentricity. `NP 112-2014, H.5 (3)`

## 3. Bearing resistance – ULS (same as EC7 Annex D)

Drained:

$$R_d = A'\left(c'\,N_c\,b_c\,s_c\,i_c + q'\,N_q\,b_q\,s_q\,i_q + 0.5\,\gamma'\,B'\,N_\gamma\,b_\gamma\,s_\gamma\,i_\gamma\right) \qquad (F.2)$$

$$N_q = e^{\pi\tan\varphi'}\tan^2(45° + \varphi'/2) \qquad N_c = (N_q - 1)\cot\varphi' \qquad N_\gamma = 2\,(N_q - 1)\tan\varphi'$$

Undrained:

$$R_d = A'\,\left[(\pi + 2)\,c_u\,b_c\,s_c\,i_c + q\right] \qquad (F.1)$$

- A′ = B′·L′ effective area: B′ = B − 2e_B, L′ = L − 2e_L
- rectangular shape factors: $s_q = 1 + (B'/L')\sin\varphi'$, $s_\gamma = 1 - 0.3\,B'/L'$; undrained $s_c = 1 + 0.2\,B'/L'$
- Check: $V_d \le R_d$ – with the design approach and partial factors of the National Annex `SR EN 1997-1, 6.5.2, Annex D` · `NP 112-2014, Annex F`

## 4. Eurocode route

EC7 uses the same Annex D; it has no p_conv or p_pl. Serviceability is shown by the settlement calculation (6.6), ULS by R_d. For the second-generation EN 1997-1:2024 the Romanian NA draft went to public enquiry in 2025.

---
*Sources: NP 112-2014 D.1–D.2, F.1–F.2, H.5, Tables H.7–H.8; SR EN 1997-1:2004 6.5, Annex D.*
</script>

function mdCore(md,inline){
  const math=[];
  md=md.replace(/\$\$([\s\S]+?)\$\$/g,(m,t)=>{math.push([1,t]);return '@@M'+(math.length-1)+'@@'});
  md=md.replace(/\$([^$\n]+?)\$/g,(m,t)=>{math.push([0,t]);return '@@M'+(math.length-1)+'@@'});
  md=md.replace(/~([^~\s]+)~/g,'<sub>$1</sub>');
  md=md.replace(/(^|[^\w\\@])([A-Za-z\u03b1-\u03c9]{1,2})_([A-Za-z0-9]+(?:,[A-Za-z0-9]+)?)/g,'$1$2<sub>$3</sub>');
  let html=inline?marked.parseInline(md):marked.parse(md,{gfm:true});
  html=html.replace(/@@M(\d+)@@/g,(m,i)=>{const [d,t]=math[+i];return d?'<span class="eq">\\['+esc(t)+'\\]</span>':'\\('+esc(t)+'\\)'});
  return html.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
}
let INFOS=[];
function renderMd(md){
  INFOS=[];
  md=md.replace(/\[i\]([\s\S]+?)\[\/i\]/g,(m,t)=>{INFOS.push(t);return '@@I'+(INFOS.length-1)+'@@'});
  return mdCore(md,false).replace(/@@I(\d+)@@/g,(m,i)=>`<button type="button" class="ib" data-i="${i}" aria-expanded="false" aria-label="${T().info}">i</button>`);
}

function buildConv(){
  const host=document.createElement('div');host.className='convs';
  CONV.forEach((c,ci)=>{
    const card=document.createElement('section');card.className='conv';
    let rows='';
    if(c.lin){rows=c.lin.map(([u],i)=>`<div class="crow"><input id="cv${ci}-${i}" inputmode="decimal" aria-label="${esc(u)}"><span class="u">${esc(u)}</span></div>`).join('');}
    else rows=c.f.map(([k,l,u,def,ro])=>`<div class="crow c"><label for="cv${ci}-${k}">${esc(tr(l))}</label><input id="cv${ci}-${k}" inputmode="decimal" ${ro?'readonly tabindex="-1"':''}><span class="u">${esc(u)}</span></div>`).join('');
    card.innerHTML=`<div><h3>${esc(tr(c.t))}</h3>${c.n?`<p class="cn">${esc(tr(c.n))}</p>`:''}</div><div class="rows">${rows}</div>`;
    host.appendChild(card);
    if(c.lin){
      const ins=c.lin.map((_,i)=>card.querySelector(`#cv${ci}-${i}`));
      const fac=i=>{const f=c.lin[i][1];return typeof f==='function'?f():f;};
      const fill=(src,val)=>{const base=val*fac(src);ins.forEach((el,i)=>{if(i!==src)el.value=fmtS(base/fac(i));});};
      ins.forEach((el,i)=>el.addEventListener('input',()=>{const v=num(el.value);if(isFinite(v))fill(i,v);}));
      ins[c.def[0]].value=fmtS(c.def[1]);fill(c.def[0],c.def[1]);
      c._refresh=()=>{const v=num(ins[c.def[0]].value);if(isFinite(v))fill(c.def[0],v);};
    }else{
      const el={};c.f.forEach(([k])=>el[k]=card.querySelector(`#cv${ci}-${k}`));
      c.f.forEach(([k,,,def])=>{if(def!=null)el[k].value=fmtS(def);});
      const run=k=>{const v={};for(const x in el)v[x]=num(el[x].value);const out=c.calc(k,v);for(const x in out)if(x!==k&&el[x])el[x].value=fmtS(out[x]);};
      c.f.forEach(([k,,,,ro])=>{if(!ro)el[k].addEventListener('input',()=>{if(isFinite(num(el[k].value)))run(k);});});
      run(c.f[0][0]);
    }
  });
  return host;
}

function beamSvg(b){
  const dg=b.dg||['V','M'];
  const W=340,X0=26,X1=W-18,yb=52,N=240,hh=28;
  const yc=dg.map((_,k)=>yb+76+k*104),H=yc[yc.length-1]+50;
  const sx=x=>X0+(X1-X0)*x/b.Lt;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tr(b.n))}" style="width:100%;height:auto;display:block">`;
  const arrH=(x1,x2,y,w)=>{const d=x2>x1?1:-1;return `<line x1="${x1}" y1="${y}" x2="${x2-d*6}" y2="${y}" stroke="var(--ink)" stroke-width="${w}"/><path d="M${x2-d*9},${y-4.5} L${x2},${y} L${x2-d*9},${y+4.5}Z" fill="var(--ink)"/>`;};
  const t=b.ld.t;
  if(t==='udl'||t==='tri'){
    const n=Math.round(b.Lt*9);
    for(let i=0;i<=n;i++){const x=i/n*b.Lt,h=t==='tri'?24*x/b.Lt:24;if(h<3)continue;const X=sx(x);s+=`<line x1="${X}" y1="${yb-4-h}" x2="${X}" y2="${yb-6}" stroke="var(--ink)" stroke-width="1"/><path d="M${X-3},${yb-10} L${X},${yb-4} L${X+3},${yb-10}Z" fill="var(--ink)"/>`;}
    s+=t==='tri'?`<line x1="${sx(0)}" y1="${yb-4}" x2="${sx(b.Lt)}" y2="${yb-28}" stroke="var(--ink)" stroke-width="1.2"/><text x="${sx(b.Lt)-4}" y="${yb-32}" text-anchor="end" class="bt">q</text>`:`<line x1="${sx(0)}" y1="${yb-28}" x2="${sx(b.Lt)}" y2="${yb-28}" stroke="var(--ink)" stroke-width="1.2"/><text x="${(sx(0)+sx(b.Lt))/2}" y="${yb-33}" text-anchor="middle" class="bt">q</text>`;
  }else if(t==='p'){const X=sx(b.ld.x);s+=`<line x1="${X}" y1="${yb-34}" x2="${X}" y2="${yb-6}" stroke="var(--ink)" stroke-width="1.8"/><path d="M${X-4.5},${yb-12} L${X},${yb-3} L${X+4.5},${yb-12}Z" fill="var(--ink)"/><text x="${X+6}" y="${yb-24}" class="bt">P</text>`;
    if(b.ld.lab){s+=`<line x1="${sx(0)}" y1="${yb+26}" x2="${X}" y2="${yb+26}" stroke="var(--ink-2)" stroke-width=".8"/><text x="${(sx(0)+X)/2}" y="${yb+23}" text-anchor="middle" class="bt s">a</text><text x="${(X+sx(1))/2}" y="${yb+23}" text-anchor="middle" class="bt s">b</text><line x1="${X}" y1="${yb+20}" x2="${X}" y2="${yb+30}" stroke="var(--ink-2)" stroke-width=".8"/>`;}}
  else if(t==='axT'){const X=sx(b.Lt);s+=arrH(X+2,X+16>W-2?W-2:X+16,yb,1.8)+`<text x="${X-6}" y="${yb-10}" text-anchor="end" class="bt">F</text>`;}
  else if(t==='axC'){const X=sx(b.Lt);s+=`<line x1="${W-2}" y1="${yb}" x2="${X+8}" y2="${yb}" stroke="var(--ink)" stroke-width="1.8"/><path d="M${X+10},${yb-4.5} L${X+1},${yb} L${X+10},${yb+4.5}Z" fill="var(--ink)"/><text x="${X-6}" y="${yb-10}" text-anchor="end" class="bt">F</text>`;
    if(b.ld.dist){for(let i=1;i<8;i++){const X1=sx(i/8*b.Lt);s+=arrH(X1+12,X1,yb-14,1);}s+=`<text x="${sx(b.Lt/2)}" y="${yb-24}" text-anchor="middle" class="bt">q</text>`;}}
  const X0b=sx(0),X1b=sx(b.Lt);
  s+=`<line x1="${X0b}" y1="${yb}" x2="${X1b}" y2="${yb}" stroke="var(--ink)" stroke-width="3"/>`;
  b.sup.forEach(([x,ty])=>{const X=sx(x);
    if(ty==='pin'||ty==='roll'){s+=`<path d="M${X},${yb+2} L${X-7},${yb+14} L${X+7},${yb+14}Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>`;
      s+=ty==='roll'?`<line x1="${X-10}" y1="${yb+18}" x2="${X+10}" y2="${yb+18}" stroke="var(--ink)" stroke-width="1.3"/>`:`<line x1="${X-10}" y1="${yb+15}" x2="${X+10}" y2="${yb+15}" stroke="var(--ink)" stroke-width="1.3"/>`+[0,1,2,3].map(i=>`<line x1="${X-9+i*6}" y1="${yb+15}" x2="${X-13+i*6}" y2="${yb+20}" stroke="var(--ink)" stroke-width=".8"/>`).join('');}
    else{const d=ty==='fixr'?1:-1;s+=`<line x1="${X}" y1="${yb-16}" x2="${X}" y2="${yb+16}" stroke="var(--ink)" stroke-width="2"/>`+[0,1,2,3,4].map(i=>`<line x1="${X}" y1="${yb-14+i*7}" x2="${X+d*6}" y2="${yb-19+i*7}" stroke="var(--ink)" stroke-width=".9"/>`).join('');}
  });
  const xs=[...Array(N+1)].map((_,i)=>i/N*b.Lt);
  const sty={V:['var(--accent-tint)','var(--accent)','cv',-1],M:['var(--ro-tint)','var(--ro)','cm',1],N:['var(--calc-tint)','var(--calc)','cn',-1]};
  const Y={};
  dg.forEach((d,k)=>{const f=b[d],y0=yc[k],mx=Math.max(...xs.map(x=>Math.abs(f(x))))||1,[fl,st,,sg]=sty[d];
    Y[d]=v=>y0+sg*v/mx*hh;
    let p=`M${X0b},${y0}`;xs.forEach(x=>p+=` L${sx(x).toFixed(1)},${Y[d](f(x)).toFixed(1)}`);p+=` L${X1b},${y0}Z`;
    s+=`<path d="${p}" fill="${fl}" stroke="${st}" stroke-width="1.4" stroke-linejoin="round"/><line x1="${X0b}" y1="${y0}" x2="${X1b}" y2="${y0}" stroke="var(--ink)" stroke-width="1"/><text x="4" y="${y0+4}" class="bt b">${d}</text>`;});
  b.ann.forEach(([d,x,txt])=>{const X=sx(x);const anc=X<X0b+30?'start':X>X1b-30?'end':'middle';const xt=anc==='start'?X+2:anc==='end'?X-2:X;
    const v=b[d](x),yy=Y[d](v),down=yy>=yc[dg.indexOf(d)];const y=down?yy+14:yy-6;
    s+=`<text x="${xt}" y="${y.toFixed(1)}" text-anchor="${anc}" class="bt s ${sty[d][2]}">${esc(txt)}</text>`;});
  return s+'</svg>';
}
function renderBeam(){
  setShell('wide');
  const DEF={q:'10',P:'20',F:'100',l:'6',a:'2',A:'20',E:'210',EI:''};const v=k=>num(store.get('b'+k,DEF[k]));
  const vals={};Object.keys(DEF).forEach(k=>vals[k]=v(k));
  const dv=x=>isFinite(x)?fmtS(x):'';
  let h=`<div class="head plain"><p class="lede" style="margin:0">${T().beamIntro}</p></div>
  <div class="bin">${[['q','q','kN/m'],['P','P','kN'],['F','F','kN'],['l','l','m'],['a','a','m'],['A','A','cm²'],['E','E','GPa'],['EI','EI','kNm²']].map(([k,l,u])=>`<label class="bf"><span>${l}</span><input id="b-${k}" inputmode="decimal" value="${dv(vals[k])}" placeholder="${k==='EI'?T().eiPh:''}"><em>${u}</em></label>`).join('')}</div>`;
  let lastG='';
  h+='<div class="beams">';
  BEAMS.forEach((b,i)=>{
    if(b.g!==lastG){h+=`<h3 class="bgh">${esc(tr(BG[b.g]))}</h3>`;lastG=b.g;}
    h+=`<section class="beam"><h4>${esc(tr(b.n))}</h4><div class="bdia">${beamSvg(b)}</div><div class="bform"><table>${b.f.map(([n,tex,fn,u],j)=>`<tr><td>\\(\\displaystyle ${n.replace('TIP','\\text{'+T().tip+'}').replace('FIELD','\\text{'+T().field+'}').replace('bază','\\text{'+T().base+'}').replace('vârf','\\text{'+T().tip+'}')} = ${tex}\\)</td><td class="bv" data-b="${i}" data-j="${j}"></td></tr>`).join('')}</table>${b.note?`<p class="bnote">${esc(tr(b.note))}</p>`:''}</div></section>`;
  });
  h+=`</div><p class="foot">${T().beamFoot}</p>`;
  $('#main').innerHTML=h;
  const upd=()=>{const g=k=>num($('#b-'+k).value);const q=g('q'),P=g('P'),F=g('F'),l=g('l'),a=g('a'),A=g('A'),E=g('E'),EI=g('EI');
    document.querySelectorAll('.bv').forEach(td=>{const [n,, fn,u]=BEAMS[+td.dataset.b].f[+td.dataset.j];
      const needEI=u==='f'&&!n.includes('Delta')||n.includes('cr');
      let r=(needEI&&!(EI>0))?NaN:fn(q,P,l,a,EI,F,A,E);
      td.textContent=isFinite(r)?(u==='f'?fmtS(r*1000)+' mm':fmtS(r)+' '+u):'';});};
  Object.keys(DEF).forEach(k=>$('#b-'+k).addEventListener('input',e=>{store.set('b'+k,e.target.value);upd();}));
  upd();typeset($('#main'));
}

/* ---------- Views ---------- */
let query='',route='home';
function matches(id){const t=norm(query).split(/\s+/).filter(Boolean);if(!t.length)return true;const s=S(id);return t.every(x=>s.plain.includes(x));}
function snippet(id){const t=norm(query).split(/\s+/).filter(Boolean)[0];if(!t)return'';const raw=S(id).body.replace(/\[\/?i\]/g,'').replace(/\$[^$]*\$/g,'').replace(/[#*|>`]/g,' ').replace(/\s+/g,' ');const i=norm(raw).indexOf(t);if(i<0)return'';const a=Math.max(0,i-35),b=Math.min(raw.length,i+80);return esc((a?'…':'')+raw.slice(a,b)+(b<raw.length?'…':''));}
function go(h){if((location.hash.slice(1)||'home')===h)render();else location.hash=h;$('#reg').classList.remove('open');$('#regToggle').setAttribute('aria-expanded','false');}
const setShell=m=>{$('#shell').className='shell gutter'+(m?' '+m:'');$('#main').className='v-'+view;};
const bindGo=root=>root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));

function renderNav(curCat){
  const searching=!!query.trim();
  let h=`<button class="back" data-go="home">← ${T().cats}</button>`;let any=false;
  DATA.cats.forEach(c=>{const ids=sheetsIn(c.key).filter(matches);
    if(searching?!ids.length:!sheetsIn(c.key).length&&c.key!==curCat)return;any=any||ids.length>0;
    h+=`<div class="navcat${c.key===curCat?' cur':''}"><h3><button data-go="cat-${c.key}"><span class="glyph">${c.icon}</span>${esc(tr(c.name))}</button></h3><ul class="list">`;
    h+=ids.length?ids.map(id=>{const s=S(id);return `<li class="item${route===id?' active':''}"><button type="button" data-go="${id}"><span class="n">${s.num}</span><span class="t">${esc(s.title)}</span>${searching?`<span class="snip">${snippet(id)}</span>`:''}</button></li>`}).join(''):`<li class="empty">${T().nosheets}</li>`;
    h+='</ul></div>';});
  if(searching&&!any)h+=`<p class="empty">${T().none} „${esc(query)}”</p>`;
  $('#regBody').innerHTML=h;bindGo($('#regBody'));
}

function renderHome(){
  setShell('wide');
  const t=query.trim();
  let h=`<div class="head plain"><p class="lede" style="margin:0 0 14px">${T().homeIntro}</p></div>`;
  if(t){
    const ids=ORDER.filter(matches);
    h+=`<div class="tiles">`+(ids.length?ids.map(id=>{const s=S(id),c=catOf(s.cat);return `<button class="tile" data-go="${id}"><span class="ct">${s.num} · ${esc(tr(c.name))}</span><span class="nm">${esc(s.title)}</span><span class="ds">${snippet(id)}</span></button>`}).join(''):`<p class="empty">${T().none} „${esc(query)}”</p>`)+`</div>`;
  }else{
    h+=`<div class="tiles">`+DATA.cats.map(c=>{const n=sheetsIn(c.key).length;return `<button class="tile${n?'':' dim'}" data-go="cat-${c.key}"><span class="ic">${c.icon}</span><span class="nm">${esc(tr(c.name))}</span><span class="ct">${n} ${T().sheets}</span></button>`}).join('')+`</div>`;
  }
  $('#main').innerHTML=h;bindGo($('#main'));
}

function renderCat(k){
  const c=catOf(k);if(!c)return renderHome();
  setShell('nav');
  const ids=sheetsIn(k).filter(matches);
  let h=`<div class="head"><div class="eyebrow"><button data-go="home">${T().cats}</button><span>/</span></div><h2>${c.icon} ${esc(tr(c.name))}</h2></div><p class="catdesc">${esc(tr(c.desc))}</p>`;
  h+=`<div class="tiles">`+(ids.length?ids.map(id=>{const s=S(id);return `<button class="tile" data-go="${id}"><span class="ct">${s.num}</span><span class="nm">${esc(s.title)}</span><span class="ds">${esc(s.sub)}</span></button>`}).join(''):`<p class="empty">${query.trim()?T().none+' „'+esc(query)+'”':T().nosheets}</p>`)+`</div><p class="foot">${T().foot}</p>`;
  $('#main').innerHTML=h;bindGo($('#main'));renderNav(k);
}

function docLink(r){
  if(!r.doc)return esc(r.ro);
  const href=r.doc.file||r.doc.url,tag=r.doc.file?T().pdfIn:(r.doc.src||T().pdfOut);
  return `<a class="doc" href="${esc(href)}" target="_blank" rel="noopener">${esc(r.ro)}<span class="dtag">${esc(tag)} ↗</span></a>`;
}
function renderMap(){
  setShell('wide');
  const t=norm(query).split(/\s+/).filter(Boolean);let rows='';
  DATA.map.forEach(g=>{const c=catOf(g.cat);
    const rs=g.rows.filter(r=>!t.length||t.every(x=>norm(tr(r.el)+' '+r.ro+' '+r.ec+' '+tr(r.note||'')).includes(x)));
    if(!rs.length)return;
    rows+=`<tr class="grp"><td colspan="4">${c?c.icon+' '+esc(tr(c.name)):''}</td></tr>`;
    rows+=rs.map(r=>`<tr><td>${esc(tr(r.el))}${r.note?`<div class="note">${esc(tr(r.note))}</div>`:''}</td><td>${docLink(r)}${r.ver?`<span class="ver" title="${esc(T().verT)}">${T().ver}</span>`:''}</td><td>${esc(r.ec)}</td><td><span class="pill ${r.st}">${esc(T().st[r.st])}</span></td></tr>`).join('');});
  $('#main').innerHTML=`<div class="head plain"><p class="lede" style="margin:0">${T().mapIntro}</p></div>
  <div class="legend"><span class="pill ok">${T().st.ok}</span><span class="pill new">${T().st.new}</span><span class="pill check">${T().st.check}</span><span class="ver" style="margin:0">${T().ver}</span><span>= ${esc(T().verT)}</span></div>
  <div class="tw"><table class="maptable"><thead><tr>${T().cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="4">${T().none} „${esc(query)}”</td></tr>`}</tbody></table></div>
  <p class="foot">${T().mapNote}</p>`;
}

function renderConv(){
  setShell('wide');
  $('#main').innerHTML=`<div class="head plain headrow"><p class="lede" style="margin:0">${T().convIntro}</p><div class="gset"><span>${T().gLabel}</span><div class="seg" role="group"><button type="button" data-g="9.81" aria-pressed="${gval!==10}">9,81</button><button type="button" data-g="10" aria-pressed="${gval===10}">10</button></div></div></div>`;
  $('#main').appendChild(buildConv());
  $('#main').querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>{gval=b.dataset.g==='10'?10:9.81;store.set('g',String(gval));renderConv();}));

function renderSheet(id){
  setShell('');
  const s=S(id),c=catOf(s.cat);
  const body=window.marked?renderMd(s.body):'<p>Markdown parser unavailable.</p>';
  $('#main').innerHTML=`<div class="head"><div class="eyebrow"><span class="num">${s.num}</span><button data-go="cat-${s.cat}">${c?esc(tr(c.name)):''}</button></div><h2>${esc(s.title)}</h2>${s.sub?`<p class="sub">${esc(s.sub)}</p>`:''}</div><article class="prose" id="body">${body}</article>`;
  bindGo($('#main'));
  const hs=[...$('#body').querySelectorAll('h2')];hs.forEach((h,i)=>h.id=id+'-s'+(i+1));
  $('#toc').innerHTML=hs.map(h=>`<li><a href="#${id}" data-t="${h.id}">${esc(h.textContent)}</a></li>`).join('');
  $('#toc').querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.getElementById(a.dataset.t).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}));
  renderNav(s.cat);typeset($('#main'));
}

function render(){
  closePop();
  const h=location.hash.slice(1)||'home';let tab='home';
  if(h==='map'){route='map';tab='map';renderMap();}
  else if(h==='conv'){route='conv';tab='conv';renderConv();}
  else if(h==='beam'){route='beam';tab='beam';renderBeam();}
  else if(h.startsWith('cat-')){route=h;renderCat(h.slice(4));}
  else if(SHEETS[h]){route=h;renderSheet(h);}
  else{route='home';renderHome();}
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  $('#viewSeg').hidden=(tab==='map'||SHEETS[h]!==undefined);
}
function applyUI(){
  document.documentElement.lang=lang;
  $('#brand').textContent=T().brand;$('#q').placeholder=T().search;$('#q').setAttribute('aria-label',T().search);
  $('#regLabel').textContent=T().lapok;$('#tocLabel').textContent=T().onpage;$('#reg').setAttribute('aria-label',T().lapok);
  document.querySelectorAll('.tab').forEach((b,i)=>b.textContent=T().tabs[i]);
  $('#vGrid span').textContent=T().grid;$('#vList span').textContent=T().list;
  $('#vGrid').setAttribute('aria-pressed',String(view==='grid'));$('#vList').setAttribute('aria-pressed',String(view==='list'));
  document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
}
document.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l;store.set('lang',lang);applyUI();const y=window.scrollY;render();window.scrollTo(0,y);}));
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.v;store.set('view',view);applyUI();$('#main').className='v-'+view;}));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
$('#brandBtn').addEventListener('click',()=>go('home'));
$('#q').addEventListener('input',e=>{query=e.target.value;const h=location.hash.slice(1)||'home';if(h==='map')renderMap();else if(h==='home')renderHome();else if(h.startsWith('cat-'))renderCat(h.slice(4));else if(SHEETS[h])renderNav(SHEETS[h].cat);});
$('#regToggle').addEventListener('click',()=>{const r=$('#reg');r.classList.toggle('open');$('#regToggle').setAttribute('aria-expanded',r.classList.contains('open'));});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
applyUI();render();
})();
</script>
