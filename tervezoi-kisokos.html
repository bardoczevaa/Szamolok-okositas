<title>Tervezői kisokos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: title-block header with three tabs; Kisokos tab = category tiles → category page → sheet (register + reading column + contents).
   Deliberately light-only (white paper), per the user's preference. */
:root{
  --paper:#ffffff; --ink:#1b2830; --ink-2:#55646d; --rule:#d6dee3; --tint:#f2f5f7;
  --accent:#0d5876; --accent-tint:#e7f0f5;
  --ro:#8a2f3c; --ro-tint:#f8ecee;
  --calc:#8a5d0c; --calc-tint:#fbf6ea; --calc-rule:#e6d3a8;
  --ok:#2a7344; --ok-tint:#e8f3ec; --warn:#a23b2b; --warn-tint:#f9ebe8; --new:#7a5a00; --new-tint:#fbf3d9;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15.5px;line-height:1.62}
*{box-sizing:border-box}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header + tabs */
.top{border-bottom:2px solid var(--ink);padding-block:14px 0}
.top-in{max-width:1360px;margin:0 auto}
.row1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
.brand{display:flex;align-items:baseline;gap:12px;cursor:pointer;background:none;border:0;padding:0;color:var(--ink);font:inherit}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;margin:0;letter-spacing:.01em}
.tools{display:flex;gap:10px;align-items:center;flex:1 1 360px;justify-content:flex-end;flex-wrap:wrap}
.search{position:relative;flex:1 1 220px;max-width:380px}
.search input{width:100%;font:inherit;font-size:15px;padding:7px 12px 7px 34px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-tint)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--ink-2);stroke-width:2}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{font-family:var(--f-mono);font-size:12.5px;font-weight:500;letter-spacing:.05em;padding:6px 10px;border:0;background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg svg{width:14px;height:14px;fill:currentColor}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.tab{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.01em;padding:8px 16px 9px;border:1px solid transparent;border-bottom:0;border-radius:5px 5px 0 0;background:none;color:var(--ink-2);cursor:pointer;white-space:nowrap;margin-bottom:-2px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--ink);border-bottom:2px solid var(--paper)}

/* Shell */
.shell{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr) 210px;gap:44px;padding-block:26px 64px}
.shell.nav{grid-template-columns:260px minmax(0,1fr)}
.shell.nav .toc{display:none}
.shell.wide{grid-template-columns:minmax(0,1fr)}
.shell.wide .reg,.shell.wide .toc{display:none}
@media (max-width:1180px){.shell{grid-template-columns:240px minmax(0,1fr)}.toc{display:none}}
@media (max-width:820px){.shell,.shell.nav{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px 48px}}

/* Register */
.reg{position:sticky;top:18px;align-self:start;max-height:calc(100vh - 36px);overflow:auto;padding-right:4px}
@media (max-width:820px){.reg{position:static;max-height:none;padding-right:0}}
.reg-toggle{display:none;width:100%;font:inherit;font-weight:600;text-align:left;padding:9px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--tint);color:var(--ink);cursor:pointer}
@media (max-width:820px){.reg-toggle{display:flex;justify-content:space-between}.reg:not(.open) .reg-body{display:none}.reg-body{margin-top:10px}}
.back{display:inline-flex;gap:6px;align-items:center;font:inherit;font-size:14px;font-weight:500;padding:4px 0;border:0;background:none;color:var(--accent);cursor:pointer}
.navcat{margin-top:14px}
.navcat h3{margin:0 0 4px;padding:0 8px;font-family:var(--f-display);font-weight:600;font-size:16px}
.navcat h3 button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center}
.navcat h3 button:hover{color:var(--accent)}
.navcat h3 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.navcat.cur h3 button{color:var(--accent)}
.glyph{font-family:var(--f-mono);width:22px;text-align:center;color:var(--ink-2);flex:none}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.item{border-bottom:1px solid var(--rule)}
.item button{display:grid;grid-template-columns:30px minmax(0,1fr);gap:1px 8px;width:100%;text-align:left;font:inherit;padding:8px;background:none;border:0;color:var(--ink);cursor:pointer}
.item button:hover{background:var(--tint)}
.item.active button{background:var(--accent-tint)}
.item .n{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);padding-top:2px}
.item.active .n{color:var(--accent);font-weight:500}
.item .t{font-weight:500;font-size:14px;line-height:1.35}
.item .snip{grid-column:2;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.empty{padding:10px 8px;color:var(--ink-2);font-size:13.5px}

/* Main */
main{min-width:0}
.head{padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--rule)}
.head.plain{border-bottom:0;margin-bottom:8px}
.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.eyebrow .num{color:var(--paper);background:var(--accent);padding:1px 7px;border-radius:3px;letter-spacing:.02em}
.eyebrow button{all:unset;cursor:pointer}
.eyebrow button:hover{color:var(--accent)}
.head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.08;margin:8px 0 6px;text-wrap:balance}
.head .sub{color:var(--ink-2);font-style:italic;margin:0}
.lede{max-width:720px;color:var(--ink-2);margin:4px 0 0}

/* Home tiles + views */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;padding:18px 18px 16px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink);cursor:pointer;min-width:0;transition:border-color .12s}
.tile:hover{border-color:var(--ink)}
.tile .ic{font-family:var(--f-mono);font-size:22px;color:var(--accent);line-height:1}
.tile .nm{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.15}
.tile .ct{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.tile .ds{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.tile.dim .nm{color:var(--ink-2)}
.v-list .tiles{grid-template-columns:minmax(0,1fr);gap:0;border-top:1px solid var(--rule)}
.v-list .tile{flex-direction:row;align-items:baseline;gap:14px;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:12px 6px}
.v-list .tile:hover{background:var(--tint)}
.v-list .tile .nm{font-size:18px;flex:0 1 auto}
.v-list .tile .ic{font-size:16px;width:24px;text-align:center}
.v-list .tile .ds{flex:1 1 auto;min-width:0}
.v-list .tile .ct{margin-left:auto;white-space:nowrap}
@media (max-width:640px){.v-list .tile{flex-wrap:wrap}.v-list .tile .ds{flex-basis:100%;order:5}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
.catdesc{max-width:760px;color:var(--ink);margin:0 0 18px}
.foot{margin-top:36px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:12px;max-width:820px}

/* Prose */
.prose{max-width:780px}
.prose h2{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.2;margin:36px 0 10px;padding-top:12px;border-top:1px solid var(--ink);text-wrap:balance;scroll-margin-top:16px}
.prose h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:24px 0 8px}
.prose p,.prose ul,.prose ol{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px}
.prose li{margin:4px 0}
.prose hr{border:0;border-top:1px solid var(--rule);margin:28px 0 14px}
.prose blockquote{margin:16px 0;padding:10px 14px;background:var(--accent-tint);border-left:3px solid var(--accent);border-radius:0 4px 4px 0}
.prose blockquote p:last-child{margin-bottom:0}
.tw{overflow-x:auto;margin:12px 0 16px}
.prose table,.maptable{border-collapse:collapse;font-size:14px}
.prose th,.prose td,.maptable th,.maptable td{border:1px solid var(--rule);padding:6px 10px;vertical-align:top;font-variant-numeric:tabular-nums}
.prose th,.maptable th{background:var(--tint);font-weight:600;text-align:left}
.prose code{font-family:var(--f-mono);font-size:12px;letter-spacing:.01em;color:var(--ro);background:var(--ro-tint);padding:2px 6px;border-radius:3px;white-space:nowrap}
.eq{display:block;margin:10px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
mjx-container[display="true"]{margin:0!important}
mjx-container{color:var(--ink)}

/* Info */
.ib{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;margin:0 2px 0 4px;vertical-align:1px;border-radius:50%;border:1.5px solid var(--accent);background:var(--paper);color:var(--accent);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:12.5px;line-height:1;cursor:pointer;padding:0}
.ib:hover,.ib[aria-expanded="true"]{background:var(--accent);color:var(--paper)}
#pop{position:absolute;z-index:50;width:min(360px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--accent);border-radius:5px;box-shadow:0 8px 28px rgba(13,40,55,.18);padding:12px 14px;font-size:14px;line-height:1.55}
#pop .pl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
#pop p{margin:0}

/* Map */
.maptable{width:100%;min-width:660px}
.maptable td:nth-child(2),.maptable td:nth-child(3){font-family:var(--f-mono);font-size:13px}
.maptable td:nth-child(2){color:var(--ro)}
.maptable .grp td{background:var(--paper);border-left:0;border-right:0;padding-top:18px;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink)}
.maptable .note{font-family:var(--f-body);font-size:12.5px;color:var(--ink-2);margin-top:3px}
a.doc{color:var(--ro);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a.doc:hover{color:var(--accent)}
.dtag{display:inline-block;margin-left:6px;font-size:10.5px;letter-spacing:.04em;padding:0 5px;border:1px solid currentColor;border-radius:3px;vertical-align:1px;text-decoration:none}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:1px 7px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.new{background:var(--new-tint);color:var(--new)}
.pill.check{background:var(--warn-tint);color:var(--warn)}
.ver{font-family:var(--f-mono);font-size:10.5px;color:var(--ok);margin-left:6px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-2);margin:0 0 16px;align-items:center}

/* Converters */
.gset{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-2)}
.convs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.conv{border:1px solid var(--calc-rule);background:var(--calc-tint);border-radius:5px;padding:12px 14px 12px;min-width:0}
.conv h3{margin:0 0 2px;font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2}
.conv .cn{margin:0 0 10px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:8px;align-items:center;margin-top:6px}
.crow.c{grid-template-columns:minmax(0,1fr) 104px 52px}
.crow.c label{display:block;font-size:13px;color:var(--ink-2);line-height:1.25}
.crow input{font:inherit;font-family:var(--f-mono);font-size:14px;width:100%;padding:6px 8px;border:1px solid var(--calc-rule);border-radius:3px;background:var(--paper);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.crow input:focus{outline:none;border-color:var(--calc);box-shadow:0 0 0 3px rgba(138,93,12,.15)}
.crow input[readonly]{background:var(--tint);color:var(--calc);font-weight:500}
.crow .u{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.v-list .convs{grid-template-columns:minmax(0,1fr)}
.v-list .conv{display:grid;grid-template-columns:220px minmax(0,1fr);gap:4px 20px}
.v-list .conv .rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 14px}
@media (max-width:640px){.v-list .conv{grid-template-columns:minmax(0,1fr)}}

/* Beams */
.bin{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 14px;margin:0 0 18px;border:1px solid var(--calc-rule);background:var(--calc-tint);border-radius:5px}
@media (min-width:821px){.bin{position:sticky;top:0;z-index:5}}
.bf{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:14px}
.bf span{font-weight:500}
.bf input{font:inherit;width:90px;padding:5px 7px;border:1px solid var(--calc-rule);border-radius:3px;background:var(--paper);color:var(--ink);text-align:right}
.bf input::placeholder{font-size:11px}
.bf em{font-style:normal;font-size:12px;color:var(--ink-2)}
.beams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.bgh{grid-column:1/-1;margin:14px 0 0;font-family:var(--f-display);font-weight:700;font-size:20px;border-bottom:1px solid var(--ink);padding-bottom:4px}
.beam{border:1px solid var(--rule);border-radius:5px;padding:12px 14px;min-width:0}
.beam h4{margin:0 0 6px;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.2}
.bt{font-family:var(--f-mono);font-size:12px;fill:var(--ink)}
.bt.s{font-size:11.5px}.bt.b{font-weight:600;font-size:12px}
.bt.cv{fill:var(--accent)}.bt.cm{fill:var(--ro)}.bt.cn{fill:var(--calc)}
.bform table{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
.bform mjx-container{font-size:118%!important}
.bform td{padding:8px 4px;border-top:1px solid var(--rule);vertical-align:middle}
.bform .bv{text-align:right;font-family:var(--f-mono);font-size:14.5px;color:var(--calc);white-space:nowrap;font-variant-numeric:tabular-nums}
.bnote{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
.v-list .beams{grid-template-columns:minmax(0,1fr)}
.v-list .beam{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:4px 24px}
.v-list .beam h4{grid-column:1/-1}
@media (max-width:700px){.v-list .beam{grid-template-columns:minmax(0,1fr)}}

/* TOC */
.toc{position:sticky;top:18px;align-self:start;font-size:13.5px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.toc ol{list-style:none;margin:8px 0 0;padding:0;border-left:1px solid var(--rule)}
.toc a{display:block;padding:4px 0 4px 12px;color:var(--ink-2);text-decoration:none;line-height:1.35}
.toc a:hover{color:var(--accent)}
</style>

<header class="top gutter">
  <div class="top-in">
    <div class="row1">
      <button class="brand" type="button" id="brandBtn"><h1 id="brand"></h1></button>
      <div class="tools">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <input id="q" type="search" autocomplete="off">
        </div>
        <div class="seg" role="group" id="viewSeg">
          <button type="button" data-v="grid" id="vGrid"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg><span></span></button><button type="button" data-v="list" id="vList"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="2.4"/><rect x="1" y="6.8" width="14" height="2.4"/><rect x="1" y="11.6" width="14" height="2.4"/></svg><span></span></button>
        </div>
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-l="ro">RO</button><button type="button" data-l="hu">HU</button><button type="button" data-l="en">EN</button>
        </div>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="home"></button>
      <button class="tab" role="tab" data-tab="map"></button>
      <button class="tab" role="tab" data-tab="beam"></button>
      <button class="tab" role="tab" data-tab="conv"></button>
    </div>
  </div>
</header>

<div class="shell gutter" id="shell">
  <nav class="reg" id="reg">
    <button class="reg-toggle" id="regToggle" type="button" aria-expanded="false"><span id="regLabel"></span><span aria-hidden="true">▾</span></button>
    <div class="reg-body" id="regBody"></div>
  </nav>
  <main id="main"></main>
  <aside class="toc" id="tocWrap"><div class="label" id="tocLabel"></div><ol id="toc"></ol></aside>

<script type="text/markdown" data-id="kombinaciok" data-num="01" data-cat="loads" data-calc="ccomb" data-lang="hu">
title: Teherkombinációk
sub: CR 0-2012 és SR EN 1990 + NA szerint
---
**Mikor kell?** Minden méretezés elején: melyik hatás milyen szorzóval és milyen kísérő értékkel szerepel egy kombinációban.

## 1. A hatások osztályai

| Jel | Hatás | Példa |
|---|---|---|
| G | állandó | önsúly, burkolatok, rögzített válaszfalak |
| Q | esetleges | hasznos teher, hó, szél, hőmérséklet |
| A | rendkívüli | robbanás, ütközés, tűz |
| A_E | szeizmikus | földrengés (Romániában a P100-1 adja) |

`CR 0-2012, 4. fejezet` · `SR EN 1990, 4.1.1`

## 2. Román előírás – teherbírási határállapot (ULS), alapkombináció

$$E_d = \sum_j \gamma_{G,j}\,G_{k,j} \;+\; \gamma_{Q,1}\,Q_{k,1} \;+\; \sum_{i>1} \gamma_{Q,i}\,\psi_{0,i}\,Q_{k,i}$$

- γG = **1,35** ha kedvezőtlen, **1,00** ha kedvező [i]Pl. borulás- vagy felúszás-vizsgálatnál az önsúly kedvező, ott 1,00-val szerepel. Statikai egyensúlynál (EQU) külön szorzók vannak.[/i]
- γQ = **1,5** ha kedvezőtlen, **0** ha kedvező
- Q_k,1 a **vezető** esetleges hatás [i]Minden esetleges hatást sorra vezetőnek kell venni (hó vezet, majd szél vezet stb.), és a legkedvezőtlenebb eredményt kell megtartani. A többi hatás ψ0-val csökkentve kíséri.[/i]

`CR 0-2012, 6.4.3`

## 3. Román előírás – szeizmikus kombináció

$$E_d = \sum_j G_{k,j} \;+\; \gamma_{I,e}\,A_{E,k} \;+\; \sum_i \psi_{2,i}\,Q_{k,i}$$

- γI,e a létesítmény fontossági-kitettségi tényezője (P100-1 4.2. táblázat: I. osztály 1,4 · II. 1,2 · III. 1,0 · IV. 0,8)
- A_E,k a szeizmikus hatás karakterisztikus értéke [i]A P100-1 tervezési spektrumából (Sd) számolt erők. A γI,e szorzót vagy itt, vagy már a spektrumban kell figyelembe venni – kétszer nem.[/i]
- ψ2 a kvázi-állandó érték szorzója – **hóra Romániában ψ2 = 0,4** [i]Román sajátosság (CR 0-2012). Az SR EN 1990 ajánlott értéke 1000 m alatti helyszínen hóra ψ2 = 0. A szeizmikus tömeg számításánál ez jelentős különbség lehet lapostetős csarnokoknál.[/i]

`CR 0-2012, 6.4.3` · `P100-1/2013, 3.3`

## 4. Használhatósági határállapot (SLS)

| Kombináció | Képlet | Mire |
|---|---|---|
| karakterisztikus | $\sum G_k + Q_{k,1} + \sum \psi_{0,i} Q_{k,i}$ | irreverzibilis hatások, repedéstágasság egyes esetekben |
| gyakori | $\sum G_k + \psi_{1,1} Q_{k,1} + \sum \psi_{2,i} Q_{k,i}$ | reverzibilis hatások, rezgés |
| kvázi-állandó | $\sum G_k + \sum \psi_{2,i} Q_{k,i}$ | hosszú távú lehajlás, kúszás, süllyedés |

## 5. ψ tényezők

| Hatás | ψ0 | ψ1 | ψ2 |
|---|---|---|---|
| A – lakó | 0,7 | 0,5 | 0,3 |
| B – iroda | 0,7 | 0,5 | 0,3 |
| C – gyülekezés | 0,7 | 0,7 | 0,6 |
| D – kereskedelem | 0,7 | 0,7 | 0,6 |
| E – raktár | 1,0 | 0,9 | 0,8 |
| H – tető (nem járható) | 0,7 | 0 | 0 |
| Hó (CR 0) | 0,7 | 0,5 | 0,4 |
| Szél | 0,7 | 0,2 | 0 |
| Hőmérséklet | 0,6 | 0,5 | 0 |

> **Ellenőrizendő:** a CR 0-2012 szövege nincs a projektben, a táblázat a szokásos értékeket mutatja. Szélre az SR EN 1990 ajánlott ψ0 értéke 0,6, hóra (≤ 1000 m) 0,5 / 0,2 / 0. Töltsd fel a CR 0-t, és pontosítom a 7.1 táblázat alapján.

`CR 0-2012, 7.1 táblázat` · `SR EN 1990, A1.1 táblázat`

## 6. Eurocode út

- ULS: SR EN 1990 (6.10), vagy a kedvezőbb (6.10a) / (6.10b) pár – a nemzeti melléklet dönti el, melyik használható [i](6.10a): 1,35·G + 1,5·ψ0·Q1 + 1,5·ψ0·Qi; (6.10b): ξ·1,35·G + 1,5·Q1 + 1,5·ψ0·Qi, ajánlott ξ = 0,85. A kettő közül a kedvezőtlenebb mértékadó.[/i]
- Szeizmikus: (6.12b): ΣG + A_Ed + Σψ2·Q, ahol A_Ed = γI·A_Ek
- SLS: (6.14b), (6.15b), (6.16b)

> A második generációs EN 1990:2023 már megjelent; Romániában átmenetileg az első generációs SR EN 1990 + NA az alkalmazott.

---
*Források: CR 0-2012 Cod de proiectare. Bazele proiectării construcțiilor; SR EN 1990:2004 + NA; P100-1/2013 3.3, 4.4.5.*

<script type="text/markdown" data-id="kombinaciok" data-num="01" data-cat="loads" data-calc="ccomb" data-lang="ro">
title: Combinații de încărcări
sub: Conform CR 0-2012 și SR EN 1990 + NA
---
**Când e nevoie?** La începutul oricărui calcul: cu ce coeficient și cu ce valoare de însoțire intră fiecare acțiune într-o combinație.

## 1. Clasificarea acțiunilor

| Simbol | Acțiune | Exemplu |
|---|---|---|
| G | permanentă | greutate proprie, finisaje, pereți despărțitori ficși |
| Q | variabilă | încărcare utilă, zăpadă, vânt, temperatură |
| A | accidentală | explozie, impact, incendiu |
| A_E | seismică | cutremur (în România conform P100-1) |

`CR 0-2012, cap. 4` · `SR EN 1990, 4.1.1`

## 2. Reglementarea românească – SLU, combinația fundamentală

$$E_d = \sum_j \gamma_{G,j}\,G_{k,j} \;+\; \gamma_{Q,1}\,Q_{k,1} \;+\; \sum_{i>1} \gamma_{Q,i}\,\psi_{0,i}\,Q_{k,i}$$

- γG = **1,35** când este defavorabilă, **1,00** când este favorabilă [i]De ex. la verificarea la răsturnare sau la subpresiune greutatea proprie este favorabilă și intră cu 1,00. Pentru echilibru static (EQU) există coeficienți separați.[/i]
- γQ = **1,5** când este defavorabilă, **0** când este favorabilă
- Q_k,1 este acțiunea variabilă **dominantă** [i]Fiecare acțiune variabilă se consideră pe rând dominantă (zăpada, apoi vântul etc.) și se reține rezultatul cel mai defavorabil. Celelalte o însoțesc reduse cu ψ0.[/i]

`CR 0-2012, 6.4.3`

## 3. Reglementarea românească – combinația seismică

$$E_d = \sum_j G_{k,j} \;+\; \gamma_{I,e}\,A_{E,k} \;+\; \sum_i \psi_{2,i}\,Q_{k,i}$$

- γI,e factorul de importanță-expunere (P100-1 tabelul 4.2: clasa I 1,4 · II 1,2 · III 1,0 · IV 0,8)
- A_E,k valoarea caracteristică a acțiunii seismice [i]Forțele obținute din spectrul de proiectare Sd din P100-1. Factorul γI,e se aplică fie aici, fie direct în spectru – niciodată de două ori.[/i]
- ψ2 coeficientul valorii cvasipermanente – **pentru zăpadă în România ψ2 = 0,4** [i]Specific CR 0-2012. Valoarea recomandată în SR EN 1990 pentru amplasamente sub 1000 m este ψ2 = 0. La halele cu acoperiș plat diferența în masa seismică poate fi importantă.[/i]

`CR 0-2012, 6.4.3` · `P100-1/2013, 3.3`

## 4. Starea limită de serviciu (SLS)

| Combinație | Expresie | Utilizare |
|---|---|---|
| caracteristică | $\sum G_k + Q_{k,1} + \sum \psi_{0,i} Q_{k,i}$ | efecte ireversibile |
| frecventă | $\sum G_k + \psi_{1,1} Q_{k,1} + \sum \psi_{2,i} Q_{k,i}$ | efecte reversibile, vibrații |
| cvasipermanentă | $\sum G_k + \sum \psi_{2,i} Q_{k,i}$ | săgeți de lungă durată, curgere lentă, tasări |

## 5. Coeficienții ψ

| Acțiune | ψ0 | ψ1 | ψ2 |
|---|---|---|---|
| A – locuințe | 0,7 | 0,5 | 0,3 |
| B – birouri | 0,7 | 0,5 | 0,3 |
| C – aglomerări | 0,7 | 0,7 | 0,6 |
| D – comerț | 0,7 | 0,7 | 0,6 |
| E – depozitare | 1,0 | 0,9 | 0,8 |
| H – acoperiș necirculabil | 0,7 | 0 | 0 |
| Zăpadă (CR 0) | 0,7 | 0,5 | 0,4 |
| Vânt | 0,7 | 0,2 | 0 |
| Temperatură | 0,6 | 0,5 | 0 |

> **De verificat:** textul CR 0-2012 nu este în proiect; tabelul redă valorile uzuale. Pentru vânt SR EN 1990 recomandă ψ0 = 0,6, pentru zăpadă (≤ 1000 m) 0,5 / 0,2 / 0. Încarcă CR 0 și completez exact după tabelul 7.1.

`CR 0-2012, tabelul 7.1` · `SR EN 1990, tabelul A1.1`

## 6. Varianta Eurocode

- SLU: SR EN 1990 (6.10) sau perechea (6.10a) / (6.10b) – anexa națională stabilește ce se poate folosi [i](6.10a): 1,35·G + 1,5·ψ0·Q1 + 1,5·ψ0·Qi; (6.10b): ξ·1,35·G + 1,5·Q1 + 1,5·ψ0·Qi, cu ξ = 0,85 recomandat. Se reține cea mai defavorabilă.[/i]
- Seismic: (6.12b): ΣG + A_Ed + Σψ2·Q, cu A_Ed = γI·A_Ek
- SLS: (6.14b), (6.15b), (6.16b)

> EN 1990:2023 (generația a doua) a apărut; în România se aplică deocamdată SR EN 1990 + NA (generația întâi).

*Surse: CR 0-2012 Cod de proiectare. Bazele proiectării construcțiilor; SR EN 1990:2004 + NA; P100-1/2013 3.3, 4.4.5.*

<script type="text/markdown" data-id="kombinaciok" data-num="01" data-cat="loads" data-calc="ccomb" data-lang="en">
title: Load combinations
sub: Per CR 0-2012 and SR EN 1990 + NA
---
**When?** At the start of every design: which factor and which accompanying value each action takes in a combination.

## 1. Classes of actions

| Symbol | Action | Example |
|---|---|---|
| G | permanent | self-weight, finishes, fixed partitions |
| Q | variable | imposed load, snow, wind, temperature |
| A | accidental | explosion, impact, fire |
| A_E | seismic | earthquake (in Romania per P100-1) |

`CR 0-2012, ch. 4` · `SR EN 1990, 4.1.1`

## 2. Romanian code – ULS, fundamental combination

$$E_d = \sum_j \gamma_{G,j}\,G_{k,j} \;+\; \gamma_{Q,1}\,Q_{k,1} \;+\; \sum_{i>1} \gamma_{Q,i}\,\psi_{0,i}\,Q_{k,i}$$

- γG = **1.35** unfavourable, **1.00** favourable [i]E.g. in overturning or uplift checks self-weight is favourable and enters with 1.00. Static equilibrium (EQU) has its own factors.[/i]
- γQ = **1.5** unfavourable, **0** favourable
- Q_k,1 is the **leading** variable action [i]Take each variable action as leading in turn (snow, then wind, etc.) and keep the worst result. The others accompany it, reduced by ψ0.[/i]

`CR 0-2012, 6.4.3`

## 3. Romanian code – seismic combination

$$E_d = \sum_j G_{k,j} \;+\; \gamma_{I,e}\,A_{E,k} \;+\; \sum_i \psi_{2,i}\,Q_{k,i}$$

- γI,e importance-exposure factor (P100-1 Table 4.2: class I 1.4 · II 1.2 · III 1.0 · IV 0.8)
- A_E,k characteristic seismic action [i]Forces from the P100-1 design spectrum Sd. Apply γI,e either here or in the spectrum – never twice.[/i]
- ψ2 quasi-permanent factor – **for snow in Romania ψ2 = 0.4** [i]A CR 0-2012 specific. SR EN 1990 recommends ψ2 = 0 for snow below 1000 m altitude. For flat-roof halls this changes the seismic mass noticeably.[/i]

`CR 0-2012, 6.4.3` · `P100-1/2013, 3.3`

## 4. Serviceability (SLS)

| Combination | Expression | Use |
|---|---|---|
| characteristic | $\sum G_k + Q_{k,1} + \sum \psi_{0,i} Q_{k,i}$ | irreversible effects |
| frequent | $\sum G_k + \psi_{1,1} Q_{k,1} + \sum \psi_{2,i} Q_{k,i}$ | reversible effects, vibration |
| quasi-permanent | $\sum G_k + \sum \psi_{2,i} Q_{k,i}$ | long-term deflection, creep, settlement |

## 5. ψ factors

| Action | ψ0 | ψ1 | ψ2 |
|---|---|---|---|
| A – residential | 0.7 | 0.5 | 0.3 |
| B – office | 0.7 | 0.5 | 0.3 |
| C – congregation | 0.7 | 0.7 | 0.6 |
| D – shopping | 0.7 | 0.7 | 0.6 |
| E – storage | 1.0 | 0.9 | 0.8 |
| H – roof (not accessible) | 0.7 | 0 | 0 |
| Snow (CR 0) | 0.7 | 0.5 | 0.4 |
| Wind | 0.7 | 0.2 | 0 |
| Temperature | 0.6 | 0.5 | 0 |

> **To verify:** the CR 0-2012 text is not in the project; the table shows the usual values. SR EN 1990 recommends ψ0 = 0.6 for wind and 0.5 / 0.2 / 0 for snow (≤ 1000 m). Upload CR 0 and I will match it to Table 7.1.

`CR 0-2012, Table 7.1` · `SR EN 1990, Table A1.1`

## 6. Eurocode route

- ULS: SR EN 1990 (6.10), or the pair (6.10a) / (6.10b) – the National Annex decides [i](6.10a): 1.35·G + 1.5·ψ0·Q1 + 1.5·ψ0·Qi; (6.10b): ξ·1.35·G + 1.5·Q1 + 1.5·ψ0·Qi, ξ = 0.85 recommended. The less favourable governs.[/i]
- Seismic: (6.12b): ΣG + A_Ed + Σψ2·Q, with A_Ed = γI·A_Ek
- SLS: (6.14b), (6.15b), (6.16b)

> The second-generation EN 1990:2023 is published; Romania still applies the first-generation SR EN 1990 + NA for now.

---
*Sources: CR 0-2012 Design code. Basis of structural design; SR EN 1990:2004 + NA; P100-1/2013 3.3, 4.4.5.*
</script>
<script type="text/markdown" data-id="hoteher" data-num="02" data-cat="loads" data-calc="csnow" data-lang="hu">
title: Hóteher tetőn
sub: CR 1-1-3/2012 és SR EN 1991-1-3 + NA szerint
---
**Mikor kell?** Minden tetőnél; lapos és kis hajlású csarnoktetőknél gyakran ez a mértékadó esetleges teher.

## 1. Román előírás – CR 1-1-3/2012

$$s = \gamma_{Is}\;\mu_i\;C_e\;C_t\;s_{0,k}$$

- **s0,k** a talajszinti hóteher karakterisztikus értéke, IMR = 50 év, a térképről [kN/m²] [i]Romániában tipikusan 1,5–2,5 kN/m², hegyvidéken több. 1000 m felett a kódex külön képletet ad.[/i]
- **γIs** fontossági-kitettségi tényező: I. osztály 1,15 · II. 1,10 · III. és IV. 1,00
- **μi** tetőalak-tényező: nyeregtető és lapostető 0° ≤ α ≤ 30°: 0,8 · 30° < α < 60°: 0,8·(60 − α)/30 · α ≥ 60°: 0
- **Ce** kitettségi tényező: teljes kitettség 0,8 · részleges 1,0 · csökkent (védett) 1,2 [i]Teljes: sík, akadály nélküli terep, ahol a szél lefújja a havat. Csökkent: a környező épületek, fák védik a tetőt.[/i]
- **Ct** hőtényező: általában 1,0 [i]Kisebb érték csak jól hővezető (pl. üveg) tetőnél, külön igazolással.[/i]

További esetek: hózsákok tetőszintváltásnál és attika mellett, hóvisszatartó, tetőperem-túlnyúlás – a kódex 5. és 6. fejezete. [i]Hózsákoknál a lokális μ akár 2–3 is lehet – könnyű acélcsarnokoknál ez gyakori tönkremeneteli ok.[/i]

> **Ellenőrizendő:** a CR 1-1-3 szövege nincs a projektben; a tényezők a szokásos értékek. Töltsd fel, és pontosítom a táblázatokkal.

## 2. Eurocode út – SR EN 1991-1-3

$$s = \mu_i\;C_e\;C_t\;s_k \qquad (5.1)$$

- Nincs külön γ fontossági tényező; s_k és C_e értékét a nemzeti melléklet adja `SR EN 1991-1-3, 5.2`
- A második generációs EN 1991-1-3:2025 megjelent, de még nem lépett a román gyakorlatba.

## 3. Kombinációban

ψ0 = 0,7 · ψ1 = 0,5 · ψ2 = **0,4** (CR 0) – a hó a szeizmikus tömegben is szerepel. Lásd a teherkombinációk lapot.

<script type="text/markdown" data-id="hoteher" data-num="02" data-cat="loads" data-calc="csnow" data-lang="ro">

## 1. Reglementarea românească – CR 1-1-3/2012

$$s = \gamma_{Is}\;\mu_i\;C_e\;C_t\;s_{0,k}$$

- **s0,k** valoarea caracteristică a încărcării din zăpadă pe sol, IMR = 50 ani, din hartă [kN/m²] [i]În România uzual 1,5–2,5 kN/m², mai mult în zona montană. Peste 1000 m codul dă o relație separată.[/i]

- **Ce** coeficientul de expunere: expunere completă 0,8 · parțială 1,0 · redusă 1,2 [i]Completă: teren deschis, fără obstacole, vântul spulberă zăpada. Redusă: acoperișul este adăpostit de clădiri sau arbori din jur.[/i]
- **Ct** coeficientul termic: de regulă 1,0 [i]Valori mai mici numai la acoperișuri cu transmisie termică mare (de ex. sticlă), justificat separat.[/i]

<script type="text/markdown" data-id="hoteher" data-num="02" data-cat="loads" data-calc="csnow" data-lang="en">
title: Snow load on roofs
sub: Per CR 1-1-3/2012 and SR EN 1991-1-3 + NA
---
**When?** Every roof; for flat and low-pitch hall roofs it is often the governing variable load.

## 1. Romanian code – CR 1-1-3/2012

$$s = \gamma_{Is}\;\mu_i\;C_e\;C_t\;s_{0,k}$$

- **s0,k** characteristic ground snow load, MRI = 50 years, from the map [kN/m²] [i]Typically 1.5–2.5 kN/m² in Romania, more in mountain areas. Above 1000 m the code gives a separate expression.[/i]
- **γIs** importance-exposure factor: class I 1.15 · II 1.10 · III and IV 1.00
- **μi** shape coefficient: duopitch and flat 0° ≤ α ≤ 30°: 0.8 · 30° < α < 60°: 0.8·(60 − α)/30 · α ≥ 60°: 0
- **Ce** exposure coefficient: full 0.8 · partial 1.0 · reduced (sheltered) 1.2 [i]Full: open flat terrain, wind clears the snow. Reduced: roof sheltered by surrounding buildings or trees.[/i]
- **Ct** thermal coefficient: normally 1.0 [i]Lower only for roofs with high heat transmission (e.g. glass), justified separately.[/i]

Further cases: drifts at roof steps and parapets, snow guards, overhangs – chapters 5 and 6 of the code. [i]Local μ in drifts can reach 2–3 – a frequent failure cause in light steel halls.[/i]

> **To verify:** the CR 1-1-3 text is not in the project; the factors are the usual values. Upload it and I will match the tables.

## 2. Eurocode route – SR EN 1991-1-3

$$s = \mu_i\;C_e\;C_t\;s_k \qquad (5.1)$$

- No separate importance factor; s_k and C_e per the National Annex `SR EN 1991-1-3, 5.2`
- The second-generation EN 1991-1-3:2025 is published but not yet in Romanian practice.

## 3. In combinations

ψ0 = 0.7 · ψ1 = 0.5 · ψ2 = **0.4** (CR 0) – snow also enters the seismic mass. See the load combinations sheet.

<script type="text/markdown" data-id="szelteher" data-num="03" data-cat="loads" data-calc="cwind" data-lang="hu">
title: Szélteher
sub: CR 1-1-4/2012 és SR EN 1991-1-4 + NA szerint
---
**Mikor kell?** Csarnokok, magas és karcsú szerkezetek, tetőburkolatok és rögzítéseik, homlokzatok.

## 1. Román előírás – CR 1-1-4/2012

Felületi nyomás (külső és belső):

$$w_e = \gamma_{Iw}\;c_{pe}\;q_p(z_e) \qquad w_i = \gamma_{Iw}\;c_{pi}\;q_p(z_i)$$

Szerkezetre ható szélerő:

$$F_w = \gamma_{Iw}\;c_s c_d\;c_f\;q_p(z_e)\;A_{ref}$$

- **q_b** a szél referencia-torlónyomása, IMR = 50 év, a térképről [kPa]; $q_b = \tfrac{1}{2}\rho\,v_b^2$, ρ = 1,25 kg/m³ [i]Romániában tipikusan 0,4–0,7 kPa; a Bărăgan és a Dobrudzsa a legszelesebb.[/i]
- **q_p(z) = c_e(z) · q_b** – csúcs-torlónyomás z magasságban; c_e(z) a terepkategóriától függő kitettségi tényező
- **γIw** fontossági-kitettségi tényező: I. 1,15 · II. 1,10 · III. és IV. 1,00
- **c_pe, c_pi** nyomási tényezők (falzónák A–E, tetőzónák F–I); c_pe,10 nagy felületekre, c_pe,1 rögzítésekre (≤ 1 m²) [i]Belső nyomásra, ha a nyílások nem dominánsak, a kedvezőtlenebb c_pi = +0,2 vagy −0,3 veendő.[/i]

> **Ellenőrizendő:** a CR 1-1-4 szövege nincs a projektben; a tényezők a szokásos értékek.

## 2. A csúcs-torlónyomás képlete (EN 1991-1-4, ajánlott összefüggések)

$$q_p(z) = \left[1 + 7\,I_v(z)\right]\cdot\tfrac{1}{2}\,\rho\,v_m^2(z) \qquad v_m(z) = c_r(z)\,c_o(z)\,v_b$$

$$c_r(z) = k_r \ln\frac{z}{z_0} \qquad k_r = 0{,}19\left(\frac{z_0}{0{,}05}\right)^{0{,}07} \qquad I_v(z) = \frac{1}{c_o \ln(z/z_0)}$$

| Terepkategória | z0 [m] | zmin [m] |
|---|---|---|
| 0 – tenger, part | 0,003 | 1 |
| I – tó, akadálytalan sík | 0,01 | 1 |
| II – alacsony növényzet, elszórt akadályok | 0,05 | 2 |
| III – falvak, külváros, erdő | 0,3 | 5 |
| IV – város, ≥ 15%-ban 15 m feletti beépítés | 1,0 | 10 |

`SR EN 1991-1-4, 4.1 táblázat, (4.3)–(4.8)` – z < zmin esetén z = zmin. [i]A CR 1-1-4 ugyanezt az öt terepkategóriát és lényegében azonos profilt használ; a c_e(z) értékeit a kódex táblázatosan is megadja.[/i]

## 3. Eurocode út

$$w_e = q_p(z_e)\,c_{pe} \qquad F_w = c_s c_d\,c_f\,q_p(z_e)\,A_{ref}$$

Nincs γIw – a fontosságot a nemzeti melléklet kezeli (pl. a valószínűségi tényezővel). `SR EN 1991-1-4, 5.2–5.3`

<script type="text/markdown" data-id="szelteher" data-num="03" data-cat="loads" data-calc="cwind" data-lang="en">
title: Wind action
sub: Per CR 1-1-4/2012 and SR EN 1991-1-4 + NA
---
**When?** Halls, tall and slender structures, roof cladding and fixings, façades.

## 1. Romanian code – CR 1-1-4/2012

Surface pressure (external and internal):

$$w_e = \gamma_{Iw}\;c_{pe}\;q_p(z_e) \qquad w_i = \gamma_{Iw}\;c_{pi}\;q_p(z_i)$$

Wind force on the structure:

$$F_w = \gamma_{Iw}\;c_s c_d\;c_f\;q_p(z_e)\;A_{ref}$$

- **q_b** reference wind pressure, MRI = 50 years, from the map [kPa]; $q_b = \tfrac{1}{2}\rho\,v_b^2$, ρ = 1.25 kg/m³ [i]Typically 0.4–0.7 kPa in Romania; Bărăgan and Dobruja are the windiest.[/i]

## 2. Peak velocity pressure (EN 1991-1-4 recommended expressions)

$$q_p(z) = \left[1 + 7\,I_v(z)\right]\cdot\tfrac{1}{2}\,\rho\,v_m^2(z) \qquad v_m(z) = c_r(z)\,c_o(z)\,v_b$$

$$c_r(z) = k_r \ln\frac{z}{z_0} \qquad k_r = 0.19\left(\frac{z_0}{0.05}\right)^{0.07} \qquad I_v(z) = \frac{1}{c_o \ln(z/z_0)}$$

| Terrain category | z0 [m] | zmin [m] |
|---|---|---|
| 0 – sea, coast | 0.003 | 1 |
| I – lakes, flat open land | 0.01 | 1 |
| II – low vegetation, isolated obstacles | 0.05 | 2 |
| III – villages, suburbs, forest | 0.3 | 5 |
| IV – urban, ≥ 15% buildings over 15 m | 1.0 | 10 |

`SR EN 1991-1-4, Table 4.1, (4.3)–(4.8)` – for z < zmin use z = zmin. [i]CR 1-1-4 uses the same five categories and essentially the same profile; it also tabulates c_e(z).[/i]

## 3. Eurocode route

$$w_e = q_p(z_e)\,c_{pe} \qquad F_w = c_s c_d\,c_f\,q_p(z_e)\,A_{ref}$$

No γIw – importance is handled by the National Annex (e.g. the probability factor). `SR EN 1991-1-4, 5.2–5.3`

---
*Sources: CR 1-1-4/2012 Design code. Wind action on structures; SR EN 1991-1-4 + NA.*
</script>
<script type="text/markdown" data-id="alapnyiroero" data-num="04" data-cat="seismic" data-calc="cfb" data-lang="hu">
title: Szeizmikus alapnyíróerő – helyettesítő erők módszere
sub: P100-1/2013 szerint, összevetve az SR EN 1998-1-gyel
---
**Mikor kell?** Szabályos épületek kézi ellenőrzéséhez, a modális számítás nagyságrendi kontrolljához, és előtervezéshez.

> Romániában épületekre a **P100-1/2013** a kötelező szeizmikus tervezési előírás. A P100-1/2025 tervezetét bejelentették (TRIS 2024/0706/RO), de a hatálybalépését mindig ellenőrizni kell.

## 1. A helyszín adatai

- **ag** – a talaj tervezési csúcsgyorsulása, IMR = 225 év (20% túllépési valószínűség 50 év alatt) `P100-1/2013, 3.1 ábra` [i]A térképről vagy az A.1 táblázatból, településenként. Tipikus értékek: 0,10g … 0,40g (Vrancea-közeli zónák a legnagyobbak).[/i]
- **TC** – a spektrum sarokperiódusa: 0,7 s · 1,0 s · 1,6 s `P100-1/2013, 3.2 ábra` [i]A TC zónázás a helyi talajviszonyokat és a rengésforrás frekvenciatartalmát együtt írja le – ezért nincs külön S talajtényező, mint az EC8-ban.[/i]

| TC [s] | TB [s] | TD [s] |
|---|---|---|
| 0,70 | 0,14 | 3,00 |
| 1,00 | 0,20 | 3,00 |
| 1,60 | 0,32 | 2,00 |

`P100-1/2013, 3.1 táblázat`

## 2. Normalizált rugalmas spektrum β(T)

β0 = 2,5 (5% csillapítás)

$$\beta(T) = 1 + \frac{\beta_0 - 1}{T_B}\,T \qquad 0 \le T \le T_B$$

$$\beta(T) = \beta_0 \qquad T_B < T \le T_C$$

$$\beta(T) = \beta_0\,\frac{T_C}{T} \qquad T_C < T \le T_D$$

$$\beta(T) = \beta_0\,\frac{T_C\,T_D}{T^2} \qquad T_D < T \le 5\text{ s}$$

`P100-1/2013, (3.3)–(3.6)` · rugalmas spektrum: $S_e(T) = a_g\,\beta(T)$ `(3.2)`

## 3. Tervezési spektrum Sd(T)

$$S_d(T) = a_g\left[1 + \frac{\beta_0/q - 1}{T_B}\,T\right] \qquad 0 < T \le T_B$$

$$S_d(T) = a_g\,\frac{\beta(T)}{q} \qquad T > T_B$$

- **q** a viselkedési tényező [i]Anyag és szerkezeti rendszer szerint, a P100-1 anyagspecifikus fejezeteiből (5. beton, 6. acél, 7. öszvér, 8. falazat, 9. fa). Pl. többszintes, több mezős vasbeton keret, DCH: q = 5·αu/α1 = 5·1,35 = 6,75. Vasbeton falas szerkezetekre a CR 2-1-1.1/2022 is ad előírásokat.[/i]

`P100-1/2013, (3.17)–(3.18)`

## 4. Alapnyíróerő

$$F_b = \gamma_{I,e}\; S_d(T_1)\; m\; \lambda$$

- **γI,e** fontossági-kitettségi tényező: I. 1,4 · II. 1,2 · III. 1,0 · IV. 0,8 `P100-1/2013, 4.2 táblázat`
- **m** az épület teljes tömege a szeizmikus kombináció gravitációs terheiből [i]m = Σ(Gk + ψ2·Qk)/g – itt jelenik meg a hóra vonatkozó ψ2 = 0,4 (CR 0).[/i]
- **λ** = 0,85, ha T1 ≤ TC és az épület 2 szintnél magasabb; minden más esetben 1,0 [i]A korrekció az alapmódus effektív modális tömegét veszi figyelembe – többszintes épületeknél az első módus nem a teljes tömeget mozgatja.[/i]
- Szeizmikus együttható: $c = \gamma_{I,e}\,S_d(T_1)\,\lambda / g$, így $F_b = c \cdot G$

`P100-1/2013, 4.5.3.2.2`

## 5. Az alapperiódus becslése

$$T_1 = C_t\,H^{3/4}$$

C_t = 0,085 (acél nyomatékbíró keret) · 0,075 (vasbeton keret, külpontos merevítésű acél) · 0,050 (minden más) — H [m] az épület magassága, legfeljebb kb. 40 m-ig [i]Közelítő képlet, előtervezéshez. A végleges T1 a modális számításból jön. Az SR EN 1998-1 (4.6) ugyanezt a képletet adja.[/i]

## 6. Az erő szétosztása a szinteken

$$F_i = F_b\,\frac{m_i\,s_i}{\sum_j m_j\,s_j} \;\approx\; F_b\,\frac{m_i\,z_i}{\sum_j m_j\,z_j}$$

ahol s_i az alapmódus elmozdulása az i. szinten; lineáris közelítésnél a szint magassága, z_i. `P100-1/2013, 4.5.3.2.3`

## 7. Eurocode út (SR EN 1998-1)

- Spektrum: $S_d(T) = a_g\,S\,\frac{2{,}5}{q}$ a platón, ahol $a_g = \gamma_I\,a_{gR}$ és S a talajtényező (A–E talajosztály) `SR EN 1998-1, 3.2.2.5`
- Alsó korlát: $S_d(T) \ge \beta\,a_g$, ajánlott β = 0,2
- Alapnyíróerő: $F_b = S_d(T_1)\,m\,\lambda$ `(4.5)` – a γI már az ag-ban van
- **Különbség:** a P100-1 a talajt a TC zónával kezeli (nincs S), és a γI,e-t az erőnél alkalmazza.

---
*Források: P100-1/2013 3.1, 3.2, 4.4.5, 4.5.3.2 és a kommentárok E5 példája; SR EN 1998-1:2004 + NA.*
</script>
<script type="text/markdown" data-id="alapnyiroero" data-num="04" data-cat="seismic" data-calc="cfb" data-lang="ro">
title: Forța tăietoare de bază – metoda forțelor laterale
sub: Conform P100-1/2013, comparativ cu SR EN 1998-1
---
**Când e nevoie?** Pentru verificarea manuală a structurilor regulate, controlul ordinului de mărime al calculului modal și predimensionare.

> În România, pentru clădiri, **P100-1/2013** este codul seismic obligatoriu. Proiectul P100-1/2025 a fost notificat (TRIS 2024/0706/RO); intrarea lui în vigoare trebuie verificată de fiecare dată.

## 1. Datele amplasamentului

- **ag** – accelerația de vârf a terenului pentru proiectare, IMR = 225 ani (20% probabilitate de depășire în 50 de ani) `P100-1/2013, Figura 3.1` [i]Din hartă sau din tabelul A.1, pe localități. Valori uzuale: 0,10g … 0,40g (zonele apropiate de Vrancea au cele mai mari valori).[/i]
- **TC** – perioada de control (colț): 0,7 s · 1,0 s · 1,6 s `P100-1/2013, Figura 3.2` [i]Zonarea TC descrie împreună condițiile locale de teren și conținutul de frecvențe al sursei – de aceea nu există factorul de teren S ca în EC8.[/i]

| TC [s] | TB [s] | TD [s] |
|---|---|---|
| 0,70 | 0,14 | 3,00 |
| 1,00 | 0,20 | 3,00 |
| 1,60 | 0,32 | 2,00 |

`P100-1/2013, tabelul 3.1`

## 2. Spectrul normalizat de răspuns elastic β(T)

β0 = 2,5 (amortizare 5%)

$$\beta(T) = 1 + \frac{\beta_0 - 1}{T_B}\,T \qquad 0 \le T \le T_B$$

$$\beta(T) = \beta_0 \qquad T_B < T \le T_C$$

$$\beta(T) = \beta_0\,\frac{T_C}{T} \qquad T_C < T \le T_D$$

$$\beta(T) = \beta_0\,\frac{T_C\,T_D}{T^2} \qquad T_D < T \le 5\text{ s}$$

`P100-1/2013, (3.3)–(3.6)` · spectrul elastic: $S_e(T) = a_g\,\beta(T)$ `(3.2)`

## 3. Spectrul de proiectare Sd(T)

$$S_d(T) = a_g\left[1 + \frac{\beta_0/q - 1}{T_B}\,T\right] \qquad 0 < T \le T_B$$

$$S_d(T) = a_g\,\frac{\beta(T)}{q} \qquad T > T_B$$

- **q** factorul de comportare [i]După material și sistem structural, din capitolele P100-1 (5 beton, 6 oțel, 7 compozit, 8 zidărie, 9 lemn). De ex. cadre BA cu mai multe niveluri și deschideri, DCH: q = 5·αu/α1 = 5·1,35 = 6,75. Pentru structuri cu pereți BA se aplică și CR 2-1-1.1/2022.[/i]

`P100-1/2013, (3.17)–(3.18)`

## 4. Forța tăietoare de bază

$$F_b = \gamma_{I,e}\; S_d(T_1)\; m\; \lambda$$

- **γI,e** factorul de importanță-expunere: I 1,4 · II 1,2 · III 1,0 · IV 0,8 `P100-1/2013, tabelul 4.2`
- **m** masa totală a clădirii din încărcările gravitaționale ale combinației seismice [i]m = Σ(Gk + ψ2·Qk)/g – aici intervine ψ2 = 0,4 pentru zăpadă (CR 0).[/i]
- **λ** = 0,85 dacă T1 ≤ TC și clădirea are mai mult de 2 niveluri; altfel 1,0 [i]Corecția ține seama de masa modală efectivă a modului fundamental – la clădiri cu mai multe niveluri primul mod nu antrenează întreaga masă.[/i]
- Coeficientul seismic: $c = \gamma_{I,e}\,S_d(T_1)\,\lambda / g$, deci $F_b = c \cdot G$

`P100-1/2013, 4.5.3.2.2`

## 5. Estimarea perioadei fundamentale

$$T_1 = C_t\,H^{3/4}$$

C_t = 0,085 (cadre metalice necontravântuite) · 0,075 (cadre BA, contravântuiri excentrice) · 0,050 (toate celelalte) — H [m] înălțimea clădirii, până la aprox. 40 m [i]Formulă aproximativă, pentru predimensionare. T1 final rezultă din calculul modal. SR EN 1998-1 (4.6) dă aceeași relație.[/i]

## 6. Distribuția pe niveluri

$$F_i = F_b\,\frac{m_i\,s_i}{\sum_j m_j\,s_j} \;\approx\; F_b\,\frac{m_i\,z_i}{\sum_j m_j\,z_j}$$

unde s_i este deplasarea în modul fundamental la nivelul i; aproximând liniar, cota nivelului z_i. `P100-1/2013, 4.5.3.2.3`

## 7. Varianta Eurocode (SR EN 1998-1)

- Spectru: $S_d(T) = a_g\,S\,\frac{2{,}5}{q}$ pe palier, cu $a_g = \gamma_I\,a_{gR}$ și S factorul de teren (clase A–E) `SR EN 1998-1, 3.2.2.5`
- Limita inferioară: $S_d(T) \ge \beta\,a_g$, β = 0,2 recomandat
- Forța tăietoare de bază: $F_b = S_d(T_1)\,m\,\lambda$ `(4.5)` – γI este deja inclus în ag
- **Diferența:** P100-1 tratează terenul prin zona TC (fără S) și aplică γI,e la forță.

---
*Surse: P100-1/2013 3.1, 3.2, 4.4.5, 4.5.3.2 și exemplul E5 din comentarii; SR EN 1998-1:2004 + NA.*
</script>
<script type="text/markdown" data-id="alapnyiroero" data-num="04" data-cat="seismic" data-calc="cfb" data-lang="en">
title: Seismic base shear – lateral force method
sub: Per P100-1/2013, compared with SR EN 1998-1
---
**When?** Hand checks of regular buildings, sanity check of the modal analysis, preliminary design.

> In Romania **P100-1/2013** is the mandatory seismic code for buildings. The P100-1/2025 draft was notified (TRIS 2024/0706/RO); always check whether it has entered into force.

## 1. Site data

- **ag** – design peak ground acceleration, MRI = 225 years (20% probability of exceedance in 50 years) `P100-1/2013, Figure 3.1` [i]From the map or Table A.1 by locality. Typical values 0.10g … 0.40g (zones near Vrancea are highest).[/i]
- **TC** – corner period: 0.7 s · 1.0 s · 1.6 s `P100-1/2013, Figure 3.2` [i]The TC zoning covers local ground conditions and the source frequency content together – so there is no soil factor S as in EC8.[/i]

| TC [s] | TB [s] | TD [s] |
|---|---|---|
| 0.70 | 0.14 | 3.00 |
| 1.00 | 0.20 | 3.00 |
| 1.60 | 0.32 | 2.00 |

`P100-1/2013, Table 3.1`

## 2. Normalised elastic spectrum β(T)

β0 = 2.5 (5% damping)

$$\beta(T) = 1 + \frac{\beta_0 - 1}{T_B}\,T \qquad 0 \le T \le T_B$$

$$\beta(T) = \beta_0 \qquad T_B < T \le T_C$$

$$\beta(T) = \beta_0\,\frac{T_C}{T} \qquad T_C < T \le T_D$$

$$\beta(T) = \beta_0\,\frac{T_C\,T_D}{T^2} \qquad T_D < T \le 5\text{ s}$$

`P100-1/2013, (3.3)–(3.6)` · elastic spectrum: $S_e(T) = a_g\,\beta(T)$ `(3.2)`

## 3. Design spectrum Sd(T)

$$S_d(T) = a_g\left[1 + \frac{\beta_0/q - 1}{T_B}\,T\right] \qquad 0 < T \le T_B$$

$$S_d(T) = a_g\,\frac{\beta(T)}{q} \qquad T > T_B$$

- **q** behaviour factor [i]By material and structural system, from the P100-1 material chapters (5 concrete, 6 steel, 7 composite, 8 masonry, 9 timber). E.g. multi-storey multi-bay RC frame, DCH: q = 5·αu/α1 = 5·1.35 = 6.75. RC wall structures also follow CR 2-1-1.1/2022.[/i]

`P100-1/2013, (3.17)–(3.18)`

## 4. Base shear

$$F_b = \gamma_{I,e}\; S_d(T_1)\; m\; \lambda$$

- **γI,e** importance-exposure factor: I 1.4 · II 1.2 · III 1.0 · IV 0.8 `P100-1/2013, Table 4.2`
- **m** total mass from the gravity loads of the seismic combination [i]m = Σ(Gk + ψ2·Qk)/g – this is where ψ2 = 0.4 for snow (CR 0) enters.[/i]
- **λ** = 0.85 if T1 ≤ TC and the building has more than 2 storeys; otherwise 1.0 [i]Accounts for the effective modal mass of the fundamental mode – in multi-storey buildings the first mode does not mobilise the full mass.[/i]
- Seismic coefficient: $c = \gamma_{I,e}\,S_d(T_1)\,\lambda / g$, so $F_b = c \cdot G$

`P100-1/2013, 4.5.3.2.2`

## 5. Estimating the fundamental period

$$T_1 = C_t\,H^{3/4}$$

C_t = 0.085 (steel moment frames) · 0.075 (RC frames, eccentrically braced steel) · 0.050 (all others) — H [m] building height, up to about 40 m [i]Approximate, for preliminary design. The final T1 comes from the modal analysis. SR EN 1998-1 (4.6) gives the same expression.[/i]

## 6. Distribution over storeys

$$F_i = F_b\,\frac{m_i\,s_i}{\sum_j m_j\,s_j} \;\approx\; F_b\,\frac{m_i\,z_i}{\sum_j m_j\,z_j}$$

where s_i is the fundamental-mode displacement of storey i; with a linear shape, the storey height z_i. `P100-1/2013, 4.5.3.2.3`

## 7. Eurocode route (SR EN 1998-1)

- Spectrum: $S_d(T) = a_g\,S\,\frac{2.5}{q}$ on the plateau, with $a_g = \gamma_I\,a_{gR}$ and S the soil factor (ground types A–E) `SR EN 1998-1, 3.2.2.5`
- Lower bound: $S_d(T) \ge \beta\,a_g$, β = 0.2 recommended
- Base shear: $F_b = S_d(T_1)\,m\,\lambda$ `(4.5)` – γI is already in ag
- **Difference:** P100-1 handles the ground through the TC zone (no S) and applies γI,e to the force.

---
*Sources: P100-1/2013 3.1, 3.2, 4.4.5, 4.5.3.2 and commentary example E5; SR EN 1998-1:2004 + NA.*
</script>
<script type="text/markdown" data-id="gepek-szeizmikus-ero" data-num="05" data-cat="seismic" data-calc="ccns,cfa" data-lang="hu">
title: Gépekre és berendezésekre ható szeizmikus erő
sub: P100-1/2013 10. fejezet (CNS) és SR EN 1998-1 4.3.5 szerint
---
**Mikor kell?** Gépalapok, tartályok, csővezeték-tartók, tetőn álló berendezések horgonyzásához és az alaplemez ellenőrzéséhez.

## 1. Alapelv

A gépet **nem szerkezeti elemként** kezeljük (románul CNS – *componentă nestructurală*): a vízszintes erőt kézzel számítjuk, és a gép **súlypontjában** működtetjük. Így a borítónyomaték is helyesen jelenik meg, ami a horgonyokra és az alaplemezre mértékadó. [i]Egy modális számítás a gép tömegét általában a lemez síkjában venné fel, és a borítónyomaték kimaradna.[/i]

Az itt számított erő **csak** a gépre, a rögzítésére és a közvetlen alátámasztásra vonatkozik; nem adódik hozzá a teljes épület szeizmikus erejéhez. `P100-1/2013, 10.3.1 (3)`

## 2. Román előírás – P100-1/2013, 10.3.1.2

$$F_{CNS}(z) = \frac{\gamma_{CNS}\;a_g\;\beta_{CNS}\;K_z}{q_{CNS}}\;m_{CNS} \qquad (10.1)$$

$$K_z = 1 + 2\,\frac{z}{H}$$

- **ag** a talaj tervezési gyorsulása [m/s²], **m_CNS** a gép legnagyobb üzemi tömege [t] → az erő kN-ban [i]Üzemi tömeg = önsúly + töltet. Tartálynál a tele állapot.[/i]
- **z** a rögzítési pont magassága az épület alapja felett, **H** az épület átlagos tetőmagassága [i]Talajon, önálló alaplemezen álló gépnél z = 0, tehát K_z = 1. Tetőn álló gépnél z = H, K_z = 3.[/i]
- **γ_CNS** fontossági tényező: **1,5** mérgező vagy robbanásveszélyes anyagot tartalmazó tartályokra, létfontosságú berendezésekre; egyébként az épület γI,e-je [i]P100-1/2013 10.3.1.3.1. A (2) bekezdés a PDF-ben rosszul olvasható – a pontos megfogalmazást ellenőrizd a szabványban.[/i]
- **β_CNS** dinamikus erősítési tényező és **q_CNS** viselkedési tényező: táblázatból (lásd lent)

Korlátok:

$$0{,}75\;\gamma_{CNS}\,a_g\,m_{CNS} \;\le\; F_{CNS} \;\le\; 4\;\gamma_{CNS}\,a_g\,m_{CNS} \qquad (10.2)$$

Függőleges erő ugyanígy, a függőleges gyorsulással (a_vg, (3.16)). `P100-1/2013, 10.3.1.2 (5)`

| Berendezés (P100-1 10.1–10.2 táblázat, részlet) | β_CNS | q_CNS |
|---|---|---|
| Kazánok, bojlerek; köpenyen álló vagy szabadon álló nyomástartó edények | 1,0 | 2,5 |
| Elektromos berendezések | 1,0 | 2,5 |
| HVAC, rezgésszigetelés nélkül | 1,0 | 2,5 |
| HVAC, neoprén rezgésszigeteléssel | 2,5 | 2,5 |
| HVAC, rugós rezgésszigeteléssel | 2,5 | 2,0 |
| Kültéri berendezések | 2,5 | 6,0 |
| Konzolos kémény, szellőzőcső (súlypont alatt rögzítve) | 2,5 | 1,5 |
| Liftek, mozgólépcsők | 1,0 | 2,5 |

> **Talajon álló merev gépnél** (z = 0, β = 1, q = 2,5) a (10.1) értéke 0,4·γ·ag·m, ami kisebb az alsó korlátnál – **a mértékadó erő 0,75·γ·ag·m**.

Az erő a gép súlypontjában, a legkedvezőtlenebb irányban hat. `P100-1/2013, 10.3.1.2 (6)`

## 3. Eurocode út – SR EN 1998-1, 4.3.5

$$F_a = \frac{S_a\;W_a\;\gamma_a}{q_a} \qquad (4.24)$$

$$S_a = \alpha\,S\left[\frac{3\,(1 + z/H)}{1 + (1 - T_a/T_1)^2} - 0{,}5\right] \ge \alpha\,S \qquad (4.25)$$

- α = ag/g, S talajtényező (A–E) [i]1. típusú spektrum: A 1,00 · B 1,20 · C 1,15 · D 1,35 · E 1,40.[/i]
- **Talajon, önálló alapon álló gép:** z = 0, nincs felerősítő T1, ezért $S_a = \alpha\,S$
- **Hajlékony gép** (ha a gyártó megadja a T_a-t): $S_a = \max\{\alpha S;\; S_e(T_a)/g\}$ [i]Mérnöki kiterjesztés: a gép egytömegű lengőként a rugalmas spektrum szerint gyorsul. Rezonanciánál (Ta = T1, z = 0) a (4.25) is 2,5·α·S-t ad, ami a spektrum platója – a kettő összhangban van.[/i]
- γa ≥ 1,5 mérgező/robbanásveszélyes tartályokra, egyébként 1,0; qa = 1,0 konzolos (több mint fele merevítetlen), 2,0 egyébként `4.3.5.3, 4.4 táblázat`

## 4. Súlypont és borítónyomaték

$$h_g = h_0 + \eta\,(H_g - h_0) \qquad M = F \cdot h_g$$

H_g a gép teljes magassága, h_0 a láb- vagy alátétmagasság, η a súlypont relatív helyzete (egyenletes tömegeloszlásnál 0,5). [i]Ha a gyártó megadja a valós súlypontot, azt kell használni.[/i]

## 5. Terhek átadása az alaplemezre

**Lábakon álló gép** (n láb):

$$V_{láb} = \frac{F}{n} \qquad \Delta N = \frac{4M}{n\,D_c}\;\text{(kör)} \qquad \Delta N = \frac{2M}{n\,a}\;\text{(téglalap)}$$

Ha $W/n - \Delta N < 0$, a lábat horgonyozni kell.

**Felületen fekvő gép** (doboz, skid; b a rengés irányában, d rá merőlegesen):

$$p_x = \frac{F}{A_{felf}} \qquad p_{z,max} = \pm\frac{6M}{b^2 d} \qquad q_{két\,fél} = \pm\frac{4M}{b^2 d}$$

Felemelkedés nincs, ha $W/A_{felf} - p_{z,max} \ge 0$.

## 6. Alaplemez a talajon

$$F_{alap} = \alpha S\,W_{alap} \;\text{(EC)} \quad\text{vagy}\quad 0{,}75\,\gamma\,a_g\,m_{alap}\;\text{(a P100-1 logikája szerint)}$$

$$e = \frac{F\,(t + h_g) + F_{alap}\,t/2}{W + W_{alap}} \qquad \sigma_{max,min} = \frac{N}{BL}\left(1 \pm \frac{6e}{B}\right)\;(e \le B/6)$$

Csúszás: $F + F_{alap} \le N\,\tan\delta$ – helyszíni betonnál δ = φ_cv `SR EN 1997-1, 6.5.3` · külpontosság: `6.5.4` · román talajtörési ellenőrzés: `NP 112-2014`

## 7. Példa (P12, DAF egység, W = 63 kN, talajon, 1,90 × 3,00 × 2,70 m)

| | P100-1 (ag = 0,15g = 1,47 m/s²) | EC8 (agR = 1,47 m/s², D talaj, S = 1,35) |
|---|---|---|
| tömeg | m = 63 / 9,81 = 6,42 t | W = 63 kN |
| tényezők | γ = 1,0 · β = 1,0 · q = 2,5 · Kz = 1 | γa = 1,0 · qa = 1,0 |
| (10.1) / Sa | 0,4·ag·m = 3,77 kN | Sa = 0,1498·1,35 = 0,2023 |
| mértékadó F | max(3,77; 0,75·1,47·6,42 = **7,08 kN**) | **12,74 kN** |
| M (hg = 1,35 m) | 9,56 kNm | 17,21 kNm |

> A két út eltérése főleg az S talajtényezőből és a q-ból adódik. Romániában épülő létesítménynél a P100-1 a kötelező; az EC8-as érték a biztonság javára tér el.

**Bevitel végeselemes programba:** egy „Földrengés” tehercsoport EX és EY esettel; kombinációk: G + ψ2Q + EX ± 0,30·EY és 0,30·EX ± EY, mindkét előjellel (8 kombináció). A talajrugót csak nyomottra kell állítani. [i]Ha modális számítás is fut a modellen, a gép erejét ne vedd fel kétszer.[/i]

---
*Források: P100-1/2013 10.3.1–10.3.1.3, 10.1–10.2 táblázat; SR EN 1998-1 4.3.5; SR EN 1997-1 6.5.3, 6.5.4; SR EN 1990 (6.12b).*
</script>
<script type="text/markdown" data-id="gepek-szeizmikus-ero" data-num="05" data-cat="seismic" data-calc="ccns,cfa" data-lang="ro">
title: Forța seismică pe utilaje și echipamente
sub: Conform P100-1/2013 cap. 10 (CNS) și SR EN 1998-1 4.3.5
---
**Când e nevoie?** La ancorarea utilajelor, rezervoarelor, suporturilor de conducte, echipamentelor pe acoperiș și la verificarea plăcii de fundare.

## 1. Principiu

Utilajul se tratează ca **componentă nestructurală (CNS)**: forța orizontală se calculează manual și se aplică în **centrul de greutate** al utilajului. Astfel momentul de răsturnare apare corect, iar acesta dimensionează ancorajele și placa. [i]Un calcul modal ar considera de regulă masa utilajului în planul plăcii, iar momentul de răsturnare s-ar pierde.[/i]

Forța calculată aici se folosește **numai** pentru CNS, prinderile ei și verificarea locală a reazemului; nu se adună cu forța seismică a întregii structuri. `P100-1/2013, 10.3.1 (3)`

## 2. Reglementarea românească – P100-1/2013, 10.3.1.2

$$F_{CNS}(z) = \frac{\gamma_{CNS}\;a_g\;\beta_{CNS}\;K_z}{q_{CNS}}\;m_{CNS} \qquad (10.1)$$

$$K_z = 1 + 2\,\frac{z}{H}$$

- **ag** accelerația terenului pentru proiectare [m/s²], **m_CNS** masa maximă a CNS în exploatare [t] → forța în kN [i]Masa în exploatare = greutate proprie + conținut. La rezervoare, starea plină.[/i]
- **z** cota punctului de prindere față de baza construcției, **H** înălțimea medie a acoperișului [i]Utilaj pe placă proprie, pe teren: z = 0, deci K_z = 1. Utilaj pe acoperiș: z = H, K_z = 3.[/i]
- **γ_CNS** factorul de importanță: **1,5** pentru recipienți cu substanțe toxice sau explozive, CNS esențiale; altfel γI,e al clădirii [i]P100-1/2013 10.3.1.3.1. Alineatul (2) este greu lizibil în PDF – verifică formularea exactă în cod.[/i]
- **β_CNS** factorul de amplificare dinamică și **q_CNS** factorul de comportare: din tabele (vezi mai jos)

Limite:

$$0{,}75\;\gamma_{CNS}\,a_g\,m_{CNS} \;\le\; F_{CNS} \;\le\; 4\;\gamma_{CNS}\,a_g\,m_{CNS} \qquad (10.2)$$

Forța verticală se calculează la fel, cu accelerația verticală (a_vg, (3.16)). `P100-1/2013, 10.3.1.2 (5)`

| Echipament (P100-1 tabelele 10.1–10.2, extras) | β_CNS | q_CNS |
|---|---|---|
| Boilere, cazane; vase de presiune rezemate pe manta sau așezate liber | 1,0 | 2,5 |
| Echipamente electrice | 1,0 | 2,5 |
| HVAC neizolate împotriva vibrațiilor | 1,0 | 2,5 |
| HVAC izolate cu neopren | 2,5 | 2,5 |
| HVAC izolate cu arcuri | 2,5 | 2,0 |
| Echipamente montate în exterior | 2,5 | 6,0 |
| Coșuri, canale de ventilație în consolă (ancorate sub centrul de greutate) | 2,5 | 1,5 |
| Ascensoare, scări rulante | 1,0 | 2,5 |

> **Utilaj rigid pe teren** (z = 0, β = 1, q = 2,5): relația (10.1) dă 0,4·γ·ag·m, sub limita inferioară – **forța de calcul este 0,75·γ·ag·m**.

Forța acționează în centrul de greutate, pe direcția cea mai defavorabilă. `P100-1/2013, 10.3.1.2 (6)`

## 3. Varianta Eurocode – SR EN 1998-1, 4.3.5

$$F_a = \frac{S_a\;W_a\;\gamma_a}{q_a} \qquad (4.24)$$

$$S_a = \alpha\,S\left[\frac{3\,(1 + z/H)}{1 + (1 - T_a/T_1)^2} - 0{,}5\right] \ge \alpha\,S \qquad (4.25)$$

- α = ag/g, S factorul de teren (A–E) [i]Spectru tip 1: A 1,00 · B 1,20 · C 1,15 · D 1,35 · E 1,40.[/i]
- **Utilaj pe teren, pe fundație proprie:** z = 0, fără T1 care să amplifice, deci $S_a = \alpha\,S$
- **Utilaj flexibil** (dacă producătorul dă T_a): $S_a = \max\{\alpha S;\; S_e(T_a)/g\}$ [i]Extensie inginerească: utilajul se comportă ca oscilator cu un grad de libertate. La rezonanță (Ta = T1, z = 0) și (4.25) dă 2,5·α·S, adică palierul spectrului – cele două sunt coerente.[/i]
- γa ≥ 1,5 pentru rezervoare cu substanțe toxice/explozive, altfel 1,0; qa = 1,0 consolă (peste jumătate necontravântuită), 2,0 în rest `4.3.5.3, tabelul 4.4`

## 4. Centrul de greutate și momentul de răsturnare

$$h_g = h_0 + \eta\,(H_g - h_0) \qquad M = F \cdot h_g$$

H_g înălțimea totală a utilajului, h_0 înălțimea picioarelor/suportului, η poziția relativă a centrului de greutate (0,5 pentru masă uniformă). [i]Dacă producătorul dă centrul de greutate real, se folosește acela.[/i]

## 5. Transmiterea încărcărilor la placă

**Utilaj pe picioare** (n picioare):

$$V_{picior} = \frac{F}{n} \qquad \Delta N = \frac{4M}{n\,D_c}\;\text{(cerc)} \qquad \Delta N = \frac{2M}{n\,a}\;\text{(dreptunghi)}$$

Dacă $W/n - \Delta N < 0$, piciorul trebuie ancorat.

**Utilaj rezemat pe suprafață** (cutie, skid; b pe direcția seismului, d perpendicular):

$$p_x = \frac{F}{A_{rez}} \qquad p_{z,max} = \pm\frac{6M}{b^2 d} \qquad q_{două\,jumătăți} = \pm\frac{4M}{b^2 d}$$

Nu apare desprindere dacă $W/A_{rez} - p_{z,max} \ge 0$.

## 6. Placa de fundare pe teren

$$F_{fund} = \alpha S\,W_{fund} \;\text{(EC)} \quad\text{sau}\quad 0{,}75\,\gamma\,a_g\,m_{fund}\;\text{(după logica P100-1)}$$

$$e = \frac{F\,(t + h_g) + F_{fund}\,t/2}{W + W_{fund}} \qquad \sigma_{max,min} = \frac{N}{BL}\left(1 \pm \frac{6e}{B}\right)\;(e \le B/6)$$

Lunecare: $F + F_{fund} \le N\,\tan\delta$ – la beton turnat pe loc δ = φ_cv `SR EN 1997-1, 6.5.3` · excentricitate: `6.5.4` · verificarea terenului: `NP 112-2014`

## 7. Exemplu (P12, unitate DAF, W = 63 kN, pe teren, 1,90 × 3,00 × 2,70 m)

| | P100-1 (ag = 0,15g = 1,47 m/s²) | EC8 (agR = 1,47 m/s², teren D, S = 1,35) |
|---|---|---|
| masa | m = 63 / 9,81 = 6,42 t | W = 63 kN |
| factori | γ = 1,0 · β = 1,0 · q = 2,5 · Kz = 1 | γa = 1,0 · qa = 1,0 |
| (10.1) / Sa | 0,4·ag·m = 3,77 kN | Sa = 0,1498·1,35 = 0,2023 |
| F de calcul | max(3,77; 0,75·1,47·6,42 = **7,08 kN**) | **12,74 kN** |
| M (hg = 1,35 m) | 9,56 kNm | 17,21 kNm |

> Diferența vine mai ales din factorul de teren S și din q. Pentru o investiție în România P100-1 este obligatoriu; valoarea EC8 este acoperitoare.

**Introducere în programul de calcul:** un grup de încărcări „Seism" cu ipotezele EX și EY; combinații: G + ψ2Q + EX ± 0,30·EY și 0,30·EX ± EY, cu ambele semne (8 combinații). Resortul terenului se setează doar la compresiune. [i]Dacă pe model rulează și calcul modal, nu introduce forța utilajului de două ori.[/i]

---
*Surse: P100-1/2013 10.3.1–10.3.1.3, tabelele 10.1–10.2; SR EN 1998-1 4.3.5; SR EN 1997-1 6.5.3, 6.5.4; SR EN 1990 (6.12b).*
</script>
<script type="text/markdown" data-id="gepek-szeizmikus-ero" data-num="05" data-cat="seismic" data-calc="ccns,cfa" data-lang="en">
title: Seismic force on machinery and equipment
sub: Per P100-1/2013 ch. 10 (NSC) and SR EN 1998-1 4.3.5
---
**When?** Anchoring machines, tanks, pipe supports, roof-mounted equipment, and checking the equipment slab.

## 1. Principle

The machine is treated as a **non-structural component** (Romanian CNS): the horizontal force is computed by hand and applied at the machine's **centre of gravity**. That way the overturning moment appears correctly, and it governs the anchors and the slab. [i]A modal analysis would usually place the machine's mass in the slab plane and lose the overturning moment.[/i]

The force computed here is used **only** for the component, its fastenings and the local check of its support; it is not added to the seismic force of the whole structure. `P100-1/2013, 10.3.1 (3)`

## 2. Romanian code – P100-1/2013, 10.3.1.2

$$F_{CNS}(z) = \frac{\gamma_{CNS}\;a_g\;\beta_{CNS}\;K_z}{q_{CNS}}\;m_{CNS} \qquad (10.1)$$

$$K_z = 1 + 2\,\frac{z}{H}$$

- **ag** design ground acceleration [m/s²], **m_CNS** maximum operating mass [t] → force in kN [i]Operating mass = self-weight + contents. For tanks, the full state.[/i]
- **z** height of the attachment above the building base, **H** average roof height [i]Machine on its own slab on the ground: z = 0, so K_z = 1. Machine on the roof: z = H, K_z = 3.[/i]
- **γ_CNS** importance factor: **1.5** for vessels with toxic or explosive contents and essential components; otherwise the building's γI,e [i]P100-1/2013 10.3.1.3.1. Paragraph (2) is poorly legible in the PDF – check the exact wording in the code.[/i]
- **β_CNS** dynamic amplification factor and **q_CNS** behaviour factor: from the tables (below)

Bounds:

$$0.75\;\gamma_{CNS}\,a_g\,m_{CNS} \;\le\; F_{CNS} \;\le\; 4\;\gamma_{CNS}\,a_g\,m_{CNS} \qquad (10.2)$$

The vertical force is computed the same way with the vertical acceleration (a_vg, (3.16)). `P100-1/2013, 10.3.1.2 (5)`

| Equipment (P100-1 Tables 10.1–10.2, extract) | β_CNS | q_CNS |
|---|---|---|
| Boilers; pressure vessels on skirts or free-standing | 1.0 | 2.5 |
| Electrical equipment | 1.0 | 2.5 |
| HVAC, not vibration-isolated | 1.0 | 2.5 |
| HVAC, neoprene isolators | 2.5 | 2.5 |
| HVAC, spring isolators | 2.5 | 2.0 |
| Outdoor equipment | 2.5 | 6.0 |
| Cantilever chimneys, vent stacks (anchored below CG) | 2.5 | 1.5 |
| Lifts, escalators | 1.0 | 2.5 |

> **Rigid machine on the ground** (z = 0, β = 1, q = 2.5): (10.1) gives 0.4·γ·ag·m, below the lower bound – **the design force is 0.75·γ·ag·m**.

The force acts at the centre of gravity, in the most unfavourable direction. `P100-1/2013, 10.3.1.2 (6)`

## 3. Eurocode route – SR EN 1998-1, 4.3.5

$$F_a = \frac{S_a\;W_a\;\gamma_a}{q_a} \qquad (4.24)$$

$$S_a = \alpha\,S\left[\frac{3\,(1 + z/H)}{1 + (1 - T_a/T_1)^2} - 0.5\right] \ge \alpha\,S \qquad (4.25)$$

- α = ag/g, S soil factor (A–E) [i]Type 1 spectrum: A 1.00 · B 1.20 · C 1.15 · D 1.35 · E 1.40.[/i]
- **Machine on the ground, on its own foundation:** z = 0, no amplifying T1, so $S_a = \alpha\,S$
- **Flexible machine** (if the manufacturer gives T_a): $S_a = \max\{\alpha S;\; S_e(T_a)/g\}$ [i]Engineering extension: the machine responds as a single-degree-of-freedom oscillator. At resonance (Ta = T1, z = 0) (4.25) also gives 2.5·α·S, the spectrum plateau – the two agree.[/i]
- γa ≥ 1.5 for tanks with toxic/explosive contents, otherwise 1.0; qa = 1.0 cantilever (more than half unbraced), 2.0 otherwise `4.3.5.3, Table 4.4`

## 4. Centre of gravity and overturning moment

$$h_g = h_0 + \eta\,(H_g - h_0) \qquad M = F \cdot h_g$$

H_g total machine height, h_0 leg or pedestal height, η relative CG position (0.5 for uniform mass). [i]Use the manufacturer's real CG when available.[/i]

## 5. Load transfer to the slab

**Machine on legs** (n legs):

$$V_{leg} = \frac{F}{n} \qquad \Delta N = \frac{4M}{n\,D_c}\;\text{(circle)} \qquad \Delta N = \frac{2M}{n\,a}\;\text{(rectangle)}$$

If $W/n - \Delta N < 0$, the leg must be anchored.

**Machine bearing on an area** (box, skid; b along the earthquake, d across):

$$p_x = \frac{F}{A_{bear}} \qquad p_{z,max} = \pm\frac{6M}{b^2 d} \qquad q_{two\,halves} = \pm\frac{4M}{b^2 d}$$

No uplift if $W/A_{bear} - p_{z,max} \ge 0$.

## 6. Slab on the ground

$$F_{slab} = \alpha S\,W_{slab} \;\text{(EC)} \quad\text{or}\quad 0.75\,\gamma\,a_g\,m_{slab}\;\text{(P100-1 logic)}$$

$$e = \frac{F\,(t + h_g) + F_{slab}\,t/2}{W + W_{slab}} \qquad \sigma_{max,min} = \frac{N}{BL}\left(1 \pm \frac{6e}{B}\right)\;(e \le B/6)$$

Sliding: $F + F_{slab} \le N\,\tan\delta$ – cast-in-place concrete δ = φ_cv `SR EN 1997-1, 6.5.3` · eccentricity: `6.5.4` · Romanian bearing check: `NP 112-2014`

## 7. Example (P12, DAF unit, W = 63 kN, on the ground, 1.90 × 3.00 × 2.70 m)

| | P100-1 (ag = 0.15g = 1.47 m/s²) | EC8 (agR = 1.47 m/s², ground D, S = 1.35) |
|---|---|---|
| mass | m = 63 / 9.81 = 6.42 t | W = 63 kN |
| factors | γ = 1.0 · β = 1.0 · q = 2.5 · Kz = 1 | γa = 1.0 · qa = 1.0 |
| (10.1) / Sa | 0.4·ag·m = 3.77 kN | Sa = 0.1498·1.35 = 0.2023 |
| design F | max(3.77; 0.75·1.47·6.42 = **7.08 kN**) | **12.74 kN** |
| M (hg = 1.35 m) | 9.56 kNm | 17.21 kNm |

> The difference comes mainly from the soil factor S and from q. For a project built in Romania P100-1 is mandatory; the EC8 value is on the safe side.

**Input to FE software:** one "Seismic" load group with EX and EY cases; combinations G + ψ2Q + EX ± 0.30·EY and 0.30·EX ± EY, both signs (8 combinations). Set the soil springs to compression-only. [i]If a modal analysis also runs on the model, do not apply the machine force twice.[/i]

---
*Sources: P100-1/2013 10.3.1–10.3.1.3, Tables 10.1–10.2; SR EN 1998-1 4.3.5; SR EN 1997-1 6.5.3, 6.5.4; SR EN 1990 (6.12b).*
</script>
<script type="text/markdown" data-id="talajmodulusok" data-num="06" data-cat="found" data-calc="cmod" data-lang="hu">
title: Talajmodulusok: Eoed – Es – Em
sub: NP 112-2014 J melléklet és SR EN 1997-1 F melléklet szerint
---
**Mikor kell?** Ha a geotechnikai szakvélemény ödometrikus modulust ad, de a süllyedés- vagy ágyazásiszám-számításhoz más modulus kell.

## 1. A fogalmak – figyelj a jelölésre!

| Jelölés | Jelentés | Hol használjuk |
|---|---|---|
| E_oed (M, M2-3) | ödometrikus modulus, oldalirányban gátolt összenyomódás | laborvizsgálat eredménye |
| **E_s (román)** | *modul de deformație liniară* = M0 · E_oed | NP 112 süllyedésszámítás |
| **Es (magyar szokás)** | = E_oed, ugyanaz a mennyiség | magyar gyakorlat, EC7 F1 |
| E_m = E | rugalmassági (Young-) modulus, drénezett | EC7 F2, rugalmas féltér |
| E_u | drénezetlen modulus | azonnali süllyedés |

> **Csapda:** a román NP 112-ben az E_s **nagyobb** az E_oed-nél (M0 ≥ 1), a rugalmasságtani Em viszont **kisebb** nála. Ugyanaz a betű két különböző mennyiséget jelöl a két gyakorlatban. [i]Az M0 tapasztalati szorzó: a laborminta zavartságát és a labor–terep különbséget korrigálja. A rugalmasságtani átváltás ezzel szemben csak az oldalirányú gátlás hatását veszi le. A kettő nem ugyanazt a jelenséget kezeli, ezért nem szabad keverni.[/i]

## 2. Román előírás – NP 112-2014, J.1.2

$$E_s = M_0 \cdot E_{oed} \qquad (J.1)$$

- E_oed-et abban a feszültségtartományban kell venni, ahol a talaj ténylegesen dolgozik: σ′gz-től σ′gz + σz-ig [i]σ′gz a geológiai (hatékony önsúly-) feszültség a mintavétel mélységében, σz az alapból származó többletfeszültség ugyanott.[/i]
- M0 a J.1 táblázatból, kísérleti adat hiányában; I_c < 0,5 vagy e > 1,10 esetén M0 = 1

| Talaj | I_c | e 0,41–0,60 | 0,61–0,80 | 0,81–1,00 | 1,01–1,10 |
|---|---|---|---|---|---|
| Homok | – | 1,0 | 1,0 | – | – |
| Agyagos homok, homokos iszap, homokos agyag | 0–1,00 | 1,6 | 1,3 | 1,0 | – |
| Iszap, agyagos iszap, iszapos agyag | 0,76–1,00 | 2,3 | 1,7 | 1,3 | 1,1 |
| | 0,50–0,75 | 1,9 | 1,5 | 1,2 | 1,0 |
| Agyag, kövér agyag | 0,76–1,00 | 1,8 | 1,5 | 1,3 | 1,2 |
| | 0,50–0,75 | 1,5 | 1,3 | 1,1 | 1,0 |

`NP 112-2014, J.1 táblázat`

Poisson-tényező kísérlet hiányában `NP 112-2014, J.3 táblázat`:

| Talaj | ν |
|---|---|
| Görgeteg, kavics | 0,27 |
| Homok (iszapos és agyagos homok is) | 0,30 |
| Iszap, agyagos iszap, homokos agyag, iszapos agyag | 0,35 |
| Agyag, kövér agyag | 0,42 |

Előtervezéshez a J.2 táblázat tájékoztató E_s értékeket ad (pl. kaviccsal kevert homok e = 0,45 mellett 50 000 kPa). `NP 112-2014, J.1.4`

## 3. Eurocode út – rugalmasságtani átváltás

$$E_m = E_{oed}\,\frac{(1+\nu)(1-2\nu)}{1-\nu} \qquad E_{oed} = E_m\,\frac{1-\nu}{(1+\nu)(1-2\nu)}$$

| ν | Em / Eoed | Em, ha Eoed = 36 MPa |
|---|---|---|
| 0,25 | 0,833 | 30,0 MPa |
| 0,30 | 0,743 | 26,7 MPa |
| 0,35 | 0,623 | 22,4 MPa |
| 0,40 | 0,467 | 16,8 MPa |

- **F1 (rétegösszegzés):** Δs = σz·Δz / E_oed – gátolt oldalirányú alakváltozás, ezért az E_oed a megfelelő `SR EN 1997-1, F melléklet`
- **F2 (rugalmas féltér):** s = p·B·f / E_m – itt E_m kell
- **F3:** drénezetlen paraméterek (E_u, ν_u)

## 4. ν becslése Jáky szerint

$$K_0 = 1 - \sin\varphi' \qquad \nu = \frac{K_0}{1 + K_0}$$

Normálisan konszolidált talajra, drénezett állapotban. φ′ = 35° → ν = 0,30; φ′ = 20° → 0,40; φ′ = 15° → 0,43 (drénezett számításhoz 0,40-nél szokás megállni). `SR EN 1997-1, (9.1)` [i]Túlkonszolidált talajnál K0 nagyobb, a képlet ott csak közelítés.[/i]

## 5. Mire figyelj

- Az ödometrikus modulus erősen függ a feszültségszinttől – mindig nézd meg, milyen tartományra adták meg.
- Kis terhelésű alapoknál (gépalapok) a valós tartomány néhányszor 10 kPa; nagyobb tartományra megadott érték általában a biztonság javára téved.
- A román breviárba E_s = M0·E_oed kerül, és mindig írd ki, honnan van az M0.

---
*Források: NP 112-2014 J.1–J.3; SR EN 1997-1:2004 F melléklet, 9.5.2; Jáky J. (1944).*
</script>
<script type="text/markdown" data-id="talajmodulusok" data-num="06" data-cat="found" data-calc="cmod" data-lang="ro">
title: Module de deformație: Eoed – Es – Em
sub: Conform NP 112-2014 anexa J și SR EN 1997-1 anexa F
---
**Când e nevoie?** Când studiul geotehnic dă modulul edometric, dar pentru tasări sau coeficientul de pat e nevoie de alt modul.

## 1. Noțiuni – atenție la notații!

| Notație | Semnificație | Unde se folosește |
|---|---|---|
| E_oed (M, M2-3) | modul edometric, deformație laterală împiedicată | rezultat de laborator |
| **E_s (RO)** | modul de deformație liniară = M0 · E_oed | calculul tasărilor NP 112 |
| **Es (practica maghiară)** | = E_oed, aceeași mărime | practica din Ungaria, EC7 F1 |
| E_m = E | modul de elasticitate (Young), drenat | EC7 F2, semispațiu elastic |
| E_u | modul nedrenat | tasare imediată |

> **Capcană:** în NP 112 E_s este **mai mare** decât E_oed (M0 ≥ 1), pe când modulul elastic Em este **mai mic**. Aceeași literă desemnează două mărimi diferite în cele două practici. [i]M0 este un coeficient empiric: corectează perturbarea probei și diferența laborator–teren. Conversia elastică, în schimb, elimină doar efectul împiedicării laterale. Tratează fenomene diferite și nu trebuie amestecate.[/i]

## 2. Reglementarea românească – NP 112-2014, J.1.2

$$E_s = M_0 \cdot E_{oed} \qquad (J.1)$$

- E_oed se ia în intervalul de eforturi în care lucrează efectiv terenul: de la σ′gz la σ′gz + σz [i]σ′gz efortul geologic la adâncimea de recoltare, σz efortul suplimentar din fundație la aceeași adâncime.[/i]
- M0 din tabelul J.1, în lipsa datelor experimentale; pentru I_c < 0,5 sau e > 1,10 se acceptă M0 = 1

| Pământ | I_c | e 0,41–0,60 | 0,61–0,80 | 0,81–1,00 | 1,01–1,10 |
|---|---|---|---|---|---|
| Nisipuri | – | 1,0 | 1,0 | – | – |
| Nisip argilos, praf nisipos, argilă nisipoasă | 0–1,00 | 1,6 | 1,3 | 1,0 | – |
| Praf, praf argilos, argilă prăfoasă | 0,76–1,00 | 2,3 | 1,7 | 1,3 | 1,1 |
| | 0,50–0,75 | 1,9 | 1,5 | 1,2 | 1,0 |
| Argilă, argilă grasă | 0,76–1,00 | 1,8 | 1,5 | 1,3 | 1,2 |
| | 0,50–0,75 | 1,5 | 1,3 | 1,1 | 1,0 |

`NP 112-2014, tabelul J.1`

Coeficientul lui Poisson în lipsa încercărilor `NP 112-2014, tabelul J.3`:

| Pământ | ν |
|---|---|
| Bolovănișuri și pietrișuri | 0,27 |
| Nisipuri (inclusiv prăfoase și argiloase) | 0,30 |
| Praf, praf argilos, argilă nisipoasă, argilă prăfoasă | 0,35 |
| Argilă, argilă grasă | 0,42 |

Pentru predimensionare, tabelul J.2 dă valori orientative E_s (de ex. nisip cu pietriș, e = 0,45: 50 000 kPa). `NP 112-2014, J.1.4`

## 3. Varianta Eurocode – conversie elastică

$$E_m = E_{oed}\,\frac{(1+\nu)(1-2\nu)}{1-\nu} \qquad E_{oed} = E_m\,\frac{1-\nu}{(1+\nu)(1-2\nu)}$$

| ν | Em / Eoed | Em pentru Eoed = 36 MPa |
|---|---|---|
| 0,25 | 0,833 | 30,0 MPa |
| 0,30 | 0,743 | 26,7 MPa |
| 0,35 | 0,623 | 22,4 MPa |
| 0,40 | 0,467 | 16,8 MPa |

- **F1 (însumare pe straturi):** Δs = σz·Δz / E_oed – deformație laterală împiedicată, deci E_oed `SR EN 1997-1, anexa F`
- **F2 (semispațiu elastic):** s = p·B·f / E_m – aici e nevoie de E_m
- **F3:** parametri nedrenați (E_u, ν_u)

## 4. Estimarea lui ν după Jáky

$$K_0 = 1 - \sin\varphi' \qquad \nu = \frac{K_0}{1 + K_0}$$

Pentru pământ normal consolidat, stare drenată. φ′ = 35° → ν = 0,30; φ′ = 20° → 0,40; φ′ = 15° → 0,43 (pentru calcul drenat uzual se limitează la 0,40). `SR EN 1997-1, (9.1)` [i]La pământuri supraconsolidate K0 este mai mare; formula este doar aproximativă.[/i]

## 5. Atenție

- Modulul edometric depinde puternic de nivelul eforturilor – verifică intervalul pentru care a fost dat.
- La fundații slab încărcate (fundații de utilaje) intervalul real este de câteva zeci de kPa; o valoare dată pe un interval mai mare este de regulă acoperitoare.
- În breviarul românesc se scrie E_s = M0·E_oed și se indică sursa lui M0.

---
*Surse: NP 112-2014 J.1–J.3; SR EN 1997-1:2004 anexa F, 9.5.2; Jáky J. (1944).*

title: Soil moduli: Eoed – Es – Em
sub: Per NP 112-2014 Annex J and SR EN 1997-1 Annex F
---
**When?** When the geotechnical report gives the oedometer modulus but the settlement or subgrade-modulus calculation needs another one.

## 1. Definitions – watch the symbols!

| Symbol | Meaning | Used in |
|---|---|---|
| E_oed (M, M2-3) | oedometer (constrained) modulus | laboratory result |
| **E_s (Romanian)** | linear deformation modulus = M0 · E_oed | NP 112 settlement |
| **Es (Hungarian habit)** | = E_oed, the same quantity | Hungarian practice, EC7 F1 |
| E_m = E | Young's modulus, drained | EC7 F2, elastic half-space |
| E_u | undrained modulus | immediate settlement |

> **Trap:** in NP 112 E_s is **larger** than E_oed (M0 ≥ 1), while the elastic Em is **smaller**. The same letter means two different things in the two practices. [i]M0 is empirical: it corrects for sample disturbance and the lab–field difference. The elastic conversion only removes the effect of lateral confinement. They address different phenomena and must not be mixed.[/i]

## 2. Romanian code – NP 112-2014, J.1.2

$$E_s = M_0 \cdot E_{oed} \qquad (J.1)$$

- Take E_oed over the stress range the soil actually works in: from σ′gz to σ′gz + σz [i]σ′gz is the geostatic effective stress at sampling depth, σz the added stress from the foundation at that depth.[/i]
- M0 from Table J.1 when no test data exist; for I_c < 0.5 or e > 1.10, M0 = 1

| Soil | I_c | e 0.41–0.60 | 0.61–0.80 | 0.81–1.00 | 1.01–1.10 |
|---|---|---|---|---|---|
| Sands | – | 1.0 | 1.0 | – | – |
| Clayey sand, sandy silt, sandy clay | 0–1.00 | 1.6 | 1.3 | 1.0 | – |
| Silt, clayey silt, silty clay | 0.76–1.00 | 2.3 | 1.7 | 1.3 | 1.1 |
| | 0.50–0.75 | 1.9 | 1.5 | 1.2 | 1.0 |
| Clay, fat clay | 0.76–1.00 | 1.8 | 1.5 | 1.3 | 1.2 |
| | 0.50–0.75 | 1.5 | 1.3 | 1.1 | 1.0 |

`NP 112-2014, Table J.1`

Poisson's ratio without tests `NP 112-2014, Table J.3`:

| Soil | ν |
|---|---|
| Boulders, gravels | 0.27 |
| Sands (incl. silty and clayey sands) | 0.30 |
| Silt, clayey silt, sandy clay, silty clay | 0.35 |
| Clay, fat clay | 0.42 |

For preliminary design Table J.2 gives indicative E_s values (e.g. sand with gravel, e = 0.45: 50 000 kPa). `NP 112-2014, J.1.4`

## 3. Eurocode route – elastic conversion

$$E_m = E_{oed}\,\frac{(1+\nu)(1-2\nu)}{1-\nu} \qquad E_{oed} = E_m\,\frac{1-\nu}{(1+\nu)(1-2\nu)}$$

| ν | Em / Eoed | Em for Eoed = 36 MPa |
|---|---|---|
| 0.25 | 0.833 | 30.0 MPa |
| 0.30 | 0.743 | 26.7 MPa |
| 0.35 | 0.623 | 22.4 MPa |
| 0.40 | 0.467 | 16.8 MPa |

- **F1 (layer summation):** Δs = σz·Δz / E_oed – lateral strain prevented, so E_oed `SR EN 1997-1, Annex F`
- **F2 (elastic half-space):** s = p·B·f / E_m – needs E_m
- **F3:** undrained parameters (E_u, ν_u)

## 4. Estimating ν after Jáky

$$K_0 = 1 - \sin\varphi' \qquad \nu = \frac{K_0}{1 + K_0}$$

Normally consolidated soil, drained. φ′ = 35° → ν = 0.30; φ′ = 20° → 0.40; φ′ = 15° → 0.43 (usually capped at 0.40 for drained analysis). `SR EN 1997-1, (9.1)` [i]For overconsolidated soil K0 is larger; the formula is only an approximation there.[/i]

## 5. Watch out

- The oedometer modulus depends strongly on stress level – check the range it was given for.
- Lightly loaded foundations (machine bases) work over a few tens of kPa; a value for a larger range is usually on the safe side.
- In a Romanian calculation report write E_s = M0·E_oed and state where M0 comes from.

---
*Sources: NP 112-2014 J.1–J.3; SR EN 1997-1:2004 Annex F, 9.5.2; Jáky J. (1944).*
