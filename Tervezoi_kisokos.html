<script type="text/markdown" data-id="alapnyiroero" data-num="05" data-cat="seismic" data-calc="cfb" data-lang="hu">
title: Szeizmikus alapnyíróerő – helyettesítő erők módszere
sub: P100-1/2013 szerint, összevetve az SR EN 1998-1-gyel
---
**Mikor kell?** Szabályos épületek kézi ellenőrzéséhez, a modális számítás nagyságrendi kontrolljához, és előtervezéshez.

> Romániában épületekre a **P100-1/2013** a kötelező szeizmikus tervezési előírás. A P100-1/2025 tervezetét bejelentették (TRIS 2024/0706/RO), de a hatálybalépését mindig ellenőrizni kell.

## 1. A helyszín adatai

- **ag** – a talaj tervezési csúcsgyorsulása, IMR = 225 év (20% túllépési valószínűség 50 év alatt) `P100-1/2013, 3.1 ábra` [i]A térképről vagy az A.1 táblázatból, településenként. Tipikus értékek: 0,10g … 0,40g (Vrancea-közeli zónák a legnagyobbak).[/i]
- **TC** – a spektrum sarokperiódusa: 0,7 s · 1,0 s · 1,6 s `P100-1/2013, 3.2 ábra` [i]A TC zónázás a helyi talajviszonyokat és a rengésforrás frekvenciatartalmát együtt írja le – ezért nincs külön S talajtényező, mint az EC8-ban.[/i]

| TC [s] | TB [s] | TD [s] |
|---|---|---|
| 0,70 | 0,14 | 3,00 |
| 1,00 | 0,20 | 3,00 |
| 1,60 | 0,32 | 2,00 |

`P100-1/2013, 3.1 táblázat`

## 2. Normalizált rugalmas spektrum β(T)

β0 = 2,5 (5% csillapítás)

$$\beta(T) = 1 + \frac{\beta_0 - 1}{T_B}\,T \qquad 0 \le T \le T_B$$

$$\beta(T) = \beta_0 \qquad T_B < T \le T_C$$

$$\beta(T) = \beta_0\,\frac{T_C}{T} \qquad T_C < T \le T_D$$

$$\beta(T) = \beta_0\,\frac{T_C\,T_D}{T^2} \qquad T_D < T \le 5\text{ s}$$

`P100-1/2013, (3.3)–(3.6)` · rugalmas spektrum: $S_e(T) = a_g\,\beta(T)$ `(3.2)`

## 3. Tervezési spektrum Sd(T)

$$S_d(T) = a_g\left[1 + \frac{\beta_0/q - 1}{T_B}\,T\right] \qquad 0 < T \le T_B$$

$$S_d(T) = a_g\,\frac{\beta(T)}{q} \qquad T > T_B$$

- **q** a viselkedési tényező [i]Anyag és szerkezeti rendszer szerint, a P100-1 anyagspecifikus fejezeteiből (5. beton, 6. acél, 7. öszvér, 8. falazat, 9. fa). Pl. többszintes, több mezős vasbeton keret, DCH: q = 5·αu/α1 = 5·1,35 = 6,75. Vasbeton falas szerkezetekre a CR 2-1-1.1/2022 is ad előírásokat.[/i]

`P100-1/2013, (3.17)–(3.18)`

## 4. Alapnyíróerő

$$F_b = \gamma_{I,e}\; S_d(T_1)\; m\; \lambda$$

- **γI,e** fontossági-kitettségi tényező: I. 1,4 · II. 1,2 · III. 1,0 · IV. 0,8 `P100-1/2013, 4.2 táblázat`
- **m** az épület teljes tömege a szeizmikus kombináció gravitációs terheiből [i]m = Σ(Gk + ψ2·Qk)/g – itt jelenik meg a hóra vonatkozó ψ2 = 0,4 (CR 0).[/i]
- **λ** = 0,85, ha T1 ≤ TC és az épület 2 szintnél magasabb; minden más esetben 1,0 [i]A korrekció az alapmódus effektív modális tömegét veszi figyelembe – többszintes épületeknél az első módus nem a teljes tömeget mozgatja.[/i]
- Szeizmikus együttható: $c = \gamma_{I,e}\,S_d(T_1)\,\lambda / g$, így $F_b = c \cdot G$

`P100-1/2013, 4.5.3.2.2, (4.3)`

## 5. Az alapperiódus becslése

$$T_1 = C_t\,H^{3/4}$$

C_t = 0,085 (acél nyomatékbíró keret) · 0,075 (vasbeton keret, külpontos merevítésű acél) · 0,050 (minden más) — H [m] az épület magassága, legfeljebb kb. 40 m-ig [i]Közelítő képlet, előtervezéshez. A végleges T1 a modális számításból jön. Az SR EN 1998-1 (4.6) ugyanezt a képletet adja.[/i]

## 6. Az erő szétosztása a szinteken

$$F_i = F_b\,\frac{m_i\,s_i}{\sum_j m_j\,s_j} \;\approx\; F_b\,\frac{m_i\,z_i}{\sum_j m_j\,z_j}$$

ahol s_i az alapmódus elmozdulása az i. szinten; lineáris közelítésnél a szint magassága, z_i. `P100-1/2013, 4.5.3.2.3, (4.4)–(4.5)`

## 7. Eurocode út (SR EN 1998-1)

- Spektrum: $S_d(T) = a_g\,S\,\frac{2{,}5}{q}$ a platón, ahol $a_g = \gamma_I\,a_{gR}$ és S a talajtényező (A–E talajosztály) `SR EN 1998-1, 3.2.2.5`
- Alsó korlát: $S_d(T) \ge \beta\,a_g$, ajánlott β = 0,2
- Alapnyíróerő: $F_b = S_d(T_1)\,m\,\lambda$ `(4.5)` – a γI már az ag-ban van
- **Különbség:** a P100-1 a talajt a TC zónával kezeli (nincs S), és a γI,e-t az erőnél alkalmazza.

---
*Források: P100-1/2013 (2019-es módosítással) 3.1, 3.2, 4.4.5, 4.5.3.2 és a kommentárok E5 példája; SR EN 1998-1:2004 + NA.*
</script>
<script type="text/markdown" data-id="alapnyiroero" data-num="05" data-cat="seismic" data-calc="cfb" data-lang="ro">
title: Forța tăietoare de bază – metoda forțelor laterale
sub: Conform P100-1/2013, comparativ cu SR EN 1998-1
---
**Când e nevoie?** Pentru verificarea manuală a structurilor regulate, controlul ordinului de mărime al calculului modal și predimensionare.

> În România, pentru clădiri, **P100-1/2013** este codul seismic obligatoriu. Proiectul P100-1/2025 a fost notificat (TRIS 2024/0706/RO); intrarea lui în vigoare trebuie verificată de fiecare dată.

## 1. Datele amplasamentului

- **ag** – accelerația de vârf a terenului pentru proiectare, IMR = 225 ani (20% probabilitate de depășire în 50 de ani) `P100-1/2013, Figura 3.1` [i]Din hartă sau din tabelul A.1, pe localități. Valori uzuale: 0,10g … 0,40g (zonele apropiate de Vrancea au cele mai mari valori).[/i]
- **TC** – perioada de control (colț): 0,7 s · 1,0 s · 1,6 s `P100-1/2013, Figura 3.2` [i]Zonarea TC descrie împreună condițiile locale de teren și conținutul de frecvențe al sursei – de aceea nu există factorul de teren S ca în EC8.[/i]

| TC [s] | TB [s] | TD [s] |
|---|---|---|
| 0,70 | 0,14 | 3,00 |
| 1,00 | 0,20 | 3,00 |
| 1,60 | 0,32 | 2,00 |

`P100-1/2013, tabelul 3.1`

## 2. Spectrul normalizat de răspuns elastic β(T)

β0 = 2,5 (amortizare 5%)

$$\beta(T) = 1 + \frac{\beta_0 - 1}{T_B}\,T \qquad 0 \le T \le T_B$$

$$\beta(T) = \beta_0 \qquad T_B < T \le T_C$$

$$\beta(T) = \beta_0\,\frac{T_C}{T} \qquad T_C < T \le T_D$$

$$\beta(T) = \beta_0\,\frac{T_C\,T_D}{T^2} \qquad T_D < T \le 5\text{ s}$$

`P100-1/2013, (3.3)–(3.6)` · spectrul elastic: $S_e(T) = a_g\,\beta(T)$ `(3.2)`

## 3. Spectrul de proiectare Sd(T)

$$S_d(T) = a_g\left[1 + \frac{\beta_0/q - 1}{T_B}\,T\right] \qquad 0 < T \le T_B$$

$$S_d(T) = a_g\,\frac{\beta(T)}{q} \qquad T > T_B$$

- **q** factorul de comportare [i]După material și sistem structural, din capitolele P100-1 (5 beton, 6 oțel, 7 compozit, 8 zidărie, 9 lemn). De ex. cadre BA cu mai multe niveluri și deschideri, DCH: q = 5·αu/α1 = 5·1,35 = 6,75. Pentru structuri cu pereți BA se aplică și CR 2-1-1.1/2022.[/i]

`P100-1/2013, (3.17)–(3.18)`

## 4. Forța tăietoare de bază

$$F_b = \gamma_{I,e}\; S_d(T_1)\; m\; \lambda$$

- **γI,e** factorul de importanță-expunere: I 1,4 · II 1,2 · III 1,0 · IV 0,8 `P100-1/2013, tabelul 4.2`
- **m** masa totală a clădirii din încărcările gravitaționale ale combinației seismice [i]m = Σ(Gk + ψ2·Qk)/g – aici intervine ψ2 = 0,4 pentru zăpadă (CR 0).[/i]
- **λ** = 0,85 dacă T1 ≤ TC și clădirea are mai mult de 2 niveluri; altfel 1,0 [i]Corecția ține seama de masa modală efectivă a modului fundamental – la clădiri cu mai multe niveluri primul mod nu antrenează întreaga masă.[/i]
- Coeficientul seismic: $c = \gamma_{I,e}\,S_d(T_1)\,\lambda / g$, deci $F_b = c \cdot G$

`P100-1/2013, 4.5.3.2.2, (4.3)`

## 5. Estimarea perioadei fundamentale

$$T_1 = C_t\,H^{3/4}$$

C_t = 0,085 (cadre metalice necontravântuite) · 0,075 (cadre BA, contravântuiri excentrice) · 0,050 (toate celelalte) — H [m] înălțimea clădirii, până la aprox. 40 m [i]Formulă aproximativă, pentru predimensionare. T1 final rezultă din calculul modal. SR EN 1998-1 (4.6) dă aceeași relație.[/i]

## 6. Distribuția pe niveluri

$$F_i = F_b\,\frac{m_i\,s_i}{\sum_j m_j\,s_j} \;\approx\; F_b\,\frac{m_i\,z_i}{\sum_j m_j\,z_j}$$

unde s_i este deplasarea în modul fundamental la nivelul i; aproximând liniar, cota nivelului z_i. `P100-1/2013, 4.5.3.2.3, (4.4)–(4.5)`

## 7. Varianta Eurocode (SR EN 1998-1)

- Spectru: $S_d(T) = a_g\,S\,\frac{2{,}5}{q}$ pe palier, cu $a_g = \gamma_I\,a_{gR}$ și S factorul de teren (clase A–E) `SR EN 1998-1, 3.2.2.5`
- Limita inferioară: $S_d(T) \ge \beta\,a_g$, β = 0,2 recomandat
- Forța tăietoare de bază: $F_b = S_d(T_1)\,m\,\lambda$ `(4.5)` – γI este deja inclus în ag
- **Diferența:** P100-1 tratează terenul prin zona TC (fără S) și aplică γI,e la forță.

---
*Surse: P100-1/2013 (modificat 2019) 3.1, 3.2, 4.4.5, 4.5.3.2 și exemplul E5 din comentarii; SR EN 1998-1:2004 + NA.*
</script>
<script type="text/markdown" data-id="alapnyiroero" data-num="05" data-cat="seismic" data-calc="cfb" data-lang="en">
title: Seismic base shear – lateral force method
sub: Per P100-1/2013, compared with SR EN 1998-1
---
**When?** Hand checks of regular buildings, sanity check of the modal analysis, preliminary design.

> In Romania **P100-1/2013** is the mandatory seismic code for buildings. The P100-1/2025 draft was notified (TRIS 2024/0706/RO); always check whether it has entered into force.

## 1. Site data

- **ag** – design peak ground acceleration, MRI = 225 years (20% probability of exceedance in 50 years) `P100-1/2013, Figure 3.1` [i]From the map or Table A.1 by locality. Typical values 0.10g … 0.40g (zones near Vrancea are highest).[/i]
- **TC** – corner period: 0.7 s · 1.0 s · 1.6 s `P100-1/2013, Figure 3.2` [i]The TC zoning covers local ground conditions and the source frequency content together – so there is no soil factor S as in EC8.[/i]

| TC [s] | TB [s] | TD [s] |
|---|---|---|
| 0.70 | 0.14 | 3.00 |
| 1.00 | 0.20 | 3.00 |
| 1.60 | 0.32 | 2.00 |

`P100-1/2013, Table 3.1`

## 2. Normalised elastic spectrum β(T)

β0 = 2.5 (5% damping)

$$\beta(T) = 1 + \frac{\beta_0 - 1}{T_B}\,T \qquad 0 \le T \le T_B$$

$$\beta(T) = \beta_0 \qquad T_B < T \le T_C$$

$$\beta(T) = \beta_0\,\frac{T_C}{T} \qquad T_C < T \le T_D$$

$$\beta(T) = \beta_0\,\frac{T_C\,T_D}{T^2} \qquad T_D < T \le 5\text{ s}$$

`P100-1/2013, (3.3)–(3.6)` · elastic spectrum: $S_e(T) = a_g\,\beta(T)$ `(3.2)`

## 3. Design spectrum Sd(T)

$$S_d(T) = a_g\left[1 + \frac{\beta_0/q - 1}{T_B}\,T\right] \qquad 0 < T \le T_B$$

$$S_d(T) = a_g\,\frac{\beta(T)}{q} \qquad T > T_B$$

- **q** behaviour factor [i]By material and structural system, from the P100-1 material chapters (5 concrete, 6 steel, 7 composite, 8 masonry, 9 timber). E.g. multi-storey multi-bay RC frame, DCH: q = 5·αu/α1 = 5·1.35 = 6.75. RC wall structures also follow CR 2-1-1.1/2022.[/i]

`P100-1/2013, (3.17)–(3.18)`

## 4. Base shear

$$F_b = \gamma_{I,e}\; S_d(T_1)\; m\; \lambda$$

- **γI,e** importance-exposure factor: I 1.4 · II 1.2 · III 1.0 · IV 0.8 `P100-1/2013, Table 4.2`
- **m** total mass from the gravity loads of the seismic combination [i]m = Σ(Gk + ψ2·Qk)/g – this is where ψ2 = 0.4 for snow (CR 0) enters.[/i]
- **λ** = 0.85 if T1 ≤ TC and the building has more than 2 storeys; otherwise 1.0 [i]Accounts for the effective modal mass of the fundamental mode – in multi-storey buildings the first mode does not mobilise the full mass.[/i]
- Seismic coefficient: $c = \gamma_{I,e}\,S_d(T_1)\,\lambda / g$, so $F_b = c \cdot G$

`P100-1/2013, 4.5.3.2.2, (4.3)`

## 5. Estimating the fundamental period

$$T_1 = C_t\,H^{3/4}$$

C_t = 0.085 (steel moment frames) · 0.075 (RC frames, eccentrically braced steel) · 0.050 (all others) — H [m] building height, up to about 40 m [i]Approximate, for preliminary design. The final T1 comes from the modal analysis. SR EN 1998-1 (4.6) gives the same expression.[/i]

## 6. Distribution over storeys

$$F_i = F_b\,\frac{m_i\,s_i}{\sum_j m_j\,s_j} \;\approx\; F_b\,\frac{m_i\,z_i}{\sum_j m_j\,z_j}$$

where s_i is the fundamental-mode displacement of storey i; with a linear shape, the storey height z_i. `P100-1/2013, 4.5.3.2.3, (4.4)–(4.5)`

## 7. Eurocode route (SR EN 1998-1)

- Spectrum: $S_d(T) = a_g\,S\,\frac{2.5}{q}$ on the plateau, with $a_g = \gamma_I\,a_{gR}$ and S the soil factor (ground types A–E) `SR EN 1998-1, 3.2.2.5`
- Lower bound: $S_d(T) \ge \beta\,a_g$, β = 0.2 recommended
- Base shear: $F_b = S_d(T_1)\,m\,\lambda$ `(4.5)` – γI is already in ag
- **Difference:** P100-1 handles the ground through the TC zone (no S) and applies γI,e to the force.

---
*Sources: P100-1/2013 (amended 2019) 3.1, 3.2, 4.4.5, 4.5.3.2 and commentary example E5; SR EN 1998-1:2004 + NA.*
</script>
<script type="text/markdown" data-id="gepek-szeizmikus-ero" data-num="06" data-cat="seismic" data-calc="ccns,cfa" data-lang="hu">
title: Gépekre és berendezésekre ható szeizmikus erő
sub: P100-1/2013 10. fejezet (CNS) és SR EN 1998-1 4.3.5 szerint
---
**Mikor kell?** Gépalapok, tartályok, csővezeték-tartók, tetőn álló berendezések horgonyzásához és az alaplemez ellenőrzéséhez.

## 1. Alapelv

A gépet **nem szerkezeti elemként** kezeljük (románul CNS – *componentă nestructurală*): a vízszintes erőt kézzel számítjuk, és a gép **súlypontjában** működtetjük. Így a borítónyomaték is helyesen jelenik meg, ami a horgonyokra és az alaplemezre mértékadó. [i]Egy modális számítás a gép tömegét általában a lemez síkjában venné fel, és a borítónyomaték kimaradna.[/i]

Az itt számított erő **csak** a gépre, a rögzítésére és a közvetlen alátámasztásra vonatkozik; nem adódik hozzá a teljes épület szeizmikus erejéhez. `P100-1/2013, 10.3.1 (3)`

## 2. Román előírás – P100-1/2013, 10.3.1.2

$$F_{CNS}(z) = \frac{\gamma_{CNS}\;a_g\;\beta_{CNS}\;K_z}{q_{CNS}}\;m_{CNS} \qquad (10.1)$$

$$K_z = 1 + 2\,\frac{z}{H}$$

- **ag** a talaj tervezési gyorsulása [m/s²], **m_CNS** a gép legnagyobb üzemi tömege [t] → az erő kN-ban [i]Üzemi tömeg = önsúly + töltet. Tartálynál a tele állapot.[/i]
- **z** a rögzítési pont magassága az épület alapja felett, **H** az épület átlagos tetőmagassága [i]Talajon, önálló alaplemezen álló gépnél z = 0, tehát K_z = 1. Tetőn álló gépnél z = H, K_z = 3.[/i]
- **γ_CNS** fontossági tényező: **≥ 1,5** mérgező vagy robbanásveszélyes anyagot tartalmazó tartályokra, létfontosságú és menekülési útvonalon lévő elemekre, nyilvános raktárak polcaira; minden más esetben **γCNS = γI,e** [i]P100-1/2013 10.3.1.3.1 (1) és (2), a 2019-es módosítás után is változatlan.[/i]
- **β_CNS** dinamikus erősítési tényező és **q_CNS** viselkedési tényező: táblázatból (lásd lent)

Korlátok:

$$0{,}75\;\gamma_{CNS}\,a_g\,m_{CNS} \;\le\; F_{CNS} \;\le\; 4\;\gamma_{CNS}\,a_g\,m_{CNS} \qquad (10.2)$$

Függőleges erő ugyanígy, a függőleges gyorsulással (a_vg, (3.16)). `P100-1/2013, 10.3.1.2 (5)`

| Berendezés (P100-1 10.1–10.2 táblázat, részlet) | β_CNS | q_CNS |
|---|---|---|
| Kazánok, bojlerek; köpenyen álló vagy szabadon álló nyomástartó edények | 1,0 | 2,5 |
| Elektromos berendezések | 1,0 | 2,5 |
| HVAC, rezgésszigetelés nélkül | 1,0 | 2,5 |
| HVAC, neoprén rezgésszigeteléssel | 2,5 | 2,5 |
| HVAC, rugós rezgésszigeteléssel | 2,5 | 2,0 |
| Kültéri berendezések | 2,5 | 6,0 |
| Konzolos kémény, szellőzőcső (súlypont alatt rögzítve) | 2,5 | 1,5 |
| Liftek, mozgólépcsők | 1,0 | 2,5 |

> **Talajon álló merev gépnél** (z = 0, β = 1, q = 2,5) a (10.1) értéke 0,4·γ·ag·m, ami kisebb az alsó korlátnál – **a mértékadó erő 0,75·γ·ag·m**.

Az erő a gép súlypontjában, a legkedvezőtlenebb irányban hat. `P100-1/2013, 10.3.1.2 (6)`

## 3. Eurocode út – SR EN 1998-1, 4.3.5

$$F_a = \frac{S_a\;W_a\;\gamma_a}{q_a} \qquad (4.24)$$

$$S_a = \alpha\,S\left[\frac{3\,(1 + z/H)}{1 + (1 - T_a/T_1)^2} - 0{,}5\right] \ge \alpha\,S \qquad (4.25)$$

- α = ag/g, S talajtényező (A–E) [i]1. típusú spektrum: A 1,00 · B 1,20 · C 1,15 · D 1,35 · E 1,40.[/i]
- **Talajon, önálló alapon álló gép:** z = 0, nincs felerősítő T1, ezért $S_a = \alpha\,S$
- **Hajlékony gép** (ha a gyártó megadja a T_a-t): $S_a = \max\{\alpha S;\; S_e(T_a)/g\}$ [i]Mérnöki kiterjesztés: a gép egytömegű lengőként a rugalmas spektrum szerint gyorsul. Rezonanciánál (Ta = T1, z = 0) a (4.25) is 2,5·α·S-t ad, ami a spektrum platója – a kettő összhangban van.[/i]
- γa ≥ 1,5 mérgező/robbanásveszélyes tartályokra, egyébként 1,0; qa = 1,0 konzolos (több mint fele merevítetlen), 2,0 egyébként `4.3.5.3, 4.4 táblázat`

## 4. Súlypont és borítónyomaték

$$h_g = h_0 + \eta\,(H_g - h_0) \qquad M = F \cdot h_g$$

H_g a gép teljes magassága, h_0 a láb- vagy alátétmagasság, η a súlypont relatív helyzete (egyenletes tömegeloszlásnál 0,5). [i]Ha a gyártó megadja a valós súlypontot, azt kell használni.[/i]

## 5. Terhek átadása az alaplemezre

**Lábakon álló gép** (n láb):

$$V_{láb} = \frac{F}{n} \qquad \Delta N = \frac{4M}{n\,D_c}\;\text{(kör)} \qquad \Delta N = \frac{2M}{n\,a}\;\text{(téglalap)}$$

Ha $W/n - \Delta N < 0$, a lábat horgonyozni kell.

**Felületen fekvő gép** (doboz, skid; b a rengés irányában, d rá merőlegesen):

$$p_x = \frac{F}{A_{felf}} \qquad p_{z,max} = \pm\frac{6M}{b^2 d} \qquad q_{két\,fél} = \pm\frac{4M}{b^2 d}$$

Felemelkedés nincs, ha $W/A_{felf} - p_{z,max} \ge 0$.

## 6. Alaplemez a talajon

$$F_{alap} = \alpha S\,W_{alap} \;\text{(EC)} \quad\text{vagy}\quad 0{,}75\,\gamma\,a_g\,m_{alap}\;\text{(a P100-1 logikája szerint)}$$

$$e = \frac{F\,(t + h_g) + F_{alap}\,t/2}{W + W_{alap}} \qquad \sigma_{max,min} = \frac{N}{BL}\left(1 \pm \frac{6e}{B}\right)\;(e \le B/6)$$

Csúszás: $F + F_{alap} \le N\,\tan\delta$ – helyszíni betonnál δ = φ_cv `SR EN 1997-1, 6.5.3` · külpontosság: `6.5.4` · román talajtörési ellenőrzés: `NP 112-2014`

## 7. Példa (P12, DAF egység, W = 63 kN, talajon, 1,90 × 3,00 × 2,70 m)

| | P100-1 (ag = 0,15g = 1,47 m/s²) | EC8 (agR = 1,47 m/s², D talaj, S = 1,35) |
|---|---|---|
| tömeg | m = 63 / 9,81 = 6,42 t | W = 63 kN |
| tényezők | γ = 1,0 · β = 1,0 · q = 2,5 · Kz = 1 | γa = 1,0 · qa = 1,0 |
| (10.1) / Sa | 0,4·ag·m = 3,77 kN | Sa = 0,1498·1,35 = 0,2023 |
| mértékadó F | max(3,77; 0,75·1,47·6,42 = **7,08 kN**) | **12,74 kN** |
| M (hg = 1,35 m) | 9,56 kNm | 17,21 kNm |

> A két út eltérése főleg az S talajtényezőből és a q-ból adódik. Romániában épülő létesítménynél a P100-1 a kötelező; az EC8-as érték a biztonság javára tér el.

**Bevitel végeselemes programba:** egy „Földrengés” tehercsoport EX és EY esettel; kombinációk: G + ψ2Q + EX ± 0,30·EY és 0,30·EX ± EY, mindkét előjellel (8 kombináció). A talajrugót csak nyomottra kell állítani. [i]Ha modális számítás is fut a modellen, a gép erejét ne vedd fel kétszer.[/i]

---
*Források: P100-1/2013 (2019-es módosítással) 10.3.1–10.3.1.3, 10.1–10.2 táblázat; SR EN 1998-1 4.3.5; SR EN 1997-1 6.5.3, 6.5.4; SR EN 1990 (6.12b).*
</script>
<script type="text/markdown" data-id="gepek-szeizmikus-ero" data-num="06" data-cat="seismic" data-calc="ccns,cfa" data-lang="ro">
title: Forța seismică pe utilaje și echipamente
sub: Conform P100-1/2013 cap. 10 (CNS) și SR EN 1998-1 4.3.5
---
**Când e nevoie?** La ancorarea utilajelor, rezervoarelor, suporturilor de conducte, echipamentelor pe acoperiș și la verificarea plăcii de fundare.

## 1. Principiu

Utilajul se tratează ca **componentă nestructurală (CNS)**: forța orizontală se calculează manual și se aplică în **centrul de greutate** al utilajului. Astfel momentul de răsturnare apare corect, iar acesta dimensionează ancorajele și placa. [i]Un calcul modal ar considera de regulă masa utilajului în planul plăcii, iar momentul de răsturnare s-ar pierde.[/i]

Forța calculată aici se folosește **numai** pentru CNS, prinderile ei și verificarea locală a reazemului; nu se adună cu forța seismică a întregii structuri. `P100-1/2013, 10.3.1 (3)`

## 2. Reglementarea românească – P100-1/2013, 10.3.1.2

$$F_{CNS}(z) = \frac{\gamma_{CNS}\;a_g\;\beta_{CNS}\;K_z}{q_{CNS}}\;m_{CNS} \qquad (10.1)$$

$$K_z = 1 + 2\,\frac{z}{H}$$

- **ag** accelerația terenului pentru proiectare [m/s²], **m_CNS** masa maximă a CNS în exploatare [t] → forța în kN [i]Masa în exploatare = greutate proprie + conținut. La rezervoare, starea plină.[/i]
- **z** cota punctului de prindere față de baza construcției, **H** înălțimea medie a acoperișului [i]Utilaj pe placă proprie, pe teren: z = 0, deci K_z = 1. Utilaj pe acoperiș: z = H, K_z = 3.[/i]
- **γ_CNS** factorul de importanță: **≥ 1,5** pentru recipienți cu substanțe toxice sau explozive, CNS esențiale și cele de pe căile de evacuare, rafturi accesibile publicului; în rest **γCNS = γI,e** [i]P100-1/2013 10.3.1.3.1 (1) și (2), neschimbat după modificarea din 2019.[/i]
- **β_CNS** factorul de amplificare dinamică și **q_CNS** factorul de comportare: din tabele (vezi mai jos)

Limite:

$$0{,}75\;\gamma_{CNS}\,a_g\,m_{CNS} \;\le\; F_{CNS} \;\le\; 4\;\gamma_{CNS}\,a_g\,m_{CNS} \qquad (10.2)$$

Forța verticală se calculează la fel, cu accelerația verticală (a_vg, (3.16)). `P100-1/2013, 10.3.1.2 (5)`

| Echipament (P100-1 tabelele 10.1–10.2, extras) | β_CNS | q_CNS |
|---|---|---|
| Boilere, cazane; vase de presiune rezemate pe manta sau așezate liber | 1,0 | 2,5 |
| Echipamente electrice | 1,0 | 2,5 |
| HVAC neizolate împotriva vibrațiilor | 1,0 | 2,5 |
| HVAC izolate cu neopren | 2,5 | 2,5 |
| HVAC izolate cu arcuri | 2,5 | 2,0 |
| Echipamente montate în exterior | 2,5 | 6,0 |
| Coșuri, canale de ventilație în consolă (ancorate sub centrul de greutate) | 2,5 | 1,5 |
| Ascensoare, scări rulante | 1,0 | 2,5 |

> **Utilaj rigid pe teren** (z = 0, β = 1, q = 2,5): relația (10.1) dă 0,4·γ·ag·m, sub limita inferioară – **forța de calcul este 0,75·γ·ag·m**.

Forța acționează în centrul de greutate, pe direcția cea mai defavorabilă. `P100-1/2013, 10.3.1.2 (6)`

## 3. Varianta Eurocode – SR EN 1998-1, 4.3.5

$$F_a = \frac{S_a\;W_a\;\gamma_a}{q_a} \qquad (4.24)$$

$$S_a = \alpha\,S\left[\frac{3\,(1 + z/H)}{1 + (1 - T_a/T_1)^2} - 0{,}5\right] \ge \alpha\,S \qquad (4.25)$$

- α = ag/g, S factorul de teren (A–E) [i]Spectru tip 1: A 1,00 · B 1,20 · C 1,15 · D 1,35 · E 1,40.[/i]
- **Utilaj pe teren, pe fundație proprie:** z = 0, fără T1 care să amplifice, deci $S_a = \alpha\,S$
- **Utilaj flexibil** (dacă producătorul dă T_a): $S_a = \max\{\alpha S;\; S_e(T_a)/g\}$ [i]Extensie inginerească: utilajul se comportă ca oscilator cu un grad de libertate. La rezonanță (Ta = T1, z = 0) și (4.25) dă 2,5·α·S, adică palierul spectrului – cele două sunt coerente.[/i]
- γa ≥ 1,5 pentru rezervoare cu substanțe toxice/explozive, altfel 1,0; qa = 1,0 consolă (peste jumătate necontravântuită), 2,0 în rest `4.3.5.3, tabelul 4.4`

## 4. Centrul de greutate și momentul de răsturnare

$$h_g = h_0 + \eta\,(H_g - h_0) \qquad M = F \cdot h_g$$

H_g înălțimea totală a utilajului, h_0 înălțimea picioarelor/suportului, η poziția relativă a centrului de greutate (0,5 pentru masă uniformă). [i]Dacă producătorul dă centrul de greutate real, se folosește acela.[/i]

## 5. Transmiterea încărcărilor la placă

**Utilaj pe picioare** (n picioare):

$$V_{picior} = \frac{F}{n} \qquad \Delta N = \frac{4M}{n\,D_c}\;\text{(cerc)} \qquad \Delta N = \frac{2M}{n\,a}\;\text{(dreptunghi)}$$

Dacă $W/n - \Delta N < 0$, piciorul trebuie ancorat.

**Utilaj rezemat pe suprafață** (cutie, skid; b pe direcția seismului, d perpendicular):

$$p_x = \frac{F}{A_{rez}} \qquad p_{z,max} = \pm\frac{6M}{b^2 d} \qquad q_{două\,jumătăți} = \pm\frac{4M}{b^2 d}$$

Nu apare desprindere dacă $W/A_{rez} - p_{z,max} \ge 0$.

## 6. Placa de fundare pe teren

$$F_{fund} = \alpha S\,W_{fund} \;\text{(EC)} \quad\text{sau}\quad 0{,}75\,\gamma\,a_g\,m_{fund}\;\text{(după logica P100-1)}$$

$$e = \frac{F\,(t + h_g) + F_{fund}\,t/2}{W + W_{fund}} \qquad \sigma_{max,min} = \frac{N}{BL}\left(1 \pm \frac{6e}{B}\right)\;(e \le B/6)$$

Lunecare: $F + F_{fund} \le N\,\tan\delta$ – la beton turnat pe loc δ = φ_cv `SR EN 1997-1, 6.5.3` · excentricitate: `6.5.4` · verificarea terenului: `NP 112-2014`

## 7. Exemplu (P12, unitate DAF, W = 63 kN, pe teren, 1,90 × 3,00 × 2,70 m)

| | P100-1 (ag = 0,15g = 1,47 m/s²) | EC8 (agR = 1,47 m/s², teren D, S = 1,35) |
|---|---|---|
| masa | m = 63 / 9,81 = 6,42 t | W = 63 kN |
| factori | γ = 1,0 · β = 1,0 · q = 2,5 · Kz = 1 | γa = 1,0 · qa = 1,0 |
| (10.1) / Sa | 0,4·ag·m = 3,77 kN | Sa = 0,1498·1,35 = 0,2023 |
| F de calcul | max(3,77; 0,75·1,47·6,42 = **7,08 kN**) | **12,74 kN** |
| M (hg = 1,35 m) | 9,56 kNm | 17,21 kNm |

> Diferența vine mai ales din factorul de teren S și din q. Pentru o investiție în România P100-1 este obligatoriu; valoarea EC8 este acoperitoare.

**Introducere în programul de calcul:** un grup de încărcări „Seism" cu ipotezele EX și EY; combinații: G + ψ2Q + EX ± 0,30·EY și 0,30·EX ± EY, cu ambele semne (8 combinații). Resortul terenului se setează doar la compresiune. [i]Dacă pe model rulează și calcul modal, nu introduce forța utilajului de două ori.[/i]

---
*Surse: P100-1/2013 (modificat 2019) 10.3.1–10.3.1.3, tabelele 10.1–10.2; SR EN 1998-1 4.3.5; SR EN 1997-1 6.5.3, 6.5.4; SR EN 1990 (6.12b).*
</script>
<script type="text/markdown" data-id="gepek-szeizmikus-ero" data-num="06" data-cat="seismic" data-calc="ccns,cfa" data-lang="en">
title: Seismic force on machinery and equipment
sub: Per P100-1/2013 ch. 10 (NSC) and SR EN 1998-1 4.3.5
---
**When?** Anchoring machines, tanks, pipe supports, roof-mounted equipment, and checking the equipment slab.

## 1. Principle

The machine is treated as a **non-structural component** (Romanian CNS): the horizontal force is computed by hand and applied at the machine's **centre of gravity**. That way the overturning moment appears correctly, and it governs the anchors and the slab. [i]A modal analysis would usually place the machine's mass in the slab plane and lose the overturning moment.[/i]

The force computed here is used **only** for the component, its fastenings and the local check of its support; it is not added to the seismic force of the whole structure. `P100-1/2013, 10.3.1 (3)`

## 2. Romanian code – P100-1/2013, 10.3.1.2

$$F_{CNS}(z) = \frac{\gamma_{CNS}\;a_g\;\beta_{CNS}\;K_z}{q_{CNS}}\;m_{CNS} \qquad (10.1)$$

$$K_z = 1 + 2\,\frac{z}{H}$$

- **ag** design ground acceleration [m/s²], **m_CNS** maximum operating mass [t] → force in kN [i]Operating mass = self-weight + contents. For tanks, the full state.[/i]
- **z** height of the attachment above the building base, **H** average roof height [i]Machine on its own slab on the ground: z = 0, so K_z = 1. Machine on the roof: z = H, K_z = 3.[/i]
- **γ_CNS** importance factor: **≥ 1.5** for vessels with toxic or explosive contents, essential components and those on escape routes, public-access racking; otherwise **γCNS = γI,e** [i]P100-1/2013 10.3.1.3.1 (1) and (2), unchanged by the 2019 amendment.[/i]
- **β_CNS** dynamic amplification factor and **q_CNS** behaviour factor: from the tables (below)

Bounds:

$$0.75\;\gamma_{CNS}\,a_g\,m_{CNS} \;\le\; F_{CNS} \;\le\; 4\;\gamma_{CNS}\,a_g\,m_{CNS} \qquad (10.2)$$

The vertical force is computed the same way with the vertical acceleration (a_vg, (3.16)). `P100-1/2013, 10.3.1.2 (5)`

| Equipment (P100-1 Tables 10.1–10.2, extract) | β_CNS | q_CNS |
|---|---|---|
| Boilers; pressure vessels on skirts or free-standing | 1.0 | 2.5 |
| Electrical equipment | 1.0 | 2.5 |
| HVAC, not vibration-isolated | 1.0 | 2.5 |
| HVAC, neoprene isolators | 2.5 | 2.5 |
| HVAC, spring isolators | 2.5 | 2.0 |
| Outdoor equipment | 2.5 | 6.0 |
| Cantilever chimneys, vent stacks (anchored below CG) | 2.5 | 1.5 |
| Lifts, escalators | 1.0 | 2.5 |

> **Rigid machine on the ground** (z = 0, β = 1, q = 2.5): (10.1) gives 0.4·γ·ag·m, below the lower bound – **the design force is 0.75·γ·ag·m**.

The force acts at the centre of gravity, in the most unfavourable direction. `P100-1/2013, 10.3.1.2 (6)`

## 3. Eurocode route – SR EN 1998-1, 4.3.5

$$F_a = \frac{S_a\;W_a\;\gamma_a}{q_a} \qquad (4.24)$$

$$S_a = \alpha\,S\left[\frac{3\,(1 + z/H)}{1 + (1 - T_a/T_1)^2} - 0.5\right] \ge \alpha\,S \qquad (4.25)$$

- α = ag/g, S soil factor (A–E) [i]Type 1 spectrum: A 1.00 · B 1.20 · C 1.15 · D 1.35 · E 1.40.[/i]
- **Machine on the ground, on its own foundation:** z = 0, no amplifying T1, so $S_a = \alpha\,S$
- **Flexible machine** (if the manufacturer gives T_a): $S_a = \max\{\alpha S;\; S_e(T_a)/g\}$ [i]Engineering extension: the machine responds as a single-degree-of-freedom oscillator. At resonance (Ta = T1, z = 0) (4.25) also gives 2.5·α·S, the spectrum plateau – the two agree.[/i]
- γa ≥ 1.5 for tanks with toxic/explosive contents, otherwise 1.0; qa = 1.0 cantilever (more than half unbraced), 2.0 otherwise `4.3.5.3, Table 4.4`

## 4. Centre of gravity and overturning moment

$$h_g = h_0 + \eta\,(H_g - h_0) \qquad M = F \cdot h_g$$

H_g total machine height, h_0 leg or pedestal height, η relative CG position (0.5 for uniform mass). [i]Use the manufacturer's real CG when available.[/i]

## 5. Load transfer to the slab

**Machine on legs** (n legs):

$$V_{leg} = \frac{F}{n} \qquad \Delta N = \frac{4M}{n\,D_c}\;\text{(circle)} \qquad \Delta N = \frac{2M}{n\,a}\;\text{(rectangle)}$$

If $W/n - \Delta N < 0$, the leg must be anchored.

**Machine bearing on an area** (box, skid; b along the earthquake, d across):

$$p_x = \frac{F}{A_{bear}} \qquad p_{z,max} = \pm\frac{6M}{b^2 d} \qquad q_{two\,halves} = \pm\frac{4M}{b^2 d}$$

No uplift if $W/A_{bear} - p_{z,max} \ge 0$.

## 6. Slab on the ground

$$F_{slab} = \alpha S\,W_{slab} \;\text{(EC)} \quad\text{or}\quad 0.75\,\gamma\,a_g\,m_{slab}\;\text{(P100-1 logic)}$$

$$e = \frac{F\,(t + h_g) + F_{slab}\,t/2}{W + W_{slab}} \qquad \sigma_{max,min} = \frac{N}{BL}\left(1 \pm \frac{6e}{B}\right)\;(e \le B/6)$$

Sliding: $F + F_{slab} \le N\,\tan\delta$ – cast-in-place concrete δ = φ_cv `SR EN 1997-1, 6.5.3` · eccentricity: `6.5.4` · Romanian bearing check: `NP 112-2014`

## 7. Example (P12, DAF unit, W = 63 kN, on the ground, 1.90 × 3.00 × 2.70 m)

| | P100-1 (ag = 0.15g = 1.47 m/s²) | EC8 (agR = 1.47 m/s², ground D, S = 1.35) |
|---|---|---|
| mass | m = 63 / 9.81 = 6.42 t | W = 63 kN |
| factors | γ = 1.0 · β = 1.0 · q = 2.5 · Kz = 1 | γa = 1.0 · qa = 1.0 |
| (10.1) / Sa | 0.4·ag·m = 3.77 kN | Sa = 0.1498·1.35 = 0.2023 |
| design F | max(3.77; 0.75·1.47·6.42 = **7.08 kN**) | **12.74 kN** |
| M (hg = 1.35 m) | 9.56 kNm | 17.21 kNm |

> The difference comes mainly from the soil factor S and from q. For a project built in Romania P100-1 is mandatory; the EC8 value is on the safe side.

**Input to FE software:** one "Seismic" load group with EX and EY cases; combinations G + ψ2Q + EX ± 0.30·EY and 0.30·EX ± EY, both signs (8 combinations). Set the soil springs to compression-only. [i]If a modal analysis also runs on the model, do not apply the machine force twice.[/i]

---
*Sources: P100-1/2013 (amended 2019) 10.3.1–10.3.1.3, Tables 10.1–10.2; SR EN 1998-1 4.3.5; SR EN 1997-1 6.5.3, 6.5.4; SR EN 1990 (6.12b).*
</script>
<script type="text/markdown" data-id="talajmodulusok" data-num="07" data-cat="found" data-calc="cmod" data-lang="hu">
title: Talajmodulusok: Eoed – Es – Em
sub: NP 112-2014 J melléklet és SR EN 1997-1 F melléklet szerint
---
**Mikor kell?** Ha a geotechnikai szakvélemény ödometrikus modulust ad, de a süllyedés- vagy ágyazásiszám-számításhoz más modulus kell.

## 1. A fogalmak – figyelj a jelölésre!

| Jelölés | Jelentés | Hol használjuk |
|---|---|---|
| E_oed (M, M2-3) | ödometrikus modulus, oldalirányban gátolt összenyomódás | laborvizsgálat eredménye |
| **E_s (román)** | *modul de deformație liniară* = M0 · E_oed | NP 112 süllyedésszámítás |
| **Es (magyar szokás)** | = E_oed, ugyanaz a mennyiség | magyar gyakorlat, EC7 F1 |
| E_m = E | rugalmassági (Young-) modulus, drénezett | EC7 F2, rugalmas féltér |
| E_u | drénezetlen modulus | azonnali süllyedés |

> **Csapda:** a román NP 112-ben az E_s **nagyobb** az E_oed-nél (M0 ≥ 1), a rugalmasságtani Em viszont **kisebb** nála. Ugyanaz a betű két különböző mennyiséget jelöl a két gyakorlatban. [i]Az M0 tapasztalati szorzó: a laborminta zavartságát és a labor–terep különbséget korrigálja. A rugalmasságtani átváltás ezzel szemben csak az oldalirányú gátlás hatását veszi le. A kettő nem ugyanazt a jelenséget kezeli, ezért nem szabad keverni.[/i]

## 2. Román előírás – NP 112-2014, J.1.2

$$E_s = M_0 \cdot E_{oed} \qquad (J.1)$$

- E_oed-et abban a feszültségtartományban kell venni, ahol a talaj ténylegesen dolgozik: σ′gz-től σ′gz + σz-ig [i]σ′gz a geológiai (hatékony önsúly-) feszültség a mintavétel mélységében, σz az alapból származó többletfeszültség ugyanott.[/i]
- M0 a J.1 táblázatból, kísérleti adat hiányában; I_c < 0,5 vagy e > 1,10 esetén M0 = 1

| Talaj | I_c | e 0,41–0,60 | 0,61–0,80 | 0,81–1,00 | 1,01–1,10 |
|---|---|---|---|---|---|
| Homok | – | 1,0 | 1,0 | – | – |
| Agyagos homok, homokos iszap, homokos agyag | 0–1,00 | 1,6 | 1,3 | 1,0 | – |
| Iszap, agyagos iszap, iszapos agyag | 0,76–1,00 | 2,3 | 1,7 | 1,3 | 1,1 |
| | 0,50–0,75 | 1,9 | 1,5 | 1,2 | 1,0 |
| Agyag, kövér agyag | 0,76–1,00 | 1,8 | 1,5 | 1,3 | 1,2 |
| | 0,50–0,75 | 1,5 | 1,3 | 1,1 | 1,0 |

`NP 112-2014, J.1 táblázat`

Poisson-tényező kísérlet hiányában `NP 112-2014, J.3 táblázat`:

| Talaj | ν |
|---|---|
| Görgeteg, kavics | 0,27 |
| Homok (iszapos és agyagos homok is) | 0,30 |
| Iszap, agyagos iszap, homokos agyag, iszapos agyag | 0,35 |
| Agyag, kövér agyag | 0,42 |

Előtervezéshez a J.2 táblázat tájékoztató E_s értékeket ad (pl. kaviccsal kevert homok e = 0,45 mellett 50 000 kPa). `NP 112-2014, J.1.4`

## 3. Eurocode út – rugalmasságtani átváltás

$$E_m = E_{oed}\,\frac{(1+\nu)(1-2\nu)}{1-\nu} \qquad E_{oed} = E_m\,\frac{1-\nu}{(1+\nu)(1-2\nu)}$$

| ν | Em / Eoed | Em, ha Eoed = 36 MPa |
|---|---|---|
| 0,25 | 0,833 | 30,0 MPa |
| 0,30 | 0,743 | 26,7 MPa |
| 0,35 | 0,623 | 22,4 MPa |
| 0,40 | 0,467 | 16,8 MPa |

- **F1 (rétegösszegzés):** Δs = σz·Δz / E_oed – gátolt oldalirányú alakváltozás, ezért az E_oed a megfelelő `SR EN 1997-1, F melléklet`
- **F2 (rugalmas féltér):** s = p·B·f / E_m – itt E_m kell
- **F3:** drénezetlen paraméterek (E_u, ν_u)

## 4. ν becslése Jáky szerint

$$K_0 = 1 - \sin\varphi' \qquad \nu = \frac{K_0}{1 + K_0}$$

Normálisan konszolidált talajra, drénezett állapotban. φ′ = 35° → ν = 0,30; φ′ = 20° → 0,40; φ′ = 15° → 0,43 (drénezett számításhoz 0,40-nél szokás megállni). `SR EN 1997-1, (9.1)` [i]Túlkonszolidált talajnál K0 nagyobb, a képlet ott csak közelítés.[/i]

## 5. Mire figyelj

- Az ödometrikus modulus erősen függ a feszültségszinttől – mindig nézd meg, milyen tartományra adták meg.
- Kis terhelésű alapoknál (gépalapok) a valós tartomány néhányszor 10 kPa; nagyobb tartományra megadott érték általában a biztonság javára téved.
- A román breviárba E_s = M0·E_oed kerül, és mindig írd ki, honnan van az M0.

---
*Források: NP 112-2014 J.1–J.3; SR EN 1997-1:2004 F melléklet, 9.5.2; Jáky J. (1944).*
</script>
<script type="text/markdown" data-id="talajmodulusok" data-num="07" data-cat="found" data-calc="cmod" data-lang="ro">
title: Module de deformație: Eoed – Es – Em
sub: Conform NP 112-2014 anexa J și SR EN 1997-1 anexa F
---
**Când e nevoie?** Când studiul geotehnic dă modulul edometric, dar pentru tasări sau coeficientul de pat e nevoie de alt modul.

## 1. Noțiuni – atenție la notații!

| Notație | Semnificație | Unde se folosește |
|---|---|---|
| E_oed (M, M2-3) | modul edometric, deformație laterală împiedicată | rezultat de laborator |
| **E_s (RO)** | modul de deformație liniară = M0 · E_oed | calculul tasărilor NP 112 |
| **Es (practica maghiară)** | = E_oed, aceeași mărime | practica din Ungaria, EC7 F1 |
| E_m = E | modul de elasticitate (Young), drenat | EC7 F2, semispațiu elastic |
| E_u | modul nedrenat | tasare imediată |

> **Capcană:** în NP 112 E_s este **mai mare** decât E_oed (M0 ≥ 1), pe când modulul elastic Em este **mai mic**. Aceeași literă desemnează două mărimi diferite în cele două practici. [i]M0 este un coeficient empiric: corectează perturbarea probei și diferența laborator–teren. Conversia elastică, în schimb, elimină doar efectul împiedicării laterale. Tratează fenomene diferite și nu trebuie amestecate.[/i]

## 2. Reglementarea românească – NP 112-2014, J.1.2

$$E_s = M_0 \cdot E_{oed} \qquad (J.1)$$

- E_oed se ia în intervalul de eforturi în care lucrează efectiv terenul: de la σ′gz la σ′gz + σz [i]σ′gz efortul geologic la adâncimea de recoltare, σz efortul suplimentar din fundație la aceeași adâncime.[/i]
- M0 din tabelul J.1, în lipsa datelor experimentale; pentru I_c < 0,5 sau e > 1,10 se acceptă M0 = 1

| Pământ | I_c | e 0,41–0,60 | 0,61–0,80 | 0,81–1,00 | 1,01–1,10 |
|---|---|---|---|---|---|
| Nisipuri | – | 1,0 | 1,0 | – | – |
| Nisip argilos, praf nisipos, argilă nisipoasă | 0–1,00 | 1,6 | 1,3 | 1,0 | – |
| Praf, praf argilos, argilă prăfoasă | 0,76–1,00 | 2,3 | 1,7 | 1,3 | 1,1 |
| | 0,50–0,75 | 1,9 | 1,5 | 1,2 | 1,0 |
| Argilă, argilă grasă | 0,76–1,00 | 1,8 | 1,5 | 1,3 | 1,2 |
| | 0,50–0,75 | 1,5 | 1,3 | 1,1 | 1,0 |

`NP 112-2014, tabelul J.1`

Coeficientul lui Poisson în lipsa încercărilor `NP 112-2014, tabelul J.3`:

| Pământ | ν |
|---|---|
| Bolovănișuri și pietrișuri | 0,27 |
| Nisipuri (inclusiv prăfoase și argiloase) | 0,30 |
| Praf, praf argilos, argilă nisipoasă, argilă prăfoasă | 0,35 |
| Argilă, argilă grasă | 0,42 |

Pentru predimensionare, tabelul J.2 dă valori orientative E_s (de ex. nisip cu pietriș, e = 0,45: 50 000 kPa). `NP 112-2014, J.1.4`

## 3. Varianta Eurocode – conversie elastică

$$E_m = E_{oed}\,\frac{(1+\nu)(1-2\nu)}{1-\nu} \qquad E_{oed} = E_m\,\frac{1-\nu}{(1+\nu)(1-2\nu)}$$

| ν | Em / Eoed | Em pentru Eoed = 36 MPa |
|---|---|---|
| 0,25 | 0,833 | 30,0 MPa |
| 0,30 | 0,743 | 26,7 MPa |
| 0,35 | 0,623 | 22,4 MPa |
| 0,40 | 0,467 | 16,8 MPa |

- **F1 (însumare pe straturi):** Δs = σz·Δz / E_oed – deformație laterală împiedicată, deci E_oed `SR EN 1997-1, anexa F`
- **F2 (semispațiu elastic):** s = p·B·f / E_m – aici e nevoie de E_m
- **F3:** parametri nedrenați (E_u, ν_u)

## 4. Estimarea lui ν după Jáky

$$K_0 = 1 - \sin\varphi' \qquad \nu = \frac{K_0}{1 + K_0}$$

Pentru pământ normal consolidat, stare drenată. φ′ = 35° → ν = 0,30; φ′ = 20° → 0,40; φ′ = 15° → 0,43 (pentru calcul drenat uzual se limitează la 0,40). `SR EN 1997-1, (9.1)` [i]La pământuri supraconsolidate K0 este mai mare; formula este doar aproximativă.[/i]

## 5. Atenție

- Modulul edometric depinde puternic de nivelul eforturilor – verifică intervalul pentru care a fost dat.
- La fundații slab încărcate (fundații de utilaje) intervalul real este de câteva zeci de kPa; o valoare dată pe un interval mai mare este de regulă acoperitoare.
- În breviarul românesc se scrie E_s = M0·E_oed și se indică sursa lui M0.

---
*Surse: NP 112-2014 J.1–J.3; SR EN 1997-1:2004 anexa F, 9.5.2; Jáky J. (1944).*
</script>
<script type="text/markdown" data-id="talajmodulusok" data-num="07" data-cat="found" data-calc="cmod" data-lang="en">
title: Soil moduli: Eoed – Es – Em
sub: Per NP 112-2014 Annex J and SR EN 1997-1 Annex F
---
**When?** When the geotechnical report gives the oedometer modulus but the settlement or subgrade-modulus calculation needs another one.

## 1. Definitions – watch the symbols!

| Symbol | Meaning | Used in |
|---|---|---|
| E_oed (M, M2-3) | oedometer (constrained) modulus | laboratory result |
| **E_s (Romanian)** | linear deformation modulus = M0 · E_oed | NP 112 settlement |
| **Es (Hungarian habit)** | = E_oed, the same quantity | Hungarian practice, EC7 F1 |
| E_m = E | Young's modulus, drained | EC7 F2, elastic half-space |
| E_u | undrained modulus | immediate settlement |

> **Trap:** in NP 112 E_s is **larger** than E_oed (M0 ≥ 1), while the elastic Em is **smaller**. The same letter means two different things in the two practices. [i]M0 is empirical: it corrects for sample disturbance and the lab–field difference. The elastic conversion only removes the effect of lateral confinement. They address different phenomena and must not be mixed.[/i]

## 2. Romanian code – NP 112-2014, J.1.2

$$E_s = M_0 \cdot E_{oed} \qquad (J.1)$$

- Take E_oed over the stress range the soil actually works in: from σ′gz to σ′gz + σz [i]σ′gz is the geostatic effective stress at sampling depth, σz the added stress from the foundation at that depth.[/i]
- M0 from Table J.1 when no test data exist; for I_c < 0.5 or e > 1.10, M0 = 1

| Soil | I_c | e 0.41–0.60 | 0.61–0.80 | 0.81–1.00 | 1.01–1.10 |
|---|---|---|---|---|---|
| Sands | – | 1.0 | 1.0 | – | – |
| Clayey sand, sandy silt, sandy clay | 0–1.00 | 1.6 | 1.3 | 1.0 | – |
| Silt, clayey silt, silty clay | 0.76–1.00 | 2.3 | 1.7 | 1.3 | 1.1 |
| | 0.50–0.75 | 1.9 | 1.5 | 1.2 | 1.0 |
| Clay, fat clay | 0.76–1.00 | 1.8 | 1.5 | 1.3 | 1.2 |
| | 0.50–0.75 | 1.5 | 1.3 | 1.1 | 1.0 |

`NP 112-2014, Table J.1`

Poisson's ratio without tests `NP 112-2014, Table J.3`:

| Soil | ν |
|---|---|
| Boulders, gravels | 0.27 |
| Sands (incl. silty and clayey sands) | 0.30 |
| Silt, clayey silt, sandy clay, silty clay | 0.35 |
| Clay, fat clay | 0.42 |

For preliminary design Table J.2 gives indicative E_s values (e.g. sand with gravel, e = 0.45: 50 000 kPa). `NP 112-2014, J.1.4`

## 3. Eurocode route – elastic conversion

$$E_m = E_{oed}\,\frac{(1+\nu)(1-2\nu)}{1-\nu} \qquad E_{oed} = E_m\,\frac{1-\nu}{(1+\nu)(1-2\nu)}$$

| ν | Em / Eoed | Em for Eoed = 36 MPa |
|---|---|---|
| 0.25 | 0.833 | 30.0 MPa |
| 0.30 | 0.743 | 26.7 MPa |
| 0.35 | 0.623 | 22.4 MPa |
| 0.40 | 0.467 | 16.8 MPa |

- **F1 (layer summation):** Δs = σz·Δz / E_oed – lateral strain prevented, so E_oed `SR EN 1997-1, Annex F`
- **F2 (elastic half-space):** s = p·B·f / E_m – needs E_m
- **F3:** undrained parameters (E_u, ν_u)

## 4. Estimating ν after Jáky

$$K_0 = 1 - \sin\varphi' \qquad \nu = \frac{K_0}{1 + K_0}$$

Normally consolidated soil, drained. φ′ = 35° → ν = 0.30; φ′ = 20° → 0.40; φ′ = 15° → 0.43 (usually capped at 0.40 for drained analysis). `SR EN 1997-1, (9.1)` [i]For overconsolidated soil K0 is larger; the formula is only an approximation there.[/i]

## 5. Watch out

- The oedometer modulus depends strongly on stress level – check the range it was given for.
- Lightly loaded foundations (machine bases) work over a few tens of kPa; a value for a larger range is usually on the safe side.
- In a Romanian calculation report write E_s = M0·E_oed and state where M0 comes from.

*Sources: NP 112-2014 J.1–J.3; SR EN 1997-1:2004 Annex F, 9.5.2; Jáky J. (1944).*

title: Süllyedésszámítás – rétegösszegzés
sub: NP 112-2014 H melléklet, összevetve az SR EN 1997-1 F mellékletével

**Mikor kell?** Síkalapok és lemezalapok abszolút és relatív süllyedéséhez, szomszédos épületek egymásra hatásához.

## 1. Nettó nyomás az alapsíkon

$$p_{net} = p_{ef,med} - \gamma\,D \qquad (H.1) \qquad p_{ef,med} = V_d / A$$

- V_d a teljes teher az alapsíkon (szerkezet + alap + ráterhelő talaj), γ a talaj átlagos térfogatsúlya az alapsík felett, D az alapozási mélység [i]Széles (B > 10 m) munkagödörnél kötött talajban, ha a gödör feneke megemelkedhet, p_net = p_ef,med (a kiemelt talaj tehermentesítő hatása nélkül), és a p_net < γD tartományban az újraterhelési modulus használható.[/i]

$$\sigma_z = \alpha_0 \cdot p_{net} \qquad (H.2)$$

## 3. Elemi rétegek és aktív zóna

- Elemi réteg vastagsága: **h_i ≤ 0,4·B**, rétegen belül homogén talaj `H.2.1 (3)`
- Az aktív zóna alja (z0), ahol $\sigma_z \le 0{,}2\,\sigma_{gz}$ `(H.3)` [i]σgz a geológiai (önsúly-) feszültség ugyanabban a mélységben – talajvíz alatt a víz alatti térfogatsúllyal.[/i]
- Ha a határ egy jóval puhább rétegbe esik, vagy E_s < 5000 kPa: a réteget be kell venni, illetve $\sigma_z \le 0{,}1\,\sigma_{gz}$ `(H.4)`
- Gyakorlatilag összenyomhatatlan réteg (E_s > 100 000 kPa) tetejénél az aktív zóna lezárható

## 4. A süllyedés

$$s = \beta \sum_{i=1}^{n} \frac{\sigma_{zi}^{med}\,h_i}{E_{s,i}} \qquad \beta = 0{,}8 \qquad (H.5)$$

$$\sigma_{zi}^{med} = \frac{\sigma_{zi}^{sup} + \sigma_{zi}^{inf}}{2}$$

- E_s,i a román lineáris alakváltozási modulus, $E_s = M_0\,E_{oed}$ (lásd a talajmodulus-lapot) [i]kPa-ban és méterben számolva s méterben jön ki. A szabvány cm-ben írja fel, ezért ott 100-as szorzó is szerepel.[/i]

## 5. Szomszédos alapok hatása – sarokpont-módszer

$$\sigma_z = \alpha_c \cdot p_{net} \qquad (H.6)$$

Egy tetszőleges P pont alatt a terhelt téglalapot P-n átmenő vonalakkal négy téglalapra bontjuk, és az α_c tényezőket előjelesen összegezzük `(H.7)`, H.4 táblázat. A szomszéd épület σz-je hozzáadódik a saját feszültséghez. [i]Meglévő épület melletti új alapnál a meglévő épület már lezajlott süllyedését nem szabad újra számolni – csak az új épület okozta többletfeszültség okoz többletsüllyedést a meglévő alatt.[/i]

## 6. Relatív értékek és ellenőrzés

- süllyedéskülönbség Δs, elfordulás tg θ = Δs / L, relatív lehajlás `(H.14)`:

$$f = \frac{2\,s_3 - s_1 - s_2}{2\,l}$$

- Ellenőrzés: $\Delta \le \Delta_{lim}$ `(H.15)` – a határértékek a H.1 táblázatból vagy a szerkezeti tervből; technológiai korlátozású építményeknél (CRE) a technológiai terv adja `NP 112-2014, H.4`

## 7. Eurocode út

SR EN 1997-1, F1: $s = \sum \sigma_z\,\Delta z / E_{oed}$ – nincs β tényező, és az E_oed-et használja (M0 nélkül). A határ mélységére tipikusan a 20%-os kritérium; a határértékekre a H melléklet ad tájékoztatást. `SR EN 1997-1, 6.6, F és H melléklet`

**Când e nevoie?** Pentru tasarea absolută și relativă a fundațiilor de suprafață și a radierelor și pentru influența clădirilor învecinate.

## 1. Presiunea netă la baza fundației

$$p_{net} = p_{ef,med} - \gamma\,D \qquad (H.1) \qquad p_{ef,med} = V_d / A$$

- V_d încărcarea totală la baza fundației (structură + fundație + pământul de pe fundație), γ greutatea volumică medie a pământului de deasupra bazei, D adâncimea de fundare [i]La gropi late (B > 10 m) în pământuri coezive, dacă fundul săpăturii se poate umfla, se acceptă p_net = p_ef,med (fără efectul de descărcare), iar pentru p_net < γD se pot folosi modulele la descărcare.[/i]
- Încărcările din combinația SLS – conform CR 0, după caz caracteristică, cvasipermanentă sau frecventă `NP 112-2014, H.5 (2)`

## 2. Efortul pe verticala centrului

$$\sigma_z = \alpha_0 \cdot p_{net} \qquad (H.2)$$

`NP 112-2014, tabelul H.3` – B latura mică, L latura mare; se admite interpolarea liniară.

## 3. Straturi elementare și zona activă

- Grosimea stratului elementar: **h_i ≤ 0,4·B**, pământ omogen în strat `H.2.1 (3)`
- Limita inferioară a zonei active (z0) unde $\sigma_z \le 0{,}2\,\sigma_{gz}$ `(H.3)` [i]σgz efortul geologic la aceeași adâncime – sub nivelul apei cu greutatea volumică submersată.[/i]
- Dacă limita cade într-un strat mult mai compresibil sau cu E_s < 5000 kPa: se include stratul, respectiv $\sigma_z \le 0{,}1\,\sigma_{gz}$ `(H.4)`
- La un strat practic incompresibil (E_s > 100 000 kPa) zona activă se poate limita la suprafața acestuia

## 4. Tasarea

$$s = \beta \sum_{i=1}^{n} \frac{\sigma_{zi}^{med}\,h_i}{E_{s,i}} \qquad \beta = 0{,}8 \qquad (H.5)$$

$$\sigma_{zi}^{med} = \frac{\sigma_{zi}^{sup} + \sigma_{zi}^{inf}}{2}$$

- E_s,i modulul de deformație liniară, $E_s = M_0\,E_{oed}$ (vezi fișa modulelor) [i]Cu kPa și metri tasarea rezultă în metri. Normativul o scrie în cm, de aceea apare factorul 100.[/i]

## 5. Influența fundațiilor vecine – metoda punctelor de colț

$$\sigma_z = \alpha_c \cdot p_{net} \qquad (H.6)$$

Sub un punct oarecare P, suprafața încărcată se împarte prin drepte care trec prin P în patru dreptunghiuri, iar coeficienții α_c se însumează cu semn `(H.7)`, tabelul H.4. σz din clădirea vecină se adună la efortul propriu. [i]La o fundație nouă lângă o clădire existentă nu se recalculează tasarea deja consumată a clădirii existente – numai efortul suplimentar din clădirea nouă produce tasare suplimentară sub cea existentă.[/i]

## 6. Mărimi relative și verificare

- tasare diferențială Δs, rotire tg θ = Δs / L, încovoiere relativă `(H.14)`:

$$f = \frac{2\,s_3 - s_1 - s_2}{2\,l}$$

- Verificare: $\Delta \le \Delta_{lim}$ `(H.15)` – valori limită din tabelul H.1 sau din proiectul structurii; la construcții cu restricții de deformații (CRE) din proiectul tehnologic `NP 112-2014, H.4`

## 7. Varianta Eurocode

SR EN 1997-1, F1: $s = \sum \sigma_z\,\Delta z / E_{oed}$ – fără factorul β și cu E_oed (fără M0). Pentru adâncimea zonei se folosește uzual criteriul de 20%; pentru valori limită, anexa H dă orientări. `SR EN 1997-1, 6.6, anexele F și H`

$$p_{net} = p_{ef,med} - \gamma\,D \qquad (H.1) \qquad p_{ef,med} = V_d / A$$

$$\sigma_z = \alpha_c \cdot p_{net} \qquad (H.6)$$

<script type="text/markdown" data-id="sikalap-teherbiras" data-num="09" data-cat="found" data-calc="cbear" data-lang="hu">
title: Síkalapok talajtörési ellenőrzése
sub: NP 112-2014 D, F, H melléklet – p_conv, p_pl és R_d (EC7 D melléklet)
---
**Mikor kell?** Talp-, sáv- és lemezalapok méretezésénél. A román gyakorlatban három szint létezik: hagyományos (konvencionális) nyomás, plasztikus nyomás (SLS) és teherbírás (ULS).

## 1. Hagyományos nyomás – p_conv

$$p_{conv} = \bar{p}_{conv} + C_B + C_D \qquad (D.1)$$

- $\bar{p}_{conv}$ alapérték a D.1–D.5 táblázatokból, **B = 1,0 m** szélességre és **D = 2,0 m** mélységre [i]Pl. közepesen tömör középhomok 500 kPa, tömör 600 kPa; tömör durva homok 700 kPa; homokos kavics 550 kPa. Kötött talajnál az e hézagtényező és az I_c konzisztenciaindex szerint, interpolálva.[/i]
- Szélességi korrekció, B ≤ 5 m: $C_B = \bar{p}_{conv}\,K_1\,(B - 1)$, K1 = 0,10 szemcsés talajra (iszapos homok kivételével), 0,05 iszapos homokra és kötött talajra; B > 5 m: C_B = 0,4·p̄ ill. 0,2·p̄ `D.2.1`
- Mélységi korrekció: D ≤ 2 m: $C_D = \bar{p}_{conv}\,(D - 2)/4$; D > 2 m: $C_D = \gamma\,(D - 2)$ `D.2.2` [i]γ az alapsík feletti rétegek súlyozott átlagos térfogatsúlya. Pinceszintes épületeknél a D értelmezésére figyelj (a szabvány külön szabályt ad).[/i]

Használat: előtervezés, illetve egyszerű feltételek mellett hagyományos építményekre. Ellenőrzés: $p_{ef,med} \le p_{conv}$, külpontos terhelésnél $p_{ef,max} \le 1{,}2\,p_{conv}$ (egy irányban) [i]A külpontos esetek szorzóit (1,2 egy irányban, 1,4 két irányban) a NP 112 1. fejezetében ellenőrizd – a szöveg a projekt PDF-jéből nem olvasható ki biztosan.[/i]

## 2. Plasztikus nyomás – p_pl (SLS)

Pince nélküli épület:

$$p_{pl} = m_L\,(\bar{\gamma}\,B\,N_1 + q\,N_2 + c\,N_3) \qquad (H.16)$$

Pinces épület:

$$p_{pl} = m_L\left[\bar{\gamma}\,B\,N_1 + \frac{2q_e + q_i}{3}\,N_2 + c\,N_3\right] \qquad (H.17)$$

- m_L a munkakörülményi tényező (H.7 táblázat): kavics, görgeteg 2,0 · finom homok 1,7 / 1,6 (telített) · iszapos homok 1,5 / 1,3 · kötött talaj I_c ≥ 0,5: 1,4 · I_c < 0,5: 1,1
- $\bar{\gamma}$ az alapsík alatti B/4 mélységű réteg súlyozott térfogatsúlya, q az oldalsó terhelés az alapsík szintjén (≈ γ·D), c a kohézió
- N1, N2, N3 a φ függvényében (H.8 táblázat): φ = 20° → 0,51 / 3,06 / 5,66 · 25° ≈ 0,78 / 4,12 / 6,68 · 30° → 1,15 / 5,59 / 7,95 [i]SLS-ben a talaj parciális tényezői 1,0 – karakterisztikus paraméterekkel számolunk.[/i]
- Kör vagy sokszög alapnál az egyenértékű szélesség $B = \sqrt{A}$

Ellenőrzés: $p_{ef,med} \le p_{pl}$ és a külpontos csúcsnyomásokra a megfelelő szorzós feltétel. `NP 112-2014, H.5 (3)`

## 3. Teherbírás – ULS (az EC7 D mellékletével azonos)

Drénezett állapot:

$$R_d = A'\left(c'\,N_c\,b_c\,s_c\,i_c + q'\,N_q\,b_q\,s_q\,i_q + 0{,}5\,\gamma'\,B'\,N_\gamma\,b_\gamma\,s_\gamma\,i_\gamma\right) \qquad (F.2)$$

$$N_q = e^{\pi\tan\varphi'}\tan^2(45° + \varphi'/2) \qquad N_c = (N_q - 1)\cot\varphi' \qquad N_\gamma = 2\,(N_q - 1)\tan\varphi'$$

Drénezetlen állapot:

$$R_d = A'\,\left[(\pi + 2)\,c_u\,b_c\,s_c\,i_c + q\right] \qquad (F.1)$$

- A′ = B′·L′ a hatékony (redukált) felület: B′ = B − 2e_B, L′ = L − 2e_L
- alaktényezők téglalapra: $s_q = 1 + (B'/L')\sin\varphi'$, $s_\gamma = 1 - 0{,}3\,B'/L'$; drénezetlen $s_c = 1 + 0{,}2\,B'/L'$
- Ellenőrzés: $V_d \le R_d$ – a román NA szerinti tervezési megközelítéssel és parciális tényezőkkel `SR EN 1997-1, 6.5.2, D melléklet` · `NP 112-2014, F melléklet`

## 4. Eurocode út

Az EC7 ugyanazt a D mellékletet használja; p_conv és p_pl fogalma nincs benne. A használhatóságot a süllyedés-számítás igazolja (6.6), a teherbírást az R_d. A második generációs EN 1997-1:2024-hez a román NA tervezete 2025-ben volt közvéleményen.

---
*Források: NP 112-2014 D.1–D.2, F.1–F.2, H.5, H.7–H.8 táblázat; SR EN 1997-1:2004 6.5, D melléklet.*

title: Capacitatea portantă a fundațiilor de suprafață
sub: NP 112-2014 anexele D, F, H – p_conv, p_pl și R_d (EC7 anexa D)
---
**Când e nevoie?** La dimensionarea fundațiilor izolate, continue și a radierelor. În practica românească există trei niveluri: presiunea convențională, presiunea plastică (SLS) și capacitatea portantă (SLU).

## 1. Presiunea convențională – p_conv

$$p_{conv} = \bar{p}_{conv} + C_B + C_D \qquad (D.1)$$

- $\bar{p}_{conv}$ valoarea de bază din tabelele D.1–D.5, pentru **B = 1,0 m** și **D = 2,0 m** [i]De ex. nisip mijlociu de îndesare medie 500 kPa, îndesat 600 kPa; nisip mare îndesat 700 kPa; pietriș cu nisip 550 kPa. La pământuri coezive după indicele porilor e și indicele de consistență I_c, prin interpolare.[/i]
- Corecția de lățime, B ≤ 5 m: $C_B = \bar{p}_{conv}\,K_1\,(B - 1)$, K1 = 0,10 pentru pământuri necoezive (exceptând nisipurile prăfoase), 0,05 pentru nisipuri prăfoase și pământuri coezive; B > 5 m: C_B = 0,4·p̄ resp. 0,2·p̄ `D.2.1`
- Corecția de adâncime: D ≤ 2 m: $C_D = \bar{p}_{conv}\,(D - 2)/4$; D > 2 m: $C_D = \gamma\,(D - 2)$ `D.2.2` [i]γ greutatea volumică medie ponderată a straturilor de deasupra tălpii. La clădiri cu subsol atenție la definirea lui D (normativul dă reguli separate).[/i]

Utilizare: predimensionare, respectiv construcții obișnuite în condiții simple. Verificare: $p_{ef,med} \le p_{conv}$, la încărcare excentrică $p_{ef,max} \le 1{,}2\,p_{conv}$ (pe o direcție) [i]Verifică coeficienții pentru excentricitate (1,2 pe o direcție, 1,4 pe două) în cap. 1 al NP 112 – textul nu se citește sigur din PDF-ul proiectului.[/i]

## 2. Presiunea plastică – p_pl (SLS)

Construcții fără subsol:

$$p_{pl} = m_L\,(\bar{\gamma}\,B\,N_1 + q\,N_2 + c\,N_3) \qquad (H.16)$$

Construcții cu subsol:

$$p_{pl} = m_L\left[\bar{\gamma}\,B\,N_1 + \frac{2q_e + q_i}{3}\,N_2 + c\,N_3\right] \qquad (H.17)$$

- m_L coeficientul condițiilor de lucru (tabelul H.7): bolovănișuri, pietrișuri 2,0 · nisipuri fine 1,7 / 1,6 (saturate) · nisipuri prăfoase 1,5 / 1,3 · pământuri coezive I_c ≥ 0,5: 1,4 · I_c < 0,5: 1,1
- $\bar{\gamma}$ media ponderată a greutăților volumice pe adâncimea B/4 sub talpă, q suprasarcina laterală la nivelul tălpii (≈ γ·D), c coeziunea
- N1, N2, N3 funcție de φ (tabelul H.8): φ = 20° → 0,51 / 3,06 / 5,66 · 25° ≈ 0,78 / 4,12 / 6,68 · 30° → 1,15 / 5,59 / 7,95 [i]La SLS coeficienții parțiali pentru pământ sunt 1,0 – se lucrează cu parametrii caracteristici.[/i]
- La fundații circulare sau poligonale, latura echivalentă $B = \sqrt{A}$

Verificare: $p_{ef,med} \le p_{pl}$ și condițiile corespunzătoare pentru presiunile maxime la excentricitate. `NP 112-2014, H.5 (3)`

## 3. Capacitatea portantă – SLU (identic cu EC7 anexa D)

Condiții drenate:

$$R_d = A'\left(c'\,N_c\,b_c\,s_c\,i_c + q'\,N_q\,b_q\,s_q\,i_q + 0{,}5\,\gamma'\,B'\,N_\gamma\,b_\gamma\,s_\gamma\,i_\gamma\right) \qquad (F.2)$$

$$N_q = e^{\pi\tan\varphi'}\tan^2(45° + \varphi'/2) \qquad N_c = (N_q - 1)\cot\varphi' \qquad N_\gamma = 2\,(N_q - 1)\tan\varphi'$$

Condiții nedrenate:

$$R_d = A'\,\left[(\pi + 2)\,c_u\,b_c\,s_c\,i_c + q\right] \qquad (F.1)$$

- A′ = B′·L′ aria redusă: B′ = B − 2e_B, L′ = L − 2e_L
- factori de formă dreptunghi: $s_q = 1 + (B'/L')\sin\varphi'$, $s_\gamma = 1 - 0{,}3\,B'/L'$; nedrenat $s_c = 1 + 0{,}2\,B'/L'$
- Verificare: $V_d \le R_d$ – cu abordarea de calcul și coeficienții parțiali din anexa națională `SR EN 1997-1, 6.5.2, anexa D` · `NP 112-2014, anexa F`

## 4. Varianta Eurocode

EC7 folosește aceeași anexă D; noțiunile p_conv și p_pl nu există. Starea de serviciu se justifică prin calculul tasărilor (6.6), iar SLU prin R_d. Pentru generația a doua EN 1997-1:2024, proiectul anexei naționale a fost în anchetă publică în 2025.

---

title: Bearing check of shallow foundations
sub: NP 112-2014 Annexes D, F, H – p_conv, p_pl and R_d (EC7 Annex D)
---
**When?** Sizing pads, strips and rafts. Romanian practice has three levels: conventional pressure, plastic pressure (SLS) and bearing resistance (ULS).

## 1. Conventional pressure – p_conv

$$p_{conv} = \bar{p}_{conv} + C_B + C_D \qquad (D.1)$$

- $\bar{p}_{conv}$ base value from Tables D.1–D.5, for **B = 1.0 m** width and **D = 2.0 m** depth [i]E.g. medium-dense medium sand 500 kPa, dense 600 kPa; dense coarse sand 700 kPa; sandy gravel 550 kPa. For cohesive soils by void ratio e and consistency index I_c, interpolated.[/i]
- Width correction, B ≤ 5 m: $C_B = \bar{p}_{conv}\,K_1\,(B - 1)$, K1 = 0.10 for cohesionless soils (except silty sands), 0.05 for silty sands and cohesive soils; B > 5 m: C_B = 0.4·p̄ or 0.2·p̄ `D.2.1`
- Depth correction: D ≤ 2 m: $C_D = \bar{p}_{conv}\,(D - 2)/4$; D > 2 m: $C_D = \gamma\,(D - 2)$ `D.2.2` [i]γ is the weighted mean unit weight above the base. With basements, mind the definition of D (the code has separate rules).[/i]

Use: preliminary design, and ordinary buildings under simple conditions. Check: $p_{ef,med} \le p_{conv}$, eccentric loading $p_{ef,max} \le 1.2\,p_{conv}$ (one direction) [i]Confirm the eccentricity factors (1.2 one way, 1.4 two ways) in NP 112 chapter 1 – the text is not reliably legible in the project PDF.[/i]

## 2. Plastic pressure – p_pl (SLS)

Buildings without basement:

$$p_{pl} = m_L\,(\bar{\gamma}\,B\,N_1 + q\,N_2 + c\,N_3) \qquad (H.16)$$

Buildings with basement:

$$p_{pl} = m_L\left[\bar{\gamma}\,B\,N_1 + \frac{2q_e + q_i}{3}\,N_2 + c\,N_3\right] \qquad (H.17)$$

- m_L working-condition factor (Table H.7): boulders, gravels 2.0 · fine sands 1.7 / 1.6 (saturated) · silty sands 1.5 / 1.3 · cohesive I_c ≥ 0.5: 1.4 · I_c < 0.5: 1.1
- $\bar{\gamma}$ weighted unit weight over B/4 below the base, q lateral surcharge at base level (≈ γ·D), c cohesion
- N1, N2, N3 as functions of φ (Table H.8): φ = 20° → 0.51 / 3.06 / 5.66 · 25° ≈ 0.78 / 4.12 / 6.68 · 30° → 1.15 / 5.59 / 7.95 [i]At SLS the partial factors on soil are 1.0 – use characteristic parameters.[/i]
- Circular or polygonal bases: equivalent width $B = \sqrt{A}$

Check: $p_{ef,med} \le p_{pl}$ plus the corresponding conditions on peak pressures under eccentricity. `NP 112-2014, H.5 (3)`

## 3. Bearing resistance – ULS (same as EC7 Annex D)

Drained:

$$R_d = A'\left(c'\,N_c\,b_c\,s_c\,i_c + q'\,N_q\,b_q\,s_q\,i_q + 0.5\,\gamma'\,B'\,N_\gamma\,b_\gamma\,s_\gamma\,i_\gamma\right) \qquad (F.2)$$

$$N_q = e^{\pi\tan\varphi'}\tan^2(45° + \varphi'/2) \qquad N_c = (N_q - 1)\cot\varphi' \qquad N_\gamma = 2\,(N_q - 1)\tan\varphi'$$

Undrained:

$$R_d = A'\,\left[(\pi + 2)\,c_u\,b_c\,s_c\,i_c + q\right] \qquad (F.1)$$

- A′ = B′·L′ effective area: B′ = B − 2e_B, L′ = L − 2e_L
- rectangular shape factors: $s_q = 1 + (B'/L')\sin\varphi'$, $s_\gamma = 1 - 0.3\,B'/L'$; undrained $s_c = 1 + 0.2\,B'/L'$
- Check: $V_d \le R_d$ – with the design approach and partial factors of the National Annex `SR EN 1997-1, 6.5.2, Annex D` · `NP 112-2014, Annex F`

## 4. Eurocode route

EC7 uses the same Annex D; it has no p_conv or p_pl. Serviceability is shown by the settlement calculation (6.6), ULS by R_d. For the second-generation EN 1997-1:2024 the Romanian NA draft went to public enquiry in 2025.

---
*Sources: NP 112-2014 D.1–D.2, F.1–F.2, H.5, Tables H.7–H.8; SR EN 1997-1:2004 6.5, Annex D.*

  const txt=el.textContent.replace(/^\s*\n/,'');const cut=txt.indexOf('\n---\n');
  const head=txt.slice(0,cut),body=txt.slice(cut+5);const meta={};
  head.split('\n').forEach(l=>{const m=l.match(/^(\w+):\s*(.*)$/);if(m)meta[m[1]]=m[2].trim();});
  SHEETS[id].L[el.dataset.lang]={title:meta.title||id,sub:meta.sub||'',body,plain:norm((meta.title||'')+' '+(meta.sub||'')+' '+body.replace(/[$\\{}]/g,' '))};
});

/* ---------- Markdown ---------- */
function mdCore(md,inline){
  const math=[];
  md=md.replace(/\$\$([\s\S]+?)\$\$/g,(m,t)=>{math.push([1,t]);return '@@M'+(math.length-1)+'@@'});
  md=md.replace(/\$([^$\n]+?)\$/g,(m,t)=>{math.push([0,t]);return '@@M'+(math.length-1)+'@@'});
  md=md.replace(/~([^~\s]+)~/g,'<sub>$1</sub>');
  md=md.replace(/(^|[^\w\\@])([A-Za-z\u03b1-\u03c9]{1,2})_([A-Za-z0-9]+(?:,[A-Za-z0-9]+)?)/g,'$1$2<sub>$3</sub>');
  let html=inline?marked.parseInline(md):marked.parse(md,{gfm:true});
  html=html.replace(/@@M(\d+)@@/g,(m,i)=>{const [d,t]=math[+i];return d?'<span class="eq">\\['+esc(t)+'\\]</span>':'\\('+esc(t)+'\\)'});
  return html.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
}
let INFOS=[];
function renderMd(md){
  INFOS=[];
  md=md.replace(/\[i\]([\s\S]+?)\[\/i\]/g,(m,t)=>{INFOS.push(t);return '@@I'+(INFOS.length-1)+'@@'});
  return mdCore(md,false).replace(/@@I(\d+)@@/g,(m,i)=>`<button type="button" class="ib" data-i="${i}" aria-expanded="false" aria-label="${T().info}">i</button>`);
}
function typeset(el){if(window.MathJax&&MathJax.typesetPromise){try{MathJax.typesetClear&&MathJax.typesetClear([el]);}catch(e){}return MathJax.typesetPromise([el]).catch(()=>{});}}
window.__typeset=()=>typeset($('#main'));

  const b=e.target.closest('.ib');

    pop.innerHTML='<div class="pl">'+T().info+'</div><p>'+mdCore(INFOS[+b.dataset.i]||'',true)+'</p>';pop.hidden=false;
    const r=b.getBoundingClientRect(),w=pop.offsetWidth;let left=r.left+window.scrollX-12;

  if(!e.target.closest('#pop'))closePop();
});

function buildConv(){
  const host=document.createElement('div');host.className='convs';
  CONV.forEach((c,ci)=>{
    const card=document.createElement('section');card.className='conv';
    let rows='';
    if(c.lin){rows=c.lin.map(([u],i)=>`<div class="crow"><input id="cv${ci}-${i}" inputmode="decimal" aria-label="${esc(u)}"><span class="u">${esc(u)}</span></div>`).join('');}
    else rows=c.f.map(([k,l,u,def,ro])=>`<div class="crow c"><label for="cv${ci}-${k}">${esc(tr(l))}</label><input id="cv${ci}-${k}" inputmode="decimal" ${ro?'readonly tabindex="-1"':''}><span class="u">${esc(u)}</span></div>`).join('');
    card.innerHTML=`<div><h3>${esc(tr(c.t))}</h3>${c.n?`<p class="cn">${esc(tr(c.n))}</p>`:''}</div><div class="rows">${rows}</div>`;
    host.appendChild(card);
    if(c.lin){
      const ins=c.lin.map((_,i)=>card.querySelector(`#cv${ci}-${i}`));
      const fac=i=>{const f=c.lin[i][1];return typeof f==='function'?f():f;};
      const fill=(src,val)=>{const base=val*fac(src);ins.forEach((el,i)=>{if(i!==src)el.value=fmtS(base/fac(i));});};
      ins.forEach((el,i)=>el.addEventListener('input',()=>{const v=num(el.value);if(isFinite(v))fill(i,v);}));
      ins[c.def[0]].value=fmtS(c.def[1]);fill(c.def[0],c.def[1]);
      c._refresh=()=>{const v=num(ins[c.def[0]].value);if(isFinite(v))fill(c.def[0],v);};
    }else{
      const el={};c.f.forEach(([k])=>el[k]=card.querySelector(`#cv${ci}-${k}`));
      c.f.forEach(([k,,,def])=>{if(def!=null)el[k].value=fmtS(def);});
      const run=k=>{const v={};for(const x in el)v[x]=num(el[x].value);const out=c.calc(k,v);for(const x in out)if(x!==k&&el[x])el[x].value=fmtS(out[x]);};
      c.f.forEach(([k,,,,ro])=>{if(!ro)el[k].addEventListener('input',()=>{if(isFinite(num(el[k].value)))run(k);});});
      run(c.f[0][0]);
    }
  });
  return host;
}

/* ---------- Views ---------- */
let query='',route='home';
function matches(id){const t=norm(query).split(/\s+/).filter(Boolean);if(!t.length)return true;const s=S(id);return t.every(x=>s.plain.includes(x));}
function snippet(id){const t=norm(query).split(/\s+/).filter(Boolean)[0];if(!t)return'';const raw=S(id).body.replace(/\[\/?i\]/g,'').replace(/\$[^$]*\$/g,'').replace(/[#*|>`]/g,' ').replace(/\s+/g,' ');const i=norm(raw).indexOf(t);if(i<0)return'';const a=Math.max(0,i-35),b=Math.min(raw.length,i+80);return esc((a?'…':'')+raw.slice(a,b)+(b<raw.length?'…':''));}
function go(h){if((location.hash.slice(1)||'home')===h)render();else location.hash=h;$('#reg').classList.remove('open');$('#regToggle').setAttribute('aria-expanded','false');}
const setShell=m=>{$('#shell').className='shell gutter'+(m?' '+m:'');$('#main').className='v-'+view;};
const bindGo=root=>root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));

function renderNav(curCat){
  const searching=!!query.trim();
  let h=`<button class="back" data-go="home">← ${T().cats}</button>`;let any=false;
  DATA.cats.forEach(c=>{const ids=sheetsIn(c.key).filter(matches);
    if(searching?!ids.length:!sheetsIn(c.key).length&&c.key!==curCat)return;any=any||ids.length>0;
    h+=`<div class="navcat${c.key===curCat?' cur':''}"><h3><button data-go="cat-${c.key}"><span class="glyph">${c.icon}</span>${esc(tr(c.name))}</button></h3><ul class="list">`;
    h+=ids.length?ids.map(id=>{const s=S(id);return `<li class="item${route===id?' active':''}"><button type="button" data-go="${id}"><span class="n">${s.num}</span><span class="t">${esc(s.title)}</span>${searching?`<span class="snip">${snippet(id)}</span>`:''}</button></li>`}).join(''):`<li class="empty">${T().nosheets}</li>`;
    h+='</ul></div>';});
  if(searching&&!any)h+=`<p class="empty">${T().none} „${esc(query)}”</p>`;
  $('#regBody').innerHTML=h;bindGo($('#regBody'));
}

function renderHome(){
  setShell('wide');
  const t=query.trim();
  let h=`<div class="head plain"><p class="lede" style="margin:0 0 14px">${T().homeIntro}</p></div>`;
  if(t){
    const ids=ORDER.filter(matches);
    h+=`<div class="tiles">`+(ids.length?ids.map(id=>{const s=S(id),c=catOf(s.cat);return `<button class="tile" data-go="${id}"><span class="ct">${s.num} · ${esc(tr(c.name))}</span><span class="nm">${esc(s.title)}</span><span class="ds">${snippet(id)}</span></button>`}).join(''):`<p class="empty">${T().none} „${esc(query)}”</p>`)+`</div>`;
  }else{
    h+=`<div class="tiles">`+DATA.cats.map(c=>{const n=sheetsIn(c.key).length;return `<button class="tile${n?'':' dim'}" data-go="cat-${c.key}"><span class="ic">${c.icon}</span><span class="nm">${esc(tr(c.name))}</span><span class="ct">${n} ${T().sheets}</span></button>`}).join('')+`</div>`;
  }
  $('#main').innerHTML=h;bindGo($('#main'));
}

function renderCat(k){
  const c=catOf(k);if(!c)return renderHome();
  setShell('nav');
  const ids=sheetsIn(k).filter(matches);
  let h=`<div class="head"><div class="eyebrow"><button data-go="home">${T().cats}</button><span>/</span></div><h2>${c.icon} ${esc(tr(c.name))}</h2></div><p class="catdesc">${esc(tr(c.desc))}</p>`;
  h+=`<div class="tiles">`+(ids.length?ids.map(id=>{const s=S(id);return `<button class="tile" data-go="${id}"><span class="ct">${s.num}</span><span class="nm">${esc(s.title)}</span><span class="ds">${esc(s.sub)}</span></button>`}).join(''):`<p class="empty">${query.trim()?T().none+' „'+esc(query)+'”':T().nosheets}</p>`)+`</div><p class="foot">${T().foot}</p>`;
  $('#main').innerHTML=h;bindGo($('#main'));renderNav(k);
}

function docLink(r){
  if(!r.docs||!r.docs.length)return esc(r.ro);
  const a=(d,txt,cls)=>`<a class="${cls}" href="${esc(d.file||d.url)}" target="_blank" rel="noopener"${d.file?` data-pdf="${esc(d.file)}" data-t="${esc(r.ro+(d.lab?' – '+tr(d.lab):''))}"`:''}>${txt}</a>`;
  const [m,...rest]=r.docs;
  return a(m,`${esc(r.ro)}<span class="dtag">${esc(m.file?(m.lab?tr(m.lab):T().pdfIn):(m.src||T().pdfOut))} ↗</span>`,'doc')+rest.map(d=>' '+a(d,`<span class="dtag">${esc(tr(d.lab)||'PDF')} ↗</span>`,'doc')).join('');
}
function renderMap(){
  setShell('wide');
  const t=norm(query).split(/\s+/).filter(Boolean);let rows='';
  DATA.map.forEach(g=>{const c=catOf(g.cat);
    const rs=g.rows.filter(r=>!t.length||t.every(x=>norm(tr(r.el)+' '+r.ro+' '+r.ec+' '+tr(r.note||'')).includes(x)));

  <div class="tw"><table class="maptable"><thead><tr>${T().cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="4">${T().none} „${esc(query)}”</td></tr>`}</tbody></table></div>

function renderConv(){
  setShell('wide');
  $('#main').innerHTML=`<div class="head plain headrow"><p class="lede" style="margin:0">${T().convIntro}</p><div class="gset"><span>${T().gLabel}</span><div class="seg" role="group"><button type="button" data-g="9.81" aria-pressed="${gval!==10}">9,81</button><button type="button" data-g="10" aria-pressed="${gval===10}">10</button></div></div></div>`;

  o.lb=Math.max(1,v.le/v.be);o.km=kmOf(o.lb);o.kB=2*o.km*v.es/((1-v.nu*v.nu)*v.be);
  o.kC=v.ss>0?v.pn/(v.ss/1000):NaN;
  const K1=+v.k1;o.CB=v.bb<=5?v.pb*K1*(v.bb-1):v.pb*(K1>=0.1?0.4:0.2);o.CD=v.dd<=2?v.pb*(v.dd-2)/4:v.gg*(v.dd-2);o.pc=v.pb+o.CB+o.CD;return o;}

   </tbody></table></div><p class="bnote">¹ ${tr(L3('Interpolare între I<sub>c</sub> = 0,5 (min.) și I<sub>c</sub> = 1 (max.) a pământului argilos din interspații. În interval, la roci, după compactitate și starea de degradare.','I<sub>c</sub> = 0,5 (min.) és I<sub>c</sub> = 1 (max.) között interpolálva a hézagkitöltő agyag konzisztenciája szerint. Kőzeteknél a tartományon belül a tömörség és mállottság szerint.','Interpolate between I<sub>c</sub> = 0.5 (min) and I<sub>c</sub> = 1 (max) of the clayey void filling. For rock, within the range by compactness and weathering.'))}</p>

   <div class="tw"><table class="mt">${th([tr(SL.fill),tr(L3('nisipoase, zguri: S<sub>r</sub> ≤ 0,5','homokos, salak: S<sub>r</sub> ≤ 0,5','sandy, slag: S<sub>r</sub> ≤ 0.5')),'S<sub>r</sub> ≥ 0,8',tr(L3('prăfoase, coezive: S<sub>r</sub> ≤ 0,5','iszapos, kötött: S<sub>r</sub> ≤ 0,5','silty, cohesive: S<sub>r</sub> ≤ 0.5')),'S<sub>r</sub> ≥ 0,8'])}<tbody>${D5.map(r=>`<tr><th style="font-family:var(--f-body);text-align:left">${esc(tr(r[0]))}</th>${r[1].map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
   <p class="bnote">${tr(L3('Pentru 0,5 < S<sub>r</sub> < 0,8 se interpolează liniar. Verificarea la SLU/SLS după capitolul 6 din NP 112 și SR EN 1997-1.','0,5 < S<sub>r</sub> < 0,8 között lineáris interpoláció. Teherbírási és használhatósági ellenőrzés az NP 112 6. fejezete és az SR EN 1997-1 szerint.','Interpolate linearly for 0.5 < S<sub>r</sub> < 0.8. ULS/SLS checks per NP 112 chapter 6 and SR EN 1997-1.'))}</p>`);
  if(!h.includes('msec'))h+=`<p>${T().none} „${esc(query)}”</p>`;
  $('#main').innerHTML=h;
  $('#main').querySelectorAll('.msec').forEach(d=>d.addEventListener('toggle',()=>store.set('soil-'+d.dataset.k,d.open?'1':'0')));
  $('#main').querySelectorAll('[data-s]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{const k=el.dataset.s;const val=el.tagName==='SELECT'?el.value:num(el.value);if(el.tagName!=='SELECT'&&!isFinite(val))return;SV[k]=val;store.set('s-'+k,String(val));soilOut();}));
  soilOut();
}

function render(){
  closePop();
  const h=location.hash.slice(1)||'home';let tab='home';
  if(h==='map'){route='map';tab='map';renderMap();}
  else if(h==='conv'){route='conv';tab='conv';renderConv();}
  else if(h==='beam'){route='beam';tab='beam';renderBeam();}
  else if(h==='mat'){route='mat';tab='mat';renderMat();}
  else if(h==='lib'){route='lib';tab='lib';renderLib();}
  else if(h==='soil'){route='soil';tab='soil';renderSoil();}
  else if(h.startsWith('cat-')){route=h;renderCat(h.slice(4));}
  else if(SHEETS[h]){route=h;renderSheet(h);}
  else{route='home';renderHome();}
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  $('#viewSeg').hidden=(tab==='map'||tab==='lib'||SHEETS[h]!==undefined);
}
function applyUI(){
  document.documentElement.lang=lang;
  $('#brand').textContent=T().brand;$('#q').placeholder=T().search;$('#q').setAttribute('aria-label',T().search);
  $('#regLabel').textContent=T().lapok;$('#tocLabel').textContent=T().onpage;$('#reg').setAttribute('aria-label',T().lapok);
  document.querySelectorAll('.tab').forEach((b,i)=>b.textContent=T().tabs[i]);
  $('#vGrid span').textContent=T().grid;$('#vList span').textContent=T().list;
  $('#vGrid').setAttribute('aria-pressed',String(view==='grid'));$('#vList').setAttribute('aria-pressed',String(view==='list'));
  document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
}
document.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l;store.set('lang',lang);applyUI();const y=window.scrollY;render();window.scrollTo(0,y);}));
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.v;store.set('view',view);applyUI();$('#main').className='v-'+view;}));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
$('#brandBtn').addEventListener('click',()=>go('home'));
$('#q').addEventListener('input',e=>{query=e.target.value;const h=location.hash.slice(1)||'home';if(h==='beam')renderBeam();else if(h==='mat')renderMat();else if(h==='map')renderMap();else if(h==='lib')renderLib();else if(h==='soil')renderSoil();else if(h==='home')renderHome();else if(h.startsWith('cat-'))renderCat(h.slice(4));else if(SHEETS[h])renderNav(SHEETS[h].cat);});
$('#regToggle').addEventListener('click',()=>{const r=$('#reg');r.classList.toggle('open');$('#regToggle').setAttribute('aria-expanded',r.classList.contains('open'));});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
applyUI();render();libInit();
})();
</script>
