<title>Tervezői kisokos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: title-block header with three tabs; Kisokos tab = category tiles → category page → sheet (register + reading column + contents).
   Deliberately light-only (white paper), per the user's preference. */
:root{
  --paper:#ffffff; --ink:#1b2830; --ink-2:#55646d; --rule:#d6dee3; --tint:#f2f5f7;
  --accent:#0d5876; --accent-tint:#e7f0f5;
  --ro:#8a2f3c; --ro-tint:#f8ecee;
  --calc:#8a5d0c; --calc-tint:#fbf6ea; --calc-rule:#e6d3a8;
  --ok:#2a7344; --ok-tint:#e8f3ec; --warn:#a23b2b; --warn-tint:#f9ebe8; --new:#7a5a00; --new-tint:#fbf3d9;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15.5px;line-height:1.62}
*{box-sizing:border-box}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header + tabs */
.top{border-bottom:2px solid var(--ink);padding-block:14px 0}
.top-in{max-width:1360px;margin:0 auto}
.row1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
.brand{display:flex;align-items:baseline;gap:12px;cursor:pointer;background:none;border:0;padding:0;color:var(--ink);font:inherit}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;margin:0;letter-spacing:.01em}
.tools{display:flex;gap:10px;align-items:center;flex:1 1 360px;justify-content:flex-end;flex-wrap:wrap}
.search{position:relative;flex:1 1 220px;max-width:380px}
.search input{width:100%;font:inherit;font-size:15px;padding:7px 12px 7px 34px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-tint)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--ink-2);stroke-width:2}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{font-family:var(--f-mono);font-size:12.5px;font-weight:500;letter-spacing:.05em;padding:6px 10px;border:0;background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg svg{width:14px;height:14px;fill:currentColor}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.tab{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.01em;padding:8px 16px 9px;border:1px solid transparent;border-bottom:0;border-radius:5px 5px 0 0;background:none;color:var(--ink-2);cursor:pointer;white-space:nowrap;margin-bottom:-2px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--ink);border-bottom:2px solid var(--paper)}

/* Shell */
.shell{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr) 210px;gap:44px;padding-block:26px 64px}
.shell.nav{grid-template-columns:260px minmax(0,1fr)}
.shell.nav .toc{display:none}
.shell.wide{grid-template-columns:minmax(0,1fr)}
.shell.wide .reg,.shell.wide .toc{display:none}
@media (max-width:1180px){.shell{grid-template-columns:240px minmax(0,1fr)}.toc{display:none}}
@media (max-width:820px){.shell,.shell.nav{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px 48px}}

/* Register */
.reg{position:sticky;top:18px;align-self:start;max-height:calc(100vh - 36px);overflow:auto;padding-right:4px}
@media (max-width:820px){.reg{position:static;max-height:none;padding-right:0}}
.reg-toggle{display:none;width:100%;font:inherit;font-weight:600;text-align:left;padding:9px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--tint);color:var(--ink);cursor:pointer}
@media (max-width:820px){.reg-toggle{display:flex;justify-content:space-between}.reg:not(.open) .reg-body{display:none}.reg-body{margin-top:10px}}
.back{display:inline-flex;gap:6px;align-items:center;font:inherit;font-size:14px;font-weight:500;padding:4px 0;border:0;background:none;color:var(--accent);cursor:pointer}
.navcat{margin-top:14px}
.navcat h3{margin:0 0 4px;padding:0 8px;font-family:var(--f-display);font-weight:600;font-size:16px}
.navcat h3 button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center}
.navcat h3 button:hover{color:var(--accent)}
.navcat h3 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.navcat.cur h3 button{color:var(--accent)}
.glyph{font-family:var(--f-mono);width:22px;text-align:center;color:var(--ink-2);flex:none}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.item{border-bottom:1px solid var(--rule)}
.item button{display:grid;grid-template-columns:30px minmax(0,1fr);gap:1px 8px;width:100%;text-align:left;font:inherit;padding:8px;background:none;border:0;color:var(--ink);cursor:pointer}
.item button:hover{background:var(--tint)}
.item.active button{background:var(--accent-tint)}
.item .n{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);padding-top:2px}
.item.active .n{color:var(--accent);font-weight:500}
.item .t{font-weight:500;font-size:14px;line-height:1.35}
.item .snip{grid-column:2;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.empty{padding:10px 8px;color:var(--ink-2);font-size:13.5px}

/* Main */
main{min-width:0}
.head{padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--rule)}
.head.plain{border-bottom:0;margin-bottom:8px}
.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.eyebrow .num{color:var(--paper);background:var(--accent);padding:1px 7px;border-radius:3px;letter-spacing:.02em}
.eyebrow button{all:unset;cursor:pointer}
.eyebrow button:hover{color:var(--accent)}
.head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.08;margin:8px 0 6px;text-wrap:balance}
.head .sub{color:var(--ink-2);font-style:italic;margin:0}
.lede{max-width:720px;color:var(--ink-2);margin:4px 0 0}

/* Home tiles + views */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;padding:18px 18px 16px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink);cursor:pointer;min-width:0;transition:border-color .12s}
.tile:hover{border-color:var(--ink)}
.tile .ic{font-family:var(--f-mono);font-size:22px;color:var(--accent);line-height:1}
.tile .nm{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.15}
.tile .ct{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.tile .ds{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.tile.dim .nm{color:var(--ink-2)}
.v-list .tiles{grid-template-columns:minmax(0,1fr);gap:0;border-top:1px solid var(--rule)}
.v-list .tile{flex-direction:row;align-items:baseline;gap:14px;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:12px 6px}
.v-list .tile:hover{background:var(--tint)}
.v-list .tile .nm{font-size:18px;flex:0 1 auto}
.v-list .tile .ic{font-size:16px;width:24px;text-align:center}
.v-list .tile .ds{flex:1 1 auto;min-width:0}
.v-list .tile .ct{margin-left:auto;white-space:nowrap}
@media (max-width:640px){.v-list .tile{flex-wrap:wrap}.v-list .tile .ds{flex-basis:100%;order:5}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
.catdesc{max-width:760px;color:var(--ink);margin:0 0 18px}
.foot{margin-top:36px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:12px;max-width:820px}

/* Prose */
.prose{max-width:780px}
.prose h2{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.2;margin:36px 0 10px;padding-top:12px;border-top:1px solid var(--ink);text-wrap:balance;scroll-margin-top:16px}
.prose h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:24px 0 8px}
.prose p,.prose ul,.prose ol{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px}
.prose li{margin:4px 0}
.prose hr{border:0;border-top:1px solid var(--rule);margin:28px 0 14px}
.prose blockquote{margin:16px 0;padding:10px 14px;background:var(--accent-tint);border-left:3px solid var(--accent);border-radius:0 4px 4px 0}
.prose blockquote p:last-child{margin-bottom:0}
.tw{overflow-x:auto;margin:12px 0 16px}
.prose table,.maptable{border-collapse:collapse;font-size:14px}
.prose th,.prose td,.maptable th,.maptable td{border:1px solid var(--rule);padding:6px 10px;vertical-align:top;font-variant-numeric:tabular-nums}
.prose th,.maptable th{background:var(--tint);font-weight:600;text-align:left}
.prose code{font-family:var(--f-mono);font-size:12px;letter-spacing:.01em;color:var(--ro);background:var(--ro-tint);padding:2px 6px;border-radius:3px;white-space:nowrap}
.eq{display:block;margin:10px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
mjx-container[display="true"]{margin:0!important}
mjx-container{color:var(--ink)}

/* Info */
.ib{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;margin:0 2px 0 4px;vertical-align:1px;border-radius:50%;border:1.5px solid var(--accent);background:var(--paper);color:var(--accent);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:12.5px;line-height:1;cursor:pointer;padding:0}
.ib:hover,.ib[aria-expanded="true"]{background:var(--accent);color:var(--paper)}
#pop{position:absolute;z-index:50;width:min(360px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--accent);border-radius:5px;box-shadow:0 8px 28px rgba(13,40,55,.18);padding:12px 14px;font-size:14px;line-height:1.55}
#pop .pl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
#pop p{margin:0}

/* Map */
.maptable{width:100%;min-width:660px}
.maptable td:nth-child(2),.maptable td:nth-child(3){font-family:var(--f-mono);font-size:13px}
.maptable td:nth-child(2){color:var(--ro)}
.maptable .grp td{background:var(--paper);border-left:0;border-right:0;padding-top:18px;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink)}
.maptable .note{font-family:var(--f-body);font-size:12.5px;color:var(--ink-2);margin-top:3px}
a.doc{color:var(--ro);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a.doc:hover{color:var(--accent)}
.dtag{display:inline-block;margin-left:6px;font-size:10.5px;letter-spacing:.04em;padding:0 5px;border:1px solid currentColor;border-radius:3px;vertical-align:1px;text-decoration:none}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:1px 7px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.new{background:var(--new-tint);color:var(--new)}
.pill.check{background:var(--warn-tint);color:var(--warn)}
.ver{font-family:var(--f-mono);font-size:10.5px;color:var(--ok);margin-left:6px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-2);margin:0 0 16px;align-items:center}

/* Converters */
.gset{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-2)}
.convs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.conv{border:1px solid var(--calc-rule);background:var(--calc-tint);border-radius:5px;padding:12px 14px 12px;min-width:0}
.conv h3{margin:0 0 2px;font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2}
.conv .cn{margin:0 0 10px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:8px;align-items:center;margin-top:6px}
.crow.c{grid-template-columns:minmax(0,1fr) 104px 52px}
.crow.c label{display:block;font-size:13px;color:var(--ink-2);line-height:1.25}
.crow input{font:inherit;font-family:var(--f-mono);font-size:14px;width:100%;padding:6px 8px;border:1px solid var(--calc-rule);border-radius:3px;background:var(--paper);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.crow input:focus{outline:none;border-color:var(--calc);box-shadow:0 0 0 3px rgba(138,93,12,.15)}
.crow input[readonly]{background:var(--tint);color:var(--calc);font-weight:500}
.crow .u{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.v-list .convs{grid-template-columns:minmax(0,1fr)}
.v-list .conv{display:grid;grid-template-columns:220px minmax(0,1fr);gap:4px 20px}
.v-list .conv .rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 14px}
@media (max-width:640px){.v-list .conv{grid-template-columns:minmax(0,1fr)}}

/* Beams */
.bin{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 14px;margin:0 0 18px;border:1px solid var(--calc-rule);background:var(--calc-tint);border-radius:5px}
@media (min-width:821px){.bin{position:sticky;top:0;z-index:5}}
.bf{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:14px}
.bf span{font-weight:500}
.bf input{font:inherit;width:90px;padding:5px 7px;border:1px solid var(--calc-rule);border-radius:3px;background:var(--paper);color:var(--ink);text-align:right}
.bf input::placeholder{font-size:11px}
.bf em{font-style:normal;font-size:12px;color:var(--ink-2)}
.beams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.bgh{grid-column:1/-1;margin:14px 0 0;font-family:var(--f-display);font-weight:700;font-size:20px;border-bottom:1px solid var(--ink);padding-bottom:4px}
.beam{border:1px solid var(--rule);border-radius:5px;padding:12px 14px;min-width:0}
.beam h4{margin:0 0 6px;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.2}
.bt{font-family:var(--f-mono);font-size:12px;fill:var(--ink)}
.bt.s{font-size:11.5px}.bt.b{font-weight:600;font-size:12px}
.bt.cv{fill:var(--accent)}.bt.cm{fill:var(--ro)}.bt.cn{fill:var(--calc)}
.bform{overflow-x:auto}
.bform table{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
.bform mjx-container{font-size:118%!important}
.bform td{padding:8px 4px;border-top:1px solid var(--rule);vertical-align:middle}
.bform .bv{text-align:right;font-family:var(--f-mono);font-size:14.5px;color:var(--calc);white-space:nowrap;font-variant-numeric:tabular-nums}
.bnote{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
.v-list .beams{grid-template-columns:minmax(0,1fr)}
.v-list .beam{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:4px 24px}
.v-list .beam h4{grid-column:1/-1}
@media (max-width:700px){.v-list .beam{grid-template-columns:minmax(0,1fr)}}

/* Interactive cards */
.bpar{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 2px;padding:8px 10px;background:var(--calc-tint);border:1px solid var(--calc-rule);border-radius:4px}
.bpi{display:flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:13px;border-radius:3px;transition:box-shadow .2s}
.bpi span{font-weight:500}
.bpi input{font:inherit;width:72px;padding:4px 6px;border:1px solid var(--calc-rule);border-radius:3px;background:var(--paper);color:var(--ink);text-align:right}
.bpi input::placeholder{font-size:10px}
.bpi input:focus{outline:none;border-color:var(--calc);box-shadow:0 0 0 3px rgba(138,93,12,.15)}
.bpi em{font-style:normal;font-size:11.5px;color:var(--ink-2)}
.bpi.flash{box-shadow:0 0 0 3px var(--calc)}
.bt.ed{fill:var(--calc);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.bt.ed:hover{fill:var(--ink)}
.drag{cursor:ew-resize}
.binl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--calc);flex-basis:100%}
@media (prefers-reduced-motion:reduce){.bpi{transition:none}}

/* Cards grid + modal */
.bgrp{margin:0 0 6px}
.bgrp>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px}
.bgrp>summary::-webkit-details-marker{display:none}
.bgrp>summary::before{content:"▸";font-size:14px;color:var(--ink-2);transition:transform .15s;display:inline-block}
.bgrp[open]>summary::before{transform:rotate(90deg)}
.bcnt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-weight:400}
.bgrp .beams{margin:12px 0 18px}
.beams{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))!important}
.bcard{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;padding:12px 12px 10px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink);cursor:pointer;min-width:0}
.bcard:hover{border-color:var(--ink)}
.bcard .bct{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.2}
.bcard .bdia{pointer-events:none}
.bcard .bnt{font-size:13px;color:var(--ink-2)}
.bcard .bopen{margin-top:auto;font-size:12.5px;color:var(--accent);font-weight:500}
.v-list .beams{grid-template-columns:minmax(0,1fr)!important}
.v-list .bcard{display:grid;grid-template-columns:minmax(0,1fr) 260px;align-items:center}
.v-list .bcard .bopen{grid-column:1}
@media (max-width:640px){.v-list .bcard{grid-template-columns:minmax(0,1fr)}}
/* library + pdf viewer */
.libbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 14px}
.btn{font:600 14px var(--f-body);padding:8px 14px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:6px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--rule,#cfd6da);color:var(--ink-2);font-weight:500}
.libstat{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.libtip{font-size:13px;color:var(--ink-2);background:var(--paper);border-left:3px solid var(--accent);padding:8px 12px;margin:0 0 18px}
.sh3{font:700 15px var(--f-display);margin:18px 0 8px}
.libtable{width:100%;min-width:600px}
.libtable th,.libtable td{text-align:left!important}
.libtable td:nth-child(2){font-family:var(--f-body)}
.libtable td:first-child{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.libtable td:nth-child(3){white-space:normal}
.pchip{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--f-mono);padding:2px 8px;margin:2px 4px 2px 0;border-radius:4px;border:1px solid var(--ro);background:var(--ro-tint);color:var(--ro);cursor:pointer;text-decoration:none;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.na{border-color:var(--accent);background:transparent;color:var(--accent)}
.pchip.bi{border-style:dashed}
.pmiss{font-family:var(--f-mono);font-size:12px;color:#9aa5ab}
#pv{position:fixed;inset:0;z-index:70;background:#525659;display:flex;flex-direction:column}
#pv[hidden]{display:none}
.pvbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--ink);flex-wrap:wrap}
.pvbar .ttl{font:700 15px var(--f-display);flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvbar input{width:56px;font:13px var(--f-mono);padding:4px 6px;text-align:right}
.pvbar button,.pvbar a{font:600 13px var(--f-body);padding:5px 10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:5px;cursor:pointer;text-decoration:none}
.pvbar .z{font-family:var(--f-mono);font-size:12.5px;min-width:46px;text-align:center}
.pvbody{flex:1;overflow:auto;padding:16px 8px;-webkit-overflow-scrolling:touch}
.pvpage{margin:0 auto 12px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.35);position:relative}
.pvpage canvas{display:block;width:100%;height:100%}
.pvmsg{color:#fff;font:15px var(--f-body);max-width:560px;margin:60px auto;text-align:center;line-height:1.5}
#bmod{position:fixed;inset:0;z-index:60;background:rgba(27,40,48,.45);overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bm-in{max-width:1180px;margin:0 auto;background:var(--paper);border-radius:6px;padding:16px 20px 20px;box-shadow:0 12px 40px rgba(13,40,55,.25)}
.bm-h{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:14px}
.bm-h h3{flex:1;margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(19px,2.5vw,24px);line-height:1.15;text-align:center}
.bm-nav,.bm-x{font:inherit;font-size:20px;width:36px;height:36px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);cursor:pointer;flex:none}
.bm-nav:hover,.bm-x:hover{border-color:var(--ink)}
.bm-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.bm-body.one{grid-template-columns:minmax(0,1fr);max-width:720px;margin:0 auto}
@media (max-width:900px){.bm-body{grid-template-columns:minmax(0,1fr)}}
.bm-dia svg{max-height:70vh}
.bpi.wide select{font:inherit;font-family:var(--f-body);font-size:13px;padding:4px 6px;border:1px solid var(--calc-rule);border-radius:3px;background:var(--paper);color:var(--ink);max-width:220px}
.rect{display:flex;align-items:center;gap:6px;flex-basis:100%;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.rect input{font:inherit;width:58px;padding:4px 6px;border:1px solid var(--calc-rule);border-radius:3px;background:var(--paper);color:var(--ink);text-align:right}
.mini{font:inherit;font-size:12.5px;padding:4px 9px;border:1px solid var(--calc);border-radius:3px;background:var(--paper);color:var(--calc);cursor:pointer}
/* Materials */
.mpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin:12px 0 14px}
.mcard{border:1px solid var(--rule);border-radius:5px;padding:12px 14px}
.mcard.calcc{border-color:var(--calc-rule);background:var(--calc-tint)}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-family:var(--f-display);font-weight:700;font-size:18px}
.mh select{font:inherit;font-size:16px;padding:4px 8px;border:1px solid var(--ink);border-radius:4px;background:var(--paper);color:var(--ink)}
.mdl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;margin:0;font-size:14.5px}
.mdl dt{color:var(--ink-2)}
.mdl dd{margin:0;font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.mdl dd.key{color:var(--calc);font-weight:500}
.mrow{display:flex;gap:14px;margin-bottom:10px;font-family:var(--f-mono);font-size:13.5px}
.mrow label{display:flex;align-items:center;gap:6px}
.mrow input{font:inherit;width:64px;padding:4px 6px;border:1px solid var(--calc-rule);border-radius:3px;background:var(--paper);color:var(--ink);text-align:right}
.mt{border-collapse:collapse;font-size:13.5px;min-width:100%}
.mt th,.mt td{border:1px solid var(--rule);padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mt thead th{background:var(--tint);font-weight:600;text-align:center}
.mt tbody th{text-align:left;font-family:var(--f-mono);font-weight:500}
.mt tr[data-c]{cursor:pointer}
.mt tr[data-c]:hover td,.mt tr[data-c]:hover th{background:var(--tint)}
.mt tr.sel td,.mt tr.sel th{background:var(--calc-tint)}

/* TOC */
.toc{position:sticky;top:18px;align-self:start;font-size:13.5px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.toc ol{list-style:none;margin:8px 0 0;padding:0;border-left:1px solid var(--rule)}
.toc a{display:block;padding:4px 0 4px 12px;color:var(--ink-2);text-decoration:none;line-height:1.35}
.toc a:hover{color:var(--accent)}
</style>

<script type="text/markdown" data-id="kombinaciok" data-num="01" data-cat="loads" data-calc="ccomb" data-lang="hu">
title: Teherkombinációk
sub: CR 0-2012 és SR EN 1990 + NA szerint
---
**Mikor kell?** Minden méretezés elején: melyik hatás milyen szorzóval és milyen kísérő értékkel szerepel egy kombinációban.

## 1. A hatások osztályai

| Jel | Hatás | Példa |
|---|---|---|
| G | állandó | önsúly, burkolatok, rögzített válaszfalak |
| Q | esetleges | hasznos teher, hó, szél, hőmérséklet |
| A | rendkívüli | robbanás, ütközés, tűz |
| A_E | szeizmikus | földrengés (Romániában a P100-1 adja) |

`CR 0-2012, 4. fejezet` · `SR EN 1990, 4.1.1`

## 2. Román előírás – teherbírási határállapot (ULS), alapkombináció

$$E_d = \sum_j \gamma_{G,j}\,G_{k,j} \;+\; \gamma_{Q,1}\,Q_{k,1} \;+\; \sum_{i>1} \gamma_{Q,i}\,\psi_{0,i}\,Q_{k,i}$$

- γG = **1,35** ha kedvezőtlen, **1,00** ha kedvező [i]Pl. borulás- vagy felúszás-vizsgálatnál az önsúly kedvező, ott 1,00-val szerepel. Statikai egyensúlynál (EQU) külön szorzók vannak.[/i]
- γQ = **1,5** ha kedvezőtlen, **0** ha kedvező
- Q_k,1 a **vezető** esetleges hatás [i]Minden esetleges hatást sorra vezetőnek kell venni (hó vezet, majd szél vezet stb.), és a legkedvezőtlenebb eredményt kell megtartani. A többi hatás ψ0-val csökkentve kíséri.[/i]

`CR 0-2012, 6.4.3.2, (6.9)` · `7.2 táblázat`

- **Statikai egyensúly (EQU):** γG,sup = 1,10, γG,inf = 0,90, γQ = 1,5 `CR 0-2012, 7.3 táblázat`

## 3. Román előírás – szeizmikus kombináció

$$E_d = \sum_j G_{k,j} \;+\; \gamma_{I,e}\,A_{E,k} \;+\; \sum_i \psi_{2,i}\,Q_{k,i}$$

- γI,e a létesítmény fontossági-kitettségi tényezője (P100-1 4.2. táblázat: I. osztály 1,4 · II. 1,2 · III. 1,0 · IV. 0,8)
- A_E,k a szeizmikus hatás karakterisztikus értéke [i]A P100-1 tervezési spektrumából (Sd) számolt erők. A γI,e szorzót vagy itt, vagy már a spektrumban kell figyelembe venni – kétszer nem.[/i]
- ψ2 a kvázi-állandó érték szorzója – **hóra Romániában ψ2 = 0,4** [i]Román sajátosság (CR 0-2012, 7.1 táblázat). A hó γIs szorzóját a szeizmikus tömegnél nem kell alkalmazni (CR 1-1-3, 4.1 (12)). Az SR EN 1990 ajánlott értéke 1000 m alatti helyszínen hóra ψ2 = 0. A szeizmikus tömeg számításánál ez jelentős különbség lehet lapostetős csarnokoknál.[/i]

`CR 0-2012, (6.11)` · `7.4 táblázat` · `P100-1/2013, 3.3`

**Rendkívüli kombináció:** $E_d = \sum G_{k,j} + A_d + (\psi_{1,1}\text{ vagy }\psi_{2,1})\,Q_{k,1} + \sum_{i>1} \psi_{2,i}\,Q_{k,i}$ `CR 0-2012, (6.10)`

## 4. Használhatósági határállapot (SLS)

| Kombináció | Képlet | Mire |
|---|---|---|
| karakterisztikus | $\sum G_k + Q_{k,1} + \sum \psi_{0,i} Q_{k,i}$ | irreverzibilis hatások, repedéstágasság egyes esetekben |
| gyakori | $\sum G_k + \psi_{1,1} Q_{k,1} + \sum \psi_{2,i} Q_{k,i}$ | reverzibilis hatások, rezgés |
| kvázi-állandó | $\sum G_k + \sum \psi_{2,i} Q_{k,i}$ | hosszú távú lehajlás, kúszás, süllyedés |

`CR 0-2012, 6.5.3, (6.13)–(6.15)`

## 5. ψ tényezők

| Hatás | ψ0 | ψ1 | ψ2 |
|---|---|---|---|
| A – lakó | 0,7 | 0,5 | 0,3 |
| B – iroda | 0,7 | 0,5 | 0,3 |
| C – gyülekezés | 0,7 | 0,7 | 0,6 |
| D – kereskedelem | 0,7 | 0,7 | 0,6 |
| E – raktár | 1,0 | 0,9 | 0,8 |
| F – jármű < 30 kN | 0,7 | 0,7 | 0,6 |
| G – jármű 30–160 kN | 0,7 | 0,5 | 0,3 |
| H – tető (nem járható) | 0,7 | 0 | 0 |
| Hó (CR 0) | 0,7 | 0,5 | 0,4 |
| Szél | 0,7 | 0,2 | 0 |
| Hőmérséklet | 0,6 | 0,5 | 0 |

> A táblázat a CR 0-2012 7.1 táblázatával egyezik. Az SR EN 1990 ajánlása ettől eltér: szélre ψ0 = 0,6, hóra (≤ 1000 m) 0,5 / 0,2 / 0.

`CR 0-2012, 7.1 táblázat` · `SR EN 1990, A1.1 táblázat`

## 6. Eurocode út

- ULS: SR EN 1990 (6.10), vagy a kedvezőbb (6.10a) / (6.10b) pár – a nemzeti melléklet dönti el, melyik használható [i](6.10a): 1,35·G + 1,5·ψ0·Q1 + 1,5·ψ0·Qi; (6.10b): ξ·1,35·G + 1,5·Q1 + 1,5·ψ0·Qi, ajánlott ξ = 0,85. A kettő közül a kedvezőtlenebb mértékadó.[/i]
- Szeizmikus: (6.12b): ΣG + A_Ed + Σψ2·Q, ahol A_Ed = γI·A_Ek
- SLS: (6.14b), (6.15b), (6.16b)

> A második generációs EN 1990:2023 már megjelent; Romániában átmenetileg az első generációs SR EN 1990 + NA az alkalmazott.

---
*Források: CR 0-2012 Cod de proiectare. Bazele proiectării construcțiilor; SR EN 1990:2004 + NA; P100-1/2013 3.3, 4.4.5.*
</script>
<script type="text/markdown" data-id="kombinaciok" data-num="01" data-cat="loads" data-calc="ccomb" data-lang="ro">
title: Combinații de încărcări
sub: Conform CR 0-2012 și SR EN 1990 + NA
---
**Când e nevoie?** La începutul oricărui calcul: cu ce coeficient și cu ce valoare de însoțire intră fiecare acțiune într-o combinație.

## 1. Clasificarea acțiunilor

| Simbol | Acțiune | Exemplu |
|---|---|---|
| G | permanentă | greutate proprie, finisaje, pereți despărțitori ficși |
| Q | variabilă | încărcare utilă, zăpadă, vânt, temperatură |
| A | accidentală | explozie, impact, incendiu |
| A_E | seismică | cutremur (în România conform P100-1) |

`CR 0-2012, cap. 4` · `SR EN 1990, 4.1.1`

## 2. Reglementarea românească – SLU, combinația fundamentală

$$E_d = \sum_j \gamma_{G,j}\,G_{k,j} \;+\; \gamma_{Q,1}\,Q_{k,1} \;+\; \sum_{i>1} \gamma_{Q,i}\,\psi_{0,i}\,Q_{k,i}$$

- γG = **1,35** când este defavorabilă, **1,00** când este favorabilă [i]De ex. la verificarea la răsturnare sau la subpresiune greutatea proprie este favorabilă și intră cu 1,00. Pentru echilibru static (EQU) există coeficienți separați.[/i]
- γQ = **1,5** când este defavorabilă, **0** când este favorabilă
- Q_k,1 este acțiunea variabilă **dominantă** [i]Fiecare acțiune variabilă se consideră pe rând dominantă (zăpada, apoi vântul etc.) și se reține rezultatul cel mai defavorabil. Celelalte o însoțesc reduse cu ψ0.[/i]

`CR 0-2012, 6.4.3.2, (6.9)` · `tabelul 7.2`

- **Echilibru static (ECH):** γG,sup = 1,10, γG,inf = 0,90, γQ = 1,5 `CR 0-2012, tabelul 7.3`

## 3. Reglementarea românească – combinația seismică

$$E_d = \sum_j G_{k,j} \;+\; \gamma_{I,e}\,A_{E,k} \;+\; \sum_i \psi_{2,i}\,Q_{k,i}$$

- γI,e factorul de importanță-expunere (P100-1 tabelul 4.2: clasa I 1,4 · II 1,2 · III 1,0 · IV 0,8)
- A_E,k valoarea caracteristică a acțiunii seismice [i]Forțele obținute din spectrul de proiectare Sd din P100-1. Factorul γI,e se aplică fie aici, fie direct în spectru – niciodată de două ori.[/i]
- ψ2 coeficientul valorii cvasipermanente – **pentru zăpadă în România ψ2 = 0,4** [i]Specific CR 0-2012 (tabelul 7.1). Factorul γIs al zăpezii nu se aplică la masa seismică (CR 1-1-3, 4.1 (12)). Valoarea recomandată în SR EN 1990 pentru amplasamente sub 1000 m este ψ2 = 0. La halele cu acoperiș plat diferența în masa seismică poate fi importantă.[/i]

`CR 0-2012, (6.11)` · `tabelul 7.4` · `P100-1/2013, 3.3`

**Gruparea accidentală:** $E_d = \sum G_{k,j} + A_d + (\psi_{1,1}\text{ sau }\psi_{2,1})\,Q_{k,1} + \sum_{i>1} \psi_{2,i}\,Q_{k,i}$ `CR 0-2012, (6.10)`

## 4. Starea limită de serviciu (SLS)

| Combinație | Expresie | Utilizare |
|---|---|---|
| caracteristică | $\sum G_k + Q_{k,1} + \sum \psi_{0,i} Q_{k,i}$ | efecte ireversibile |
| frecventă | $\sum G_k + \psi_{1,1} Q_{k,1} + \sum \psi_{2,i} Q_{k,i}$ | efecte reversibile, vibrații |
| cvasipermanentă | $\sum G_k + \sum \psi_{2,i} Q_{k,i}$ | săgeți de lungă durată, curgere lentă, tasări |

`CR 0-2012, 6.5.3, (6.13)–(6.15)`

## 5. Coeficienții ψ

| Acțiune | ψ0 | ψ1 | ψ2 |
|---|---|---|---|
| A – locuințe | 0,7 | 0,5 | 0,3 |
| B – birouri | 0,7 | 0,5 | 0,3 |
| C – aglomerări | 0,7 | 0,7 | 0,6 |
| D – comerț | 0,7 | 0,7 | 0,6 |
| E – depozitare | 1,0 | 0,9 | 0,8 |
| F – vehicule < 30 kN | 0,7 | 0,7 | 0,6 |
| G – vehicule 30–160 kN | 0,7 | 0,5 | 0,3 |
| H – acoperiș necirculabil | 0,7 | 0 | 0 |
| Zăpadă (CR 0) | 0,7 | 0,5 | 0,4 |
| Vânt | 0,7 | 0,2 | 0 |
| Temperatură | 0,6 | 0,5 | 0 |

> Tabelul corespunde tabelului 7.1 din CR 0-2012. Recomandarea SR EN 1990 diferă: vânt ψ0 = 0,6, zăpadă (≤ 1000 m) 0,5 / 0,2 / 0.

`CR 0-2012, tabelul 7.1` · `SR EN 1990, tabelul A1.1`

## 6. Varianta Eurocode

- SLU: SR EN 1990 (6.10) sau perechea (6.10a) / (6.10b) – anexa națională stabilește ce se poate folosi [i](6.10a): 1,35·G + 1,5·ψ0·Q1 + 1,5·ψ0·Qi; (6.10b): ξ·1,35·G + 1,5·Q1 + 1,5·ψ0·Qi, cu ξ = 0,85 recomandat. Se reține cea mai defavorabilă.[/i]
- Seismic: (6.12b): ΣG + A_Ed + Σψ2·Q, cu A_Ed = γI·A_Ek
- SLS: (6.14b), (6.15b), (6.16b)

> EN 1990:2023 (generația a doua) a apărut; în România se aplică deocamdată SR EN 1990 + NA (generația întâi).

---
*Surse: CR 0-2012 Cod de proiectare. Bazele proiectării construcțiilor; SR EN 1990:2004 + NA; P100-1/2013 3.3, 4.4.5.*
</script>
<script type="text/markdown" data-id="kombinaciok" data-num="01" data-cat="loads" data-calc="ccomb" data-lang="en">
title: Load combinations
sub: Per CR 0-2012 and SR EN 1990 + NA
---
**When?** At the start of every design: which factor and which accompanying value each action takes in a combination.

## 1. Classes of actions

| Symbol | Action | Example |
|---|---|---|
| G | permanent | self-weight, finishes, fixed partitions |
| Q | variable | imposed load, snow, wind, temperature |
| A | accidental | explosion, impact, fire |
| A_E | seismic | earthquake (in Romania per P100-1) |

`CR 0-2012, ch. 4` · `SR EN 1990, 4.1.1`

## 2. Romanian code – ULS, fundamental combination

$$E_d = \sum_j \gamma_{G,j}\,G_{k,j} \;+\; \gamma_{Q,1}\,Q_{k,1} \;+\; \sum_{i>1} \gamma_{Q,i}\,\psi_{0,i}\,Q_{k,i}$$

- γG = **1.35** unfavourable, **1.00** favourable [i]E.g. in overturning or uplift checks self-weight is favourable and enters with 1.00. Static equilibrium (EQU) has its own factors.[/i]
- γQ = **1.5** unfavourable, **0** favourable
- Q_k,1 is the **leading** variable action [i]Take each variable action as leading in turn (snow, then wind, etc.) and keep the worst result. The others accompany it, reduced by ψ0.[/i]

`CR 0-2012, 6.4.3.2, (6.9)` · `Table 7.2`

- **Static equilibrium (EQU):** γG,sup = 1.10, γG,inf = 0.90, γQ = 1.5 `CR 0-2012, Table 7.3`

## 3. Romanian code – seismic combination

$$E_d = \sum_j G_{k,j} \;+\; \gamma_{I,e}\,A_{E,k} \;+\; \sum_i \psi_{2,i}\,Q_{k,i}$$

- γI,e importance-exposure factor (P100-1 Table 4.2: class I 1.4 · II 1.2 · III 1.0 · IV 0.8)
- A_E,k characteristic seismic action [i]Forces from the P100-1 design spectrum Sd. Apply γI,e either here or in the spectrum – never twice.[/i]
- ψ2 quasi-permanent factor – **for snow in Romania ψ2 = 0.4** [i]A CR 0-2012 specific (Table 7.1). The snow factor γIs is not applied to the seismic mass (CR 1-1-3, 4.1 (12)). SR EN 1990 recommends ψ2 = 0 for snow below 1000 m altitude. For flat-roof halls this changes the seismic mass noticeably.[/i]

`CR 0-2012, (6.11)` · `Table 7.4` · `P100-1/2013, 3.3`

**Accidental combination:** $E_d = \sum G_{k,j} + A_d + (\psi_{1,1}\text{ or }\psi_{2,1})\,Q_{k,1} + \sum_{i>1} \psi_{2,i}\,Q_{k,i}$ `CR 0-2012, (6.10)`

## 4. Serviceability (SLS)

| Combination | Expression | Use |
|---|---|---|
| characteristic | $\sum G_k + Q_{k,1} + \sum \psi_{0,i} Q_{k,i}$ | irreversible effects |
| frequent | $\sum G_k + \psi_{1,1} Q_{k,1} + \sum \psi_{2,i} Q_{k,i}$ | reversible effects, vibration |
| quasi-permanent | $\sum G_k + \sum \psi_{2,i} Q_{k,i}$ | long-term deflection, creep, settlement |

`CR 0-2012, 6.5.3, (6.13)–(6.15)`

## 5. ψ factors

| Action | ψ0 | ψ1 | ψ2 |
|---|---|---|---|
| A – residential | 0.7 | 0.5 | 0.3 |
| B – office | 0.7 | 0.5 | 0.3 |
| C – congregation | 0.7 | 0.7 | 0.6 |
| D – shopping | 0.7 | 0.7 | 0.6 |
| E – storage | 1.0 | 0.9 | 0.8 |
| F – vehicles < 30 kN | 0.7 | 0.7 | 0.6 |
| G – vehicles 30–160 kN | 0.7 | 0.5 | 0.3 |
| H – roof (not accessible) | 0.7 | 0 | 0 |
| Snow (CR 0) | 0.7 | 0.5 | 0.4 |
| Wind | 0.7 | 0.2 | 0 |
| Temperature | 0.6 | 0.5 | 0 |

> The table matches CR 0-2012 Table 7.1. SR EN 1990 recommends otherwise: wind ψ0 = 0.6, snow (≤ 1000 m) 0.5 / 0.2 / 0.

`CR 0-2012, Table 7.1` · `SR EN 1990, Table A1.1`

## 6. Eurocode route

- ULS: SR EN 1990 (6.10), or the pair (6.10a) / (6.10b) – the National Annex decides [i](6.10a): 1.35·G + 1.5·ψ0·Q1 + 1.5·ψ0·Qi; (6.10b): ξ·1.35·G + 1.5·Q1 + 1.5·ψ0·Qi, ξ = 0.85 recommended. The less favourable governs.[/i]
- Seismic: (6.12b): ΣG + A_Ed + Σψ2·Q, with A_Ed = γI·A_Ek
- SLS: (6.14b), (6.15b), (6.16b)

> The second-generation EN 1990:2023 is published; Romania still applies the first-generation SR EN 1990 + NA for now.

---

## 1. Romanian code – CR 1-1-3/2012

Persistent/transient design situation:

$$s = \gamma_{Is}\;\mu_i\;C_e\;C_t\;s_k \qquad (4.1)$$

Exceptional drift (accidental action):

$$s = \gamma_{Is}\;\mu_i\;s_k \qquad (4.2)$$

- **sk** characteristic ground snow load [kN/m²]: 2% annual probability of exceedance, MRI = 50 years `Figure 3.1` [i]The map applies for altitude A ≤ 1000 m; above that use (3.1)–(3.2). The code also lists sk by locality (e.g. Botoșani 2.5; Ineu, Arad county 1.5 kN/m²).[/i]
- **γIs** importance-exposure factor: class I **1.15** · II **1.10** · III and IV **1.00** `Table 4.1` [i]γIs is not applied when computing the seismic mass (4.1 (12)).[/i]
- **Ce** exposure coefficient: full **0.8** · normal **1.0** · reduced **1.2** `Table 4.2` [i]Full: flat unsheltered terrain, snow blown in all directions. Normal: terrain and neighbours prevent significant removal. Reduced: the building sits lower than its surroundings or is surrounded by tall trees/buildings.[/i]
- **Ct** thermal coefficient: **1.0** – lower only if roof heat transfer > 1 W/m²K, by calculation `4.1 (14)`
- **μi** shape coefficient `Table 5.1`:

| α | 0° ≤ α ≤ 30° | 30° < α < 60° | α ≥ 60° |
|---|---|---|---|
| μ1 (mono- and duopitch) | 0.8 | 0.8·(60 − α)/30 | 0 |
| μ2 (multi-span, valley) | 0.8 + 0.8·α/30 | 1.6 | – |

If snow guards, parapets or other obstacles stop snow sliding off, μ is not less than 0.8 `5.1 (2), 5.2 (3)`. Drifts at steps, parapets and taller neighbours – chapters 5 and 6. [i]Local μ in drifts can reach 2–3 – a frequent failure cause in light steel halls.[/i]

**Combination factors:** ψ0 = 0.7 · ψ1 = 0.5 · ψ2 = 0.4 `Table 4.3`

## 2. Eurocode route – SR EN 1991-1-3

$$s = \mu_i\;C_e\;C_t\;s_k \qquad (5.1)$$

- No separate importance factor; sk and Ce per the National Annex `SR EN 1991-1-3, 5.2`
- The second-generation EN 1991-1-3:2025 is published but not yet in Romanian practice.

---
*Sources: CR 1-1-3/2012 (4.1–4.3, Table 5.1, Figure 3.1) and Annex D; SR EN 1991-1-3:2005.*
</script>
<script type="text/markdown" data-id="szelteher" data-num="04" data-cat="loads" data-calc="cwind" data-lang="hu">
title: Szélteher
sub: CR 1-1-4/2012 és SR EN 1991-1-4 + NA szerint
---
**Mikor kell?** Csarnokok, magas és karcsú szerkezetek, tetőburkolatok és rögzítéseik, homlokzatok.

## 1. Referencia-torlónyomás

$$q_b = \tfrac12\,\rho\,v_b^2 \qquad q_b\,[\text{Pa}] = 0{,}625\,v_b^2\,[\text{m/s}] \qquad (2.1)\text{–}(2.2)$$

- **vb** a 10 perces átlagszél 10 m magasan, II. terepkategóriában, évi 2% túllépéssel (IMR = 50 év) `2.2`
- **qb** a 2.1 ábra térképéről; az A melléklet 337 városra táblázatosan is megadja [i]A térkép 1000 m tengerszint feletti magasságig érvényes, fölötte az (A.1) képlet. Délnyugat-Bánságban (qb ≥ 0,7 kPa) és 1000 m fölött az ANM friss mérései ajánlottak.[/i]

## 2. A szél magassági profilja – CR 1-1-4/2012

| Terepkategória | z0 [m] | zmin [m] | kr | β |
|---|---|---|---|---|
| 0 – tenger, part | 0,003 | 1 | 0,155 | 2,74 |
| I – tó, akadálytalan sík | 0,01 | 1 | 0,169 | 2,74 |
| II – nyílt terep, elszórt akadályok | 0,05 | 2 | 0,189 | 2,66 |
| III – falu, külváros, erdő | 0,3 | 5 | 0,214 | 2,35 |
| IV – város, ≥ 15% 15 m-nél magasabb épület | 1,0 | 10 | 0,233 | 2,12 |

`2.1–2.3 táblázat` [i]III. kategóriához legalább 500 m, IV.-hez legalább 800 m hosszan kell az adott terepnek kiterjednie az épület körül.[/i]

$$c_r(z) = k_r(z_0)\,\ln\frac{z}{z_0} \qquad k_r = 0{,}189\left(\frac{z_0}{0{,}05}\right)^{0{,}07} \qquad (2.4)\text{–}(2.5)$$

$$I_v(z) = \frac{\beta}{2{,}5\,\ln(z/z_0)} \qquad (2.11)$$

$$c_e(z) = \left[1 + 7\,I_v(z)\right]c_r^2(z) \qquad q_p(z) = c_e(z)\,q_b \qquad (2.18),\,(2.20)$$

z < zmin esetén z = zmin; a profil zmax = 200 m-ig érvényes.

## 3. Nyomás és erő – CR 1-1-4/2012

$$w_e = \gamma_{Iw}\;c_{pe}\;q_p(z_e) \qquad w_i = \gamma_{Iw}\;c_{pi}\;q_p(z_i) \qquad (3.1),\,(3.2)$$

$$F_w = \gamma_{Iw}\;c_d\;c_f\;q_p(z_e)\;A_{ref} \qquad (3.3)$$

- **γIw** fontossági-kitettségi tényező: I. **1,15** · II. **1,15** · III. **1,00** · IV. **1,00** `3.1 táblázat` [i]Figyelem: a szélnél a II. osztály is 1,15 – a hónál ugyanez 1,10.[/i]
- **cpe** falakra A–E, tetőkre F–I zónák (4. fejezet); cpe,10 nagy felületekre, cpe,1 rögzítésekre
- **cpi** belső nyomás: domináns oldallal 0,75·cpe (2× nyílásarány) vagy 0,90·cpe (3×); egyébként a 4.13 ábra; ha nem határozható meg, **+0,2 vagy −0,3**, a kedvezőtlenebb `4.2.9, (4.1)–(4.2)`

## 4. Eurocode út – SR EN 1991-1-4

- $k_r = 0{,}19\,(z_0/0{,}05)^{0{,}07}$, $I_v = k_I / [c_o \ln(z/z_0)]$, $q_p = [1 + 7I_v]\,\tfrac12\rho v_m^2$ `(4.4)–(4.8)`
- $w_e = q_p(z_e)\,c_{pe}$, $F_w = c_s c_d\,c_f\,q_p(z_e)\,A_{ref}$ – nincs γIw `5.2–5.3`
- **Különbség:** a CR 1-1-4 β/2,5 turbulencia-tényezője kategóriánként eltér az EN kI/co = 1 értékétől, így ce(z) is kissé más.

---
*Források: CR 1-1-4/2012 Cod de proiectare. Evaluarea acțiunii vântului asupra construcțiilor (2.1–2.20, 3.1–3.3, 2.1–2.3 és 3.1 táblázat) és E melléklet; SR EN 1991-1-4:2006.*
</script>
<script type="text/markdown" data-id="szelteher" data-num="04" data-cat="loads" data-calc="cwind" data-lang="ro">
title: Acțiunea vântului
sub: Conform CR 1-1-4/2012 și SR EN 1991-1-4 + NA
---
**Când e nevoie?** Hale, structuri înalte și zvelte, învelitori și prinderile lor, fațade.

## 1. Presiunea de referință

$$q_b = \tfrac12\,\rho\,v_b^2 \qquad q_b\,[\text{Pa}] = 0{,}625\,v_b^2\,[\text{m/s}] \qquad (2.1)\text{–}(2.2)$$

- **vb** viteza medie pe 10 minute la 10 m, teren categoria II, probabilitate anuală de depășire 2% (IMR = 50 ani) `2.2`
- **qb** din harta figurii 2.1; anexa A dă valori pentru 337 de localități [i]Harta este valabilă până la 1000 m altitudine; peste, relația (A.1). În sud-vestul Banatului (qb ≥ 0,7 kPa) și peste 1000 m se recomandă date ANM recente.[/i]

## 2. Profilul vântului – CR 1-1-4/2012

| Categoria de teren | z0 [m] | zmin [m] | kr | β |
|---|---|---|---|---|
| 0 – mare, zonă costieră | 0,003 | 1 | 0,155 | 2,74 |
| I – lacuri, teren plat fără obstacole | 0,01 | 1 | 0,169 | 2,74 |
| II – câmp deschis, obstacole izolate | 0,05 | 2 | 0,189 | 2,66 |
| III – sate, suburbii, păduri | 0,3 | 5 | 0,214 | 2,35 |
| IV – urban, ≥ 15% clădiri peste 15 m | 1,0 | 10 | 0,233 | 2,12 |

`tabelele 2.1–2.3` [i]Pentru categoriile III și IV terenul trebuie să se dezvolte pe cel puțin 500 m, respectiv 800 m în jurul construcției.[/i]

$$c_r(z) = k_r(z_0)\,\ln\frac{z}{z_0} \qquad k_r = 0{,}189\left(\frac{z_0}{0{,}05}\right)^{0{,}07} \qquad (2.4)\text{–}(2.5)$$

$$I_v(z) = \frac{\beta}{2{,}5\,\ln(z/z_0)} \qquad (2.11)$$

$$c_e(z) = \left[1 + 7\,I_v(z)\right]c_r^2(z) \qquad q_p(z) = c_e(z)\,q_b \qquad (2.18),\,(2.20)$$

Pentru z < zmin se ia z = zmin; profilul este valabil până la zmax = 200 m.

## 3. Presiune și forță – CR 1-1-4/2012

$$w_e = \gamma_{Iw}\;c_{pe}\;q_p(z_e) \qquad w_i = \gamma_{Iw}\;c_{pi}\;q_p(z_i) \qquad (3.1),\,(3.2)$$

$$F_w = \gamma_{Iw}\;c_d\;c_f\;q_p(z_e)\;A_{ref} \qquad (3.3)$$

- **γIw** factorul de importanță-expunere: I **1,15** · II **1,15** · III **1,00** · IV **1,00** `tabelul 3.1` [i]Atenție: la vânt și clasa II are 1,15 – la zăpadă 1,10.[/i]
- **cpe** zone A–E pe pereți, F–I pe acoperiș (cap. 4); cpe,10 pentru suprafețe mari, cpe,1 pentru prinderi
- **cpi** presiune interioară: cu latură dominantă 0,75·cpe (goluri de 2×) sau 0,90·cpe (3×); altfel figura 4.13; dacă nu se poate determina, **+0,2 sau −0,3**, valoarea defavorabilă `4.2.9, (4.1)–(4.2)`

## 4. Varianta Eurocode – SR EN 1991-1-4

- $k_r = 0{,}19\,(z_0/0{,}05)^{0{,}07}$, $I_v = k_I / [c_o \ln(z/z_0)]$, $q_p = [1 + 7I_v]\,\tfrac12\rho v_m^2$ `(4.4)–(4.8)`
- $w_e = q_p(z_e)\,c_{pe}$, $F_w = c_s c_d\,c_f\,q_p(z_e)\,A_{ref}$ – fără γIw `5.2–5.3`
- **Diferența:** factorul β/2,5 din CR 1-1-4 diferă pe categorii de valoarea EN kI/co = 1, deci și ce(z) diferă puțin.

---
*Surse: CR 1-1-4/2012 (2.1–2.20, 3.1–3.3, tabelele 2.1–2.3 și 3.1) și anexa E; SR EN 1991-1-4:2006.*

title: Wind action
sub: Per CR 1-1-4/2012 and SR EN 1991-1-4 + NA
---
**When?** Halls, tall and slender structures, roof cladding and fixings, façades.

## 1. Reference velocity pressure

$$q_b = \tfrac12\,\rho\,v_b^2 \qquad q_b\,[\text{Pa}] = 0.625\,v_b^2\,[\text{m/s}] \qquad (2.1)\text{–}(2.2)$$

- **vb** 10-minute mean wind at 10 m, terrain category II, 2% annual exceedance (MRI = 50 years) `2.2`
- **qb** from the map in Figure 2.1; Annex A tabulates 337 towns [i]The map applies up to 1000 m altitude; above, use (A.1). In south-west Banat (qb ≥ 0.7 kPa) and above 1000 m recent ANM data are recommended.[/i]

## 2. Wind profile – CR 1-1-4/2012

| Terrain category | z0 [m] | zmin [m] | kr | β |
|---|---|---|---|---|
| 0 – sea, coast | 0.003 | 1 | 0.155 | 2.74 |
| I – lakes, flat open land | 0.01 | 1 | 0.169 | 2.74 |
| II – open country, isolated obstacles | 0.05 | 2 | 0.189 | 2.66 |
| III – villages, suburbs, forest | 0.3 | 5 | 0.214 | 2.35 |
| IV – urban, ≥ 15% buildings over 15 m | 1.0 | 10 | 0.233 | 2.12 |

`Tables 2.1–2.3` [i]Categories III and IV require that terrain to extend at least 500 m and 800 m around the building respectively.[/i]

$$c_r(z) = k_r(z_0)\,\ln\frac{z}{z_0} \qquad k_r = 0.189\left(\frac{z_0}{0.05}\right)^{0.07} \qquad (2.4)\text{–}(2.5)$$

$$I_v(z) = \frac{\beta}{2.5\,\ln(z/z_0)} \qquad (2.11)$$

$$c_e(z) = \left[1 + 7\,I_v(z)\right]c_r^2(z) \qquad q_p(z) = c_e(z)\,q_b \qquad (2.18),\,(2.20)$$

For z < zmin use z = zmin; the profile applies up to zmax = 200 m.

## 3. Pressure and force – CR 1-1-4/2012

$$w_e = \gamma_{Iw}\;c_{pe}\;q_p(z_e) \qquad w_i = \gamma_{Iw}\;c_{pi}\;q_p(z_i) \qquad (3.1),\,(3.2)$$

$$F_w = \gamma_{Iw}\;c_d\;c_f\;q_p(z_e)\;A_{ref} \qquad (3.3)$$

- **γIw** importance-exposure factor: I **1.15** · II **1.15** · III **1.00** · IV **1.00** `Table 3.1` [i]Note: for wind class II is also 1.15 – for snow it is 1.10.[/i]
- **cpe** wall zones A–E, roof zones F–I (ch. 4); cpe,10 for large areas, cpe,1 for fixings
- **cpi** internal pressure: with a dominant face 0.75·cpe (openings 2×) or 0.90·cpe (3×); otherwise Figure 4.13; if it cannot be determined, **+0.2 or −0.3**, whichever is worse `4.2.9, (4.1)–(4.2)`

## 4. Eurocode route – SR EN 1991-1-4

- $w_e = q_p(z_e)\,c_{pe}$, $F_w = c_s c_d\,c_f\,q_p(z_e)\,A_{ref}$ – no γIw `5.2–5.3`
